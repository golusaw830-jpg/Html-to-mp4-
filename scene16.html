<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 13B (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 13B (5.0 SECONDS EXACT)
  Voiceover: "...तो धर्म क्या है?"
  Visual Concept: The opposing scale pan empties into a bright white-gold light point that pierces
  the dark canvas with the question "तो धर्म क्या है?" and a steady 1.5s hold at the end.
  100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s loop, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dharmaScaleBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <radialGradient id="piercingLightAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%" stop-color="#fff4b8" stop-opacity="0.90"/>
      <stop offset="55%" stop-color="#ffaa1d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#050c10" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#dharmaScaleBg)"/>
    <g id="cosmicStarsLayer"></g>

    <g id="bgMandala" transform="translate(505, 740)" opacity="0.34">
      <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.65"/>
    </g>

    <!-- SYMBOLIC SCALES WITH PIERCING LIGHT POINT -->
    <g id="dharmaScalesAssembly" transform="translate(505, 735)">
      <rect x="-11" y="-235" width="22" height="545" rx="7" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>
      <circle cx="0" cy="-242" r="22" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
      <path d="M -125 310 L 125 310 L 96 274 L -96 274 Z" fill="#083336" stroke="url(#goldMetal)" stroke-width="4.5"/>

      <g id="tiltingScaleBeam" transform="translate(0, -215) rotate(14)">
        <line x1="-245" y1="0" x2="245" y2="0" stroke="url(#goldBright)" stroke-width="11" stroke-linecap="round" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="18" fill="#115e59" stroke="url(#goldBright)" stroke-width="4"/>

        <!-- LEFT PAN -->
        <g id="leftPanAssembly" transform="translate(-225, 0) rotate(-14)">
          <line x1="0" y1="0" x2="-64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <line x1="0" y1="0" x2="64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <path d="M -82 165 L 82 165 Q 0 215 -82 165 Z" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>
        </g>

        <!-- RIGHT PAN: EMPTIES INTO BRIGHT WHITE-GOLD LIGHT POINT -->
        <g id="rightPanAssembly" transform="translate(225, 0) rotate(-14)">
          <line x1="0" y1="0" x2="-64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <line x1="0" y1="0" x2="64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <path d="M -82 165 L 82 165 Q 0 215 -82 165 Z" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>

          <g id="lightPointGroup" transform="translate(0, 125)" filter="url(#superGlow)">
            <circle id="lightPointAura" cx="0" cy="0" r="165" fill="url(#piercingLightAura)"/>
            <circle id="lightPointCore" cx="0" cy="0" r="24" fill="#ffffff"/>
            <line id="piercingLightRay" x1="0" y1="0" x2="-460" y2="-135" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" opacity="0.92"/>
          </g>
        </g>
      </g>
    </g>

    <g id="particlesLayer"></g>

    <!-- CENTRAL QUESTION & STEADY 1.5s HOLD -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <g id="kwQuestion" opacity="0" transform="scale(0.85)">
        <rect x="-345" y="-54" width="690" height="96" rx="48" fill="url(#goldBright)" stroke="#071417" stroke-width="4.5" filter="url(#superGlow)"/>
        <text x="0" y="14" text-anchor="middle" fill="#071417" font-size="52" font-weight="900" letter-spacing="1">तो धर्म क्या है? ⚖️</text>
      </g>
    </g>
  </g>

  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const lightPointGroup = document.getElementById('lightPointGroup');
      const lightPointCore = document.getElementById('lightPointCore');
      const piercingLightRay = document.getElementById('piercingLightRay');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kwQuestion = document.getElementById('kwQuestion');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.70..1.00 = steady 1.5s hold

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        const effectiveT = Math.min(1, t / 0.70);
        const camScale = 1 + easeOutCubic(effectiveT) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);
        bgMandala.setAttribute('transform', `translate(505, 740) rotate(${(effectiveT * 32).toFixed(1)})`);

        const pierceProg = easeOutCubic(Math.min(1, t / 0.42));
        lightPointGroup.setAttribute('transform', `translate(0, ${(135 - pierceProg * 72).toFixed(1)})`);
        lightPointCore.setAttribute('transform', `scale(${(0.75 + pierceProg * 0.95).toFixed(2)})`);
        piercingLightRay.setAttribute('opacity', (0.35 + pierceProg * 0.65).toFixed(2));

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - effectiveT * pt.speed * 3.5) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(effectiveT * Math.PI * 4 + pt.phase) * 14;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', '0.68');
        }

        if (t >= 0.14) {
          const p = Math.min(1, (t - 0.14) / 0.14);
          const s = 0.85 + 0.15 * easeOutBack(p);
          kwQuestion.setAttribute('opacity', easeOutCubic(p).toFixed(2));
          kwQuestion.setAttribute('transform', `scale(${s.toFixed(3)})`);
        } else {
          kwQuestion.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
