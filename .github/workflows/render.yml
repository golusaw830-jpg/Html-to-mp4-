name: Render Animated Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-parler-${{ runner.os }}-v2

      - name: Install FFmpeg, Hindi Fonts & Indic Parler-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra git
          pip install --upgrade pip setuptools wheel Cython
          pip install "numpy>=1.26.4,<2"
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/huggingface/parler-tts.git soundfile faster-whisper
          pip install --upgrade --no-deps "protobuf>=5.28.0" "transformers==4.46.1"
          python3 -c "from parler_tts import ParlerTTSForConditionalGeneration; from transformers import AutoTokenizer; print('ALL_IMPORTS_OK')"

      - name: Install Node dependencies
        run: npm install

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1

      - name: Auto-Generate Emotional Hindi Voiceover (Indic Parler-TTS) & Captions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, glob, re, json
          import numpy as np
          import torch
          import soundfile as sf
          from parler_tts import ParlerTTSForConditionalGeneration
          from transformers import AutoTokenizer
          from faster_whisper import WhisperModel

          if not glob.glob("audio.*") and os.path.exists("script.txt"):
              raw_text = open("script.txt", encoding="utf-8").read().strip()
              if raw_text:
                  print("Loading ai4bharat/indic-parler-tts...")
                  device = "cpu"
                  model = ParlerTTSForConditionalGeneration.from_pretrained("ai4bharat/indic-parler-tts").to(device)
                  tokenizer = AutoTokenizer.from_pretrained("ai4bharat/indic-parler-tts")
                  desc_tokenizer = AutoTokenizer.from_pretrained(model.config.text_encoder._name_or_path)

                  description = "Rohit speaks in a deep, cinematic, suspenseful Hindi storytelling tone with clear pronunciation, dramatic pauses, and studio-quality clarity."
                  desc_ids = desc_tokenizer(description, return_tensors="pt").to(device)

                  sentences = [s.strip() for s in re.split(r'(?<=[।?!.])\s+', raw_text) if s.strip()]
                  combined = []
                  sr = model.config.sampling_rate
                  silence = np.zeros(int(sr * 0.25), dtype=np.float32)

                  for idx, sent in enumerate(sentences, 1):
                      print(f"Generating sentence {idx}/{len(sentences)}: {sent}")
                      prompt_ids = tokenizer(sent, return_tensors="pt").to(device)
                      with torch.no_grad():
                          gen = model.generate(
                              input_ids=desc_ids.input_ids,
                              attention_mask=desc_ids.attention_mask,
                              prompt_input_ids=prompt_ids.input_ids,
                              prompt_attention_mask=prompt_ids.attention_mask
                          )
                      wav = gen.cpu().numpy().squeeze().astype(np.float32)
                      combined.append(wav)
                      combined.append(silence)

                  final_audio = np.concatenate(combined)
                  sf.write("audio.wav", final_audio, sr)
                  print("Emotional Hindi voiceover saved to audio.wav!")

          audio_files = [f for f in glob.glob("audio.*") if f.split(".")[-1].lower() in ["mp3", "wav", "m4a", "ogg", "aac"]]
          if audio_files and not os.path.exists("captions.json"):
              print(f"Transcribing {audio_files[0]} for exact word-synced captions...")
              w_model = WhisperModel("small", device="cpu", compute_type="int8")
              segments, _ = w_model.transcribe(audio_files[0], language="hi")
              cues = []
              for seg in segments:
                  txt = seg.text.strip()
                  if txt:
                      cues.append({
                          "start": round(seg.start, 2),
                          "end": round(seg.end, 2),
                          "text": txt
                      })
              with open("captions.json", "w", encoding="utf-8") as cf:
                  json.dump(cues, cf, ensure_ascii=False, indent=2)
              print(f"Generated captions.json with {len(cues)} synced segments!")
          PYEOF

      - name: Render HTML scenes to MP4
        run: node render.js

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: synced-final-video
          path: final_video_with_audio.mp4
