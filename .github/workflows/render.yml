name: Render HTML to MP4

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg and Chrome Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Install Puppeteer
        run: npm install

      - name: Render Video
        run: node render.js

      - name: Upload MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output.mp4
          
