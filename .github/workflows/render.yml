name: Render Animated Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python for Indic Parler-TTS & Whisper
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Hindi Fonts and AI Voice Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra git
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.26,<2" "protobuf>=5.28.0" transformers==4.46.1 accelerate sentencepiece soundfile faster-whisper argbind einops julius scipy tqdm
          pip install --no-deps descript-audiotools descript-audio-codec git+https://github.com/huggingface/parler-tts.git
          pip install flatten-dict randomname rich tensorboard fire matplotlib ffmpy librosa pyloudnorm markdown2 pystoi torch-stoi scikit-learn
          python3 -c "from parler_tts import ParlerTTSForConditionalGeneration; from transformers import AutoTokenizer; print('PARLER_OK')"

      - name: Install Node dependencies
        run: npm install

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Auto-Generate Emotional Hindi Voiceover (Indic Parler-TTS) & Captions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, glob, re, json
          import torch
          import soundfile as sf
          from parler_tts import ParlerTTSForConditionalGeneration
          from transformers import AutoTokenizer
          from faster_whisper import WhisperModel

          has_audio = any(glob.glob(f"audio.{ext}") for ext in ["mp3", "wav", "m4a", "ogg", "aac"])

          if os.path.exists("script.txt") and not has_audio:
              with open("script.txt", "r", encoding="utf-8") as f:
                  full_text = " ".join(f.read().strip().split())

              if full_text:
                  print("Loading AI4Bharat Indic Parler-TTS model...")
                  device = "cpu"
                  model_id = "ai4bharat/indic-parler-tts"
                  model = ParlerTTSForConditionalGeneration.from_pretrained(model_id).to(device)
                  tokenizer = AutoTokenizer.from_pretrained(model_id)
                  desc_tokenizer = AutoTokenizer.from_pretrained(model.config.text_encoder._name_or_path)

                  description = (
                      "Rohit speaks with a deep, dramatic, and expressive male voice in Hindi, "
                      "with natural storytelling pauses, rich emotion, moderate pace, and clear studio audio."
                  )

                  # Split into clean sentences for natural breathing & stability
                  sentences = [s.strip() for s in re.split(r'(?<=[।?!.])\s+', full_text) if s.strip()]
                  audio_chunks = []

                  for idx, sent in enumerate(sentences):
                      print(f"Synthesizing sentence {idx+1}/{len(sentences)}: {sent}")
                      input_ids = desc_tokenizer(description, return_tensors="pt").input_ids.to(device)
                      prompt_input_ids = tokenizer(sent, return_tensors="pt").input_ids.to(device)
                      generation = model.generate(input_ids=input_ids, prompt_input_ids=prompt_input_ids)
                      audio_arr = generation.cpu().numpy().squeeze()
                      audio_chunks.append(audio_arr)

                  import numpy as np
                  silence = np.zeros(int(model.config.sampling_rate * 0.28), dtype=np.float32)
                  combined = []
                  for i, chunk in enumerate(audio_chunks):
                      combined.append(chunk)
                      if i < len(audio_chunks) - 1:
                          combined.append(silence)
                  final_audio = np.concatenate(combined)
                  sf.write("audio.wav", final_audio, model.config.sampling_rate)
                  print("Emotional Hindi voiceover saved to audio.wav!")

          # Generate exact synced captions.json from audio.wav / audio.mp3 using Whisper
          audio_files = [f for f in glob.glob("audio.*") if f.split(".")[-1].lower() in ["mp3", "wav", "m4a", "ogg", "aac"]]
          if audio_files and not os.path.exists("captions.json"):
              print(f"Transcribing {audio_files[0]} for exact word-synced captions...")
              w_model = WhisperModel("small", device="cpu", compute_type="int8")
              segments, _ = w_model.transcribe(audio_files[0], language="hi")
              cues = []
              for seg in segments:
                  txt = seg.text.strip()
                  if txt:
                      cues.append({
                          "start": round(seg.start, 2),
                          "end": round(seg.end, 2),
                          "text": txt
                      })
              with open("captions.json", "w", encoding="utf-8") as cf:
                  json.dump(cues, cf, ensure_ascii=False, indent=2)
              print(f"Generated captions.json with {len(cues)} synced segments!")
          EOF

      - name: Render HTML scenes to MP4
        run: node render.js

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: synced-final-video
          path: final_video_with_audio.mp4
