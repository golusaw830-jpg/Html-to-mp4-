name: Render Animated Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Node dependencies
        run: npm install

      - name: Render HTML scenes to MP4 (30 FPS)
        run: node render.js

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: synced-final-video
          path: final_video_with_audio.mp4
          
