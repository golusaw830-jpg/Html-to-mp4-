<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 5 (00:18.5 – 00:23.5 = 5.0 SECONDS EXACT)

-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. CONSISTENT COSMIC VOID BACKDROP (Matches Scenes 1-4) -->

    <!-- Ajna Chakra & Brain Bio-Energy Halo -->

      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>

    <!-- Translucent Cosmic Silhouette Fill -->

    <!-- Luminous Brain Hemisphere Gradient -->

    </radialGradient>

    <!-- Locked Rudra-Mani Gem Core Gradient (Exact Match with Scenes 1, 2 & 4) -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD GRADIENTS -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 860) scale(1) translate(-540, -860)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicVoidBg)"/>
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>

    <!-- Cosmic Starfield -->
    <g id="cosmicStarsLayer"></g>

    <!-- LAYER 2: SACRED AJNA CHAKRA MANDALA BEHIND HEAD -->
    <g id="ajnaMandalaGroup" transform="translate(540, 690)">
      <circle id="ajnaAuraOrb" cx="0" cy="0" r="470" fill="url(#ajnaNeuralAura)" opacity="0.78"/>
      <g id="ajnaRingOuter" opacity="0.48">
        <circle cx="0" cy="0" r="420" fill="none" stroke="url(#goldMetal)" stroke-width="3.5" stroke-dasharray="22 12"/>

      </g>
      <g id="ajnaRingInner" opacity="0.42">
        <polygon points="0,-345 299,172 -299,172" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
        <polygon points="0,345 299,-172 -299,-172" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>

    <!-- ========================================================= -->
    <!-- LAYER 3: GLOWING HUMAN HEAD, BRAIN & SPINAL CHAKRA DIAGRAM-->
    <!-- ========================================================= -->
    <g id="neuralDiagramAssembly" transform="translate(540, 840)">

      <!-- Translucent Glowing Silhouette of Ashwatthama (Topknot + Profile/3-Quarter Head + Shoulders) -->
      <g id="ashwaEnergySilhouette">
        <!-- Warrior Topknot Hair Bun (Jata Mukuta Silhouette) -->
        <path d="M -78 -395 C -88 -495, 88 -495, 78 -395 Z" fill="url(#silhouetteBodyGrad)" stroke="url(#goldMetal)" stroke-width="4.5"/>
        <!-- Flowing Hair Locks Rim -->
        <path d="M -175 -260 C -265 -140, -305 40, -255 240" fill="none" stroke="url(#goldMetal)" stroke-width="4" opacity="0.55"/>
        <path d="M 175 -260 C 265 -140, 305 40, 255 240" fill="none" stroke="url(#goldMetal)" stroke-width="4" opacity="0.55"/>

        <!-- Head, Neck & Broad Warrior Shoulders Energy Contour -->
        <path d="M -172 -285 C -172 -368, 172 -368, 172 -285 L 158 -75 C 158 15, 92 85, 78 105 L 92 215 C 245 245, 345 335, 375 565 L -375 565 C -345 335, -245 245, -92 215 L -78 105 C -92 85, -158 15, -158 -75 Z"
              fill="url(#silhouetteBodyGrad)" stroke="url(#goldBright)" stroke-width="5.5" filter="url(#softGoldGlow)"/>

        <!-- Golden Warrior Headband Contour (Matches Scene 1) -->
        <path d="M -174 -282 Q 0 -316 174 -282" fill="none" stroke="url(#goldMetal)" stroke-width="7" opacity="0.75"/>
      </g>

      <!-- ======================================================= -->
      <!-- ILLUMINATED BRAIN (SAHASRARA / CORTEX) & NEURAL NETWORK -->
      <!-- ======================================================= -->
      <g id="brainNeuralNetwork">
        <!-- Luminous Brain Cortex Silhouette -->
        <path d="M 0 -322 C -85 -325, -138 -275, -132 -205 C -126 -145, -75 -115, -24 -115 L -16 -65 L 16 -65 L 24 -115 C 75 -115, 126 -145, 132 -205 C 138 -275, 85 -325, 0 -322 Z"
              fill="url(#brainCoreGrad)" stroke="#ffe066" stroke-width="3.5" opacity="0.88"/>

        <!-- Brain Gyri / Neural Fold Curves -->
        <g stroke="#ffbe2e" stroke-width="2.5" fill="none" opacity="0.6">
          <path d="M -22 -295 Q -72 -275 -82 -232 Q -95 -192 -52 -165"/>
          <path d="M 22 -295 Q 72 -275 82 -232 Q 95 -192 52 -165"/>
          <path d="M -15 -245 Q -55 -225 -45 -185"/>
          <path d="M 15 -245 Q 55 -225 45 -185"/>
        </g>

        <!-- SUSHUMNA SPINAL CORD & IDA-PINGALA NADI ENERGY CHANNELS -->
        <g id="spinalChannelGroup">
          <!-- Central Sushumna Spine Line (From Brainstem y=-65 down to y=520) -->
          <line x1="0" y1="-65" x2="0" y2="520" stroke="#4a1d08" stroke-width="12" stroke-linecap="round"/>
          <line id="sushumnaFlowLine" x1="0" y1="-65" x2="0" y2="520" stroke="url(#goldBright)" stroke-width="6" stroke-dasharray="28 16" stroke-linecap="round" filter="url(#softGoldGlow)"/>

          <!-- Intertwining Ida & Pingala Serpentine Nadis -->
          <path id="nadiWaveLeft" d="M 0 -55 Q -58 35 0 125 Q 58 215 0 305 Q -58 395 0 485"
                fill="none" stroke="#ff9900" stroke-width="3.5" stroke-dasharray="16 10" opacity="0.85"/>
          <path id="nadiWaveRight" d="M 0 -55 Q 58 35 0 125 Q -58 215 0 305 Q 58 395 0 485"
                fill="none" stroke="#fff7c2" stroke-width="3.5" stroke-dasharray="16 10" opacity="0.85"/>

          <!-- Spinal Chakra Nodes (Vishuddha Throat, Anahata Heart, Manipura Solar Plexus) -->
          <g id="chakraVishuddha" transform="translate(0, 125)">
            <circle cx="0" cy="0" r="24" fill="#1a072e" stroke="url(#goldBright)" stroke-width="4"/>
            <circle cx="0" cy="0" r="9" fill="#ffffff" filter="url(#softGoldGlow)"/>
          </g>
          <g id="chakraAnahata" transform="translate(0, 305)">
            <circle cx="0" cy="0" r="28" fill="#1a072e" stroke="url(#goldBright)" stroke-width="4.5"/>
            <polygon points="0,-16 14,8 -14,8" fill="none" stroke="#ffe066" stroke-width="2"/>
            <polygon points="0,16 14,-8 -14,-8" fill="none" stroke="#ffe066" stroke-width="2"/>
            <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#softGoldGlow)"/>
          </g>
          <g id="chakraManipura" transform="translate(0, 485)">
            <circle cx="0" cy="0" r="24" fill="#1a072e" stroke="url(#goldBright)" stroke-width="4"/>
            <circle cx="0" cy="0" r="9" fill="#ffe066" filter="url(#softGoldGlow)"/>
          </g>
        </g>

        <!-- GOLDEN NEURAL PATHWAYS RADIATING FROM FOREHEAD MANI (0, -215) -->
        <g id="neuralRaysGroup" filter="url(#softGoldGlow)">
          <!-- Upper Left & Right Cortex Neural Paths -->
          <path id="neuralPath1" d="M 0 -215 Q -55 -275 -98 -245" fill="none" stroke="#fff7c2" stroke-width="4.5" stroke-dasharray="18 10" stroke-linecap="round"/>
          <path id="neuralPath2" d="M 0 -215 Q 55 -275 98 -245" fill="none" stroke="#fff7c2" stroke-width="4.5" stroke-dasharray="18 10" stroke-linecap="round"/>
          <!-- Mid Temporal Neural Paths -->
          <path id="neuralPath3" d="M 0 -215 Q -65 -195 -112 -180" fill="none" stroke="#ffe066" stroke-width="4.5" stroke-dasharray="18 10" stroke-linecap="round"/>
          <path id="neuralPath4" d="M 0 -215 Q 65 -195 112 -180" fill="none" stroke="#ffe066" stroke-width="4.5" stroke-dasharray="18 10" stroke-linecap="round"/>
          <!-- Direct Brainstem & Pineal Link -->
          <line id="neuralStemLink" x1="0" y1="-215" x2="0" y2="-65" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 10" stroke-linecap="round"/>

          <!-- Glowing Neural Synapse Nodes Inside Brain -->
          <circle cx="-98" cy="-245" r="8" fill="#ffffff"/>
          <circle cx="98" cy="-245" r="8" fill="#ffffff"/>
          <circle cx="-112" cy="-180" r="8" fill="#ffe066"/>
          <circle cx="112" cy="-180" r="8" fill="#ffe066"/>
          <circle cx="0" cy="-65" r="10" fill="#ffffff"/>
        </g>
      </g>

      <!-- ======================================================= -->
      <!-- AJNA CHAKRA LOTUS & LOCKED RUDRA-MANI GEM (0, -215)     -->
      <!-- ======================================================= -->
      <g id="ajnaManiFocal" transform="translate(0, -215)">
        <!-- Expanding Golden Bio-Energy Waves -->
        <circle id="ajnaWave1" cx="0" cy="0" r="55" fill="none" stroke="#fff7c2" stroke-width="7" opacity="0"/>
        <circle id="ajnaWave2" cx="0" cy="0" r="55" fill="none" stroke="#ff9900" stroke-width="5" opacity="0"/>

        <!-- Two-Petaled Ajna Chakra Lotus Wings -->
        <g filter="url(#softGoldGlow)">
          <path d="M -42 0 C -85 -38, -135 -24, -148 0 C -135 24, -85 38, -42 0 Z" fill="#ffbe2e" fill-opacity="0.28" stroke="url(#goldBright)" stroke-width="4"/>
          <path d="M 42 0 C 85 -38, 135 -24, 148 0 C 135 24, 85 38, 42 0 Z" fill="#ffbe2e" fill-opacity="0.28" stroke="url(#goldBright)" stroke-width="4"/>
        </g>

        <!-- Hexagonal Golden Socket & Locked Rudra-Mani Core (Matches Scenes 1, 2 & 4) -->
        <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#24050a" stroke="url(#goldBright)" stroke-width="5"/>
        <g id="maniCorePulse" filter="url(#superGlow)">
          <ellipse cx="0" cy="0" rx="28" ry="39" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="3"/>
          <polygon points="0,-27 17,0 0,27 -17,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.88"/>
          <circle cx="-8" cy="-12" r="6" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- Traveling Neural Energy Pulses Layer -->
    <g id="neuralPulsesLayer" filter="url(#superGlow)"></g>

    <!-- Floating Golden Energy Motes -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: आज्ञा चक्र से जुड़ाव -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-345" y="-56" width="690" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="50" font-weight="900" letter-spacing="1">आज्ञा चक्र से जुड़ाव 🧠</text>
      </g>

      <!-- Keyword 2: दिव्य तंत्रिका शक्ति -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-315" y="-50" width="630" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900" letter-spacing="1">दिव्य तंत्रिका शक्ति ⚡</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s matching Scene 5 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const ajnaRingOuter = document.getElementById('ajnaRingOuter');
      const ajnaRingInner = document.getElementById('ajnaRingInner');
      const ajnaAuraOrb = document.getElementById('ajnaAuraOrb');

      const sushumnaFlowLine = document.getElementById('sushumnaFlowLine');
      const nadiWaveLeft = document.getElementById('nadiWaveLeft');
      const nadiWaveRight = document.getElementById('nadiWaveRight');

      const neuralPath1 = document.getElementById('neuralPath1');
      const neuralPath2 = document.getElementById('neuralPath2');
      const neuralPath3 = document.getElementById('neuralPath3');
      const neuralPath4 = document.getElementById('neuralPath4');
      const neuralStemLink = document.getElementById('neuralStemLink');

      const maniCorePulse = document.getElementById('maniCorePulse');
      const ajnaWave1 = document.getElementById('ajnaWave1');
      const ajnaWave2 = document.getElementById('ajnaWave2');

      const neuralPulsesLayer = document.getElementById('neuralPulsesLayer');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 2. Generate 10 Traveling Golden Neural Pulses Flowing Down the Spine from Mani (540, 625 -> 540, 1360)
      const spinePulses = [];
      for (let i = 0; i < 10; i++) {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        p.setAttribute('r', (5 + (i % 3) * 2).toFixed(1));
        p.setAttribute('fill', i % 2 === 0 ? '#ffffff' : '#ffe066');
        neuralPulsesLayer.appendChild(p);
        spinePulses.push({ el: p, offset: i / 10 });
      }

      // 3. Generate 28 Rising Golden Energy Motes
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff8c1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Cinematic Camera Push-In (1.0 -> 1.08)
        const camScale = 1 + easeOutCubic(t) * 0.08;
        cameraRig.setAttribute('transform', `translate(540, 860) scale(${camScale.toFixed(4)}) translate(-540, -860)`);

        // 3. Ajna Chakra Mandala Rotation & Aura Pulse
        ajnaRingOuter.setAttribute('transform', `rotate(${(t * 48).toFixed(1)})`);
        ajnaRingInner.setAttribute('transform', `rotate(${(-t * 36).toFixed(1)})`);
        ajnaAuraOrb.setAttribute('r', (455 + Math.sin(t * Math.PI * 6) * 38).toFixed(1));

        // 4. Rudra-Mani Heartbeat Pulse & Expanding Waves at Ajna Chakra
        const beat = 1 + Math.abs(Math.sin(t * Math.PI * 6)) * 0.16;
        maniCorePulse.setAttribute('transform', `scale(${beat.toFixed(3)})`);

        const w1 = (t * 2.5) % 1;
        ajnaWave1.setAttribute('r', (55 + easeOutCubic(w1) * 260).toFixed(1));
        ajnaWave1.setAttribute('opacity', ((1 - w1) * 0.85).toFixed(2));

        const w2 = ((t * 2.5) + 0.5) % 1;
        ajnaWave2.setAttribute('r', (55 + easeOutCubic(w2) * 260).toFixed(1));
        ajnaWave2.setAttribute('opacity', ((1 - w2) * 0.80).toFixed(2));

        // 5. Flowing Neural Energy Streams & Spinal Chakras
        const flowOffset = -t * 480;
        neuralPath1.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        neuralPath2.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        neuralPath3.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        neuralPath4.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        neuralStemLink.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        sushumnaFlowLine.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        nadiWaveLeft.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));
        nadiWaveRight.setAttribute('stroke-dashoffset', flowOffset.toFixed(1));

        // Traveling Golden Pulses Down the Spine
        for (let i = 0; i < spinePulses.length; i++) {
          const sp = spinePulses[i];
          const prog = (sp.offset + t * 1.8) % 1;
          const y = 625 + prog * 735;
          const op = Math.sin(prog * Math.PI);
          sp.el.setAttribute('cx', '540');
          sp.el.setAttribute('cy', y.toFixed(1));
          sp.el.setAttribute('opacity', op.toFixed(2));
        }

        // 6. Rising Golden Energy Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("आज्ञा चक्र से जुड़ाव 🧠" & "दिव्य तंत्रिका शक्ति ⚡")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
