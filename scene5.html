  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const sitaAuraOrb = document.getElementById('sitaAuraOrb');
      const sitaMandala = document.getElementById('sitaMandala');
      const goldenShieldDome = document.getElementById('goldenShieldDome');
      const ravanaReachingArms = document.getElementById('ravanaReachingArms');
      const ravanaHeadsCluster = document.getElementById('ravanaHeadsCluster');
      const repulsionImpactGroup = document.getElementById('repulsionImpactGroup');
      const repulseRing = document.getElementById('repulseRing');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 28 Floating Golden Sanctuary Sparkles
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 135 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Mata Sita Golden Shield Pulse & Mandala Rotation
        sitaMandala.setAttribute('transform', `translate(0, -60) rotate(${(t * 48).toFixed(2)})`);
        const auraR = 310 + Math.sin(t * Math.PI * 4) * 28;
        sitaAuraOrb.setAttribute('r', auraR.toFixed(1));

        const shieldPulse = 0.85 + 0.15 * Math.sin(t * Math.PI * 6);
        goldenShieldDome.setAttribute('opacity', shieldPulse.toFixed(2));

        // 3. Ravana's Arms Reaching Forward (0.0 -> 0.24), Hitting Invisible Curse Barrier & Recoiling Mid-Air!
        let armOffsetX = 0;
        let armTrembleY = 0;
        let repulseOp = 0;
        let ringR = 45;

        if (t < 0.24) {
          // Reaching forward toward Mata Sita
          const reachP = easeOutCubic(t / 0.24);
          armOffsetX = 45 - reachP * 55; // Moves left from +45 to -10 (stops right at barrier!)
        } else if (t < 0.36) {
          // Abrupt halt & recoil shockwave from curse fear!
          const recoilP = (t - 0.24) / 0.12;
          armOffsetX = -10 + easeOutBack(recoilP) * 28;
          repulseOp = Math.sin(recoilP * Math.PI);
          ringR = 45 + recoilP * 95;
        } else {
          // Hands frozen & trembling mid-air, unable to touch
          armOffsetX = 18 + Math.sin((t - 0.36) * Math.PI * 36) * 3.5;
          armTrembleY = Math.cos((t - 0.36) * Math.PI * 32) * 2.5;
          repulseOp = 0.22 + 0.18 * Math.abs(Math.sin(t * Math.PI * 8));
          ringR = 65 + Math.sin(t * Math.PI * 6) * 15;
        }

        ravanaReachingArms.setAttribute('transform', `translate(${armOffsetX.toFixed(1)}, ${armTrembleY.toFixed(1)})`);
        ravanaHeadsCluster.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 16) * 0.9).toFixed(2)}, 0, -400)`);

        repulsionImpactGroup.setAttribute('opacity', repulseOp.toFixed(2));
        repulseRing.setAttribute('r', ringR.toFixed(1));

        // 4. Floating Golden Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Kinetic Hindi Keywords ("स्पर्श का भय ⚡" & "हाथ तक नहीं लगाया 🛡️")
        if (t >= 0.22) {
          const p1 = Math.min(1, (t - 0.22) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
