<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 5 (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 5 (00:20.0 – 00:25.0 = 5.0 SECONDS EXACT)
  Voiceover: "पर जब पिता ने अपने अहंकार के आगे झुकने से इनकार कर दिया,"
  Symbolic Creative SVG Visual:
  - Geometric vector reflection of Ravana's ten heads and ten golden crowns locking together on the throne
    like an unyielding iron-and-crimson wall blocking the path forward.
  - Sharp red-orange gradient lock-in & metallic barrier slam + rising crimson-amber embers.
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC CRIMSON-AMBER SKY -->
    <radialGradient id="arroganceCourtBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#3b1216"/>
      <stop offset="38%" stop-color="#173a40"/>
      <stop offset="74%" stop-color="#0b1d24"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <!-- Red-Orange Arrogance Lock-In Aura -->
    <radialGradient id="egoFireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#dc2626" stop-opacity="0.52"/>
      <stop offset="72%" stop-color="#7f1d1d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. IRON-FORTRESS & GEOMETRIC CROWN GRADIENTS -->
    <linearGradient id="ironWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#331519"/>
      <stop offset="48%" stop-color="#1c0a0e"/>
      <stop offset="100%" stop-color="#090305"/>
    </linearGradient>

    <linearGradient id="crimsonReflectionGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090305" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="redOrangeLockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>

    <!-- Reusable Geometric Side Head & Crown Unit -->
    <g id="geo-ravana-head">
      <!-- Faceted Geometric Crown -->
      <polygon points="-24,-22 -18,-62 0,-84 18,-62 24,-22" fill="url(#goldMetal)" stroke="#1a0508" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="0,-84 18,-62 0,-22 -18,-62" fill="url(#goldBright)" opacity="0.55"/>
      <!-- Angular Chiseled Head -->
      <polygon points="-22,-22 22,-22 18,18 0,34 -18,18" fill="#1f090d" stroke="#ef4444" stroke-width="2.8" stroke-linejoin="round"/>
      <!-- Glowing Slit Eyes -->
      <polygon points="-15,-4 -4,0 -15,3" fill="#ff9900"/>
      <polygon points="15,-4 4,0 15,3" fill="#ff9900"/>
    </g>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL & VOLCANIC CRIMSON BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#arroganceCourtBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Sacred Mandala Ring Behind Throne -->
    <g id="bgMandala" transform="translate(505, 720)" opacity="0.35">
      <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.72"/>
    </g>

    <!-- Blazing Red-Orange Arrogance Aura -->
    <circle id="egoFireOrb" cx="505" cy="680" r="365" fill="url(#egoFireAura)"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: GEOMETRIC TEN-HEADED RAVANA & IRON THRONE WALL   -->
    <!-- Positioned inside Safe Zone (x: 115..895, y: 260..1210)  -->
    <!-- ========================================================= -->
    <g id="tenHeadsFortressGroup" transform="translate(505, 740)">

      <!-- TOP: GEOMETRIC TEN-CROWNED RAVANA WALL (y: -440 .. -30) -->
      <g id="upperCrownWall">
        <!-- Throne High Geometric Spire Frame -->
        <polygon points="-320,-35 -285,-325 0,-455 285,-325 320,-35" fill="#140508" stroke="url(#goldMetal)" stroke-width="5" stroke-linejoin="round"/>
        <polygon points="-285,-35 -255,-295 0,-415 255,-295 285,-35" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="14 8"/>

        <!-- Left 4 Geometric Heads -->
        <use href="#geo-ravana-head" transform="translate(-265, -135) scale(0.84)"/>
        <use href="#geo-ravana-head" transform="translate(-205, -142) scale(0.88)"/>
        <use href="#geo-ravana-head" transform="translate(-145, -148) scale(0.92)"/>
        <use href="#geo-ravana-head" transform="translate(-85, -154) scale(0.96)"/>

        <!-- Right 5 Geometric Heads -->
        <use href="#geo-ravana-head" transform="translate(85, -154) scale(0.96)"/>
        <use href="#geo-ravana-head" transform="translate(145, -148) scale(0.92)"/>
        <use href="#geo-ravana-head" transform="translate(205, -142) scale(0.88)"/>
        <use href="#geo-ravana-head" transform="translate(265, -135) scale(0.84)"/>
        <use href="#geo-ravana-head" transform="translate(318, -126) scale(0.78)"/>

        <!-- GRAND CENTRAL GEOMETRIC CROWN & FACE -->
        <g id="centralGeoHead" transform="translate(0, -165)">
          <polygon points="-54,-35 -40,-135 0,-185 40,-135 54,-35" fill="url(#goldMetal)" stroke="#1a0508" stroke-width="4.5" stroke-linejoin="round"/>
          <polygon points="0,-185 40,-135 0,-35 -40,-135" fill="url(#goldBright)" opacity="0.6"/>
          <circle cx="0" cy="-105" r="11" fill="#dc2626" stroke="#1a0508" stroke-width="2.5"/>

          <!-- Chiseled Central Face -->
          <polygon points="-52,-35 52,-35 44,48 0,82 -44,48" fill="#1a060a" stroke="url(#goldBright)" stroke-width="4" stroke-linejoin="round"/>
          <!-- Tripundra Tilak -->
          <line x1="-24" y1="-18" x2="24" y2="-18" stroke="#ffffff" stroke-width="3.5"/>
          <circle cx="0" cy="-14" r="4.5" fill="#dc2626"/>
          <!-- Stern Glowing Eyes -->
          <polygon points="-38,2 -10,10 -36,16" fill="#ffaa1d" filter="url(#softGoldGlow)"/>
          <polygon points="38,2 10,10 36,16" fill="#ffaa1d" filter="url(#softGoldGlow)"/>
          <!-- Geometric Handlebar Mustache -->
          <polygon points="0,34 -44,26 -54,44 0,40 54,44 44,26" fill="#090204" stroke="#ef4444" stroke-width="2"/>
        </g>
      </g>

      <!-- CENTER: UNYIELDING IRON & RED-ORANGE LOCK-IN BARRIER WALL -->
      <g id="ironBarrierWall" transform="translate(0, -15)">
        <!-- Left & Right Heavy Iron Wall Slabs That Slam Shut at Center -->
        <g id="leftIronSlab">
          <rect x="-375" y="-22" width="375" height="68" rx="8" fill="url(#ironWallGrad)" stroke="url(#redOrangeLockGrad)" stroke-width="5"/>
          <line x1="-355" y1="12" x2="-25" y2="12" stroke="#ff6b1a" stroke-width="4" stroke-dasharray="18 10"/>
        </g>
        <g id="rightIronSlab">
          <rect x="0" y="-22" width="375" height="68" rx="8" fill="url(#ironWallGrad)" stroke="url(#redOrangeLockGrad)" stroke-width="5"/>
          <line x1="25" y1="12" x2="355" y2="12" stroke="#ff6b1a" stroke-width="4" stroke-dasharray="18 10"/>
        </g>

        <!-- Central Unbreakable Lock Seal Emblem -->
        <g id="centerLockSeal" transform="translate(0, 12)" filter="url(#superGlow)">
          <polygon points="0,-46 42,0 0,46 -42,0" fill="#2b070a" stroke="url(#goldBright)" stroke-width="5"/>
          <circle cx="0" cy="0" r="14" fill="#ff6b1a"/>
        </g>
      </g>

      <!-- BOTTOM: INVERTED MIRROR REFLECTION OF THE TEN CROWNS ON THRONE FLOOR -->
      <g id="lowerMirrorReflection" transform="translate(0, 62) scale(1, -0.78)" opacity="0.62">
        <polygon points="-320,-35 -285,-325 0,-455 285,-325 320,-35" fill="url(#crimsonReflectionGrad)" stroke="#dc2626" stroke-width="3"/>
        <use href="#geo-ravana-head" transform="translate(-205, -142) scale(0.88)"/>
        <use href="#geo-ravana-head" transform="translate(-145, -148) scale(0.92)"/>
        <use href="#geo-ravana-head" transform="translate(-85, -154) scale(0.96)"/>
        <use href="#geo-ravana-head" transform="translate(85, -154) scale(0.96)"/>
        <use href="#geo-ravana-head" transform="translate(145, -148) scale(0.92)"/>
        <use href="#geo-ravana-head" transform="translate(205, -142) scale(0.88)"/>
        <polygon points="-54,-35 -40,-135 0,-185 40,-135 54,-35" fill="url(#goldMetal)" opacity="0.7"/>
      </g>

      <!-- Shockwave Ring on Iron Barrier Lock-In -->
      <circle id="lockShockwave" cx="0" cy="-3" r="80" fill="none" stroke="#ff9900" stroke-width="9" opacity="0"/>
    </g>

    <!-- Rising Crimson & Amber Sparks -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 3: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: पिता का अहंकार -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-275" y="-48" width="550" height="82" rx="22" fill="#1f070c" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="45" font-weight="900" letter-spacing="1">पिता का अहंकार 🔥</text>
      </g>

      <!-- Keyword 2: झुकने से इनकार -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-275" y="-44" width="550" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#170500" font-size="40" font-weight="900" letter-spacing="1">झुकने से इनकार ⚔️</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND SHARP CUT & IRON LOCK-IN ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const egoFireOrb = document.getElementById('egoFireOrb');
      const upperCrownWall = document.getElementById('upperCrownWall');
      const lowerMirrorReflection = document.getElementById('lowerMirrorReflection');
      const leftIronSlab = document.getElementById('leftIronSlab');
      const rightIronSlab = document.getElementById('rightIronSlab');
      const centerLockSeal = document.getElementById('centerLockSeal');
      const lockShockwave = document.getElementById('lockShockwave');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 32; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1500)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#fca5a5' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ff6b1a' : '#fde047');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 130 + ((i * 103) % 750),
          baseY: 260 + ((i * 181) % 1140),
          speed: 155 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Twinkling Stars & Mandala Rotation
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }
        bgMandala.setAttribute('transform', `translate(505, 720) rotate(${(t * 36).toFixed(1)})`);

        // 2. Sharp Iron Wall Slam Lock-In (t: 0.05 -> 0.22) + Impact Micro-Shake
        const slamProg = easeOutCubic(Math.min(1, Math.max(0, (t - 0.05) / 0.17)));
        const slabShift = (1 - slamProg) * 260;
        leftIronSlab.setAttribute('transform', `translate(${(-slabShift).toFixed(1)}, 0)`);
        rightIronSlab.setAttribute('transform', `translate(${slabShift.toFixed(1)}, 0)`);

        let shakeX = 0;
        let shakeY = 0;
        if (t >= 0.21 && t <= 0.31) {
          const sp = (t - 0.21) / 0.10;
          shakeX = Math.sin(sp * Math.PI * 10) * 14 * (1 - sp);
          shakeY = Math.cos(sp * Math.PI * 8) * 10 * (1 - sp);
        }

        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute(
          'transform',
          `translate(${(505 + shakeX).toFixed(1)}, ${(760 + shakeY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-505, -760)`
        );

        // Central Lock Seal Snap & Shockwave Ring
        const sealScale = slamProg >= 0.95 ? 1 + Math.sin(t * Math.PI * 6) * 0.05 : slamProg;
        centerLockSeal.setAttribute('transform', `translate(0, 12) scale(${sealScale.toFixed(3)})`);

        if (t >= 0.21 && t <= 0.45) {
          const sw = (t - 0.21) / 0.24;
          lockShockwave.setAttribute('r', (80 + easeOutCubic(sw) * 290).toFixed(1));
          lockShockwave.setAttribute('opacity', ((1 - sw) * 0.85).toFixed(2));
        } else {
          lockShockwave.setAttribute('opacity', '0');
        }

        // 3. Unyielding Ten-Crown Geometric Wall & Mirror Reflection Pulse
        const breath = Math.sin(t * Math.PI * 3) * 3;
        upperCrownWall.setAttribute('transform', `translate(0, ${breath.toFixed(1)})`);
        lowerMirrorReflection.setAttribute('transform', `translate(0, ${(62 - breath).toFixed(1)}) scale(1, -0.78)`);
        egoFireOrb.setAttribute('r', (355 + Math.sin(t * Math.PI * 5) * 26).toFixed(1));

        // 4. Rising Crimson & Amber Sparks
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1140 + 1140) % 1140 + 260;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Safe-Zone Kinetic Hindi Keywords ("पिता का अहंकार 🔥" & "झुकने से इनकार ⚔️")
        if (t >= 0.20) {
          const p1 = Math.min(1, (t - 0.20) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
