<!DOCTYPE html>
<html lang="hi">
<head>

<title>Meghnad 16-Scene Blueprint - Scene 2 (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 2 (00:05.0 – 00:10.0 = 5.0 SECONDS EXACT)
  Voiceover: "पर सच यह है कि मैंने कभी यह युद्ध नहीं चाहा था।"
  Symbolic Concept & Match-Cut Continuity:
  - Begins directly with Scene 1's geometric demon shadow at (505, 745), which dissolves/melts away into
    the calm, noble face of Meghnad (Indrajit) in his locked emerald-teal & gold Lanka armor & Naga-wing crown.
  - Two gleaming vector swords sweep inward in front of him and halt mid-air just before clashing,
    accompanied by drifting translucent teal-amber vector mist.
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC AMBER SKY (Locked with Scene 1) -->
    <radialGradient id="archiveBgGrad" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <!-- Calm Golden-Teal Truth Halo Behind Indrajit -->
    <radialGradient id="calmTruthHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.90"/>
      <stop offset="32%" stop-color="#2dd4bf" stop-opacity="0.42"/>
      <stop offset="68%" stop-color="#ff9900" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- Drifting Vector Mist Gradient -->
    <linearGradient id="vectorMistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#99f6e4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>

    <!-- 2. LOCKED MEGHNAD (INDRAJIT) PALETTE -->
    <linearGradient id="meghnadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a370"/>
      <stop offset="52%" stop-color="#b57443"/>
      <stop offset="100%" stop-color="#6b3b1b"/>
    </linearGradient>

    <linearGradient id="meghnadSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d4724"/>
      <stop offset="100%" stop-color="#381a08"/>
    </linearGradient>

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="52%" stop-color="#083336"/>
      <stop offset="100%" stop-color="#03171a"/>
    </linearGradient>

    <linearGradient id="crimsonSilkSash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#690b12"/>
      <stop offset="100%" stop-color="#2b0306"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- Sword Steel Blade Gradient -->
    <linearGradient id="swordBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Scene 1 Demon Shadow Facet Gradients (For Seamless Match-Cut Dissolve) -->
    <linearGradient id="demonFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f080d"/>
      <stop offset="100%" stop-color="#030204"/>
    </linearGradient>

    <linearGradient id="demonFacetCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#120205"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#archiveBgGrad)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Sacred Vedic Mandala Behind Indrajit (Locked with Scene 1) -->
    <g id="bgMandala" transform="translate(505, 740)" opacity="0.42">
      <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.72"/>
      <polygon points="0,-335 290,168 -290,168" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
      <polygon points="0,335 290,-168 -290,-168" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
    </g>

    <!-- Calm Golden-Teal Truth Halo -->
    <circle id="truthAuraOrb" cx="505" cy="720" r="365" fill="url(#calmTruthHalo)" opacity="0.88"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: CALM, NOBLE INDRAJIT (MEGHNAD) — SAFE ZONE       -->
    <!-- Positioned at (505, 815) scale(0.82) inside Safe Zone     -->
    <!-- ========================================================= -->
    <g id="calmIndrajitGroup" transform="translate(505, 815) scale(0.82)" opacity="0">
      <!-- Swept-Back Warrior Hair Locks -->
      <path id="hairLeft" d="M -128 -210 C -205 -125, -225 25, -185 185 C -162 95, -148 5, -112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>
      <path id="hairRight" d="M 128 -210 C 205 -125, 225 25, 185 185 C 162 95, 148 5, 112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>

      <!-- Broad Warrior Torso in Locked Emerald-Teal & Gold Lanka Armor -->
      <path d="M -340 490 C -320 295, -225 210, -106 185 L 106 185 C 225 210, 320 295, 340 490 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="6"/>
      <path d="M -225 220 C -148 268, 148 268, 225 220 L 255 490 L -255 490 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="5.5"/>
      <path d="M -225 220 C -148 268, 148 268, 225 220" fill="none" stroke="url(#goldBright)" stroke-width="8"/>
      <path d="M -235 230 C -158 325, -42 420, 92 490 L 24 490 C -102 420, -198 330, -255 258 Z" fill="url(#crimsonSilkSash)" stroke="#0a1214" stroke-width="4.5"/>
      <path d="M -138 198 C -62 315, 34 420, 128 490" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" opacity="0.92"/>

      <!-- Naga-Wing Golden Shoulder Pauldrons -->
      <path d="M -322 300 C -285 245, -212 240, -176 284 L -205 342 C -244 312, -290 320, -332 360 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>
      <path d="M 322 300 C 285 245, 212 240, 176 284 L 205 342 C 244 312, 290 320, 332 360 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>

      <!-- Royal Gold Kantha Necklace & Neck -->
      <path d="M -98 182 Q 0 256 98 182" fill="none" stroke="url(#goldMetal)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="0" cy="226" r="14" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4"/>
      <path d="M -68 70 L 68 70 L 82 190 L -82 190 Z" fill="url(#meghnadSkinShadow)" stroke="#0a1214" stroke-width="5"/>

      <!-- CALM, NOBLE INDRAJIT HEAD & NAGA-SERPENT CROWN -->
      <g id="calmHeadGroup">
        <path d="M -126 -265 L -95 -420 L -38 -480 L 0 -555 L 38 -480 L 95 -420 L 126 -265 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M -126 -285 C -175 -315, -185 -365, -155 -395 C -145 -355, -135 -325, -112 -305 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <path d="M 126 -285 C 175 -315, 185 -365, 155 -395 C 145 -355, 135 -325, 112 -305 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <circle cx="0" cy="-395" r="17" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4"/>
        <circle cx="0" cy="-572" r="11" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
        <path d="M -142 -268 Q 0 -300 142 -268 L 136 -236 Q 0 -266 -136 -236 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="5"/>

        <!-- Sharp Chiseled Face (Serene, Peaceful Expression) -->
        <path d="M -138 -244 L 138 -244 L 134 -125 L 116 -38 L 54 68 C 24 102, -24 102, -54 68 L -116 -38 L -134 -125 Z"
              fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <polygon points="-146,-65 -158,-25 -146,-8 -134,-25" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
        <polygon points="146,-65 158,-25 146,-8 134,-25" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>

        <!-- Tripundra Tilak -->
        <line x1="-62" y1="-212" x2="62" y2="-212" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="-54" y1="-196" x2="54" y2="-196" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="-44" y1="-180" x2="44" y2="-180" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-196" r="8.5" fill="#dc2626" stroke="#fff7c2" stroke-width="2"/>

        <!-- Calm, Compassionate Eyebrows & Serene Eyes -->
        <path d="M -112 -146 Q -72 -158 -34 -144" fill="none" stroke="#0f1115" stroke-width="9.5" stroke-linecap="round"/>
        <path d="M 112 -146 Q 72 -158 34 -144" fill="none" stroke="#0f1115" stroke-width="9.5" stroke-linecap="round"/>

        <path d="M -102 -120 Q -66 -140 -34 -118 Q -66 -102 -102 -120 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="-68" cy="-120" r="11" fill="#d97706"/>
        <circle cx="-68" cy="-120" r="5" fill="#090d10"/>
        <circle cx="-72" cy="-124" r="2.8" fill="#ffffff"/>

        <path d="M 102 -120 Q 66 -140 34 -118 Q 66 -102 102 -120 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="68" cy="-120" r="11" fill="#d97706"/>
        <circle cx="68" cy="-120" r="5" fill="#090d10"/>
        <circle cx="64" cy="-124" r="2.8" fill="#ffffff"/>

        <!-- Nose, Mustache & Serene Gentle Lips -->
        <path d="M 0 -128 L -11 -46 L 10 -40" fill="none" stroke="#5c3014" stroke-width="5" stroke-linecap="round"/>
        <path d="M 0 -22 C -32 -30, -64 -20, -82 -4 C -58 -12, -28 -14, 0 -16 C 28 -14, 58 -12, 82 -4 C 64 -20, 32 -30, 0 -22 Z" fill="#0f1115"/>
        <path d="M -28 16 Q 0 26 28 16" fill="none" stroke="#6b2519" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: MATCH-CUT DISSOLVING DEMON SHADOW FROM SCENE 1   -->
    <!-- Starts at 100% opacity at t=0 and melts away cleanly!     -->
    <!-- ========================================================= -->
    <g id="dissolvingDemonShadow" transform="translate(505, 745)">
      <polygon points="-245,275 -165,125 0,155 165,125 245,275" fill="url(#demonFacetDark)" stroke="#991b1b" stroke-width="3.5"/>
      <polygon points="-105,-145 -145,-255 -65,-195 0,-315 65,-195 145,-255 105,-145" fill="url(#demonFacetDark)" stroke="#dc2626" stroke-width="3.5"/>
      <polygon points="-112,-145 112,-145 96,-25 48,78 0,104 -48,78 -96,-25" fill="url(#demonFacetDark)" stroke="#991b1b" stroke-width="3.5"/>
      <polygon points="-112,-145 0,-145 0,104 -48,78 -96,-25" fill="url(#demonFacetCrimson)" opacity="0.65"/>
      <polygon points="-86,-64 -28,-50 -42,-32 -82,-42" fill="#ef4444"/>
      <polygon points="86,-64 28,-50 42,-32 82,-42" fill="#ef4444"/>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 4: TWO VECTOR SWORDS HALTED JUST BEFORE CLASHING    -->
    <!-- Positioned in Foreground Safe Zone at (505, 1020)         -->
    <!-- ========================================================= -->
    <g id="haltedSwordsGroup" transform="translate(505, 1025)">
      <!-- Left Vector Sword Sweeping Right & Halting Before Center -->
      <g id="leftSwordRig" transform="translate(-145, 45) rotate(-38)">
        <!-- Blade -->
        <polygon points="-12,0 12,0 8,-255 0,-295 -8,-255" fill="url(#swordBladeGrad)" stroke="#0a1214" stroke-width="4" stroke-linejoin="round"/>
        <line x1="0" y1="-15" x2="0" y2="-265" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
        <!-- Golden Crossguard & Hilt -->
        <rect x="-36" y="-4" width="72" height="14" rx="5" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="3.5"/>
        <rect x="-9" y="10" width="18" height="48" rx="4" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="3.5"/>
        <circle cx="0" cy="64" r="11" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
      </g>

      <!-- Right Vector Sword Sweeping Left & Halting Millimeters Apart -->
      <g id="rightSwordRig" transform="translate(145, 45) rotate(38)">
        <polygon points="-12,0 12,0 8,-255 0,-295 -8,-255" fill="url(#swordBladeGrad)" stroke="#0a1214" stroke-width="4" stroke-linejoin="round"/>
        <line x1="0" y1="-15" x2="0" y2="-265" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
        <rect x="-36" y="-4" width="72" height="14" rx="5" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="3.5"/>
        <rect x="-9" y="10" width="18" height="48" rx="4" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="3.5"/>
        <circle cx="0" cy="64" r="11" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
      </g>

      <!-- Stillness / Peace Ripples Between the Two Halted Blades -->
      <g id="stillnessPulseGroup" transform="translate(0, -110)" opacity="0">
        <circle id="stillnessRing" cx="0" cy="0" r="24" fill="none" stroke="#5eead4" stroke-width="4" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#superGlow)"/>
      </g>
    </g>

    <!-- Drifting Translucent Vector Fog / Mist Ribbons -->
    <g id="vectorMistLayer" pointer-events="none">
      <ellipse id="mistBand1" cx="430" cy="960" rx="380" ry="75" fill="url(#vectorMistGrad)"/>
      <ellipse id="mistBand2" cx="580" cy="1120" rx="400" ry="85" fill="url(#vectorMistGrad)"/>
    </g>

    <!-- Floating Golden & Teal Peace Motes -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 5: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: युद्ध नहीं चाहा -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-265" y="-48" width="530" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="45" font-weight="900" letter-spacing="1">युद्ध नहीं चाहा 🕊️</text>
      </g>

      <!-- Keyword 2: असली सच्चाई -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-255" y="-44" width="510" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">असली सच्चाई ✨</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND MATCH-CUT & MOTION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const truthAuraOrb = document.getElementById('truthAuraOrb');

      const calmIndrajitGroup = document.getElementById('calmIndrajitGroup');
      const calmHeadGroup = document.getElementById('calmHeadGroup');
      const hairLeft = document.getElementById('hairLeft');
      const hairRight = document.getElementById('hairRight');
      const dissolvingDemonShadow = document.getElementById('dissolvingDemonShadow');

      const leftSwordRig = document.getElementById('leftSwordRig');
      const rightSwordRig = document.getElementById('rightSwordRig');
      const stillnessPulseGroup = document.getElementById('stillnessPulseGroup');
      const stillnessRing = document.getElementById('stillnessRing');

      const mistBand1 = document.getElementById('mistBand1');
      const mistBand2 = document.getElementById('mistBand2');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 32; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1500)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#5eead4' : '#fde047');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 130 + ((i * 103) % 750),
          baseY: 260 + ((i * 181) % 1140),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeOutQuart(x) {
        return 1 - Math.pow(1 - x, 4);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Twinkling Stars & Background Mandala Rotation
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }
        bgMandala.setAttribute('transform', `translate(505, 740) rotate(${(t * 42).toFixed(1)})`);

        // 2. Gentle Safe-Zone Camera Push-In
        const camScale = 1.05 - easeOutCubic(t) * 0.05;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);

        // 3. MATCH-CUT MORPH (0.0 -> 0.28): Demon Shadow Melts Away into Calm Indrajit!
        const morphProg = easeOutCubic(Math.min(1, t / 0.28));
        const shadowScale = 1.0 + morphProg * 0.16;
        const shadowY = 745 + morphProg * 35;
        dissolvingDemonShadow.setAttribute('opacity', Math.max(0, 1 - morphProg).toFixed(2));
        dissolvingDemonShadow.setAttribute('transform', `translate(505, ${shadowY.toFixed(1)}) scale(${shadowScale.toFixed(3)})`);

        const breathY = 815 + Math.sin(t * Math.PI * 3) * 5;
        calmIndrajitGroup.setAttribute('opacity', morphProg.toFixed(2));
        calmIndrajitGroup.setAttribute('transform', `translate(505, ${breathY.toFixed(1)}) scale(0.82)`);

        calmHeadGroup.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 2.5) * 1.8).toFixed(2)}, 0, 110)`);
        hairLeft.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -128, -210)`);
        hairRight.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 4) * 3.5).toFixed(2)}, 128, -210)`);
        truthAuraOrb.setAttribute('r', (355 + Math.sin(t * Math.PI * 4) * 24).toFixed(1));

        // 4. Two Vector Swords Sweep Inward & Halt Millimeters Before Clashing (0.16 -> 0.42)
        const swordProg = easeOutQuart(Math.max(0, Math.min(1, (t - 0.16) / 0.26)));
        const leftX = -260 + swordProg * 118; // Halts at x = -142
        const rightX = 260 - swordProg * 118; // Halts at x = +142
        const leftRot = -62 + swordProg * 26; // Halts at -36 deg (blades stop millimeters apart!)
        const rightRot = 62 - swordProg * 26; // Halts at +36 deg

        leftSwordRig.setAttribute('transform', `translate(${leftX.toFixed(1)}, 45) rotate(${leftRot.toFixed(1)})`);
        rightSwordRig.setAttribute('transform', `translate(${rightX.toFixed(1)}, 45) rotate(${rightRot.toFixed(1)})`);

        // Stillness Ripple Pulse Between the Halted Sword Tips
        if (t >= 0.40) {
          const pulseCycle = ((t - 0.40) * 2.5) % 1;
          stillnessPulseGroup.setAttribute('opacity', ((1 - pulseCycle) * 0.9).toFixed(2));
          stillnessRing.setAttribute('r', (18 + pulseCycle * 65).toFixed(1));
        } else {
          stillnessPulseGroup.setAttribute('opacity', '0');
        }

        // 5. Drifting Vector Fog / Mist Ribbons
        mistBand1.setAttribute('transform', `translate(${(Math.sin(t * Math.PI * 2) * 55).toFixed(1)}, 0)`);
        mistBand2.setAttribute('transform', `translate(${(-Math.cos(t * Math.PI * 2) * 65).toFixed(1)}, 0)`);

        // 6. Floating Peace Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1140 + 1140) % 1140 + 260;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("युद्ध नहीं चाहा 🕊️" & "असली सच्चाई ✨")
        if (t >= 0.24) {
          const p1 = Math.min(1, (t - 0.24) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.48) {
          const p2 = Math.min(1, (t - 0.48) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
