  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const warningAura = document.getElementById('warningAura');
      const ravanaHero = document.getElementById('ravanaHero');
      const tenHeadsGroup = document.getElementById('tenHeadsGroup');
      const crownCracks = document.getElementById('crownCracks');
      const skyBolt1 = document.getElementById('skyBolt1');
      const skyBolt2 = document.getElementById('skyBolt2');
      const skyBoltCenter = document.getElementById('skyBoltCenter');
      const curseRing1 = document.getElementById('curseRing1');
      const curseRing2 = document.getElementById('curseRing2');
      const shardsLayer = document.getElementById('shardsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 22 Golden Crown Warning Shards
      const shards = [];
      for (let i = 0; i < 22; i++) {
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        const sz = 9 + (i % 5) * 4;
        poly.setAttribute('points', `0,${-sz} ${sz * 0.8},0 0,${sz} ${-sz * 0.7},${sz * 0.3}`);
        poly.setAttribute('fill', i % 2 === 0 ? '#ffe57f' : '#ff941a');
        poly.setAttribute('stroke', '#240604');
        poly.setAttribute('stroke-width', '2');
        poly.setAttribute('opacity', '0');
        shardsLayer.appendChild(poly);

        const angle = (-165 + (i / 21) * 150) * (Math.PI / 180);
        shards.push({
          el: poly,
          vx: Math.cos(angle) * (240 + (i % 6) * 65),
          vy: Math.sin(angle) * (250 + (i % 5) * 70),
          spin: (i % 2 === 0 ? 1 : -1) * (220 + (i % 4) * 80)
        });
      }

      // Generate 24 Floating Spark Particles
      const particles = [];
      for (let i = 0; i < 24; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe47a' : '#ff7b29');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 140 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Camera Push-In + Lightning Strike Micro-Shake
        let camScale = 1 + t * 0.07;
        let shakeX = 0;
        let shakeY = 0;
        if (t >= 0.22 && t <= 0.32) {
          const sp = (t - 0.22) / 0.10;
          shakeX = Math.sin(sp * Math.PI * 10) * 16 * (1 - sp);
          shakeY = Math.cos(sp * Math.PI * 8) * 12 * (1 - sp);
        }
        cameraRig.setAttribute('transform', `translate(${(540 + shakeX).toFixed(1)}, ${(960 + shakeY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Curse Lightning Strikes at t=0.22 and t=0.58
        let boltCenterOp = 0;
        let boltSideOp = 0;
        if (t >= 0.22 && t <= 0.30) {
          boltCenterOp = Math.sin(((t - 0.22) / 0.08) * Math.PI);
          boltSideOp = boltCenterOp * 0.85;
        } else if (t >= 0.58 && t <= 0.65) {
          boltSideOp = Math.sin(((t - 0.58) / 0.07) * Math.PI);
          boltCenterOp = boltSideOp * 0.75;
        }
        skyBoltCenter.setAttribute('opacity', boltCenterOp.toFixed(2));
        skyBolt1.setAttribute('opacity', boltSideOp.toFixed(2));
        skyBolt2.setAttribute('opacity', boltSideOp.toFixed(2));

        // 3. Crown Fracture Cracks & Shockwave Rings After Strike (t >= 0.23)
        if (t >= 0.23) {
          const pulse = 0.72 + 0.28 * Math.sin((t - 0.23) * Math.PI * 12);
          crownCracks.setAttribute('opacity', pulse.toFixed(2));

          const ringProg = Math.min(1, (t - 0.23) / 0.22);
          const r1 = 130 + ringProg * 280;
          curseRing1.setAttribute('r', r1.toFixed(1));
          curseRing1.setAttribute('opacity', (1 - ringProg).toFixed(2));

          const ring2Prog = Math.max(0, Math.min(1, (t - 0.27) / 0.22));
          const r2 = 130 + ring2Prog * 240;
          curseRing2.setAttribute('r', r2.toFixed(1));
          curseRing2.setAttribute('opacity', (ring2Prog > 0 ? 1 - ring2Prog : 0).toFixed(2));
        } else {
          crownCracks.setAttribute('opacity', '0');
          curseRing1.setAttribute('opacity', '0');
          curseRing2.setAttribute('opacity', '0');
        }

        // 4. Shards Bursting From Central Crown (t: 0.23 -> 0.65)
        for (let i = 0; i < shards.length; i++) {
          const sh = shards[i];
          if (t >= 0.23 && t <= 0.65) {
            const dt = (t - 0.23) * 5;
            const x = 540 + sh.vx * dt;
            const y = 530 + sh.vy * dt + 220 * dt * dt;
            const rot = sh.spin * dt;
            const alpha = Math.max(0, 1 - (t - 0.23) / 0.42);
            sh.el.setAttribute('opacity', alpha.toFixed(2));
            sh.el.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);
          } else {
            sh.el.setAttribute('opacity', '0');
          }
        }

        // 5. Ravana Articulated Recoil & Trembling Heads
        const bobY = 1290 + Math.sin(t * Math.PI * 3) * 6;
        ravanaHero.setAttribute('transform', `translate(540, ${bobY.toFixed(1)})`);
        const headTremor = (t >= 0.22 && t <= 0.72) ? Math.sin(t * Math.PI * 36) * 1.5 : Math.sin(t * Math.PI * 4) * 0.6;
        tenHeadsGroup.setAttribute('transform', `rotate(${headTremor.toFixed(2)}, 0, -480)`);

        const auraR = 470 + Math.sin(t * Math.PI * 4) * 35;
        warningAura.setAttribute('r', auraR.toFixed(1));

        // 6. Floating Spark Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.6 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("सीता हरण 🔥" & "सौ टुकड़े क्यों नहीं? 🤯")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.42) {
          const p2 = Math.min(1, (t - 0.42) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
