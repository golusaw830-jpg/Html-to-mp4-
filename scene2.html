  <!-- DETERMINISTIC 3.0-SECOND ANIMATION & LIP-SYNC ENGINE -->
  <script>
    (function() {
      const DURATION = 8000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const heroBackAura = document.getElementById('heroBackAura');
      const sunburstOuterRing = document.getElementById('sunburstOuterRing');
      const sunRaysGroup = document.getElementById('sunRaysGroup');

      const smokeWave1 = document.getElementById('smokeWave1');
      const smokeWave2 = document.getElementById('smokeWave2');

      const meghnadHeroGroup = document.getElementById('meghnadHeroGroup');
      const meghnadHeadGroup = document.getElementById('meghnadHeadGroup');
      const loweringBowArmRig = document.getElementById('loweringBowArmRig');
      const peaceHandRig = document.getElementById('peaceHandRig');
      const palmPeaceGlow = document.getElementById('palmPeaceGlow');
      const hairLeft = document.getElementById('hairLeft');
      const hairRight = document.getElementById('hairRight');

      const mouthCavity = document.getElementById('mouthCavity');
      const upperTeeth = document.getElementById('upperTeeth');
      const upperLip = document.getElementById('upperLip');
      const lowerLip = document.getElementById('lowerLip');
      const chinShadow = document.getElementById('chinShadow');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      for (let i = 0; i < 24; i++) {
        const angle = i * 15;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '0');
        line.setAttribute('y1', '-315');
        line.setAttribute('x2', '0');
        line.setAttribute('y2', i % 2 === 0 ? '-362' : '-345');
        line.setAttribute('transform', `rotate(${angle})`);
        sunRaysGroup.appendChild(line);
      }

      const stars = [];
      for (let i = 0; i < 32; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1500)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#fb923c');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1220),
          speed: 155 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      const syllableCenters = [0.06, 0.13, 0.20, 0.27, 0.34, 0.42, 0.50, 0.58, 0.66, 0.74, 0.82, 0.90];
      function getSpeechOpenness(t) {
        let open = 0;
        for (let i = 0; i < syllableCenters.length; i++) {
          const dist = (t - syllableCenters[i]) / 0.032;
          const amp = (i === 1 || i === 5 || i === 7 || i === 10) ? 1.0 : 0.72;
          open += amp * Math.exp(-dist * dist);
        }
        return Math.min(1.0, open);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }
        smokeWave1.setAttribute('transform', `translate(${(Math.sin(t * Math.PI * 2) * 40).toFixed(1)}, 0)`);
        smokeWave2.setAttribute('transform', `translate(${(-Math.cos(t * Math.PI * 2) * 48).toFixed(1)}, 0)`);

        const camScale = 1.05 - easeOutCubic(t) * 0.05;
        cameraRig.setAttribute('transform', `translate(510, 760) scale(${camScale.toFixed(4)}) translate(-510, -760)`);

        sunburstOuterRing.setAttribute('transform', `rotate(${(t * 42).toFixed(1)})`);
        heroBackAura.setAttribute('r', (385 + Math.sin(t * Math.PI * 4) * 18).toFixed(1));

        const breathY = 825 + Math.sin(t * Math.PI * 2.5) * 5;
        meghnadHeroGroup.setAttribute('transform', `translate(510, ${breathY.toFixed(1)}) scale(0.84)`);

        const bowLowerProg = easeOutCubic(Math.min(1, t / 0.35));
        const bowAngle = -18 + bowLowerProg * 18;
        loweringBowArmRig.setAttribute('transform', `translate(-255, 330) rotate(${bowAngle.toFixed(1)})`);

        const handRiseProg = easeOutBack(Math.max(0, Math.min(1, (t - 0.10) / 0.35)));
        const handAngle = 24 - handRiseProg * 24;
        peaceHandRig.setAttribute('transform', `translate(245, 330) rotate(${handAngle.toFixed(1)})`);
        palmPeaceGlow.setAttribute('r', (48 + Math.sin(t * Math.PI * 6) * 14).toFixed(1));

        const headShake = Math.sin(t * Math.PI * 3.5) * 2.2;
        meghnadHeadGroup.setAttribute('transform', `rotate(${headShake.toFixed(2)}, 0, 110)`);

        hairLeft.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -128, -210)`);
        hairRight.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 4) * 3.5).toFixed(2)}, 128, -210)`);

        const mouthOpen = getSpeechOpenness(t);
        const jawDrop = mouthOpen * 12.5;
        const mouthWidthScale = 1.0 - mouthOpen * 0.12;

        mouthCavity.setAttribute('ry', (2 + mouthOpen * 9.5).toFixed(1));
        mouthCavity.setAttribute('cy', (3 + jawDrop * 0.45).toFixed(1));
        upperTeeth.setAttribute('opacity', (mouthOpen > 0.35 ? (mouthOpen - 0.35) * 1.3 : 0).toFixed(2));

        upperLip.setAttribute('transform', `translate(0, ${(-mouthOpen * 1.8).toFixed(1)}) scale(${mouthWidthScale.toFixed(3)}, 1)`);
        lowerLip.setAttribute('transform', `translate(0, ${jawDrop.toFixed(1)}) scale(${mouthWidthScale.toFixed(3)}, 1)`);
        chinShadow.setAttribute('transform', `translate(0, ${(jawDrop * 0.85).toFixed(1)})`);

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 3.0) % 1260 + 1260) % 1260 + 220;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.14);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.14);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
