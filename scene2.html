<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwatthama Mani - Scene 2: Mahadev's Third Eye & Rudra Flame (4.5s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #070310;
  }
</style>
</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 2 (00:04.5 – 00:09.0 = 4.5 SECONDS EXACT)
  Voiceover: "...बल्कि वो स्वयं महादेव के तीसरे नेत्र की ज्वाला से जन्मी एक जीवित ऊर्जा थी!"
  Visual Blueprint:
  - Dark cosmic background matching Scene 1 (#040208 -> #2b0d3d).
  - Ornate glowing golden Trishul & Mahadev's Third Eye (Trinetra) divine yantra opening at the center-top.
  - A blazing drop of Rudra-Agni (fire drop) emerges from the opening Third Eye, descends along a golden energy stream,
    and crystallizes into the exact faceted crimson-gold Rudra-Mani gem from Scene 1!
  - Safe-Zone Compliant Kinetic Hindi Keywords ("महादेव का तीसरा नेत्र 🔱" & "जीवित रुद्र-ऊर्जा 🔥") with zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. CONSISTENT COSMIC VOID BACKDROP (Matches Scene 1) -->
    <radialGradient id="cosmicVoidBg" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#2e0e42"/>
      <stop offset="44%" stop-color="#130521"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>

    <!-- Trinetra (Third Eye) Blazing Fire Halo -->
    <radialGradient id="trinetraAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="26%" stop-color="#ffe57f" stop-opacity="0.78"/>
      <stop offset="58%" stop-color="#ff5500" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#130521" stop-opacity="0"/>
    </radialGradient>

    <!-- Trinetra Iris Fire Gradient -->
    <radialGradient id="thirdEyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#fff078"/>
      <stop offset="68%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#7a040e"/>
    </radialGradient>

    <!-- Locked Rudra-Mani Gem Core Gradient (Exact Match with Scene 1) -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD & FLAME GRADIENTS -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="fireDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe57f"/>
      <stop offset="80%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#b80b1a"/>
    </linearGradient>

    <linearGradient id="damaruCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d92626"/>
      <stop offset="100%" stop-color="#61070d"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>

    <!-- Clip Path for Opening Third Eye Eyelids -->
    <clipPath id="thirdEyeClip">
      <path id="eyeOpeningPath" d="M -135 0 Q 0 -10 135 0 Q 0 10 -135 0 Z"/>
    </clipPath>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 880) scale(1) translate(-540, -880)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicVoidBg)"/>
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Cosmic Starfield -->
    <g id="cosmicStarsLayer"></g>

    <!-- LAYER 2: SACRED SHAIVITE YANTRA & GLOWING TRISHUL (TOP-CENTER) -->
    <g id="trishulTrinetraAssembly" transform="translate(540, 620)">
      <!-- Radiant Aura Behind Trishul & Third Eye -->
      <circle id="trinetraBgAura" cx="0" cy="0" r="440" fill="url(#trinetraAura)" opacity="0.82"/>

      <!-- Dual Rotating Sacred Yantra Rings -->
      <g id="yantraOuter" opacity="0.58">
        <circle cx="0" cy="0" r="365" fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-dasharray="22 12"/>
        <circle cx="0" cy="0" r="332" fill="none" stroke="#ffe066" stroke-width="2"/>
        <g id="yantraPetals" stroke="url(#goldMetal)" stroke-width="2.2" fill="#ffbe2e" fill-opacity="0.08"></g>
      </g>
      <g id="yantraInner" opacity="0.52">
        <polygon points="0,-310 268,155 -268,155" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
        <polygon points="0,310 268,-155 -268,-155" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
      </g>

      <!-- ======================================================= -->
      <!-- DIVINE GOLDEN TRISHUL (TRIDENT OF MAHADEV)              -->
      <!-- ======================================================= -->
      <g id="divineTrishul" filter="url(#softGoldGlow)">
        <!-- Central Vertical Staff -->
        <line x1="0" y1="430" x2="0" y2="-395" stroke="#240b03" stroke-width="22" stroke-linecap="round"/>
        <line x1="0" y1="430" x2="0" y2="-395" stroke="url(#goldMetal)" stroke-width="14" stroke-linecap="round"/>

        <!-- Ornate Golden Collar Bands -->
        <rect x="-18" y="-125" width="36" height="16" rx="5" fill="url(#goldBright)" stroke="#240b03" stroke-width="3"/>
        <rect x="-18" y="135" width="36" height="16" rx="5" fill="url(#goldBright)" stroke="#240b03" stroke-width="3"/>

        <!-- Sacred Damaru Drum Attached Below Prongs -->
        <g transform="translate(0, 178)">
          <polygon points="-44,-22 44,22 44,-22 -44,22" fill="url(#damaruCrimson)" stroke="url(#goldBright)" stroke-width="4" stroke-linejoin="round"/>
          <rect x="-8" y="-16" width="16" height="32" rx="4" fill="url(#goldBright)" stroke="#240b03" stroke-width="2.5"/>
          <!-- Swinging Damaru Knots -->
          <path id="damaruStrings" d="M 0 0 Q 38 -25 56 -8 M 0 0 Q -38 25 -56 8" fill="none" stroke="#fff7c2" stroke-width="3" stroke-linecap="round"/>
          <circle cx="56" cy="-8" r="6" fill="#ffe066"/>
          <circle cx="-56" cy="8" r="6" fill="#ffe066"/>
        </g>

        <!-- Grand Side Curved Prongs of the Trishul -->
        <path d="M -98 -235 C -102 -315, -62 -355, -52 -365 C -58 -310, -34 -265, 0 -265 C 34 -265, 58 -310, 52 -365 C 62 -355, 102 -315, 98 -235 C 94 -180, 42 -152, 0 -152 C -42 -152, -94 -180, -98 -235 Z"
              fill="none" stroke="#240b03" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M -98 -235 C -102 -315, -62 -355, -52 -365 C -58 -310, -34 -265, 0 -265 C 34 -265, 58 -310, 52 -365 C 62 -355, 102 -315, 98 -235 C 94 -180, 42 -152, 0 -152 C -42 -152, -94 -180, -98 -235 Z"
              fill="none" stroke="url(#goldBright)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Central Spear Blade Tip -->
        <polygon points="0,-455 -24,-365 0,-382 24,-365" fill="url(#goldBright)" stroke="#240b03" stroke-width="4" stroke-linejoin="round"/>
      </g>

      <!-- ======================================================= -->
      <!-- MAHADEV'S THIRD EYE (TRINETRA) OPENING IN CENTER        -->
      <!-- ======================================================= -->
      <g id="mahadevThirdEye" transform="translate(0, -15)">
        <!-- Sacred Tripundra Tilak Lines Framing the Third Eye -->
        <g opacity="0.92" filter="url(#softGoldGlow)">
          <path d="M -165 -68 Q 0 -92 165 -68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
          <path d="M -150 -50 Q 0 -72 150 -50" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M -165 68 Q 0 92 165 68" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
          <path d="M -150 50 Q 0 72 150 50" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
        </g>

        <!-- Glowing Golden Almond Socket -->
        <path d="M -142 0 Q 0 -105 142 0 Q 0 105 -142 0 Z" fill="#1a0308" stroke="url(#goldBright)" stroke-width="7" filter="url(#superGlow)"/>

        <!-- Clipped Inner Fiery Eye Interior -->
        <g clip-path="url(#thirdEyeClip)">
          <rect x="-150" y="-110" width="300" height="220" fill="#2b040a"/>
          <!-- Blazing Rudra-Agni Iris & Vertical Flame Pupil -->
          <circle cx="0" cy="0" r="68" fill="url(#thirdEyeIris)" filter="url(#superGlow)"/>
          <circle cx="0" cy="0" r="44" fill="none" stroke="#fff7c2" stroke-width="3" stroke-dasharray="10 6"/>
          <!-- Vertical Sacred Flame Pupil -->
          <path d="M 0 -46 C 18 -18, 22 14, 0 46 C -22 14, -18 -18, 0 -46 Z" fill="#ffffff"/>
        </g>

        <!-- Animated Upper & Lower Eyelid Borders -->
        <path id="upperEyelid" d="M -142 0 Q 0 -10 142 0" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
        <path id="lowerEyelid" d="M -142 0 Q 0 10 142 0" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: RUDRA-AGNI FIRE DROP CRYSTALLIZING INTO THE MANI -->
    <!-- ========================================================= -->
    <!-- Glowing Energy Conduit Connecting Third Eye (605) to Crystallized Mani (1185) -->
    <line id="fireConduitBeam" x1="540" y1="620" x2="540" y2="1185" stroke="url(#goldBright)" stroke-width="8" stroke-dasharray="24 14" filter="url(#superGlow)" opacity="0"/>

    <!-- Descending Sacred Drop of Rudra-Agni -->
    <g id="rudraFireDrop" transform="translate(540, 620)" opacity="0" filter="url(#superGlow)">
      <path d="M 0 -58 C 28 -14, 38 18, 0 52 C -38 18, -28 -14, 0 -58 Z" fill="url(#fireDropGrad)" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="0" cy="14" rx="12" ry="18" fill="#ffffff"/>
    </g>

    <!-- CRYSTALLIZED RUDRA-MANI GEM (EXACT MATCH WITH SCENE 1) -->
    <g id="crystallizedManiGroup" transform="translate(540, 1185)" opacity="0">
      <!-- Expanding Shockwave Rings on Crystallization -->
      <circle id="crystalShock1" cx="0" cy="0" r="65" fill="none" stroke="#fff7c2" stroke-width="9" opacity="0"/>
      <circle id="crystalShock2" cx="0" cy="0" r="65" fill="none" stroke="#ff6a00" stroke-width="6" opacity="0"/>

      <!-- Radiant Golden Halo Behind Mani -->
      <circle id="maniHalo" cx="0" cy="0" r="220" fill="url(#trinetraAura)"/>

      <!-- Rotating Sacred Hexagonal Setting -->
      <g id="maniHexSetting">
        <polygon points="0,-105 91,-52.5 91,52.5 0,105 -91,52.5 -91,-52.5" fill="#1c0408" fill-opacity="0.88" stroke="url(#goldMetal)" stroke-width="6"/>
        <circle cx="0" cy="0" r="126" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-dasharray="14 8"/>
      </g>

      <!-- Faceted Oval Crimson-Gold Rudra-Mani Core (Identical to Scene 1) -->
      <g id="maniGemBody" filter="url(#superGlow)">
        <ellipse cx="0" cy="0" rx="54" ry="74" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="4"/>
        <polygon points="0,-52 32,0 0,52 -32,0" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.88"/>
        <circle cx="-15" cy="-24" r="12" fill="#ffffff"/>
      </g>
    </g>

    <!-- Floating Golden Fire Embers -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: महादेव का तीसरा नेत्र -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-365" y="-56" width="730" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="50" font-weight="900" letter-spacing="1">महादेव का तीसरा नेत्र 🔱</text>
      </g>

      <!-- Keyword 2: जीवित रुद्र-ऊर्जा -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-295" y="-50" width="590" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900" letter-spacing="1">जीवित रुद्र-ऊर्जा 🔥</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 4.5-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4500; // Exact 4.5s matching Scene 2 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const yantraOuter = document.getElementById('yantraOuter');
      const yantraInner = document.getElementById('yantraInner');
      const yantraPetals = document.getElementById('yantraPetals');
      const trinetraBgAura = document.getElementById('trinetraBgAura');
      const damaruStrings = document.getElementById('damaruStrings');

      const eyeOpeningPath = document.getElementById('eyeOpeningPath');
      const upperEyelid = document.getElementById('upperEyelid');
      const lowerEyelid = document.getElementById('lowerEyelid');

      const fireConduitBeam = document.getElementById('fireConduitBeam');
      const rudraFireDrop = document.getElementById('rudraFireDrop');

      const crystallizedManiGroup = document.getElementById('crystallizedManiGroup');
      const maniHexSetting = document.getElementById('maniHexSetting');
      const maniGemBody = document.getElementById('maniGemBody');
      const maniHalo = document.getElementById('maniHalo');
      const crystalShock1 = document.getElementById('crystalShock1');
      const crystalShock2 = document.getElementById('crystalShock2');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 16 Sacred Lotus Petals Around Yantra
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-332 Q20,-290 0,-255 Q-20,-290 0,-332 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        yantraPetals.appendChild(p);
      }

      // 2. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 30 Rising Rudra-Agni Spark Embers
      const particles = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff5500');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 150 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.5s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Camera Push-In (1.0 -> 1.08)
        const camScale = 1 + easeOutCubic(t) * 0.08;
        cameraRig.setAttribute('transform', `translate(540, 880) scale(${camScale.toFixed(4)}) translate(-540, -880)`);

        // 3. Yantra Rotation & Damaru String Vibration
        yantraOuter.setAttribute('transform', `rotate(${(t * 54).toFixed(1)})`);
        yantraInner.setAttribute('transform', `rotate(${(-t * 42).toFixed(1)})`);
        trinetraBgAura.setAttribute('r', (425 + Math.sin(t * Math.PI * 6) * 35).toFixed(1));
        damaruStrings.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 24) * 14).toFixed(1)})`);

        // 4. Mahadev's Third Eye (Trinetra) Opening Wide (t: 0.05 -> 0.28)
        const eyeOpenProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.05) / 0.23)));
        const lidCurve = 8 + eyeOpenProg * 97; // Opens smoothly from 8 to 105
        eyeOpeningPath.setAttribute('d', `M -142 0 Q 0 ${(-lidCurve).toFixed(1)} 142 0 Q 0 ${lidCurve.toFixed(1)} -142 0 Z`);
        upperEyelid.setAttribute('d', `M -142 0 Q 0 ${(-lidCurve).toFixed(1)} 142 0`);
        lowerEyelid.setAttribute('d', `M -142 0 Q 0 ${lidCurve.toFixed(1)} 142 0`);

        // 5. Blazing Drop of Rudra-Agni Descending from Third Eye (t: 0.24 -> 0.48)
        if (t >= 0.24 && t <= 0.48) {
          const dropProg = easeInOutCubic((t - 0.24) / 0.24);
          const dropY = 605 + dropProg * 580; // Travels from Third Eye (605) to Mani Socket (1185)
          const dropScale = 0.65 + Math.sin(dropProg * Math.PI) * 0.45;
          rudraFireDrop.setAttribute('opacity', '1');
          rudraFireDrop.setAttribute('transform', `translate(540, ${dropY.toFixed(1)}) scale(${dropScale.toFixed(3)})`);

          fireConduitBeam.setAttribute('opacity', (dropProg * 0.85).toFixed(2));
          fireConduitBeam.setAttribute('stroke-dashoffset', (-t * 450).toFixed(1));
        } else if (t > 0.48) {
          rudraFireDrop.setAttribute('opacity', '0');
          fireConduitBeam.setAttribute('opacity', (0.45 + 0.25 * Math.sin(t * Math.PI * 8)).toFixed(2));
          fireConduitBeam.setAttribute('stroke-dashoffset', (-t * 450).toFixed(1));
        } else {
          rudraFireDrop.setAttribute('opacity', '0');
          fireConduitBeam.setAttribute('opacity', '0');
        }

        // 6. Crystallization of the Living Rudra-Mani Gem (t: 0.46 -> 1.0)
        if (t >= 0.46) {
          const crystP = Math.min(1, (t - 0.46) / 0.18);
          const popScale = 0.35 + 0.65 * easeOutBack(crystP);
          const heartbeat = 1 + Math.sin((t - 0.46) * Math.PI * 8) * 0.08;

          crystallizedManiGroup.setAttribute('opacity', Math.min(1, crystP * 2.2).toFixed(2));
          crystallizedManiGroup.setAttribute('transform', `translate(540, 1185) scale(${popScale.toFixed(3)})`);

          maniHexSetting.setAttribute('transform', `rotate(${((t - 0.46) * 72).toFixed(1)})`);
          maniGemBody.setAttribute('transform', `scale(${heartbeat.toFixed(3)})`);
          maniHalo.setAttribute('r', (210 + Math.sin(t * Math.PI * 8) * 28).toFixed(1));

          // Expanding Shockwave Rings Upon Crystallization (t: 0.46 -> 0.78)
          if (t <= 0.78) {
            const sw1 = (t - 0.46) / 0.32;
            crystalShock1.setAttribute('r', (65 + easeOutCubic(sw1) * 260).toFixed(1));
            crystalShock1.setAttribute('opacity', ((1 - sw1) * 0.9).toFixed(2));

            const sw2 = Math.max(0, (t - 0.52) / 0.26);
            crystalShock2.setAttribute('r', (65 + easeOutCubic(sw2) * 220).toFixed(1));
            crystalShock2.setAttribute('opacity', (sw2 > 0 ? (1 - sw2) * 0.85 : 0).toFixed(2));
          } else {
            crystalShock1.setAttribute('opacity', '0');
            crystalShock2.setAttribute('opacity', '0');
          }
        } else {
          crystallizedManiGroup.setAttribute('opacity', '0');
        }

        // 7. Rising Rudra-Agni Spark Embers
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 4.5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 8. Safe-Zone Kinetic Hindi Keywords ("महादेव का तीसरा नेत्र 🔱" & "जीवित रुद्र-ऊर्जा 🔥")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.13);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.48) {
          const p2 = Math.min(1, (t - 0.48) / 0.13);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
