  * { box-sizing: border-box; margin: 0; padding: 0; }

    width: 100%;
    height: 100%;
    background: #06030d;
    display: flex;

  svg#scene {

<body>

<!-- 
  PART 3 - CLIP 14 (5.0 SECONDS EXACT) — SEAMLESS LOOP FINALE MATCHING CLIP 1 FRAME
  Voiceover: "कमेंट में 'जय श्रीराम 🚩' लिखें और इस रहस्य को शेयर करें, क्योंकि..."
  Visual Design:
  - Phase 1 (0.0s - 3.6s): Lord Shri Ram's divine Kodanda bow & luminous golden arrow spin and lock upright inside the golden mandala with kinetic CTA keywords ("जय श्रीराम 🚩", "Part 2 देखें 👆").
  - Phase 2 (3.6s - 5.0s): Smoothly cross-dissolves into the EXACT opening frame of Clip 1 (cosmicBg #221042->#05020d, golden mandala at 0 deg, central "?" emblem, camera scale = 1.000) so the loop back to Clip 1 is 100% seamless!
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. EXACT CLIP 1 COSMIC INDIGO BACKGROUND GRADIENT -->
    <radialGradient id="cosmicBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#221042"/>
      <stop offset="48%" stop-color="#110724"/>
      <stop offset="100%" stop-color="#05020d"/>
    </radialGradient>

    <!-- Warm Golden Halo behind Mandala (Matches Clip 1) -->
    <radialGradient id="goldenMandalaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f" stop-opacity="0.56"/>
      <stop offset="42%" stop-color="#ff9900" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#110724" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD & DIVINE BOW GRADIENTS -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6b3"/>
      <stop offset="45%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#9e5d06"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08b0b"/>
    </linearGradient>

    <linearGradient id="kodandaWoodGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="arrowShaftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- VIEWER COMMENT CARD GLASS GRADIENT (Exact Match with Clip 1) -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1436" stop-opacity="0.97"/>
      <stop offset="60%" stop-color="#130b24" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0b0617" stop-opacity="0.99"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="goldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.82"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Ends at scale 1.000 at t=5.0s to match Clip 1 start frame!) -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: EXACT CLIP 1 COSMIC INDIGO BACKDROP & BORDER FILIGREE -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicBg)"/>

    <g opacity="0.28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Floating Golden Dust & Sparkles -->
    <g id="particlesLayer"></g>

    <!-- LAYER 2: SHARED GOLDEN MANDALA ANCHOR AT (540, 880) — IDENTICAL TO CLIP 1 -->
    <g id="mandalaAnchor" transform="translate(540, 880)">
      <!-- Radiant Warm Aura -->
      <circle id="auraCircle" cx="0" cy="0" r="520" fill="url(#goldenMandalaAura)"/>

      <!-- Outer Rotating Sacred Ring (Locks to 0 deg at t=5.0s) -->
      <g id="outerRing">
        <circle cx="0" cy="0" r="460" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="26 14"/>
        <circle cx="0" cy="0" r="430" fill="none" stroke="#ffd24d" stroke-width="1.8" opacity="0.55"/>
        <g id="lotusPetals" stroke="url(#goldGrad)" stroke-width="2.5" fill="#ffd24d" fill-opacity="0.08"></g>
      </g>

      <!-- Counter-Rotating Geometric Yantra Star (Locks to 0 deg at t=5.0s) -->
      <g id="innerYantra">
        <polygon points="0,-375 325,188 -325,188" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75"/>
        <polygon points="0,375 325,-188 -325,-188" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75"/>
        <circle cx="0" cy="0" r="265" fill="#130826" fill-opacity="0.72" stroke="url(#goldGrad)" stroke-width="4"/>
      </g>

      <!-- Shockwave Ring on Bow Lock -->
      <circle id="lockShockRing" cx="0" cy="0" r="180" fill="none" stroke="#fff6b3" stroke-width="9" opacity="0"/>

      <!-- ======================================================= -->
      <!-- HERO WEAPON: LORD SHRI RAM'S KODANDA BOW & GOLDEN ARROW -->
      <!-- ======================================================= -->
      <g id="kodandaHeroGroup" transform="scale(1)">
        <!-- Ornate Recurved Kodanda Bow Limb (Upright Vertical Stance) -->
        <g filter="url(#goldGlow)">
          <!-- Main Double-Curved Golden Bow Stave -->
          <path d="M -35 -330 C -115 -265, -135 -170, -85 -85 C -55 -35, -55 35, -85 85 C -135 170, -115 265, -35 330"
                fill="none" stroke="#240d02" stroke-width="28" stroke-linecap="round"/>
          <path d="M -35 -330 C -115 -265, -135 -170, -85 -85 C -55 -35, -55 35, -85 85 C -135 170, -115 265, -35 330"
                fill="none" stroke="url(#kodandaWoodGold)" stroke-width="18" stroke-linecap="round"/>

          <!-- Ornate Golden Grip & Lotus Filigree Bands on Bow -->
          <rect x="-78" y="-36" width="26" height="72" rx="8" fill="url(#goldBright)" stroke="#240d02" stroke-width="3.5"/>
          <circle cx="-65" cy="0" r="10" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
          <circle cx="-95" cy="-165" r="8" fill="url(#goldBright)" stroke="#240d02" stroke-width="2.5"/>
          <circle cx="-95" cy="165" r="8" fill="url(#goldBright)" stroke="#240d02" stroke-width="2.5"/>

          <!-- Top & Bottom Golden Horn Tips -->
          <path d="M -35 -330 Q -15 -355 -28 -375 Q -48 -355 -35 -330 Z" fill="url(#goldBright)" stroke="#240d02" stroke-width="2.5"/>
          <path d="M -35 330 Q -15 355 -28 375 Q -48 355 -35 330 Z" fill="url(#goldBright)" stroke="#240d02" stroke-width="2.5"/>

          <!-- Drawn Luminous Bowstring -->
          <polyline id="bowString" points="-35,-335 45,0 -35,335" fill="none" stroke="#fff7c2" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <!-- Divine Golden Brahmastra / Rama-Bana Arrow Locked on Bow -->
        <g id="divineArrow" transform="translate(0, 0)" filter="url(#strongGlow)">
          <!-- Arrow Shaft -->
          <line x1="-185" y1="0" x2="215" y2="0" stroke="url(#arrowShaftGrad)" stroke-width="10" stroke-linecap="round"/>
          <!-- Golden Fletching Feathers at Tail -->
          <path d="M -185 0 L -225 -24 L -195 0 L -225 24 Z" fill="url(#goldBright)" stroke="#240d02" stroke-width="2"/>
          <path d="M -160 0 L -195 -20 L -170 0 L -195 20 Z" fill="#ff9900"/>
          <!-- Blazing Crescent-Tipped Arrowhead -->
          <path d="M 205 -26 L 265 0 L 205 26 L 222 0 Z" fill="#ffffff" stroke="#ffbe2e" stroke-width="3"/>
          <!-- Radiant Starburst Spark on Arrow Tip -->
          <circle id="arrowTipSpark" cx="265" cy="0" r="22" fill="#fff7c2" opacity="0.9"/>
        </g>
      </g>

      <!-- ======================================================= -->
      <!-- LOOP BRIDGE: CLIP 1 CENTRAL QUESTION MARK ("?") FADE-IN -->
      <!-- (Appears smoothly in final 1.2s so t=5.0s == Clip 1 t=0s) -->
      <!-- ======================================================= -->
      <g id="loopQuestionMark" filter="url(#strongGlow)" opacity="0">
        <text x="0" y="95" text-anchor="middle" fill="url(#goldBright)" font-size="310" font-weight="900">?</text>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- CLIP 1 VIEWER COMMENT CARD POP-IN ON "क्योंकि..." (3.7s-5s) -->
    <!-- ========================================================= -->
    <g id="loopCommentCard" transform="translate(540, 940)" filter="url(#cardDropShadow)" opacity="0">
      <rect x="-465" y="-175" width="930" height="350" rx="36" fill="none" stroke="#ffe066" stroke-width="5" filter="url(#goldGlow)" opacity="0.85"/>
      <rect x="-465" y="-175" width="930" height="350" rx="36" fill="url(#cardSurface)" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="-410" y1="-72" x2="410" y2="-72" stroke="#ffd24d" stroke-width="1.5" opacity="0.25"/>
      <circle cx="-365" cy="-115" r="34" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
      <text x="-365" y="-103" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="900">K</text>
      <text x="-310" y="-118" fill="#e2e8f0" font-size="30" font-weight="800">@KailashMehta-l5v</text>
      <text x="-310" y="-86" fill="#94a3b8" font-size="22" font-weight="700">• 2 hours ago • YouTube Comment</text>
      <rect x="235" y="-142" width="190" height="46" rx="23" fill="url(#goldGrad)"/>
      <text x="330" y="-111" text-anchor="middle" fill="#1a0900" font-size="24" font-weight="900">सवाल 🔥</text>
      <text x="-415" y="-8" fill="#ffffff" font-size="42" font-weight="800">"To fir ye shrap tha to sita haran</text>
      <text x="-415" y="52" fill="#ffd24d" font-size="44" font-weight="900">me kyu nai hua ye? 🤔"</text>
      <g transform="translate(-415, 118)">
        <rect x="0" y="-22" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.08"/>
        <text x="75" y="8" text-anchor="middle" fill="#cbd5e1" font-size="24" font-weight="700">👍  1.2K</text>
        <rect x="170" y="-22" width="195" height="44" rx="22" fill="#ff2a55" fill-opacity="0.22" stroke="#ff4d73" stroke-width="1.5"/>
        <text x="267" y="8" text-anchor="middle" fill="#ff809b" font-size="24" font-weight="800">❤️ Creator</text>
      </g>
    </g>

    <!-- LAYER 3: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third y=1560 to 1760) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Phase 1 Keywords (0.0s - 3.6s): जय श्रीराम & Part 2 देखें -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-295" y="-58" width="590" height="98" rx="24" fill="#16092b" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#goldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="56" font-weight="900" letter-spacing="1">जय श्रीराम 🚩</text>
      </g>

      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-255" y="-50" width="510" height="84" rx="42" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#170700" font-size="44" font-weight="900" letter-spacing="1.5">Part 2 देखें 👆</text>
      </g>

      <!-- Phase 2 Keywords on "क्योंकि..." (3.7s - 5.0s): Exact Clip 1 Keywords -->
      <g id="loopKw1" opacity="0" transform="scale(0.85)">
        <rect x="-310" y="-58" width="620" height="98" rx="24" fill="#16092b" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#goldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="56" font-weight="900" letter-spacing="1">सवाल का जवाब ✨</text>
      </g>

      <g id="loopKw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-270" y="-50" width="540" height="84" rx="42" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#170700" font-size="44" font-weight="900" letter-spacing="1.5">Part 3 Special 🔥</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND SEAMLESS LOOP ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const outerRing = document.getElementById('outerRing');
      const innerYantra = document.getElementById('innerYantra');
      const auraCircle = document.getElementById('auraCircle');
      const lockShockRing = document.getElementById('lockShockRing');
      const kodandaHeroGroup = document.getElementById('kodandaHeroGroup');
      const divineArrow = document.getElementById('divineArrow');
      const bowString = document.getElementById('bowString');
      const arrowTipSpark = document.getElementById('arrowTipSpark');
      const loopQuestionMark = document.getElementById('loopQuestionMark');
      const loopCommentCard = document.getElementById('loopCommentCard');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');
      const loopKw1 = document.getElementById('loopKw1');
      const loopKw2 = document.getElementById('loopKw2');
      const lotusPetals = document.getElementById('lotusPetals');
      const particlesLayer = document.getElementById('particlesLayer');

      // Generate exact same 16 Sacred Lotus Petals as Clip 1
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-430 Q26,-380 0,-340 Q-26,-380 0,-430 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        lotusPetals.appendChild(p);
      }

      // Generate exact same 28 Floating Golden Sparkle Particles as Clip 1
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const baseX = (i * 113) % 1080;
        const baseY = 180 + ((i * 197) % 1620);
        const r = 2.5 + (i % 4) * 1.2;
        c.setAttribute('r', r);
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffd24d');
        particlesLayer.appendChild(c);
        particles.push({ el: c, baseX, baseY, speed: 130 + (i % 6) * 30, phase: i * 0.6 });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Camera Push-In then Smooth Pull-Back to Exact scale=1.000 at t=1.0 for Seamless Loop!
        let camScale = 1.0;
        if (t < 0.72) {
          camScale = 1.0 + easeOutCubic(t / 0.72) * 0.07;
        } else {
          const resetP = easeInOutCubic((t - 0.72) / 0.28);
          camScale = 1.07 - resetP * 0.07; // Returns cleanly to 1.000 at t=1.0!
        }
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Mandala Full 360-Degree Cycle (Ends at exact 0 deg at t=1.0 to match Clip 1!)
        const outerAngle = easeInOutCubic(t) * 360;
        const innerAngle = -easeInOutCubic(t) * 360;
        outerRing.setAttribute('transform', `rotate(${outerAngle.toFixed(2)})`);
        innerYantra.setAttribute('transform', `rotate(${innerAngle.toFixed(2)})`);

        // Aura circle matches Clip 1's r=520 at t=1.0
        const auraR = 520 + Math.sin(t * Math.PI * 4) * 38;
        auraCircle.setAttribute('r', auraR.toFixed(1));

        // 3. Kodanda Bow & Golden Arrow Spin-In (0.0 -> 0.24), Draw & Lock (0.24 -> 0.74), Loop Dissolve (0.74 -> 1.0)
        if (t < 0.24) {
          const p = easeOutBack(t / 0.24);
          const rot = -360 * (1 - p);
          const s = 0.45 + 0.55 * p;
          kodandaHeroGroup.setAttribute('opacity', Math.min(1, p * 1.4).toFixed(2));
          kodandaHeroGroup.setAttribute('transform', `rotate(${rot.toFixed(1)}) scale(${s.toFixed(3)})`);
          lockShockRing.setAttribute('opacity', '0');
          loopQuestionMark.setAttribute('opacity', '0');
        } else if (t < 0.74) {
          const holdT = (t - 0.24) / 0.50;
          const breath = 1 + Math.sin(holdT * Math.PI * 3) * 0.03;
          kodandaHeroGroup.setAttribute('opacity', '1');
          kodandaHeroGroup.setAttribute('transform', `rotate(0) scale(${breath.toFixed(3)})`);

          // Shockwave burst right after bow locks (0.24 -> 0.44)
          if (t < 0.44) {
            const sw = (t - 0.24) / 0.20;
            lockShockRing.setAttribute('r', (180 + easeOutCubic(sw) * 260).toFixed(1));
            lockShockRing.setAttribute('opacity', ((1 - sw) * 0.85).toFixed(2));
          } else {
            lockShockRing.setAttribute('opacity', '0');
          }

          // Subtle bowstring draw & arrow energy pulse
          const drawPull = 45 - Math.sin(holdT * Math.PI * 2) * 28;
          bowString.setAttribute('points', `-35,-335 ${drawPull.toFixed(1)},0 -35,335`);
          divineArrow.setAttribute('transform', `translate(${(drawPull - 45).toFixed(1)}, 0)`);
          const sparkR = 20 + Math.sin(holdT * Math.PI * 8) * 7;
          arrowTipSpark.setAttribute('r', sparkR.toFixed(1));

          loopQuestionMark.setAttribute('opacity', '0');
          loopCommentCard.setAttribute('opacity', '0');
        } else {
          // Seamless Loop Bridge on "क्योंकि..." (0.74 -> 1.0): Kodanda Bow exits while Clip 1's "?" + Comment Card pop in!
          const loopP = easeInOutCubic((t - 0.74) / 0.26);
          const bowScale = 1 - loopP * 0.22;
          kodandaHeroGroup.setAttribute('opacity', (1 - loopP).toFixed(2));
          kodandaHeroGroup.setAttribute('transform', `rotate(0) scale(${bowScale.toFixed(3)})`);

          const qScale = 0.82 + loopP * 0.18; // Reaches exact scale(1) at t=1.0!
          loopQuestionMark.setAttribute('opacity', loopP.toFixed(2));
          loopQuestionMark.setAttribute('transform', `scale(${qScale.toFixed(3)})`);

          // Pop-in Clip 1's @KailashMehta-l5v Comment Card right on "क्योंकि..."
          const cardP = easeOutBack(Math.min(1, (t - 0.76) / 0.20));
          const cardScale = 0.78 + 0.22 * cardP;
          const cardY = 980 - 40 * cardP;
          loopCommentCard.setAttribute('opacity', Math.min(1, Math.max(0, (t - 0.76) / 0.12)).toFixed(2));
          loopCommentCard.setAttribute('transform', `translate(540, ${cardY.toFixed(1)}) scale(${cardScale.toFixed(3)})`);
          lockShockRing.setAttribute('opacity', '0');
        }

        // 4. Kinetic Hindi Keywords — Phase 1 ("जय श्रीराम 🚩") transitions into Clip 1 Keywords on "क्योंकि..."
        if (t >= 0.22 && t < 0.72) {
          const p1 = Math.min(1, (t - 0.22) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else if (t >= 0.72 && t < 0.80) {
          const fadeOut = 1 - (t - 0.72) / 0.08;
          kw1.setAttribute('opacity', Math.max(0, fadeOut).toFixed(2));
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.42 && t < 0.72) {
          const p2 = Math.min(1, (t - 0.42) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else if (t >= 0.72 && t < 0.80) {
          const fadeOut = 1 - (t - 0.72) / 0.08;
          kw2.setAttribute('opacity', Math.max(0, fadeOut).toFixed(2));
        } else {
          kw2.setAttribute('opacity', '0');
        }

        // Clip 1 Keywords ("सवाल का जवाब ✨" & "Part 3 Special 🔥") pop in during "क्योंकि..." (0.78 -> 1.0)
        if (t >= 0.78) {
          const lp1 = Math.min(1, (t - 0.78) / 0.12);
          const ls1 = 0.85 + 0.15 * easeOutBack(lp1);
          loopKw1.setAttribute('opacity', easeOutCubic(lp1).toFixed(2));
          loopKw1.setAttribute('transform', `scale(${ls1.toFixed(3)})`);
        } else {
          loopKw1.setAttribute('opacity', '0');
        }

        if (t >= 0.84) {
          const lp2 = Math.min(1, (t - 0.84) / 0.12);
          const ls2 = 0.85 + 0.15 * easeOutBack(lp2);
          loopKw2.setAttribute('opacity', easeOutCubic(lp2).toFixed(2));
          loopKw2.setAttribute('transform', `translate(0, 118) scale(${ls2.toFixed(3)})`);
        } else {
          loopKw2.setAttribute('opacity', '0');
        }

        // 5. Floating Golden Particles (Periodic over 5.0s so t=1.0 matches t=0.0!)
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * 1680) % 1680 + 1680) % 1680 + 120;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          const op = 0.25 + 0.65 * Math.sin(t * Math.PI * 6 + pt.phase);
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', Math.max(0.1, op).toFixed(2));
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
