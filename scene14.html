<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 12B (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #02040a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #040917;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 12B (5.0 SECONDS EXACT)
  Voiceover: "...जिसे स्वयं देवताओं का राजा भी नहीं झुका सका था।"
  Visual Concept: Cold indigo contrast lighting; behind Indrajit, Devraj Indra's celestial crown
  and Vajra emblem appear bowed in defeat while Indrajit's silhouette stands tall and unbowed in front.
  100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s loop, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. COLD INDIGO CONTRAST BACKDROP -->
    <radialGradient id="coldIndigoBg" cx="52%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#233366"/>
      <stop offset="45%" stop-color="#0e1733"/>
      <stop offset="82%" stop-color="#060a18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <radialGradient id="unbowedRimHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.92"/>
      <stop offset="32%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="68%" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e1733" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. LOCKED MEGHNAD (INDRAJIT) PALETTE -->
    <linearGradient id="meghnadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a370"/>
      <stop offset="52%" stop-color="#b57443"/>
      <stop offset="100%" stop-color="#6b3b1b"/>
    </linearGradient>

    <linearGradient id="meghnadSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d4724"/>
      <stop offset="100%" stop-color="#381a08"/>
    </linearGradient>

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="52%" stop-color="#083336"/>
      <stop offset="100%" stop-color="#03171a"/>
    </linearGradient>

    <linearGradient id="crimsonRoyalCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#690b12"/>
      <stop offset="100%" stop-color="#2b0306"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: COLD INDIGO CONTRAST BACKDROP & SAFE-ZONE FLOOR -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#coldIndigoBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Cold Indigo Mandala Behind Scene -->
    <g id="bgMandala" transform="translate(505, 740)" opacity="0.34">
      <circle cx="0" cy="0" r="395" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="url(#goldMetal)" stroke-width="2" opacity="0.65"/>
    </g>

    <rect x="75" y="1225" width="850" height="22" rx="6" fill="url(#goldMetal)" stroke="#050914" stroke-width="4"/>
    <rect x="-60" y="1247" width="1200" height="720" fill="#030612"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: BOWED CROWN & VAJRA OF DEVRAJ INDRA BEHIND       -->
    <!-- Positioned in Upper-Right Safe Zone (x=665, y=525)        -->
    <!-- ========================================================= -->
    <g id="bowedIndraSymbolGroup" transform="translate(665, 525)">
      <circle id="indraBowedAura" cx="0" cy="25" r="215" fill="url(#unbowedRimHalo)" opacity="0.45"/>

      <!-- Bowed Celestial Crown & Vajra Emblem -->
      <g id="bowedCrownVajra" transform="rotate(26)">
        <!-- Celestial Crown Bowed Downward -->
        <path d="M -102 25 L -72 -92 L 0 -145 L 72 -92 L 102 25 Z" fill="#091226" stroke="#60a5fa" stroke-width="4.5" stroke-linejoin="round"/>
        <circle cx="0" cy="-68" r="14" fill="#2563eb" stroke="#bfdbfe" stroke-width="2.5"/>
        <path d="M -116 25 Q 0 4 116 25 L 108 45 Q 0 26 -108 45 Z" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3.5"/>

        <!-- Bowed Vajra Emblem Below Crown -->
        <g transform="translate(0, 112) rotate(-20)">
          <rect x="-24" y="-10" width="48" height="20" rx="5" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
          <path d="M -24 -6 L -92 -32 L -122 0 L -92 32 L -24 6 Z" fill="#172554" stroke="#60a5fa" stroke-width="3.5"/>
          <path d="M 24 -6 L 92 -32 L 122 0 L 92 32 L 24 6 Z" fill="#172554" stroke="#60a5fa" stroke-width="3.5"/>
        </g>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: INDRAJIT STANDING TALL & UNBOWED IN FRONT (12B)   -->
    <!-- ========================================================= -->
    <g id="indrajitUnbowedGroup" transform="translate(465, 845) scale(0.82)">
      <circle id="unbowedHeroHalo" cx="0" cy="40" r="325" fill="url(#unbowedRimHalo)" opacity="0.72"/>

      <!-- Swept-Back Warrior Hair Locks -->
      <path id="hairLeft" d="M -128 -210 C -205 -125, -225 25, -185 185 C -162 95, -148 5, -112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>
      <path id="hairRight" d="M 128 -210 C 205 -125, 225 25, 185 185 C 162 95, 148 5, 112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>

      <!-- Upright Unbowed Warrior Torso & Armor -->
      <path d="M -340 490 C -320 295, -225 210, -106 185 L 106 185 C 225 210, 320 295, 340 490 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="6"/>
      <path d="M -225 220 C -148 268, 148 268, 225 220 L 255 490 L -255 490 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="5.5"/>
      <path d="M -225 220 C -148 268, 148 268, 225 220" fill="none" stroke="url(#goldBright)" stroke-width="8"/>
      <path d="M -235 230 C -158 325, -42 420, 92 490 L 24 490 C -102 420, -198 330, -255 258 Z" fill="url(#crimsonRoyalCloth)" stroke="#0a1214" stroke-width="4.5"/>
      <path d="M -138 198 C -62 315, 34 420, 128 490" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" opacity="0.92"/>

      <!-- Naga-Wing Golden Shoulder Pauldrons -->
      <path d="M -322 300 C -285 245, -212 240, -176 284 L -205 342 C -244 312, -290 320, -332 360 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>
      <path d="M 322 300 C 285 245, 212 240, 176 284 L 205 342 C 244 312, 290 320, 332 360 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>

      <!-- Neck & Royal Gold Kantha -->
      <path d="M -68 70 L 68 70 L 82 190 L -82 190 Z" fill="url(#meghnadSkinShadow)" stroke="#0a1214" stroke-width="5"/>
      <path d="M -98 182 Q 0 256 98 182" fill="none" stroke="url(#goldMetal)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="0" cy="226" r="14" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4"/>

      <!-- LOCKED MEGHNAD HEAD & NAGA-SERPENT CROWN STANDING STRAIGHT -->
      <g id="unbowedHeadGroup">
        <path d="M -126 -265 L -95 -420 L -38 -480 L 0 -555 L 38 -480 L 95 -420 L 126 -265 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M -126 -285 C -175 -315, -185 -365, -155 -395 C -145 -355, -135 -325, -112 -305 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <path d="M 126 -285 C 175 -315, 185 -365, 155 -395 C 145 -355, 135 -325, 112 -305 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <circle cx="0" cy="-395" r="17" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4"/>
        <circle cx="0" cy="-572" r="11" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
        <path d="M -142 -268 Q 0 -300 142 -268 L 136 -236 Q 0 -266 -136 -236 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="5"/>

        <path d="M -138 -244 L 138 -244 L 134 -125 L 116 -38 L 54 68 C 24 102, -24 102, -54 68 L -116 -38 L -134 -125 Z"
              fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <polygon points="-146,-65 -158,-25 -146,-8 -134,-25" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
        <polygon points="146,-65 158,-25 146,-8 134,-25" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>

        <line x1="-62" y1="-212" x2="62" y2="-212" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="-54" y1="-196" x2="54" y2="-196" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="-44" y1="-180" x2="44" y2="-180" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-196" r="8.5" fill="#dc2626" stroke="#fff7c2" stroke-width="2"/>

        <path d="M -114 -156 L -32 -138" stroke="#0f1115" stroke-width="10.5" stroke-linecap="round"/>
        <path d="M 114 -156 L 32 -138" stroke="#0f1115" stroke-width="10.5" stroke-linecap="round"/>

        <path d="M -104 -120 Q -66 -144 -32 -118 Q -66 -100 -104 -120 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="-68" cy="-120" r="11.5" fill="#d97706"/>
        <circle cx="-68" cy="-120" r="5.5" fill="#090d10"/>
        <circle cx="-72" cy="-124" r="2.8" fill="#ffffff"/>

        <path d="M 104 -120 Q 66 -144 32 -118 Q 66 -100 104 -120 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="68" cy="-120" r="11.5" fill="#d97706"/>
        <circle cx="68" cy="-120" r="5.5" fill="#090d10"/>
        <circle cx="64" cy="-124" r="2.8" fill="#ffffff"/>

        <path d="M 0 -128 L -11 -46 L 10 -40" fill="none" stroke="#5c3014" stroke-width="5" stroke-linecap="round"/>
        <path d="M 0 -22 C -32 -30, -64 -20, -82 -4 C -58 -12, -28 -14, 0 -16 C 28 -14, 58 -12, 82 -4 C 64 -20, 32 -30, 0 -22 Z" fill="#0f1115"/>
        <path d="M -28 16 Q 0 24 28 16" fill="none" stroke="#6b2519" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Rising Golden & Indigo Sparks -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: इंद्र भी न झुका सका -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-320" y="-48" width="640" height="82" rx="22" fill="#0b1530" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="43" font-weight="900" letter-spacing="1">इंद्र भी न झुका सका 👑</text>
      </g>

      <!-- Keyword 2: अजेय योद्धा इंद्रजीत -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-295" y="-44" width="590" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">अजेय योद्धा इंद्रजीत 🚩</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND COLD INDIGO CONTRAST & UNBOWED STANCE ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const bowedCrownVajra = document.getElementById('bowedCrownVajra');
      const indraBowedAura = document.getElementById('indraBowedAura');
      const indrajitUnbowedGroup = document.getElementById('indrajitUnbowedGroup');
      const unbowedHeadGroup = document.getElementById('unbowedHeadGroup');
      const hairLeft = document.getElementById('hairLeft');
      const hairRight = document.getElementById('hairRight');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#93c5fd' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#93c5fd');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);
        bgMandala.setAttribute('transform', `translate(505, 740) rotate(${(t * 32).toFixed(1)})`);

        // Bowed Indra Crown & Vajra Gentle Subdued Tilt
        const bowTilt = 24 + Math.sin(t * Math.PI * 2.5) * 2.2;
        bowedCrownVajra.setAttribute('transform', `rotate(${bowTilt.toFixed(1)})`);
        indraBowedAura.setAttribute('r', (210 + Math.sin(t * Math.PI * 4) * 16).toFixed(1));

        // Unbowed Indrajit Standing Upright & Steady in Front
        const breathY = 845 + Math.sin(t * Math.PI * 3) * 4;
        indrajitUnbowedGroup.setAttribute('transform', `translate(465, ${breathY.toFixed(1)}) scale(0.82)`);
        unbowedHeadGroup.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 2.5) * 1.1).toFixed(2)}, 0, 110)`);
        hairLeft.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -128, -210)`);
        hairRight.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 4) * 3.5).toFixed(2)}, 128, -210)`);

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
