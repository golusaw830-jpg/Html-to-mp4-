  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const sitaHaloOrb = document.getElementById('sitaHaloOrb');
      const divineLightCone = document.getElementById('divineLightCone');
      const prabhamandalRingOuter = document.getElementById('prabhamandalRingOuter');
      const prabhamandalRingInner = document.getElementById('prabhamandalRingInner');
      const haloLotusPetals = document.getElementById('haloLotusPetals');
      const ravanaUpperBody = document.getElementById('ravanaUpperBody');
      const ravanaBowingHeads = document.getElementById('ravanaBowingHeads');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 16 Sacred Lotus Petals Around Mata Sita's Prabhamandal
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-215 Q16,-185 0,-165 Q-16,-185 0,-215 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        haloLotusPetals.appendChild(p);
      }

      // Generate 30 Floating Golden Purity Particles
      const particles = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 135 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Mata Sita Radiant Prabhamandal Expansion & Dual-Ring Rotation
        const haloExpand = 390 + easeOutCubic(Math.min(1, t / 0.45)) * 65 + Math.sin(t * Math.PI * 4) * 22;
        sitaHaloOrb.setAttribute('r', haloExpand.toFixed(1));

        const coneOp = 0.45 + easeOutCubic(Math.min(1, t / 0.40)) * 0.35 + Math.sin(t * Math.PI * 5) * 0.08;
        divineLightCone.setAttribute('opacity', coneOp.toFixed(2));

        prabhamandalRingOuter.setAttribute('transform', `translate(0, -235) rotate(${(t * 48).toFixed(1)})`);
        prabhamandalRingInner.setAttribute('transform', `translate(0, -235) rotate(${(-t * 36).toFixed(1)})`);

        // 3. Ravana's Ten Heads & Torso Bowing Downward Before Mata Sita's Radiance (t: 0.12 -> 0.55)
        const bowProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.12) / 0.43)));
        const torsoBow = -bowProg * 7.5 + Math.sin(t * Math.PI * 3) * 0.6;
        const headsBow = -bowProg * 9.0 + Math.cos(t * Math.PI * 3) * 0.7;

        ravanaUpperBody.setAttribute('transform', `rotate(${torsoBow.toFixed(2)}, 0, -90)`);
        ravanaBowingHeads.setAttribute('transform', `rotate(${headsBow.toFixed(2)}, 0, -360)`);

        // 4. Floating Golden Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Kinetic Hindi Keywords ("सतीत्व की शक्ति ✨" & "अहंकार पराजित 🚩")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
