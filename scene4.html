<!DOCTYPE html>
<html lang="hi">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  }
</style>
</head>
<body>

<!-- 
  PART 3 - CLIP 4 (5.0 SECONDS EXACT) — STRICTLY FOLLOWING BLUEPRINT
  Voiceover: "पहला—अध्यात्म रामायण और आनंद रामायण के अनुसार, रावण को इस श्राप का बेहद खौफ था!"
  Blueprint Visual: "अध्यात्म रामायण के सुनहरे श्लोक और काँपते हुए रावण के मन में नलकुबेर के श्राप की परछाईं। कीवर्ड्स: 'अध्यात्म रामायण', 'श्राप का खौफ'।"
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. BACKGROUND: Deep Cosmic Indigo & Ominous Violet Night -->
    <radialGradient id="fearBackdrop" cx="50%" cy="38%" r="76%">
      <stop offset="0%" stop-color="#38103d"/>
      <stop offset="48%" stop-color="#170624"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>

    <!-- Glowing Golden Scripture Scroll Halo -->
    <radialGradient id="scrollGoldenHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#ffe066" stop-opacity="0.52"/>
      <stop offset="75%" stop-color="#ff8c00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#170624" stop-opacity="0"/>
    </radialGradient>

    <!-- Ominous Crimson Curse Shadow Aura in Ravana's Mind -->
    <radialGradient id="curseMindShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#8c0820" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#170624" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. LOCKED CHARACTER PALETTE (Consistent Dashaanan Ravana) -->
    <linearGradient id="ravanaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5774b"/>
      <stop offset="55%" stop-color="#8f542d"/>
      <stop offset="100%" stop-color="#5e3216"/>
    </linearGradient>

    <linearGradient id="ravanaSkinDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#754120"/>
      <stop offset="100%" stop-color="#45210c"/>
    </linearGradient>

    <linearGradient id="royalCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d92626"/>
      <stop offset="55%" stop-color="#9e1116"/>
      <stop offset="100%" stop-color="#57060a"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7bd"/>
      <stop offset="42%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#8c4804"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="palmParchment" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c5611"/>
      <stop offset="14%" stop-color="#f7ca6d"/>
      <stop offset="50%" stop-color="#fff2c7"/>
      <stop offset="86%" stop-color="#f7ca6d"/>
      <stop offset="100%" stop-color="#9c5611"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Reusable Secondary Ravana Head (Consistent across all clips) -->
    <g id="ravana-side-head">
      <path d="M -26 -26 L -20 -60 L 0 -76 L 20 -60 L 26 -26 Z" fill="url(#goldGrad)" stroke="#140703" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M -30 -26 Q 0 -34 30 -26 L 28 -16 Q 0 -22 -28 -16 Z" fill="url(#goldGrad)" stroke="#140703" stroke-width="2.8"/>
      <circle cx="0" cy="-50" r="4.5" fill="#d91e18"/>
      <path d="M -26 -18 L 26 -18 L 23 20 C 23 35, 11 43, 0 43 C -11 43, -23 35, -23 20 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="3.2"/>
      <line x1="-13" y1="-9" x2="13" y2="-9" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="-11" y1="-4" x2="11" y2="-4" stroke="#ffffff" stroke-width="2.2"/>
      <circle cx="0" cy="-6" r="2.8" fill="#d91e18"/>
      <path d="M -18 2 L -4 7" stroke="#140703" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M 18 2 L 4 7" stroke="#140703" stroke-width="3.8" stroke-linecap="round"/>
      <ellipse cx="-11" cy="11" rx="5" ry="3.2" fill="#ffdf6b"/>
      <circle cx="-11" cy="11" r="2" fill="#d90b0b"/>
      <ellipse cx="11" cy="11" rx="5" ry="3.2" fill="#ffdf6b"/>
      <circle cx="11" cy="11" r="2" fill="#d90b0b"/>
      <path d="M 0 22 C -9 19, -20 23, -24 30 C -17 27, -7 26, 0 24 C 7 26, 17 27, 24 30 C 20 23, 9 19, 0 22 Z" fill="#140703"/>
    </g>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#fearBackdrop)"/>
    <g opacity="0.25" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- LAYER 2: TOP — GOLDEN ADHYATMA & ANAND RAMAYANA SLOKA SCROLL -->
    <g id="scriptureScrollTop" transform="translate(540, 310)">
      <circle cx="0" cy="0" r="340" fill="url(#scrollGoldenHalo)" opacity="0.75"/>

      <!-- Unrolled Palm-Leaf Scroll Parchment -->
      <rect x="-390" y="-125" width="780" height="250" rx="14" fill="url(#palmParchment)" stroke="#3d1903" stroke-width="5"/>
      <rect x="-370" y="-108" width="740" height="216" rx="8" fill="none" stroke="#8a4406" stroke-width="2.5" stroke-dasharray="12 8"/>

      <!-- Left & Right Golden Wooden Scroll Rollers -->
      <rect x="-415" y="-142" width="32" height="284" rx="12" fill="url(#goldGrad)" stroke="#240d02" stroke-width="4"/>
      <circle cx="-399" cy="-154" r="14" fill="url(#goldGrad)" stroke="#240d02" stroke-width="3"/>
      <circle cx="-399" cy="154" r="14" fill="url(#goldGrad)" stroke="#240d02" stroke-width="3"/>

      <rect x="383" y="-142" width="32" height="284" rx="12" fill="url(#goldGrad)" stroke="#240d02" stroke-width="4"/>
      <circle cx="399" cy="-154" r="14" fill="url(#goldGrad)" stroke="#240d02" stroke-width="3"/>
      <circle cx="399" cy="154" r="14" fill="url(#goldGrad)" stroke="#240d02" stroke-width="3"/>

      <!-- Glowing Golden Sanskrit Sloka Text inside Scroll -->
      <text x="0" y="-56" text-anchor="middle" fill="#5c2103" font-size="26" font-weight="900">॥ अध्यात्म रामायणम् एवं आनन्द रामायणम् ॥</text>
      <line x1="-310" y1="-36" x2="310" y2="-36" stroke="#8a4406" stroke-width="2" opacity="0.6"/>
      <text id="slokaLine1" x="0" y="10" text-anchor="middle" fill="#2b0d02" font-size="34" font-weight="900">"अकामां कामयिष्यति यदा..."</text>
      <text id="slokaLine2" x="0" y="64" text-anchor="middle" fill="#9e1116" font-size="32" font-weight="900">॥ शतधा तस्य मूर्धा स्फोटिष्यति ॥</text>
    </g>

    <!-- LAYER 3: MIDGROUND — LOOMING SHADOW OF NALAKUBARA'S CURSE IN RAVANA'S MIND -->
    <g id="curseShadowGroup" transform="translate(540, 880)" opacity="0">
      <circle id="mindShadowAura" cx="0" cy="0" r="460" fill="url(#curseMindShadow)"/>

      <!-- Rotating Spectral Shadow Yantra & Nalakubara Curse Silhouette -->
      <g id="curseShadowWheel" opacity="0.58">
        <circle cx="0" cy="0" r="390" fill="none" stroke="#ff3b5c" stroke-width="4" stroke-dasharray="22 14"/>
        <polygon points="0,-360 312,180 -312,180" fill="none" stroke="#ff5270" stroke-width="3"/>
        <polygon points="0,360 312,-180 -312,-180" fill="none" stroke="#ff5270" stroke-width="3"/>
      </g>

      <!-- Spectral Shadow Silhouette of Nalakubara Raising Hand in Curse -->
      <g id="nalakubaraGhost" transform="translate(0, -140)" opacity="0.48" filter="url(#strongGlow)">
        <!-- Crowned Celestial Shadow -->
        <path d="M -28 -145 L -16 -205 L 0 -225 L 16 -205 L 28 -145 Z" fill="#ff2a4b"/>
        <circle cx="0" cy="-115" r="34" fill="#ff2a4b"/>
        <!-- Broad Celestial Torso -->
        <path d="M -72 -72 C -25 -92, 25 -92, 72 -72 L 58 65 L -58 65 Z" fill="#d91636"/>
        <!-- Raised Arm Pouring Sacred Curse Water -->
        <path d="M 65 -60 C 125 -95, 165 -140, 185 -185 L 152 -200 C 132 -162, 102 -125, 52 -95 Z" fill="#ff2a4b"/>
        <circle cx="172" cy="-198" r="22" fill="#ffe066"/>
        <!-- Falling Curse Water Drops -->
        <line x1="172" y1="-175" x2="172" y2="-45" stroke="#ffe066" stroke-width="6" stroke-dasharray="14 10"/>
      </g>
    </g>

    <!-- LAYER 4: FOREGROUND HERO — TREMBLING DASHAANAN RAVANA -->
    <g id="ravanaHero" transform="translate(540, 1340)">
      <!-- Ground Shadow -->
      <ellipse cx="0" cy="340" rx="285" ry="32" fill="#040108" opacity="0.85"/>

      <!-- Royal Crimson Dhoti -->
      <path d="M -128 -105 L 128 -105 L 182 325 L 40 325 L 0 115 L -40 325 L -182 325 Z" fill="url(#royalCrimson)" stroke="#140703" stroke-width="6" stroke-linejoin="round"/>
      <line x1="-174" y1="305" x2="-44" y2="305" stroke="url(#goldGrad)" stroke-width="14"/>
      <line x1="44" y1="305" x2="174" y2="305" stroke="url(#goldGrad)" stroke-width="14"/>
      <rect x="-128" y="-135" width="256" height="32" rx="10" fill="url(#goldGrad)" stroke="#140703" stroke-width="5"/>

      <!-- Left & Right Arms Drawn Inward in Fear & Restraint -->
      <path d="M -155 -415 C -220 -365, -245 -265, -210 -155 L -158 -165 C -180 -255, -165 -320, -125 -355 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="6"/>
      <circle cx="-182" cy="-145" r="26" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="5"/>

      <path d="M 155 -415 C 220 -365, 245 -265, 210 -155 L 158 -165 C 180 -255, 165 -320, 125 -355 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="6"/>
      <circle cx="182" cy="-145" r="26" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="5"/>

      <!-- Broad Torso -->
      <path d="M -155 -425 C -80 -455, 80 -455, 155 -425 L 122 -125 L -122 -125 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="6"/>
      <path d="M -115 -428 C -62 -305, 35 -205, 112 -132" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <path d="M -85 -432 Q 0 -350 85 -432" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

      <!-- TEN HEADS TREMBLING IN FEAR -->
      <g id="tenHeadsTremble">
        <rect x="-46" y="-498" width="92" height="72" rx="14" fill="url(#ravanaSkinDark)" stroke="#140703" stroke-width="5"/>

        <use href="#ravana-side-head" transform="translate(-310, -575) scale(0.84)"/>
        <use href="#ravana-side-head" transform="translate(-250, -580) scale(0.88)"/>
        <use href="#ravana-side-head" transform="translate(-190, -585) scale(0.92)"/>
        <use href="#ravana-side-head" transform="translate(-130, -590) scale(0.96)"/>

        <use href="#ravana-side-head" transform="translate(130, -590) scale(0.96)"/>
        <use href="#ravana-side-head" transform="translate(190, -585) scale(0.92)"/>
        <use href="#ravana-side-head" transform="translate(250, -580) scale(0.88)"/>
        <use href="#ravana-side-head" transform="translate(310, -575) scale(0.84)"/>
        <use href="#ravana-side-head" transform="translate(365, -568) scale(0.80)"/>

        <!-- Main Center Crown & Fearful Face -->
        <path d="M -75 -645 L -60 -735 L 0 -790 L 60 -735 L 75 -645 Z" fill="url(#goldGrad)" stroke="#140703" stroke-width="5"/>
        <path d="M -85 -645 Q 0 -662 85 -645 L 78 -624 Q 0 -638 -78 -624 Z" fill="url(#goldGrad)" stroke="#140703" stroke-width="4.5"/>
        <circle cx="0" cy="-715" r="14" fill="#d91e18" stroke="#140703" stroke-width="3"/>

        <path d="M -72 -628 L 72 -628 L 65 -528 C 65 -488, 32 -466, 0 -466 C -32 -466, -65 -488, -65 -528 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="5.5"/>
        <line x1="-36" y1="-608" x2="36" y2="-608" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-32" y1="-596" x2="32" y2="-596" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-602" r="6" fill="#d91e18"/>

        <!-- Wide Fearful Eyes & Sweat Drop -->
        <path d="M -54 -582 L -14 -572" stroke="#140703" stroke-width="7" stroke-linecap="round"/>
        <path d="M 54 -582 L 14 -572" stroke="#140703" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="-32" cy="-558" rx="14" ry="11" fill="#ffffff" stroke="#140703" stroke-width="3"/>
        <circle cx="-32" cy="-558" r="5" fill="#9e0b0b"/>
        <ellipse cx="32" cy="-558" rx="14" ry="11" fill="#ffffff" stroke="#140703" stroke-width="3"/>
        <circle cx="32" cy="-558" r="5" fill="#9e0b0b"/>
        <!-- Cold Sweat Drop on Temple -->
        <path id="sweatDrop" d="M 56 -585 Q 64 -568 56 -560 Q 48 -568 56 -585 Z" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/>

        <path d="M 0 -526 C -26 -534, -54 -524, -66 -506 C -46 -512, -22 -514, 0 -518 C 22 -514, 46 -512, 66 -506 C 54 -524, 26 -534, 0 -526 Z" fill="#140703"/>
      </g>
    </g>

    <!-- Floating Golden & Crimson Motes -->
    <g id="particlesLayer"></g>

    <!-- LAYER 5: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Keyword 1: अध्यात्म रामायण -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-320" y="-58" width="640" height="96" rx="24" fill="#170626" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="54" font-weight="900">अध्यात्म रामायण 📜</text>
      </g>

      <!-- Keyword 2: श्राप का खौफ -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-285" y="-52" width="570" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900">श्राप का खौफ 😱</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const scriptureScrollTop = document.getElementById('scriptureScrollTop');
      const curseShadowGroup = document.getElementById('curseShadowGroup');
      const curseShadowWheel = document.getElementById('curseShadowWheel');
      const nalakubaraGhost = document.getElementById('nalakubaraGhost');
      const ravanaHero = document.getElementById('ravanaHero');
      const tenHeadsTremble = document.getElementById('tenHeadsTremble');
      const sweatDrop = document.getElementById('sweatDrop');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 26 Floating Particles
      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff4d6d');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 90 + ((i * 113) % 900),
          baseY: 200 + ((i * 197) % 1500),
          speed: 135 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Top Adhyatma Ramayana Scroll Entrance & Gentle Hover
        const pScroll = Math.min(1, t / 0.16);
        const sScroll = 0.8 + 0.2 * easeOutBack(pScroll);
        const scrollY = 310 + Math.sin(t * Math.PI * 3) * 6;
        scriptureScrollTop.setAttribute('opacity', easeOutCubic(pScroll).toFixed(2));
        scriptureScrollTop.setAttribute('transform', `translate(540, ${scrollY.toFixed(1)}) scale(${sScroll.toFixed(3)})`);

        // 3. Looming Shadow of Nalakubara's Curse in Ravana's Mind (0.18 -> 1.0)
        const pShadow = Math.max(0, Math.min(1, (t - 0.18) / 0.20));
        curseShadowGroup.setAttribute('opacity', easeOutCubic(pShadow).toFixed(2));
        curseShadowWheel.setAttribute('transform', `rotate(${(t * 42).toFixed(1)})`);
        const ghostPulse = 0.42 + 0.18 * Math.sin(t * Math.PI * 6);
        nalakubaraGhost.setAttribute('opacity', ghostPulse.toFixed(2));

        // 4. Trembling Ravana & Shivering Ten Heads
        const shiverX = (t >= 0.22) ? Math.sin(t * Math.PI * 48) * 3.5 : 0;
        const bobY = 1340 + Math.sin(t * Math.PI * 3) * 5;
        ravanaHero.setAttribute('transform', `translate(${(540 + shiverX).toFixed(1)}, ${bobY.toFixed(1)})`);

        const headJitter = (t >= 0.22) ? Math.sin(t * Math.PI * 42) * 1.4 : 0;
        tenHeadsTremble.setAttribute('transform', `rotate(${headJitter.toFixed(2)}, 0, -480)`);

        // Cold Sweat Drop Trickle
        const sweatY = ((t * 1.8) % 1) * 26;
        sweatDrop.setAttribute('transform', `translate(0, ${sweatY.toFixed(1)})`);
        sweatDrop.setAttribute('opacity', (1 - ((t * 1.8) % 1)).toFixed(2));

        // 5. Floating Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.6 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Kinetic Hindi Keywords ("अध्यात्म रामायण 📜" & "श्राप का खौफ 😱")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
