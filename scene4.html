<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwatthama Mani - Scene 4: Mahadev's Boon & Amar Kavach (4.5s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #070310;
  }
</style>
</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 4 (00:14.0 – 00:18.5 = 4.5 SECONDS EXACT)
  Voiceover: "...ताकि उन्हें एक ऐसा पुत्र मिले, जिसे स्वयं काल भी न छू सके!"
  Visual Blueprint:
  - Massive beam of golden Rudra-jyoti descending from the heavens onto the sacred Himalayan altar.
  - Inside the beam: An ornate, impenetrable Amar Kavach (Immortal Shield) and the locked faceted Rudra-Mani gem emerge.
  - Shadowy cosmic Kaal (Time/Death) waves strike the golden shield and shatter/deflect harmlessly.
  - Safe-Zone Compliant Kinetic Hindi Keywords ("महादेव का वरदान 🔱" & "काल भी अजेय 🛡️") with zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. CONSISTENT COSMIC VOID BACKDROP (Matches Scenes 1-3) -->
    <radialGradient id="cosmicVoidBg" cx="50%" cy="40%" r="76%">
      <stop offset="0%" stop-color="#2c124a"/>
      <stop offset="46%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>

    <!-- Descending Rudra-Jyoti Heaven Beam Gradient -->
    <linearGradient id="rudraJyotiBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffe57f" stop-opacity="0.72"/>
      <stop offset="75%" stop-color="#ff9900" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rudraCoreRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff4b8" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </linearGradient>

    <!-- Radiant Amar Kavach Shield Aura -->
    <radialGradient id="kavachAuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="30%" stop-color="#ffe066" stop-opacity="0.68"/>
      <stop offset="68%" stop-color="#ff8c00" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#120624" stop-opacity="0"/>
    </radialGradient>

    <!-- Locked Rudra-Mani Gem Core Gradient (Exact Match with Scenes 1 & 2) -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD & ARMOR GRADIENTS -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="shieldPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b121c"/>
      <stop offset="50%" stop-color="#1f0712"/>
      <stop offset="100%" stop-color="#0d0308"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 880) scale(1) translate(-540, -880)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicVoidBg)"/>
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Cosmic Starfield -->
    <g id="cosmicStarsLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 2: MASSIVE RUDRA-JYOTI BEAM DESCENDING FROM HEAVENS -->
    <!-- ========================================================= -->
    <g id="heavenBeamGroup" opacity="0">
      <!-- Outer Wide Golden Light Cone -->
      <polygon points="360,-80 720,-80 940,1480 140,1480" fill="url(#rudraJyotiBeam)"/>
      <!-- Inner High-Intensity Core Shaft -->
      <polygon points="465,-80 615,-80 710,1420 370,1420" fill="url(#rudraCoreRay)" opacity="0.78"/>
      <!-- Vertical Flowing Light Streaks Inside Beam -->
      <line x1="485" y1="-40" x2="435" y2="1320" stroke="#ffffff" stroke-width="4" stroke-dasharray="45 30" opacity="0.75"/>
      <line x1="595" y1="-40" x2="645" y2="1320" stroke="#ffffff" stroke-width="4" stroke-dasharray="45 30" opacity="0.75"/>
    </g>

    <!-- Sacred Himalayan Altar Base Below Beam -->
    <path d="M -60 1485 Q 540 1410 1140 1485 L 1140 2000 L -60 2000 Z" fill="#070414"/>
    <ellipse id="groundLightPool" cx="540" cy="1450" rx="380" ry="42" fill="#ffe066" opacity="0.35" filter="url(#superGlow)"/>

    <!-- ========================================================= -->
    <!-- LAYER 3: HERO EMBLEM — AMAR KAVACH & RUDRA-MANI SHIELD    -->
    <!-- ========================================================= -->
    <g id="amarKavachAssembly" transform="translate(540, 890)" opacity="0">
      <!-- Radiant Golden Aura -->
      <circle id="kavachAura" cx="0" cy="0" r="440" fill="url(#kavachAuraGrad)"/>

      <!-- Expanding Shockwave Rings on Boon Manifestation -->
      <circle id="boonShock1" cx="0" cy="0" r="180" fill="none" stroke="#fff7c2" stroke-width="10" opacity="0"/>
      <circle id="boonShock2" cx="0" cy="0" r="180" fill="none" stroke="#ff9900" stroke-width="6" opacity="0"/>

      <!-- Outer Rotating Celestial Chakra Ring -->
      <g id="kavachOuterWheel" opacity="0.78">
        <circle cx="0" cy="0" r="355" fill="none" stroke="url(#goldMetal)" stroke-width="4.5" stroke-dasharray="22 12"/>
        <circle cx="0" cy="0" r="320" fill="none" stroke="#ffe066" stroke-width="2.2"/>
        <g id="wheelLotusPetals" stroke="url(#goldMetal)" stroke-width="2.2" fill="#ffbe2e" fill-opacity="0.08"></g>
      </g>

      <!-- Counter-Rotating Inner Geometric Yantra -->
      <g id="kavachInnerWheel" opacity="0.65">
        <polygon points="0,-295 255,148 -255,148" fill="none" stroke="url(#goldBright)" stroke-width="3.5"/>
        <polygon points="0,295 255,-148 -255,-148" fill="none" stroke="url(#goldBright)" stroke-width="3.5"/>
      </g>

      <!-- IMPENETRABLE GOLDEN AMAR KAVACH (IMMORTAL SHIELD) -->
      <g id="immortalShieldBody" filter="url(#superGlow)">
        <!-- Outer Royal Shield Crest -->
        <path d="M -205 -215 L 0 -265 L 205 -215 L 185 35 C 165 185, 0 285, 0 285 C 0 285, -165 185, -185 35 Z"
              fill="url(#shieldPlateGrad)" stroke="url(#goldBright)" stroke-width="12" stroke-linejoin="round"/>
        <!-- Inner Filigree Rim -->
        <path d="M -178 -192 L 0 -236 L 178 -192 L 160 28 C 142 162, 0 250, 0 250 C 0 250, -142 162, -160 28 Z"
              fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-dasharray="16 10"/>

        <!-- Sacred Trident (Trishul) Motif Engraved on Shield -->
        <g opacity="0.55" stroke="url(#goldMetal)" stroke-width="4" fill="none">
          <line x1="0" y1="-195" x2="0" y2="215"/>
          <path d="M -62 -125 C -62 -165, -35 -180, -35 -180 C -35 -150, -18 -135, 0 -135 C 18 -135, 35 -150, 35 -180 C 35 -180, 62 -165, 62 -125 C 62 -95, 25 -82, 0 -82 C -25 -82, -62 -95, -62 -125 Z"/>
        </g>

        <!-- EMBEDDED FACETED RUDRA-MANI GEM AT CENTER OF SHIELD (Locked Design) -->
        <g id="shieldManiCore" transform="translate(0, -10)">
          <polygon points="0,-105 91,-52.5 91,52.5 0,105 -91,52.5 -91,-52.5" fill="#24050a" stroke="url(#goldBright)" stroke-width="6"/>
          <ellipse cx="0" cy="0" rx="52" ry="72" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="4"/>
          <polygon points="0,-50 31,0 0,50 -31,0" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.88"/>
          <circle cx="-14" cy="-22" r="11" fill="#ffffff"/>
        </g>
      </g>

      <!-- ======================================================= -->
      <!-- KAAL (TIME/DEATH) SHADOW ARCS DEFLECTING OFF THE SHIELD -->
      <!-- ======================================================= -->
      <g id="kaalDeflectionGroup" opacity="0">
        <!-- Left Kaal Scythe/Energy Arc Deflecting -->
        <path id="kaalArcLeft" d="M -360 -90 Q -240 -40 -215 10" fill="none" stroke="#ef4444" stroke-width="9" stroke-linecap="round" filter="url(#softGoldGlow)"/>
        <circle id="kaalSparkLeft" cx="-215" cy="10" r="24" fill="#ffffff" filter="url(#superGlow)"/>

        <!-- Right Kaal Scythe/Energy Arc Deflecting -->
        <path id="kaalArcRight" d="M 360 -90 Q 240 -40 215 10" fill="none" stroke="#ef4444" stroke-width="9" stroke-linecap="round" filter="url(#softGoldGlow)"/>
        <circle id="kaalSparkRight" cx="215" cy="10" r="24" fill="#ffffff" filter="url(#superGlow)"/>
      </g>
    </g>

    <!-- Rising Golden Boon Motes -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: महादेव का वरदान -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-320" y="-56" width="640" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="52" font-weight="900" letter-spacing="1">महादेव का वरदान 🔱</text>
      </g>

      <!-- Keyword 2: काल भी अजेय -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-275" y="-50" width="550" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900" letter-spacing="1">काल भी अजेय 🛡️</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 4.5-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4500; // Exact 4.5s matching Scene 4 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const heavenBeamGroup = document.getElementById('heavenBeamGroup');
      const groundLightPool = document.getElementById('groundLightPool');

      const amarKavachAssembly = document.getElementById('amarKavachAssembly');
      const kavachAura = document.getElementById('kavachAura');
      const kavachOuterWheel = document.getElementById('kavachOuterWheel');
      const kavachInnerWheel = document.getElementById('kavachInnerWheel');
      const wheelLotusPetals = document.getElementById('wheelLotusPetals');
      const shieldManiCore = document.getElementById('shieldManiCore');

      const boonShock1 = document.getElementById('boonShock1');
      const boonShock2 = document.getElementById('boonShock2');
      const kaalDeflectionGroup = document.getElementById('kaalDeflectionGroup');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 16 Sacred Lotus Petals Around Boon Wheel
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-320 Q20,-280 0,-245 Q-20,-280 0,-320 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        wheelLotusPetals.appendChild(p);
      }

      // 2. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 30 Rising Golden Boon Particles
      const particles = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 120 + ((i * 107) % 840),
          baseY: 200 + ((i * 197) % 1500),
          speed: 155 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.5s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Camera Push-In (1.0 -> 1.09)
        const camScale = 1 + easeOutCubic(t) * 0.09;
        cameraRig.setAttribute('transform', `translate(540, 880) scale(${camScale.toFixed(4)}) translate(-540, -880)`);

        // 3. Massive Rudra-Jyoti Beam Descending From Heavens (t: 0.0 -> 0.24)
        const beamProg = easeOutCubic(Math.min(1, t / 0.24));
        const beamPulse = 0.82 + 0.18 * Math.sin(t * Math.PI * 8);
        heavenBeamGroup.setAttribute('opacity', (beamProg * beamPulse).toFixed(2));
        heavenBeamGroup.setAttribute('transform', `scale(1, ${(0.25 + 0.75 * beamProg).toFixed(3)})`);
        groundLightPool.setAttribute('opacity', (beamProg * 0.48).toFixed(2));

        // 4. Amar Kavach & Rudra-Mani Emerging Inside the Light Beam (t: 0.16 -> 1.0)
        if (t >= 0.16) {
          const pShield = Math.min(1, (t - 0.16) / 0.20);
          const sShield = 0.45 + 0.55 * easeOutBack(pShield);
          const hoverY = 890 + Math.sin(t * Math.PI * 3) * 8;

          amarKavachAssembly.setAttribute('opacity', Math.min(1, pShield * 2.2).toFixed(2));
          amarKavachAssembly.setAttribute('transform', `translate(540, ${hoverY.toFixed(1)}) scale(${sShield.toFixed(3)})`);

          kavachOuterWheel.setAttribute('transform', `rotate(${(t * 50).toFixed(1)})`);
          kavachInnerWheel.setAttribute('transform', `rotate(${(-t * 38).toFixed(1)})`);
          kavachAura.setAttribute('r', (430 + Math.sin(t * Math.PI * 6) * 35).toFixed(1));

          const gemBeat = 1 + Math.sin(t * Math.PI * 8) * 0.08;
          shieldManiCore.setAttribute('transform', `translate(0, -10) scale(${gemBeat.toFixed(3)})`);

          // Expanding Shockwave Rings on Boon Manifestation (t: 0.22 -> 0.56)
          if (t >= 0.22 && t <= 0.56) {
            const sw1 = (t - 0.22) / 0.34;
            boonShock1.setAttribute('r', (180 + easeOutCubic(sw1) * 310).toFixed(1));
            boonShock1.setAttribute('opacity', ((1 - sw1) * 0.9).toFixed(2));

            const sw2 = Math.max(0, (t - 0.28) / 0.28);
            boonShock2.setAttribute('r', (180 + easeOutCubic(sw2) * 260).toFixed(1));
            boonShock2.setAttribute('opacity', (sw2 > 0 ? (1 - sw2) * 0.85 : 0).toFixed(2));
          } else {
            boonShock1.setAttribute('opacity', '0');
            boonShock2.setAttribute('opacity', '0');
          }
        } else {
          amarKavachAssembly.setAttribute('opacity', '0');
        }

        // 5. Kaal (Time/Death) Shadow Attacks Deflecting Off Shield (t: 0.45 -> 0.85)
        if (t >= 0.45 && t <= 0.85) {
          const kProg = (t - 0.45) / 0.40;
          const kOp = Math.sin(kProg * Math.PI);
          kaalDeflectionGroup.setAttribute('opacity', kOp.toFixed(2));
        } else {
          kaalDeflectionGroup.setAttribute('opacity', '0');
        }

        // 6. Rising Golden Boon Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 4.5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.35 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("महादेव का वरदान 🔱" & "काल भी अजेय 🛡️")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.13);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.46) {
          const p2 = Math.min(1, (t - 0.46) / 0.13);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
