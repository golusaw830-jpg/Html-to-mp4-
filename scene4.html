<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 4 (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 4 (00:15.0 – 00:20.0 = 5.0 SECONDS EXACT)
  Voiceover: "कि माता सीता को सम्मान सहित लौटा दें।"
  Symbolic Creative SVG Visual:
  - Blooming golden vector lotus (सुनहरा वेक्टर कमल) opening petal-by-petal out of calm darkness.
  - Above it, the tranquil, sacred Ashoka Vatika crescent moon motif (पवित्र चंद्र-मोटिफ़) & stylized Ashoka leaves
    bathed in soft saffron-gold rim light (pure symbolic clarity without clutter).
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & SAFFRON-GOLD SANCTUARY SKY (Locked Palette) -->
    <radialGradient id="ashokaNightBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <!-- Soft Saffron-Gold Rim Light Aura -->
    <radialGradient id="saffronRimAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffd043" stop-opacity="0.54"/>
      <stop offset="68%" stop-color="#ff8c1a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- Sacred Lunar Silver-Gold Halo -->
    <radialGradient id="lunarHaloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#ffe799" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. GOLDEN VECTOR LOTUS PETAL GRADIENTS -->
    <linearGradient id="lotusOuterGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffbe2e"/>
      <stop offset="85%" stop-color="#b85d06"/>
      <stop offset="100%" stop-color="#5e2a02"/>
    </linearGradient>

    <linearGradient id="lotusMidGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="82%" stop-color="#e08809"/>
      <stop offset="100%" stop-color="#7a3b03"/>
    </linearGradient>

    <linearGradient id="lotusInnerBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff099"/>
      <stop offset="100%" stop-color="#ffaa1d"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SERENE MIDNIGHT TEAL SANCTUARY BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#ashokaNightBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Sacred Mandala Ring Framing the Sanctuary -->
    <g id="bgMandala" transform="translate(505, 740)" opacity="0.38">
      <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.68"/>
      <polygon points="0,-335 290,168 -290,168" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
      <polygon points="0,335 290,-168 -290,-168" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>
    </g>

    <!-- Soft Saffron-Gold Rim Light Aura -->
    <circle id="saffronRimOrb" cx="505" cy="760" r="370" fill="url(#saffronRimAura)"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: TOP — ASHOKA VATIKA SACRED CRESCENT MOON MOTIF   -->
    <!-- Positioned inside Safe Zone at (505, 435)                 -->
    <!-- ========================================================= -->
    <g id="ashokaMoonGroup" transform="translate(505, 435)">
      <!-- Soft Lunar Glow -->
      <circle id="lunarGlowOrb" cx="0" cy="0" r="155" fill="url(#lunarHaloGrad)"/>

      <!-- Delicate Ashoka Leaf Filigree Framing the Crescent Moon -->
      <g opacity="0.72" stroke="url(#goldBright)" stroke-width="2.5" fill="#134e4a" fill-opacity="0.45">
        <path d="M -95 45 C -145 15, -155 -45, -115 -85 C -95 -45, -92 5, -95 45 Z"/>
        <path d="M 95 45 C 145 15, 155 -45, 115 -85 C 95 -45, 92 5, 95 45 Z"/>
        <path d="M -65 78 C -115 65, -135 25, -112 -12 C -88 18, -75 48, -65 78 Z"/>
        <path d="M 65 78 C 115 65, 135 25, 112 -12 C 88 18, 75 48, 65 78 Z"/>
      </g>

      <!-- Luminous Crescent Moon Motif (चन्द्र-मोटिफ़) -->
      <g filter="url(#superGlow)">
        <path d="M -25 -78 A 82 82 0 1 0 72 48 A 66 66 0 1 1 -25 -78 Z" fill="url(#goldBright)" stroke="#fffbeb" stroke-width="2"/>
        <!-- Sacred Star / Bindu Inside Crescent -->
        <polygon points="36,-28 42,-12 58,-6 42,0 36,16 30,0 14,-6 30,-12" fill="#ffffff"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: CENTER HERO — BLOOMING GOLDEN VECTOR LOTUS       -->
    <!-- Positioned inside Safe Zone at (505, 965)                 -->
    <!-- Petals open smoothly outward with saffron-gold rim light! -->
    <!-- ========================================================= -->
    <g id="goldenLotusGroup" transform="translate(505, 965)">
      <!-- Tranquil Rippling Water Reflections Beneath Lotus -->
      <ellipse id="waterRipple1" cx="0" cy="48" rx="190" ry="22" fill="none" stroke="url(#goldBright)" stroke-width="3" opacity="0.65"/>
      <ellipse id="waterRipple2" cx="0" cy="54" rx="265" ry="30" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.45"/>

      <!-- Sacred Emerald-Gold Lotus Pad Base -->
      <path d="M -245 32 Q -120 6 0 24 Q 120 6 245 32 Q 130 68 0 68 Q -130 68 -245 32 Z" fill="#092e33" stroke="url(#goldMetal)" stroke-width="4"/>

      <!-- OUTER PETAL RING (Unfolds Wide to ±66 deg) -->
      <g id="outerPetalsLayer" filter="url(#softGoldGlow)">
        <!-- Outer Left 2 -->
        <path id="petalOuterL2" d="M 0 24 C -55 -45, -75 -165, 0 -245 C 75 -165, 55 -45, 0 24 Z" fill="url(#lotusOuterGold)" stroke="#fff7c2" stroke-width="2.5" transform="rotate(-12 0 24)"/>
        <!-- Outer Right 2 -->
        <path id="petalOuterR2" d="M 0 24 C -55 -45, -75 -165, 0 -245 C 75 -165, 55 -45, 0 24 Z" fill="url(#lotusOuterGold)" stroke="#fff7c2" stroke-width="2.5" transform="rotate(12 0 24)"/>
        <!-- Outer Left 1 -->
        <path id="petalOuterL1" d="M 0 24 C -52 -55, -68 -185, 0 -275 C 68 -185, 52 -55, 0 24 Z" fill="url(#lotusOuterGold)" stroke="#fff7c2" stroke-width="2.5" transform="rotate(-8 0 24)"/>
        <!-- Outer Right 1 -->
        <path id="petalOuterR1" d="M 0 24 C -52 -55, -68 -185, 0 -275 C 68 -185, 52 -55, 0 24 Z" fill="url(#lotusOuterGold)" stroke="#fff7c2" stroke-width="2.5" transform="rotate(8 0 24)"/>
      </g>

      <!-- MIDDLE PETAL RING (Unfolds to ±38 deg) -->
      <g id="midPetalsLayer" filter="url(#softGoldGlow)">
        <path id="petalMidL" d="M 0 24 C -48 -65, -62 -205, 0 -305 C 62 -205, 48 -65, 0 24 Z" fill="url(#lotusMidGold)" stroke="#ffffff" stroke-width="2.5" transform="rotate(-6 0 24)"/>
        <path id="petalMidR" d="M 0 24 C -48 -65, -62 -205, 0 -305 C 62 -205, 48 -65, 0 24 Z" fill="url(#lotusMidGold)" stroke="#ffffff" stroke-width="2.5" transform="rotate(6 0 24)"/>
      </g>

      <!-- INNER RADIANT CROWN PETAL & SACRED LIGHT CORE -->
      <g id="innerCrownLayer" filter="url(#superGlow)">
        <path id="petalInnerL" d="M 0 24 C -40 -75, -52 -215, 0 -320 C 52 -215, 40 -75, 0 24 Z" fill="url(#lotusInnerBright)" stroke="#ffffff" stroke-width="2.5" transform="rotate(-3 0 24)"/>
        <path id="petalInnerR" d="M 0 24 C -40 -75, -52 -215, 0 -320 C 52 -215, 40 -75, 0 24 Z" fill="url(#lotusInnerBright)" stroke="#ffffff" stroke-width="2.5" transform="rotate(3 0 24)"/>
        <!-- Central Upright Sacred Petal -->
        <path d="M 0 24 C -38 -85, -48 -235, 0 -345 C 48 -235, 38 -85, 0 24 Z" fill="url(#lotusInnerBright)" stroke="#ffffff" stroke-width="3"/>
        <!-- Luminous Golden Seed Core -->
        <circle id="lotusHeartCore" cx="0" cy="-145" r="26" fill="#ffffff" opacity="0.92"/>
      </g>
    </g>

    <!-- Rising Golden Purity Motes -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: माता सीता का सम्मान -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-315" y="-48" width="630" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="43" font-weight="900" letter-spacing="1">माता सीता का सम्मान 🙏</text>
      </g>

      <!-- Keyword 2: ससम्मान लौटा दें -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-265" y="-44" width="530" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">ससम्मान लौटा दें ✨</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND BLOOMING LOTUS & RIM-LIGHT ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const saffronRimOrb = document.getElementById('saffronRimOrb');
      const ashokaMoonGroup = document.getElementById('ashokaMoonGroup');
      const lunarGlowOrb = document.getElementById('lunarGlowOrb');

      const petalOuterL2 = document.getElementById('petalOuterL2');
      const petalOuterR2 = document.getElementById('petalOuterR2');
      const petalOuterL1 = document.getElementById('petalOuterL1');
      const petalOuterR1 = document.getElementById('petalOuterR1');
      const petalMidL = document.getElementById('petalMidL');
      const petalMidR = document.getElementById('petalMidR');
      const petalInnerL = document.getElementById('petalInnerL');
      const petalInnerR = document.getElementById('petalInnerR');
      const lotusHeartCore = document.getElementById('lotusHeartCore');
      const waterRipple1 = document.getElementById('waterRipple1');
      const waterRipple2 = document.getElementById('waterRipple2');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 34; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1500)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 130 + ((i * 103) % 750),
          baseY: 260 + ((i * 181) % 1140),
          speed: 140 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Twinkling Stars & Mandala Rotation
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }
        bgMandala.setAttribute('transform', `translate(505, 740) rotate(${(t * 38).toFixed(1)})`);

        // 2. Gentle Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);

        // 3. Ashoka Vatika Crescent Moon Motif Soft Glow & Hover
        const moonY = 435 + Math.sin(t * Math.PI * 2.5) * 6;
        ashokaMoonGroup.setAttribute('transform', `translate(505, ${moonY.toFixed(1)})`);
        lunarGlowOrb.setAttribute('r', (150 + Math.sin(t * Math.PI * 4) * 18).toFixed(1));
        saffronRimOrb.setAttribute('r', (360 + Math.sin(t * Math.PI * 4) * 28).toFixed(1));

        // 4. Golden Vector Lotus Blooming Petal-by-Petal (t: 0.05 -> 0.55)
        const bloom = easeInOutCubic(Math.max(0, Math.min(1, (t - 0.05) / 0.50)));
        const breathe = Math.sin(t * Math.PI * 3) * 1.8;

        const out2Angle = 10 + bloom * 56 + breathe;
        const out1Angle = 7 + bloom * 40 + breathe * 0.8;
        const midAngle = 5 + bloom * 25 + breathe * 0.6;
        const inAngle = 2 + bloom * 12 + breathe * 0.4;

        petalOuterL2.setAttribute('transform', `rotate(${(-out2Angle).toFixed(2)} 0 24)`);
        petalOuterR2.setAttribute('transform', `rotate(${out2Angle.toFixed(2)} 0 24)`);
        petalOuterL1.setAttribute('transform', `rotate(${(-out1Angle).toFixed(2)} 0 24)`);
        petalOuterR1.setAttribute('transform', `rotate(${out1Angle.toFixed(2)} 0 24)`);
        petalMidL.setAttribute('transform', `rotate(${(-midAngle).toFixed(2)} 0 24)`);
        petalMidR.setAttribute('transform', `rotate(${midAngle.toFixed(2)} 0 24)`);
        petalInnerL.setAttribute('transform', `rotate(${(-inAngle).toFixed(2)} 0 24)`);
        petalInnerR.setAttribute('transform', `rotate(${inAngle.toFixed(2)} 0 24)`);

        const coreScale = 0.65 + bloom * 0.45 + Math.sin(t * Math.PI * 6) * 0.08;
        lotusHeartCore.setAttribute('transform', `translate(0, -145) scale(${coreScale.toFixed(3)}) translate(0, 145)`);

        // Water Ripples Expanding Smoothly
        const rip1 = (t * 1.5) % 1;
        waterRipple1.setAttribute('rx', (160 + rip1 * 95).toFixed(1));
        waterRipple1.setAttribute('opacity', ((1 - rip1) * 0.72).toFixed(2));

        const rip2 = ((t * 1.5) + 0.5) % 1;
        waterRipple2.setAttribute('rx', (190 + rip2 * 115).toFixed(1));
        waterRipple2.setAttribute('opacity', ((1 - rip2) * 0.55).toFixed(2));

        // 5. Rising Golden Purity Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1140 + 1140) % 1140 + 260;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Safe-Zone Kinetic Hindi Keywords ("माता सीता का सम्मान 🙏" & "ससम्मान लौटा दें ✨")
        if (t >= 0.18) {
          const p1 = Math.min(1, (t - 0.18) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
