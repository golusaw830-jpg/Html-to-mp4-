  <!-- DETERMINISTIC 3.0-SECOND ACTION & LIP-SYNC ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 3.0s for Beat 2B ("कि माता सीता को सम्मान सहित लौटा दें...")
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const sitaHaloOrb = document.getElementById('sitaHaloOrb');
      const sitaMandalaRing = document.getElementById('sitaMandalaRing');
      const royalChariotSilhouette = document.getElementById('royalChariotSilhouette');

      const respectGestureArm = document.getElementById('respectGestureArm');
      const meghnadProfileHead = document.getElementById('meghnadProfileHead');
      const hairBack = document.getElementById('hairBack');

      const mouthCavity = document.getElementById('mouthCavity');
      const upperLip = document.getElementById('upperLip');
      const lowerLip = document.getElementById('lowerLip');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      // Syllable-driven Lip-Sync for "कि मा-ता सी-ता को स-म्मा-न स-हि-त लौ-टा दें..."
      const syllableCenters = [0.06, 0.14, 0.22, 0.30, 0.38, 0.46, 0.54, 0.62, 0.70, 0.78, 0.86, 0.92];
      function getSpeechOpenness(t) {
        let open = 0;
        for (let i = 0; i < syllableCenters.length; i++) {
          const dist = (t - syllableCenters[i]) / 0.032;
          const amp = (i === 1 || i === 3 || i === 6 || i === 10) ? 1.0 : 0.72;
          open += amp * Math.exp(-dist * dist);
        }
        return Math.min(1.0, open);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 1. Subtle Safe-Zone Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.05;
        cameraRig.setAttribute('transform', `translate(500, 780) scale(${camScale.toFixed(4)}) translate(-500, -780)`);

        // 2. Mata Sita Golden Sanctity Halo & Mandala Rotation
        sitaHaloOrb.setAttribute('r', (285 + Math.sin(t * Math.PI * 5) * 24).toFixed(1));
        sitaMandalaRing.setAttribute('transform', `translate(0, -110) rotate(${(t * 48).toFixed(1)})`);
        royalChariotSilhouette.setAttribute('transform', `translate(35, ${(195 + Math.sin(t * Math.PI * 3) * 4).toFixed(1)})`);

        // 3. Meghnad Respectful Gesture & Earnest Head Nod + Lip-Sync
        const armExtend = -easeOutBack(Math.min(1, t / 0.30)) * 8 + Math.sin(t * Math.PI * 3) * 2.5;
        respectGestureArm.setAttribute('transform', `translate(42, -95) rotate(${armExtend.toFixed(2)})`);

        const headNod = Math.sin(t * Math.PI * 3) * 2.2;
        meghnadProfileHead.setAttribute('transform', `translate(12, -175) rotate(${headNod.toFixed(2)})`);
        hairBack.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3).toFixed(2)}, -45, -245)`);

        const mouthOpen = getSpeechOpenness(t);
        const jawDrop = mouthOpen * 6.5;
        mouthCavity.setAttribute('ry', (1.5 + mouthOpen * 5.0).toFixed(1));
        upperLip.setAttribute('transform', `translate(0, ${(-mouthOpen * 1.2).toFixed(1)})`);
        lowerLip.setAttribute('transform', `translate(0, ${jawDrop.toFixed(1)})`);

        // 4. Rising Golden Sanctuary Sparkles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 3.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Safe-Zone Kinetic Hindi Keywords ("माता सीता का सम्मान 🙏" & "ससम्मान लौटाने का सुझाव ✨")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.14);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.14);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
