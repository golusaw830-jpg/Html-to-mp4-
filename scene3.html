  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s matching Scene 8 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const traumaBgAura = document.getElementById('traumaBgAura');
      const brokenMandalaRing = document.getElementById('brokenMandalaRing');

      const ashwatthamaHeroGroup = document.getElementById('ashwatthamaHeroGroup');
      const headAndTraumaGroup = document.getElementById('headAndTraumaGroup');
      const hairStrandL = document.getElementById('hairStrandL');
      const hairStrandR = document.getElementById('hairStrandR');

      const fadingGoldVeins = document.getElementById('fadingGoldVeins');
      const crimsonTraumaCracks = document.getElementById('crimsonTraumaCracks');
      const searingWoundHero = document.getElementById('searingWoundHero');
      const bloodDrop = document.getElementById('bloodDrop');
      const painWave1 = document.getElementById('painWave1');
      const painWave2 = document.getElementById('painWave2');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#fca5a5' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 2. Generate 28 Rising Dark-Crimson & Ember Trauma Motes
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ef4444' : '#ff8c1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 135 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Dramatic Camera Push-In Toward Searing Forehead Wound (1.0 -> 1.10)
        const camScale = 1 + easeOutCubic(t) * 0.10;
        cameraRig.setAttribute('transform', `translate(540, 742) scale(${camScale.toFixed(4)}) translate(-540, -742)`);

        // 3. Fractured Mandala Slow Drift & Crimson Aura Throb
        brokenMandalaRing.setAttribute('transform', `rotate(${(-t * 24).toFixed(1)})`);

        // Heavy Heartbeat Throb (Lub-Dub Pain Pulse)
        const beatCycle = (t * 3.5) % 1;
        const lub = Math.exp(-Math.pow((beatCycle - 0.12) / 0.06, 2));
        const dub = 0.65 * Math.exp(-Math.pow((beatCycle - 0.28) / 0.07, 2));
        const throb = lub + dub;

        traumaBgAura.setAttribute('r', (490 + throb * 55).toFixed(1));

        // 4. Golden Neural Lines Fading Out While Dark-Crimson Trauma Cracks Spread! (t: 0.10 -> 0.55)
        const crackProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.10) / 0.45)));
        fadingGoldVeins.setAttribute('opacity', ((1 - crackProg) * 0.85).toFixed(2));
        crimsonTraumaCracks.setAttribute('opacity', (crackProg * (0.72 + throb * 0.28)).toFixed(2));

        // 5. Searing Forehead Wound Pulse, Expanding Pain Rings & Trickling Blood Drop
        const woundScale = 1.0 + throb * 0.18;
        searingWoundHero.setAttribute('transform', `scale(${woundScale.toFixed(3)})`);

        const pw1 = (t * 2.5) % 1;
        painWave1.setAttribute('r', (42 + easeOutCubic(pw1) * 240).toFixed(1));
        painWave1.setAttribute('opacity', ((1 - pw1) * 0.82).toFixed(2));

        const pw2 = ((t * 2.5) + 0.5) % 1;
        painWave2.setAttribute('r', (42 + easeOutCubic(pw2) * 240).toFixed(1));
        painWave2.setAttribute('opacity', ((1 - pw2) * 0.75).toFixed(2));

        const bloodCycle = (t * 1.6) % 1;
        bloodDrop.setAttribute('transform', `translate(0, ${(bloodCycle * 32).toFixed(1)})`);
        bloodDrop.setAttribute('opacity', (1 - bloodCycle).toFixed(2));

        // 6. Ashwatthama Agonized Breathing & Tremor
        const breathY = 960 + Math.sin(t * Math.PI * 3) * 6;
        const agonyTremor = Math.sin(t * Math.PI * 24) * 1.2 * throb;
        ashwatthamaHeroGroup.setAttribute('transform', `translate(${(540 + agonyTremor).toFixed(1)}, ${breathY.toFixed(1)})`);

        const headTilt = Math.sin(t * Math.PI * 2) * 1.6;
        headAndTraumaGroup.setAttribute('transform', `rotate(${headTilt.toFixed(2)}, 0, 120)`);
        hairStrandL.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -215, -190)`);
        hairStrandR.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 4) * 3.5).toFixed(2)}, 215, -190)`);

        // 7. Rising Trauma Embers
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 8. Safe-Zone Kinetic Hindi Keywords ("गहरा जलता घाव 🩸" & "दिव्य शांति छिन गई 🧠")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
