<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070203;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
    }

    /* 9:16 Vertical Stage Container */
    .stage-wrapper {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);
      background: #120205;
      overflow: hidden;
      border-radius: 14px;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bottom Controls Bar */
    .controls-bar {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .action-btn {
      background: rgba(24, 8, 6, 0.88);
      color: #ffd875;
      border: 1.5px solid rgba(255, 200, 80, 0.6);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.18s ease, background 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .action-btn:hover:not(:disabled) {
      background: rgba(185, 42, 14, 0.95);
      border-color: #ffe89e;
      transform: scale(1.05);
    }

    .action-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .download-btn {
      background: linear-gradient(135deg, #d43d0b, #7d1305);
      color: #fff7d6;
      border-color: #ffd35c;
    }

    .status-toast {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 6, 4, 0.94);
      color: #ffe28a;
      border: 1.5px solid #ffcf54;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .status-toast.visible {
      opacity: 1;
    }
  </style>
  <style>.controls-bar{display:none !important}</style>
</head>

      <g pointer-events="none">
        <rect x="18" y="18" width="1044" height="1884" rx="28" fill="none" stroke="#240506" stroke-width="24" />
        <rect x="18" y="18" width="1044" height="1884" rx="28" fill="none" stroke="url(#goldMetal)" stroke-width="7" />
        <rect x="34" y="34" width="1012" height="1852" rx="20" fill="none" stroke="#ffcf54" stroke-width="2.5" stroke-dasharray="16 10" />
        <g fill="url(#goldMetal)" stroke="#240506" stroke-width="3">
          <circle cx="44" cy="44" r="18" />
          <circle cx="1036" cy="44" r="18" />
          <circle cx="44" cy="1876" r="18" />
          <circle cx="1036" cy="1876" r="18" />
        </g>
      </g>
    </svg>

    <div class="controls-bar" id="controlsBar">
      <button class="action-btn" id="replayBtn" title="Replay 5s Animation">↻ Replay</button>
      <button class="action-btn download-btn" id="downloadBtn" title="Download 5.0s 9:16 Video">⬇ Download MP4</button>
    </div>
  </div>

  <script>
    (function () {
      const svgNS = "http://www.w3.org/2000/svg";

      const cameraRig = document.getElementById("camera-rig");
      const tyrantAuraOuter = document.getElementById("tyrant-aura-outer");
      const demonMandala = document.getElementById("demon-mandala");
      const stormClouds = document.getElementById("storm-clouds-layer");

      const skyBoltLeft = document.getElementById("sky-bolt-left");
      const skyBoltRight = document.getElementById("sky-bolt-right");
      const skyBoltMid = document.getElementById("sky-bolt-mid");

      const ravanaTyrantRoot = document.getElementById("ravana-tyrant-root");
      const chandrahasArmRig = document.getElementById("chandrahas-arm-rig");
      const swordGlintSweep = document.getElementById("sword-glint-sweep");
      const tenHeadsTyrant = document.getElementById("ten-heads-tyrant");
      const royalCape = document.getElementById("royal-cape");

      const embersLayer = document.getElementById("embers-layer");
      const kwTyrant = document.getElementById("kw-tyrant");
      const kwArrogantRavana = document.getElementById("kw-arrogant-ravana");

      // Build 34 Floating Golden & Crimson Embers
      const embers = [];
      for (let i = 0; i < 34; i++) {
        const circle = document.createElementNS(svgNS, "circle");
        const r = 3 + (i % 5) * 1.3;
        circle.setAttribute("r", r.toFixed(1));
        circle.setAttribute("fill", i % 2 === 0 ? "#ffe680" : "#ff4526");
        circle.setAttribute("filter", "url(#softGlow)");
        embersLayer.appendChild(circle);

        embers.push({
          el: circle,
          baseX: 80 + ((i * 103) % 920),
          startY: 1850 - ((i * 137) % 720),
          speedY: 210 + (i % 7) * 42,
          wobbleAmp: 18 + (i % 4) * 9,
          wobbleFreq: 2.1 + (i % 5) * 0.45,
          phase: i * 0.65
        });
      }

      // Easing Helpers
      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Master 5.0-Second Deterministic Render Function
      function renderFrameAtTime(t) {
        // 1. Dramatic Low-Angle Upward Pan + Scale Push-In across 5.0s
        const panProg = easeOutCubic(clamp01(t / 5.0));
        const panY = lerp(85, -35, panProg);
        const camScale = lerp(0.98, 1.07, panProg);
        cameraRig.setAttribute(
          "transform",
          `translate(540 ${(960 + panY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-540 -960)`
        );

        // 2. Pulsing Dark Crimson Aura & Rotating Demon Mandala
        const auraPulse = 1 + 0.08 * Math.sin(t * 3.4);
        tyrantAuraOuter.setAttribute(
          "transform",
          `translate(540 720) scale(${auraPulse.toFixed(3)}) translate(-540 -720)`
        );
        demonMandala.setAttribute("transform", `rotate(${((t * 15) % 360).toFixed(2)} 540 720)`);

        // Swirling Storm Clouds Drift
        const cloudDrift = Math.sin(t * 1.4) * 28;
        stormClouds.setAttribute("transform", `translate(${cloudDrift.toFixed(1)} 0)`);

        // 3. Flashing Vector Lightning Bolts Across Storm Sky
        const boltL = (t >= 0.45 && t <= 0.72) || (t >= 2.75 && t <= 3.02) ? 0.92 : 0;
        const boltR = (t >= 1.15 && t <= 1.42) || (t >= 3.60 && t <= 3.88) ? 0.92 : 0;
        const boltM = (t >= 1.95 && t <= 2.20) ? 0.85 : 0;
        skyBoltLeft.setAttribute("opacity", boltL.toFixed(2));
        skyBoltRight.setAttribute("opacity", boltR.toFixed(2));
        skyBoltMid.setAttribute("opacity", boltM.toFixed(2));

        // 4. Ravana Imposing Stance, Raised Chandrahas Sword & Metallic Glint Sweep
        const breatheY = Math.sin(t * 2.8) * 6;
        ravanaTyrantRoot.setAttribute("transform", `translate(0 ${breatheY.toFixed(1)})`);

        // Sword Raising Flourish (0.2s -> 1.1s) + Commanding Hold
        let swordArmAngle = 0;
        if (t < 1.1) {
          const p = easeOutBack(clamp01((t - 0.15) / 0.95));
          swordArmAngle = lerp(18, -4, p);
        } else {
          swordArmAngle = -4 + Math.sin((t - 1.1) * 3.0) * 3.5;
        }
        chandrahasArmRig.setAttribute("transform", `rotate(${swordArmAngle.toFixed(2)} 690 860)`);

        // Metallic Glint Sweeping Up the Chandrahas Sword Blade Twice (1.1s->2.1s & 3.1s->4.1s)
        let glintY = 0;
        let glintOpacity = 0;
        if (t >= 1.1 && t <= 2.1) {
          const gp = (t - 1.1) / 1.0;
          glintY = lerp(0, -430, gp);
          glintOpacity = Math.sin(gp * Math.PI);
        } else if (t >= 3.1 && t <= 4.1) {
          const gp = (t - 3.1) / 1.0;
          glintY = lerp(0, -430, gp);
          glintOpacity = Math.sin(gp * Math.PI);
        }
        swordGlintSweep.setAttribute("transform", `translate(0 ${glintY.toFixed(1)})`);
        swordGlintSweep.setAttribute("opacity", glintOpacity.toFixed(3));

        // Arrogant Head & Cape Motion
        tenHeadsTyrant.setAttribute("transform", `rotate(${(Math.sin(t * 2.4) * 1.1).toFixed(2)} 540 820)`);
        royalCape.setAttribute("transform", `skewX(${(Math.sin(t * 3.2) * 1.8).toFixed(2)})`);

        // 5. Rising Crimson & Golden Embers
        for (let i = 0; i < embers.length; i++) {
          const em = embers[i];
          const travel = (t * em.speedY) % 1650;
          let y = em.startY - travel;
          if (y < 140) y += 1650;
          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;
          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;
          em.el.setAttribute("cx", x.toFixed(1));
          em.el.setAttribute("cy", y.toFixed(1));
          em.el.setAttribute("opacity", clamp01(alpha).toFixed(3));
        }

        // 6. Bold Hindi Keywords ("महा-अत्याचारी" & "अहंकारी रावण")
        if (t >= 0.85) {
          const p1 = clamp01((t - 0.85) / 0.36);
          const s1 = easeOutBack(p1);
          kwTyrant.setAttribute("opacity", clamp01(p1 * 2).toFixed(3));
          kwTyrant.setAttribute("transform", `translate(540 215) scale(${s1.toFixed(3)})`);
        } else {
          kwTyrant.setAttribute("opacity", "0");
        }

        if (t >= 1.95) {
          const p2 = clamp01((t - 1.95) / 0.38);
          const s2 = easeOutBack(p2);
          const slideY = lerp(1795, 1745, easeOutCubic(p2));
          kwArrogantRavana.setAttribute("opacity", clamp01(p2 * 2).toFixed(3));
          kwArrogantRavana.setAttribute("transform", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);
        } else {
          kwArrogantRavana.setAttribute("opacity", "0");
        }
      }

      // Live 5.0-Second Preview Loop
      const CLIP_DURATION = 5.0;
      let startTimestamp = performance.now();
      let isExporting = false;

      function animationLoop(now) {
        if (!isExporting) {
          const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;
          renderFrameAtTime(elapsedSec);
        }
        requestAnimationFrame(animationLoop);
      }

      renderFrameAtTime(0);
      requestAnimationFrame(animationLoop);

      document.getElementById("replayBtn").addEventListener("click", () => {
        startTimestamp = performance.now();
        renderFrameAtTime(0);
      });

      // Direct 5.0s 9:16 Video Exporter
      const downloadBtn = document.getElementById("downloadBtn");
      const statusToast = document.getElementById("statusToast");

      function showToast(msg) {
        statusToast.textContent = msg;
        statusToast.classList.add("visible");
      }

      function hideToast() {
        statusToast.classList.remove("visible");
      }

      downloadBtn.addEventListener("click", async () => {
        if (downloadBtn.disabled) return;
        downloadBtn.disabled = true;
        isExporting = true;

        try {
          const svgEl = document.getElementById("scene");
          const width = 1080;
          const height = 1920;
          const fps = 30;
          const totalFrames = Math.round(CLIP_DURATION * fps);

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");

          const mimeCandidates = [
            "video/mp4;codecs=avc1",
            "video/mp4",
            "video/webm;codecs=vp9",
            "video/webm;codecs=vp8",
            "video/webm"
          ];
          const chosenMime = mimeCandidates.find((m) => MediaRecorder.isTypeSupported(m)) || "";
          const isMp4 = chosenMime.includes("mp4");
          const fileExt = isMp4 ? "mp4" : "webm";

          const stream = canvas.captureStream(fps);
          const recorder = chosenMime
            ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 10_000_000 })
            : new MediaRecorder(stream);

          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          const recordingDone = new Promise((resolve) => {
            recorder.onstop = resolve;
          });

          function rasterizeCurrentSvgFrame() {
            return new Promise((resolve) => {
              const xml = new XMLSerializer().serializeToString(svgEl);
              const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
              const url = URL.createObjectURL(svgBlob);
              const img = new Image();
              img.onload = () => {
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);
                resolve();
              };
              img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve();
              };
              img.src = url;
            });
          }

          recorder.start();

          for (let frame = 0; frame <= totalFrames; frame++) {
            const simTime = (frame / totalFrames) * CLIP_DURATION;
            const pct = Math.min(99, Math.round((frame / totalFrames) * 100));
            showToast(`Rendering 5.0s Video... ${pct}%`);

            renderFrameAtTime(simTime);
            await rasterizeCurrentSvgFrame();
            await new Promise((r) => setTimeout(r, 1000 / fps));
          }

          recorder.stop();
          await recordingDone;

          const videoBlob = new Blob(chunks, { type: chosenMime || "video/webm" });
          const downloadUrl = URL.createObjectURL(videoBlob);
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = `parshuram_sentence_3.${fileExt}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(downloadUrl), 4000);

          showToast(`Saved parshuram_sentence_3.${fileExt}!`);
          setTimeout(hideToast, 2800);
        } catch (err) {
          console.error(err);
          showToast("Export error — please retry");
          setTimeout(hideToast, 2800);
        } finally {
          isExporting = false;
          startTimestamp = performance.now();
          downloadBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
