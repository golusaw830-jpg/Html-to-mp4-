<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 3 (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 3 (00:10.0 – 00:15.0 = 5.0 SECONDS EXACT)
  Voiceover: "मैंने स्वयं अपने पिता रावण के सामने हाथ जोड़कर विनती की थी,"
  Symbolic Creative SVG Visual:
  - Towering royal Lanka columns & grand stepped throne dais where Dashaanan Ravana's imposing 10-headed
    silhouette looms high above.
  - Below on the court floor, Indrajit (locked emerald-teal & gold armor, Naga-wing crown) appears smaller in
    scale yet firm and resolute with hands joined in Anjali Mudra.
  - Slow low-to-high upward camera tilt + floating golden dust particles.
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC AMBER COURT SKY (Locked Palette) -->
    <radialGradient id="lankaSabhaBg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <!-- Golden Throne Backlight Aura -->
    <radialGradient id="throneBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.78"/>
      <stop offset="35%" stop-color="#ff9900" stop-opacity="0.36"/>
      <stop offset="72%" stop-color="#991b1b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- Prayer Light Halo Around Indrajit -->
    <radialGradient id="indrajitPrayerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c2" stop-opacity="0.88"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. TOWERING PILLAR & GOLD GRADIENTS -->
    <linearGradient id="pillarTealGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#041215"/>
      <stop offset="32%" stop-color="#0f3d42"/>
      <stop offset="52%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#09292e"/>
      <stop offset="100%" stop-color="#030c0e"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- 3. LOCKED MEGHNAD (INDRAJIT) PALETTE -->
    <linearGradient id="meghnadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a370"/>
      <stop offset="52%" stop-color="#b57443"/>
      <stop offset="100%" stop-color="#6b3b1b"/>
    </linearGradient>

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="52%" stop-color="#083336"/>
      <stop offset="100%" stop-color="#03171a"/>
    </linearGradient>

    <linearGradient id="crimsonRoyalCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#690b12"/>
      <stop offset="100%" stop-color="#2b0306"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Slow Low-to-High Tilt Rig Inside Safe Zone) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL COURT BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#lankaSabhaBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 2: TOWERING LANKA COLUMNS & STEPPED THRONE DAIS     -->
    <!-- All architectural anchors framed inside Safe Zone         -->
    <!-- ========================================================= -->
    <g id="toweringArchitecture">
      <!-- Left Towering Carved Column (x: 115..185) -->
      <rect x="115" y="235" width="68" height="995" fill="url(#pillarTealGold)" stroke="#071316" stroke-width="4"/>
      <rect x="103" y="235" width="92" height="28" rx="6" fill="url(#goldMetal)" stroke="#071316" stroke-width="3.5"/>
      <rect x="103" y="540" width="92" height="18" rx="4" fill="url(#goldMetal)"/>
      <rect x="103" y="880" width="92" height="18" rx="4" fill="url(#goldMetal)"/>
      <rect x="103" y="1202" width="92" height="28" rx="6" fill="url(#goldMetal)" stroke="#071316" stroke-width="3.5"/>

      <!-- Right Towering Carved Column (x: 825..895) -->
      <rect x="827" y="235" width="68" height="995" fill="url(#pillarTealGold)" stroke="#071316" stroke-width="4"/>
      <rect x="815" y="235" width="92" height="28" rx="6" fill="url(#goldMetal)" stroke="#071316" stroke-width="3.5"/>
      <rect x="815" y="540" width="92" height="18" rx="4" fill="url(#goldMetal)"/>
      <rect x="815" y="880" width="92" height="18" rx="4" fill="url(#goldMetal)"/>
      <rect x="815" y="1202" width="92" height="28" rx="6" fill="url(#goldMetal)" stroke="#071316" stroke-width="3.5"/>

      <!-- Grand Royal Torana Arch Spanning Across Top (y=235..345) -->
      <path d="M 183 345 Q 505 215 827 345 L 827 235 L 183 235 Z" fill="#061216" stroke="url(#goldMetal)" stroke-width="4.5"/>

      <!-- Stepped Royal Throne Dais (High Above at y=690..820) -->
      <rect x="330" y="695" width="350" height="32" rx="6" fill="#2b070a" stroke="url(#goldMetal)" stroke-width="4"/>
      <rect x="290" y="727" width="430" height="36" rx="6" fill="#1f0508" stroke="url(#goldMetal)" stroke-width="4"/>
      <rect x="250" y="763" width="510" height="40" rx="6" fill="#140305" stroke="url(#goldMetal)" stroke-width="4"/>

      <!-- Main Marble Court Floor Below (y=1230) -->
      <rect x="85" y="1225" width="840" height="22" rx="6" fill="url(#goldMetal)" stroke="#071316" stroke-width="4"/>
      <rect x="-60" y="1247" width="1200" height="720" fill="#040b0e"/>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: IMPOSING TEN-HEADED SILHOUETTE OF RAVANA ABOVE   -->
    <!-- Positioned on High Throne Dais at (505, 535)              -->
    <!-- ========================================================= -->
    <g id="ravanaSilhouetteGroup" transform="translate(505, 535)">
      <!-- Glowing Amber Backlight Behind Ravana's Silhouette -->
      <circle id="throneAura" cx="0" cy="-20" r="245" fill="url(#throneBacklight)"/>

      <!-- Towering Throne Backrest Silhouette -->
      <path d="M -135 160 L -150 -145 L 0 -225 L 150 -145 L 135 160 Z" fill="#090306" stroke="url(#goldMetal)" stroke-width="5" stroke-linejoin="round"/>

      <!-- Broad Imposing Shoulders & Torso Silhouette -->
      <path d="M -145 160 C -130 45, -85 10, -45 0 L 45 0 C 85 10, 130 45, 145 160 Z" fill="#070204" stroke="#991b1b" stroke-width="3.5"/>

      <!-- Ten-Headed Crowned Silhouette (4 Left + 1 Grand Center + 5 Right) -->
      <g id="ravanaTenCrowns">
        <!-- Left 4 Side Head Silhouettes -->
        <polygon points="-148,-28 -140,-68 -126,-84 -112,-68 -104,-28" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="-114,-32 -106,-74 -92,-90 -78,-74 -70,-32" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="-80,-36 -72,-80 -58,-96 -44,-80 -36,-36" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="-48,-40 -40,-86 -26,-102 -12,-86 -4,-40" fill="#070204" stroke="#d97706" stroke-width="2.2"/>

        <!-- Right 5 Side Head Silhouettes -->
        <polygon points="4,-40 12,-86 26,-102 40,-86 48,-40" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="36,-36 44,-80 58,-96 72,-80 80,-36" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="70,-32 78,-74 92,-90 106,-74 114,-32" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="104,-28 112,-68 126,-84 140,-68 148,-28" fill="#070204" stroke="#d97706" stroke-width="2.2"/>
        <polygon points="134,-24 142,-60 154,-74 166,-60 174,-24" fill="#070204" stroke="#d97706" stroke-width="2.2"/>

        <!-- Grand Central Crown & Head Silhouette -->
        <path d="M -38 -45 L -28 -118 L 0 -158 L 28 -118 L 38 -45 Z" fill="#070204" stroke="url(#goldBright)" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="-34" y="-45" width="68" height="48" rx="10" fill="#070204" stroke="#991b1b" stroke-width="3"/>
        <!-- Glowing Amber-Red Slit Eyes in Silhouette -->
        <line x1="-22" y1="-24" x2="-8" y2="-22" stroke="#ff9900" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="22" y1="-24" x2="8" y2="-22" stroke="#ff9900" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 4: RESOLUTE INDRAJIT BELOW WITH HANDS JOINED        -->
    <!-- Small in scale beneath towering columns, yet firm & noble -->
    <!-- Positioned on Court Floor at (505, 1085)                  -->
    <!-- ========================================================= -->
    <g id="indrajitPleadingGroup" transform="translate(505, 1085)">
      <!-- Soft Golden-Teal Halo Framing Indrajit -->
      <circle id="prayerAuraOrb" cx="0" cy="-35" r="165" fill="url(#indrajitPrayerHalo)"/>

      <!-- Kneeling Warrior Dhoti & Armor Base on Marble Floor (y=+140) -->
      <path d="M -78 95 L 78 95 L 105 140 L -105 140 Z" fill="url(#crimsonRoyalCloth)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="-100" y1="128" x2="100" y2="128" stroke="url(#goldMetal)" stroke-width="8"/>

      <!-- Upper Body in Locked Emerald-Teal & Gold Lanka Armor -->
      <g id="indrajitUpperBody">
        <!-- Warrior Hair Locks -->
        <path d="M -38 -115 C -72 -65, -80 -5, -62 55 C -50 15, -42 -35, -28 -75 Z" fill="#0f1115" stroke="#040608" stroke-width="3.5"/>
        <path d="M 38 -115 C 72 -65, 80 -5, 62 55 C 50 15, 42 -35, 28 -75 Z" fill="#0f1115" stroke="#040608" stroke-width="3.5"/>

        <!-- Armor Torso -->
        <path d="M -58 -65 C -22 -82, 22 -82, 58 -65 L 50 96 L -50 96 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M -42 -66 C -14 -10, 18 45, 46 92" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M -34 -66 Q 0 -32 34 -66" fill="none" stroke="url(#goldMetal)" stroke-width="8" stroke-linecap="round"/>

        <!-- Naga-Wing Golden Shoulder Pauldrons -->
        <path d="M -76 -48 C -58 -76, -28 -76, -16 -54 L -26 -24 C -44 -36, -64 -32, -80 -14 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4"/>
        <path d="M 76 -48 C 58 -76, 28 -76, 16 -54 L 26 -24 C 44 -36, 64 -32, 80 -14 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4"/>

        <!-- Head & Naga-Serpent Kirit Mukuta Crown Looking Upward -->
        <g transform="translate(0, -95)">
          <path d="M -36 -42 L -26 -88 L 0 -122 L 26 -88 L 36 -42 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4" stroke-linejoin="round"/>
          <path d="M -36 -48 C -52 -58, -55 -74, -44 -84 C -40 -72, -36 -62, -30 -55 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
          <path d="M 36 -48 C 52 -58, 55 -74, 44 -84 C 40 -72, 36 -62, 30 -55 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
          <circle cx="0" cy="-80" r="6" fill="#0d9488" stroke="url(#goldBright)" stroke-width="2"/>
          <path d="M -42 -42 Q 0 -52 42 -42 L 40 -34 Q 0 -42 -40 -34 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>

          <!-- Face Looking Upward at Father -->
          <path d="M -38 -34 L 38 -34 L 34 12 C 34 30, 16 40, 0 40 C -16 40, -34 30, -34 12 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4"/>
          <line x1="-18" y1="-24" x2="18" y2="-24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="0" cy="-20" r="3.5" fill="#dc2626"/>
          <ellipse cx="-14" cy="-6" rx="6.5" ry="4" fill="#fffbeb" stroke="#0f1115" stroke-width="2"/>
          <circle cx="-14" cy="-7" r="2.8" fill="#d97706"/>
          <ellipse cx="14" cy="-6" rx="6.5" ry="4" fill="#fffbeb" stroke="#0f1115" stroke-width="2"/>
          <circle cx="14" cy="-7" r="2.8" fill="#d97706"/>
          <path d="M -10 22 Q 0 26 10 22" fill="none" stroke="#5e2418" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Joined Hands in Earnest Anjali Mudra (Namaste) -->
        <g id="anjaliHandsRig" transform="translate(0, -10)">
          <path d="M -52 -32 C -64 5, -36 32, 0 28 L 0 4 C -22 4, -34 -10, -32 -32 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4"/>
          <path d="M 52 -32 C 64 5, 36 32, 0 28 L 0 4 C 22 4, 34 -10, 32 -32 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4"/>
          <path d="M -9 28 L 0 -18 L 9 28 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="3.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- Floating Golden Dust Particles Drifting in Court Light -->
    <g id="goldenDustLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 5: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: हाथ जोड़कर विनती -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-295" y="-48" width="590" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="44" font-weight="900" letter-spacing="1">हाथ जोड़कर विनती 🙏</text>
      </g>

      <!-- Keyword 2: पिता रावण के सामने -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-295" y="-44" width="590" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">पिता रावण के सामने 👑</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND LOW-TO-HIGH TILT & DUST ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const throneAura = document.getElementById('throneAura');
      const ravanaTenCrowns = document.getElementById('ravanaTenCrowns');
      const prayerAuraOrb = document.getElementById('prayerAuraOrb');
      const indrajitUpperBody = document.getElementById('indrajitUpperBody');
      const anjaliHandsRig = document.getElementById('anjaliHandsRig');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const goldenDustLayer = document.getElementById('goldenDustLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Twinkling Court Stars
      const stars = [];
      for (let i = 0; i < 28; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (120 + ((i * 179) % 770)).toString());
        st.setAttribute('cy', (250 + ((i * 257) % 900)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 2. Floating Golden Dust Motes in Sabha Light Beams
      const dustMotes = [];
      for (let i = 0; i < 34; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.2 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#fff7c2');
        goldenDustLayer.appendChild(c);
        dustMotes.push({
          el: c,
          baseX: 160 + ((i * 97) % 690),
          baseY: 260 + ((i * 173) % 960),
          speedY: 45 + (i % 6) * 14,
          driftAmp: 18 + (i % 4) * 8,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Twinkling Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Slow Low-to-High Upward Camera Tilt & Gentle Push-In (Blueprint Motion!)
        const tiltProg = easeOutCubic(t);
        const panY = -36 + tiltProg * 68; // Tilts smoothly from lower floor up toward Ravana's throne!
        const camScale = 1.02 + tiltProg * 0.05;
        cameraRig.setAttribute(
          'transform',
          `translate(505, ${(760 + panY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-505, -760)`
        );

        // 3. Throne Backlight Pulse & Ravana Silhouette Presence
        throneAura.setAttribute('r', (240 + Math.sin(t * Math.PI * 4) * 22).toFixed(1));
        ravanaTenCrowns.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 2) * 0.8).toFixed(2)}, 0, 0)`);

        // 4. Resolute Indrajit Breathing & Joined Hands Pulse
        const breathY = Math.sin(t * Math.PI * 3) * 2.5;
        indrajitUpperBody.setAttribute('transform', `translate(0, ${breathY.toFixed(1)})`);
        anjaliHandsRig.setAttribute('transform', `translate(0, ${(-10 + Math.sin(t * Math.PI * 4) * 2).toFixed(1)})`);
        prayerAuraOrb.setAttribute('r', (160 + Math.sin(t * Math.PI * 5) * 18).toFixed(1));

        // 5. Floating Golden Dust Motes
        for (let i = 0; i < dustMotes.length; i++) {
          const dm = dustMotes[i];
          const yPos = ((dm.baseY - t * dm.speedY * 5.0) % 960 + 960) % 960 + 260;
          const xPos = dm.baseX + Math.sin(t * Math.PI * 3 + dm.phase) * dm.driftAmp;
          const alpha = 0.35 + 0.6 * Math.abs(Math.sin(t * Math.PI * 4 + dm.phase));
          dm.el.setAttribute('cx', xPos.toFixed(1));
          dm.el.setAttribute('cy', yPos.toFixed(1));
          dm.el.setAttribute('opacity', alpha.toFixed(2));
        }

        // 6. Safe-Zone Kinetic Hindi Keywords ("हाथ जोड़कर विनती 🙏" & "पिता रावण के सामने 👑")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
