<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwatthama Mani - Scene 3: Guru Dronacharya's 12-Year Tapasya (5.0s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #070310;
  }
</style>
</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 3 (00:09.0 – 00:14.0 = 5.0 SECONDS EXACT)
  Voiceover: "बहुत कम लोग जानते हैं कि गुरु द्रोणाचार्य ने हिमालय में बारह वर्षों तक कठोर तपस्या की थी..."
  Visual Blueprint:
  - Snowy Himalayan mountain peaks under a dark cosmic night sky (#040208 -> #1e1240).
  - High-detail meditating Guru Dronacharya seated in Padmasana on a sacred Himalayan peak,
    bathed in a radiant golden tapasya aura with counter-rotating energy chakras and 12-year solar/lunar markers.
  - Gentle drifting Himalayan snowfall + rising golden tapasya sparks.
  - Safe-Zone Compliant Kinetic Hindi Keywords ("१२ वर्षों की कठोर तपस्या 🏔️" & "गुरु द्रोणाचार्य 🧘‍♂️") with zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. HIMALAYAN NIGHT SKY & SACRED TAPASYA AURA -->
    <radialGradient id="himalayaNightBg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#28184d"/>
      <stop offset="46%" stop-color="#110929"/>
      <stop offset="100%" stop-color="#04020a"/>
    </radialGradient>

    <!-- Radiant Golden Tapasya Aura Behind Guru Dronacharya -->
    <radialGradient id="tapasyaGoldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="28%" stop-color="#ffe57f" stop-opacity="0.72"/>
      <stop offset="62%" stop-color="#ff8c00" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#110929" stop-opacity="0"/>
    </radialGradient>

    <!-- Snow-Capped Himalayan Mountain Gradients -->
    <linearGradient id="snowPeakMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#cfe4ff"/>
      <stop offset="68%" stop-color="#3b5284"/>
      <stop offset="100%" stop-color="#0e142e"/>
    </linearGradient>

    <linearGradient id="snowPeakBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8d4fa"/>
      <stop offset="45%" stop-color="#2a3b66"/>
      <stop offset="100%" stop-color="#090d21"/>
    </linearGradient>

    <!-- 2. LOCKED GURU DRONACHARYA & GOLD PALETTES -->
    <linearGradient id="dronaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c693"/>
      <stop offset="55%" stop-color="#d4955e"/>
      <stop offset="100%" stop-color="#965a2b"/>
    </linearGradient>

    <linearGradient id="dronaSaffronRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff991f"/>
      <stop offset="55%" stop-color="#d9530b"/>
      <stop offset="100%" stop-color="#802203"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 920) scale(1) translate(-540, -920)">

    <!-- LAYER 1: HIMALAYAN COSMIC NIGHT SKY & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#himalayaNightBg)"/>
    <g opacity="0.26" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Twinkling Himalayan Stars -->
    <g id="cosmicStarsLayer"></g>

    <!-- Distant Flanking Himalayan Peaks -->
    <g opacity="0.88">
      <polygon points="-80,1450 220,760 540,1450" fill="url(#snowPeakBack)" stroke="#090d21" stroke-width="4"/>
      <polygon points="220,760 155,910 198,895 220,935 246,892 285,910" fill="#ffffff" opacity="0.85"/>

      <polygon points="540,1450 860,740 1160,1450" fill="url(#snowPeakBack)" stroke="#090d21" stroke-width="4"/>
      <polygon points="860,740 795,895 838,878 860,920 886,876 925,895" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- LAYER 2: ROTATING TAPASYA ENERGY CHAKRAS & 12-YEAR CYCLE RING -->
    <g id="tapasyaChakrasGroup" transform="translate(540, 880)">
      <!-- Radiant Golden Aura -->
      <circle id="tapasyaAuraOrb" cx="0" cy="0" r="450" fill="url(#tapasyaGoldAura)" opacity="0.86"/>

      <!-- Outer 12-Year Tapasya Mandala Ring (12 Sacred Year Nodes) -->
      <g id="outerChakraRing">
        <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-dasharray="22 12"/>
        <circle cx="0" cy="0" r="360" fill="none" stroke="#ffe066" stroke-width="2"/>
        <g id="twelveYearNodes"></g>
      </g>

      <!-- Counter-Rotating Inner Geometric Yantra -->
      <g id="innerChakraRing">
        <polygon points="0,-325 281,162 -281,162" fill="none" stroke="url(#goldBright)" stroke-width="3.5" opacity="0.85"/>
        <polygon points="0,325 281,-162 -281,-162" fill="none" stroke="url(#goldBright)" stroke-width="3.5" opacity="0.85"/>
        <circle cx="0" cy="0" r="245" fill="none" stroke="#fff7c2" stroke-width="2.5" stroke-dasharray="12 10" opacity="0.72"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: CENTRAL SNOWY HIMALAYAN PEAK & GURU DRONACHARYA  -->
    <!-- ========================================================= -->
    <g id="centralPeakAndGuru">
      <!-- Towering Snow-Capped Central Himalayan Summit -->
      <polygon points="60,1580 540,960 1020,1580" fill="url(#snowPeakMain)" stroke="#090d21" stroke-width="5"/>
      <!-- Crisp Snow Ridge Highlights -->
      <polygon points="540,960 390,1155 468,1125 540,1195 612,1125 690,1155" fill="#ffffff" opacity="0.94"/>
      <!-- Sacred Flat Meditation Ledge at Summit -->
      <ellipse cx="540" cy="1075" rx="185" ry="26" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
      <ellipse cx="540" cy="1075" rx="150" ry="18" fill="#ffe066" opacity="0.45" filter="url(#softGoldGlow)"/>

      <!-- Dark Foreground Mountain Base -->
      <path d="M -60 1485 Q 540 1430 1140 1485 L 1140 2000 L -60 2000 Z" fill="#060412"/>

      <!-- ======================================================= -->
      <!-- GURU DRONACHARYA MEDITATING IN PADMASANA (FULL DETAIL)  -->
      <!-- ======================================================= -->
      <g id="guruDronaHero" transform="translate(540, 915)">
        <!-- Radiant Golden Rim Silhouette Glow Around Meditating Sage -->
        <ellipse cx="0" cy="15" rx="165" ry="185" fill="#ffe066" opacity="0.18" filter="url(#superGlow)"/>

        <!-- Crossed Legs in Padmasana (Lotus Posture) -->
        <path d="M -155 142 C -175 105, -90 84, 0 102 C 90 84, 175 105, 155 142 C 135 178, -135 178, -155 142 Z"
              fill="url(#dronaSaffronRobe)" stroke="#1a0903" stroke-width="5"/>
        <path d="M -125 142 Q 0 122 125 142" fill="none" stroke="url(#goldMetal)" stroke-width="6"/>

        <!-- Muscular Ascetic Torso & Saffron Uttariya Shawl -->
        <path d="M -82 -78 C -32 -102, 32 -102, 82 -78 L 92 102 L -92 102 Z" fill="url(#dronaSkin)" stroke="#1a0903" stroke-width="5"/>
        <!-- Saffron Angavastram Draped Over Left Shoulder -->
        <path d="M -78 -80 C -22 -12, 35 45, 90 100 L 90 22 C 35 -32, -12 -65, -48 -88 Z" fill="url(#dronaSaffronRobe)" stroke="#1a0903" stroke-width="4.5"/>
        <path d="M -78 -80 C -22 -12, 35 45, 90 100" fill="none" stroke="url(#goldMetal)" stroke-width="6"/>

        <!-- Sacred White Brahmin Thread (Janeu) & Rudraksha Mala -->
        <path d="M -64 -78 C -18 5, 32 58, 78 96" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
        <path d="M -42 -80 Q 0 -18 42 -80" fill="none" stroke="#4a1906" stroke-width="9" stroke-dasharray="6 6" stroke-linecap="round"/>

        <!-- Arms Resting in Dhyana / Jnana Mudra on Knees -->
        <path d="M -80 -62 C -122 -12, -135 55, -108 108 L -78 95 C -96 52, -88 -5, -56 -45 Z" fill="url(#dronaSkin)" stroke="#1a0903" stroke-width="4.5"/>
        <path d="M 80 -62 C 122 -12, 135 55, 108 108 L 78 95 C 96 52, 88 -5, 56 -45 Z" fill="url(#dronaSkin)" stroke="#1a0903" stroke-width="4.5"/>
        <!-- Glowing Meditation Mudra Hands -->
        <circle cx="-95" cy="104" r="16" fill="#fff7c2" filter="url(#softGoldGlow)"/>
        <circle cx="95" cy="104" r="16" fill="#fff7c2" filter="url(#softGoldGlow)"/>

        <!-- Ascetic Topknot Hair Bun (Jata Mukuta) -->
        <path d="M -38 -195 C -46 -258, 46 -258, 38 -195 Z" fill="#292524" stroke="#0c0a09" stroke-width="4.5"/>
        <path d="M -36 -202 Q 0 -188 36 -202" fill="none" stroke="url(#goldMetal)" stroke-width="5"/>

        <!-- Serene, Focused Rishi Face -->
        <path d="M -48 -162 C -48 -196, 48 -196, 48 -162 L 44 -96 C 44 -68, 22 -52, 0 -52 C -22 -52, -44 -68, -44 -96 Z" fill="url(#dronaSkin)" stroke="#1a0903" stroke-width="4.5"/>
        <!-- Sacred Tilak on Forehead -->
        <line x1="0" y1="-166" x2="0" y2="-138" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-150" r="4" fill="#d91e18"/>
        <!-- Closed Meditative Eyes -->
        <path d="M -30 -130 Q -17 -122 -6 -130" fill="none" stroke="#1a0903" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M 6 -130 Q 17 -122 30 -130" fill="none" stroke="#1a0903" stroke-width="3.8" stroke-linecap="round"/>

        <!-- Flowing Silver-White Rishi Beard & Mustache -->
        <path d="M -42 -106 C -48 -42, -20 4, 0 12 C 20 4, 48 -42, 42 -106 C 28 -78, 14 -72, 0 -72 C -14 -72, -28 -78, -42 -106 Z"
              fill="#f8fafc" stroke="#1a0903" stroke-width="3.5"/>
        <path d="M 0 -86 C -18 -92, -34 -84, -40 -74 C -26 -78, -12 -79, 0 -81 C 12 -79, 26 -78, 40 -74 C 34 -84, 18 -92, 0 -86 Z" fill="#e2e8f0"/>
      </g>
    </g>

    <!-- Drifting Himalayan Snowflakes & Rising Golden Tapasya Sparks -->
    <g id="snowLayer"></g>
    <g id="sparksLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: १२ वर्षों की कठोर तपस्या -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-385" y="-56" width="770" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="48" font-weight="900" letter-spacing="0.8">१२ वर्षों की कठोर तपस्या 🏔️</text>
      </g>

      <!-- Keyword 2: गुरु द्रोणाचार्य -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-270" y="-50" width="540" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900" letter-spacing="1">गुरु द्रोणाचार्य 🧘‍♂️</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s matching Scene 3 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const tapasyaAuraOrb = document.getElementById('tapasyaAuraOrb');
      const outerChakraRing = document.getElementById('outerChakraRing');
      const innerChakraRing = document.getElementById('innerChakraRing');
      const twelveYearNodes = document.getElementById('twelveYearNodes');
      const guruDronaHero = document.getElementById('guruDronaHero');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const snowLayer = document.getElementById('snowLayer');
      const sparksLayer = document.getElementById('sparksLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 12 Sacred Year Nodes Around Tapasya Chakra (Representing 12 Years of Penance)
      const yearNodes = [];
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * (Math.PI / 180);
        const x = Math.cos(angle) * 395;
        const y = Math.sin(angle) * 395;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})`);

        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', '14');
        c.setAttribute('fill', '#1e0b36');
        c.setAttribute('stroke', '#ffe066');
        c.setAttribute('stroke-width', '3.5');
        g.appendChild(c);

        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('r', '5');
        dot.setAttribute('fill', '#ffffff');
        g.appendChild(dot);

        twelveYearNodes.appendChild(g);
        yearNodes.push({ dot, idx: i });
      }

      // 2. Generate 38 Twinkling Himalayan Stars
      const stars = [];
      for (let i = 0; i < 38; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 223) % 1150)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 26 Drifting Himalayan Snowflakes
      const snowflakes = [];
      for (let i = 0; i < 26; i++) {
        const sf = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        sf.setAttribute('r', (2.2 + (i % 4) * 1.1).toFixed(1));
        sf.setAttribute('fill', '#e0f2fe');
        snowLayer.appendChild(sf);
        snowflakes.push({
          el: sf,
          baseX: 60 + ((i * 127) % 960),
          baseY: 120 + ((i * 181) % 1400),
          speedY: 95 + (i % 5) * 28,
          phase: i * 0.7
        });
      }

      // 4. Generate 24 Rising Golden Tapasya Energy Sparks
      const sparks = [];
      for (let i = 0; i < 24; i++) {
        const sp = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        sp.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        sp.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff9900');
        sparksLayer.appendChild(sp);
        sparks.push({
          el: sp,
          baseX: 280 + ((i * 89) % 520),
          baseY: 420 + ((i * 149) % 850),
          speedY: 145 + (i % 6) * 30,
          phase: i * 0.6
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Twinkling Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Cinematic Camera Push-In Toward Meditating Guru Dronacharya (1.0 -> 1.09)
        const camScale = 1 + easeOutCubic(t) * 0.09;
        cameraRig.setAttribute('transform', `translate(540, 920) scale(${camScale.toFixed(4)}) translate(-540, -920)`);

        // 3. Counter-Rotating Tapasya Chakras & Sequential 12-Year Ignition
        outerChakraRing.setAttribute('transform', `rotate(${(t * 45).toFixed(1)})`);
        innerChakraRing.setAttribute('transform', `rotate(${(-t * 36).toFixed(1)})`);
        tapasyaAuraOrb.setAttribute('r', (440 + Math.sin(t * Math.PI * 5) * 35).toFixed(1));

        for (let i = 0; i < yearNodes.length; i++) {
          const active = t >= (i / 14) ? 1 : 0.25;
          yearNodes[i].dot.setAttribute('opacity', active.toFixed(2));
        }

        // 4. Subtle Meditative Breathing Levitation on Guru Dronacharya
        const meditateY = 915 + Math.sin(t * Math.PI * 3) * 6;
        guruDronaHero.setAttribute('transform', `translate(540, ${meditateY.toFixed(1)})`);

        // 5. Drifting Himalayan Snowflakes (Falling Downward)
        for (let i = 0; i < snowflakes.length; i++) {
          const sf = snowflakes[i];
          const yPos = ((sf.baseY + t * sf.speedY * 5) % 1450) + 100;
          const xPos = sf.baseX + Math.sin(t * Math.PI * 3 + sf.phase) * 24;
          sf.el.setAttribute('cx', xPos.toFixed(1));
          sf.el.setAttribute('cy', yPos.toFixed(1));
          sf.el.setAttribute('opacity', (0.35 + 0.45 * Math.abs(Math.sin(t * Math.PI * 4 + sf.phase))).toFixed(2));
        }

        // 6. Rising Golden Tapasya Sparks (Floating Upward)
        for (let i = 0; i < sparks.length; i++) {
          const sp = sparks[i];
          const yPos = ((sp.baseY - t * sp.speedY * 5) % 900 + 900) % 900 + 380;
          const xPos = sp.baseX + Math.sin(t * Math.PI * 5 + sp.phase) * 16;
          sp.el.setAttribute('cx', xPos.toFixed(1));
          sp.el.setAttribute('cy', yPos.toFixed(1));
          sp.el.setAttribute('opacity', (0.35 + 0.65 * Math.abs(Math.sin(t * Math.PI * 6 + sp.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("१२ वर्षों की कठोर तपस्या 🏔️" & "गुरु द्रोणाचार्य 🧘‍♂️")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
