<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 3 - Clip 3: Two Sacred Ramayana Scriptures (5.0s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #06030d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #090414;
  }
</style>
</head>
<body>

<!-- 
  PART 3 - CLIP 3 (5.0 SECONDS EXACT) — STRICTLY FOLLOWING BLUEPRINT
  Voiceover: "इस सवाल का जवाब छिपा है रामायण के दो सबसे बड़े रहस्यों में!"
  Blueprint Visual: "दो प्राचीन सुनहरे शास्त्र ग्रंथों (वाल्मीकि रामायण और अध्यात्म रामायण) का दिव्य प्रकाश के साथ खुलना। कीवर्ड्स: 'दो बड़े रहस्य', 'शास्त्रों का सच'।"
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. BACKGROUND: Deep Cosmic Indigo & Sacred Temple Night -->
    <radialGradient id="templeNightBg" cx="50%" cy="46%" r="74%">
      <stop offset="0%" stop-color="#2c134d"/>
      <stop offset="46%" stop-color="#14072b"/>
      <stop offset="100%" stop-color="#05020d"/>
    </radialGradient>

    <!-- Divine Scripture Light Halo -->
    <radialGradient id="scriptureHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffe066" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#ff8c00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14072b" stop-opacity="0"/>
    </radialGradient>

    <!-- Upward Divine Light Rays -->
    <linearGradient id="divineRayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fff6b3" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#ffbe2e" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffbe2e" stop-opacity="0"/>
    </linearGradient>

    <!-- 2. GOLD & PARCHMENT GRADIENTS -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7bd"/>
      <stop offset="42%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#8c4804"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="crimsonCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a81327"/>
      <stop offset="55%" stop-color="#610814"/>
      <stop offset="100%" stop-color="#2b0309"/>
    </linearGradient>

    <linearGradient id="parchmentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d49b42"/>
      <stop offset="70%" stop-color="#fff0c2"/>
      <stop offset="100%" stop-color="#c48229"/>
    </linearGradient>

    <linearGradient id="parchmentRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c48229"/>
      <stop offset="30%" stop-color="#fff0c2"/>
      <stop offset="100%" stop-color="#d49b42"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bookShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: COOL COSMIC TEMPLE BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#templeNightBg)"/>

    <!-- Sacred Vedic Frame Filigree -->
    <g opacity="0.28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Rotating Sacred Mandala Behind the Two Scriptures -->
    <g id="sacredMandala" transform="translate(540, 860)" opacity="0.42">
      <circle cx="0" cy="0" r="465" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="24 12"/>
      <circle cx="0" cy="0" r="395" fill="none" stroke="#ffd24d" stroke-width="2"/>
      <polygon points="0,-395 342,198 -342,198" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <polygon points="0,395 342,-198 -342,-198" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    </g>

    <!-- LAYER 2: DIVINE LIGHT BEAMS ERUPTING FROM BOTH SCRIPTURES -->
    <g id="divineBeamsGroup" opacity="0">
      <!-- Left Scripture Upward Light Cone -->
      <polygon points="130,660 470,660 410,120 190,120" fill="url(#divineRayGrad)"/>
      <!-- Right Scripture Upward Light Cone -->
      <polygon points="610,1040 950,1040 890,460 670,460" fill="url(#divineRayGrad)"/>
    </g>

    <!-- ========================================================= -->
    <!-- SCRIPTURE 1 (UPPER LEFT): वाल्मीकि रामायण (VALMIKI)       -->
    <!-- ========================================================= -->
    <g id="bookValmiki" transform="translate(310, 670)" filter="url(#bookShadow)">
      <!-- Glowing Halo Behind Book -->
      <circle id="haloValmiki" cx="0" cy="0" r="260" fill="url(#scriptureHalo)" opacity="0.8"/>

      <!-- Outer Ornate Crimson & Gold Hardcover -->
      <rect x="-215" y="-145" width="430" height="290" rx="18" fill="url(#crimsonCoverGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

      <!-- Left Open Parchment Page -->
      <g id="valmikiPageLeft">
        <path d="M 0 -128 C -65 -142, -135 -138, -195 -122 L -195 122 C -135 108, -65 104, 0 118 Z" fill="url(#parchmentLeft)" stroke="#6e3804" stroke-width="3"/>
        <!-- Sacred Sloka Lines -->
        <g stroke="#7a3e06" stroke-width="3.5" stroke-linecap="round" opacity="0.72">
          <line x1="-165" y1="-85" x2="-30" y2="-85"/>
          <line x1="-165" y1="-55" x2="-45" y2="-55"/>
          <line x1="-165" y1="-25" x2="-25" y2="-25"/>
          <line x1="-165" y1="5" x2="-55" y2="5"/>
          <line x1="-165" y1="35" x2="-35" y2="35"/>
          <line x1="-165" y1="65" x2="-60" y2="65"/>
        </g>
      </g>

      <!-- Right Open Parchment Page -->
      <g id="valmikiPageRight">
        <path d="M 0 -128 C 65 -142, 135 -138, 195 -122 L 195 122 C 135 108, 65 104, 0 118 Z" fill="url(#parchmentRight)" stroke="#6e3804" stroke-width="3"/>
        <!-- Sacred Sloka Lines & Golden Om/Bow Emblem -->
        <g stroke="#7a3e06" stroke-width="3.5" stroke-linecap="round" opacity="0.72">
          <line x1="30" y1="-85" x2="165" y2="-85"/>
          <line x1="45" y1="-55" x2="165" y2="-55"/>
          <line x1="25" y1="-25" x2="165" y2="-25"/>
          <line x1="55" y1="5" x2="165" y2="5"/>
          <line x1="35" y1="35" x2="165" y2="35"/>
          <line x1="60" y1="65" x2="165" y2="65"/>
        </g>
      </g>

      <!-- Central Golden Spine Crease -->
      <line x1="0" y1="-132" x2="0" y2="124" stroke="#592902" stroke-width="5"/>

      <!-- Radiant Golden Title Ribbon Below Scripture 1 -->
      <g transform="translate(0, 182)">
        <rect x="-185" y="-32" width="370" height="64" rx="32" fill="#18082e" stroke="url(#goldGrad)" stroke-width="3.5"/>
        <text x="0" y="10" text-anchor="middle" fill="#ffe066" font-size="34" font-weight="900">१. वाल्मीकि रामायण</text>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- SCRIPTURE 2 (LOWER RIGHT): अध्यात्म रामायण (ADHYATMA)    -->
    <!-- ========================================================= -->
    <g id="bookAdhyatma" transform="translate(770, 1050)" filter="url(#bookShadow)">
      <!-- Glowing Halo Behind Book -->
      <circle id="haloAdhyatma" cx="0" cy="0" r="260" fill="url(#scriptureHalo)" opacity="0.8"/>

      <!-- Outer Ornate Crimson & Gold Hardcover -->
      <rect x="-215" y="-145" width="430" height="290" rx="18" fill="url(#crimsonCoverGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

      <!-- Left Open Parchment Page -->
      <g id="adhyatmaPageLeft">
        <path d="M 0 -128 C -65 -142, -135 -138, -195 -122 L -195 122 C -135 108, -65 104, 0 118 Z" fill="url(#parchmentLeft)" stroke="#6e3804" stroke-width="3"/>
        <g stroke="#7a3e06" stroke-width="3.5" stroke-linecap="round" opacity="0.72">
          <line x1="-165" y1="-85" x2="-30" y2="-85"/>
          <line x1="-165" y1="-55" x2="-45" y2="-55"/>
          <line x1="-165" y1="-25" x2="-25" y2="-25"/>
          <line x1="-165" y1="5" x2="-55" y2="5"/>
          <line x1="-165" y1="35" x2="-35" y2="35"/>
          <line x1="-165" y1="65" x2="-60" y2="65"/>
        </g>
      </g>

      <!-- Right Open Parchment Page -->
      <g id="adhyatmaPageRight">
        <path d="M 0 -128 C 65 -142, 135 -138, 195 -122 L 195 122 C 135 108, 65 104, 0 118 Z" fill="url(#parchmentRight)" stroke="#6e3804" stroke-width="3"/>
        <g stroke="#7a3e06" stroke-width="3.5" stroke-linecap="round" opacity="0.72">
          <line x1="30" y1="-85" x2="165" y2="-85"/>
          <line x1="45" y1="-55" x2="165" y2="-55"/>
          <line x1="25" y1="-25" x2="165" y2="-25"/>
          <line x1="55" y1="5" x2="165" y2="5"/>
          <line x1="35" y1="35" x2="165" y2="35"/>
          <line x1="60" y1="65" x2="165" y2="65"/>
        </g>
      </g>

      <!-- Central Golden Spine Crease -->
      <line x1="0" y1="-132" x2="0" y2="124" stroke="#592902" stroke-width="5"/>

      <!-- Radiant Golden Title Ribbon Below Scripture 2 -->
      <g transform="translate(0, 182)">
        <rect x="-185" y="-32" width="370" height="64" rx="32" fill="#18082e" stroke="url(#goldGrad)" stroke-width="3.5"/>
        <text x="0" y="10" text-anchor="middle" fill="#ffe066" font-size="34" font-weight="900">२. अध्यात्म रामायण</text>
      </g>
    </g>

    <!-- Connecting Golden Energy Stream Linking Both Scriptures -->
    <path id="scriptureLinkArc" d="M 485 735 Q 540 860 595 985" fill="none" stroke="#fff6b3" stroke-width="7" stroke-dasharray="22 14" filter="url(#strongGlow)" opacity="0"/>

    <!-- Floating Golden Sanskrit Dust & Sparks -->
    <g id="particlesLayer"></g>

    <!-- LAYER 4: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Keyword 1: दो बड़े रहस्य -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-285" y="-58" width="570" height="96" rx="24" fill="#15072b" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="56" font-weight="900">दो बड़े रहस्य 📜</text>
      </g>

      <!-- Keyword 2: शास्त्रों का सच -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-275" y="-52" width="550" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900">शास्त्रों का सच ✨</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const sacredMandala = document.getElementById('sacredMandala');
      const divineBeamsGroup = document.getElementById('divineBeamsGroup');

      const bookValmiki = document.getElementById('bookValmiki');
      const valmikiPageLeft = document.getElementById('valmikiPageLeft');
      const valmikiPageRight = document.getElementById('valmikiPageRight');
      const haloValmiki = document.getElementById('haloValmiki');

      const bookAdhyatma = document.getElementById('bookAdhyatma');
      const adhyatmaPageLeft = document.getElementById('adhyatmaPageLeft');
      const adhyatmaPageRight = document.getElementById('adhyatmaPageRight');
      const haloAdhyatma = document.getElementById('haloAdhyatma');

      const scriptureLinkArc = document.getElementById('scriptureLinkArc');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 30 Rising Golden Light Motes
      const particles = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.2).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 90 + ((i * 107) % 900),
          baseY: 200 + ((i * 193) % 1500),
          speed: 140 + (i % 6) * 32,
          phase: i * 0.6
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Mandala Rotation
        sacredMandala.setAttribute('transform', `translate(540, 860) rotate(${(t * 48).toFixed(2)})`);

        // 3. Book 1 (Valmiki Ramayana) Pop-In & Page-Unfold Animation (0.06 -> 0.24)
        const pBook1 = Math.max(0, Math.min(1, (t - 0.06) / 0.18));
        const sBook1 = 0.72 + 0.28 * easeOutBack(pBook1);
        const bob1 = Math.sin(t * Math.PI * 3) * 8;
        bookValmiki.setAttribute('opacity', Math.min(1, pBook1 * 2).toFixed(2));
        bookValmiki.setAttribute('transform', `translate(310, ${(670 + bob1).toFixed(1)}) scale(${sBook1.toFixed(3)})`);

        // Pages unfolding horizontally from spine (scaleX 0.15 -> 1.0)
        const pageOpen1 = 0.15 + 0.85 * easeOutCubic(pBook1);
        valmikiPageLeft.setAttribute('transform', `scale(${pageOpen1.toFixed(3)}, 1)`);
        valmikiPageRight.setAttribute('transform', `scale(${pageOpen1.toFixed(3)}, 1)`);
        haloValmiki.setAttribute('r', (245 + Math.sin(t * Math.PI * 4) * 28).toFixed(1));

        // 4. Book 2 (Adhyatma Ramayana) Staggered Pop-In & Page-Unfold (0.20 -> 0.38)
        const pBook2 = Math.max(0, Math.min(1, (t - 0.20) / 0.18));
        const sBook2 = 0.72 + 0.28 * easeOutBack(pBook2);
        const bob2 = Math.cos(t * Math.PI * 3) * 8;
        bookAdhyatma.setAttribute('opacity', Math.min(1, pBook2 * 2).toFixed(2));
        bookAdhyatma.setAttribute('transform', `translate(770, ${(1050 + bob2).toFixed(1)}) scale(${sBook2.toFixed(3)})`);

        const pageOpen2 = 0.15 + 0.85 * easeOutCubic(pBook2);
        adhyatmaPageLeft.setAttribute('transform', `scale(${pageOpen2.toFixed(3)}, 1)`);
        adhyatmaPageRight.setAttribute('transform', `scale(${pageOpen2.toFixed(3)}, 1)`);
        haloAdhyatma.setAttribute('r', (245 + Math.cos(t * Math.PI * 4) * 28).toFixed(1));

        // 5. Divine Light Rays & Connecting Golden Stream
        const beamOp = Math.max(0, Math.min(1, (t - 0.18) / 0.16)) * (0.75 + 0.25 * Math.sin(t * Math.PI * 6));
        divineBeamsGroup.setAttribute('opacity', beamOp.toFixed(2));

        const linkOp = Math.max(0, Math.min(1, (t - 0.34) / 0.12));
        scriptureLinkArc.setAttribute('opacity', linkOp.toFixed(2));
        scriptureLinkArc.setAttribute('stroke-dashoffset', (-t * 360).toFixed(1));

        // 6. Floating Golden Light Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("दो बड़े रहस्य 📜" & "शास्त्रों का सच ✨")
        if (t >= 0.24) {
          const p1 = Math.min(1, (t - 0.24) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.46) {
          const p2 = Math.min(1, (t - 0.46) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
