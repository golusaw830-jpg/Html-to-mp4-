<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 11 (5.0s Secret Maze Path SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 11 (00:55.0 – 01:00.0 = 5.0 SECONDS EXACT)
  Voiceover: "तब मेरे ही सगे चाचा विभीषण ने शत्रुओं को मेरा गुप्त मार्ग बता दिया।"
  Symbolic Creative SVG Visual:
  - Seamless match-cut opening from Scene 10's sacred Agni-Mandal ring into a maze-like vector map of Lanka.
  - Vibhishana standing in shadow pointing his finger along the labyrinth as a glowing crimson-gold path line
    animates through the maze via stroke-dashoffset to unlock the secret passage.
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC AMBER SKY (Locked Palette) -->
    <radialGradient id="lankaMazeBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <radialGradient id="secretPathGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.72"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.34"/>
      <stop offset="75%" stop-color="#0f766e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. LANKA MAZE PARCHMENT & VIBHISHANA PALETTE -->
    <linearGradient id="mazeMapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2930"/>
      <stop offset="55%" stop-color="#07181e"/>
      <stop offset="100%" stop-color="#030c10"/>
    </linearGradient>

    <linearGradient id="crimsonGoldPath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#ffe066"/>
      <stop offset="72%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="vibhishanaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d99b66"/>
      <stop offset="56%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#633717"/>
    </linearGradient>

    <linearGradient id="vibhishanaRobes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL SKY & COURT FLOOR -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#lankaMazeBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Palace Pillars & Archway Framing Safe Zone -->
    <g opacity="0.42" fill="#051014">
      <rect x="95" y="235" width="42" height="1010"/>
      <rect x="865" y="235" width="42" height="1010"/>
      <path d="M 95 360 Q 480 230 907 360 L 907 235 L 95 235 Z"/>
    </g>

    <!-- Court Floor & Golden Trim -->
    <rect x="75" y="1225" width="850" height="22" rx="6" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4"/>
    <rect x="-60" y="1247" width="1200" height="720" fill="#040b0e"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: MAZE-LIKE VECTOR MAP OF LANKA (SAFE ZONE)        -->
    <!-- Positioned inside Safe Zone (x: 155..845, y: 315..1185)  -->
    <!-- ========================================================= -->
    <g id="lankaMazeMapGroup" transform="translate(505, 745)">
      <!-- Radiant Betrayal Path Halo -->
      <circle id="mazeAuraOrb" cx="0" cy="0" r="380" fill="url(#secretPathGlow)"/>

      <!-- Outer Royal Map Frame & Compass Crest -->
      <rect x="-335" y="-415" width="670" height="830" rx="26" fill="url(#mazeMapGrad)" stroke="url(#goldMetal)" stroke-width="5.5"/>
      <rect x="-315" y="-395" width="630" height="790" rx="18" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="14 10" opacity="0.48"/>

      <!-- Map Header Label -->
      <rect x="-175" y="-375" width="350" height="44" rx="22" fill="#06171c" stroke="url(#goldMetal)" stroke-width="3"/>
      <text x="0" y="-345" text-anchor="middle" fill="#ffe066" font-size="24" font-weight="900">लंका गुप्त मार्ग नक्शा</text>

      <!-- Intricate Labyrinth Maze Walls (भू-भुलैया दीवारें) -->
      <g id="mazeWallsLayer" stroke="#5eead4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.72">
        <!-- Outer Labyrinth Chamber Rings & Corridors -->
        <path d="M -255 -285 L 255 -285 L 255 315 L -255 315 L -255 -165"/>
        <path d="M -195 -225 L 195 -225 L 195 255 L -195 255 L -195 -105"/>
        <path d="M -135 -165 L 135 -165 L 135 195 L -135 195 L -135 -45"/>
        <path d="M -75 -105 L 75 -105 L 75 135 L -75 135 L -75 15"/>

        <!-- Cross-Baffles & Dead-End Walls Forming True Maze -->
        <line x1="-255" y1="-85" x2="-135" y2="-85"/>
        <line x1="-135" y1="-25" x2="-15" y2="-25"/>
        <line x1="75" y1="-165" x2="75" y2="-45"/>
        <line x1="135" y1="45" x2="255" y2="45"/>
        <line x1="-195" y1="125" x2="-75" y2="125"/>
        <line x1="15" y1="195" x2="15" y2="315"/>
        <line x1="-135" y1="255" x2="-15" y2="255"/>
        <line x1="135" y1="-225" x2="135" y2="-105"/>
      </g>

      <!-- Secret Gate / Yajna Sanctuary Marker at Center-Left (-15, 35) -->
      <g id="secretGateTarget" transform="translate(-15, 35)" filter="url(#superGlow)">
        <circle id="gateUnlockRing" cx="0" cy="0" r="36" fill="none" stroke="#ffe066" stroke-width="4" stroke-dasharray="10 6"/>
        <polygon points="0,-24 22,0 0,24 -22,0" fill="#2b070a" stroke="url(#goldBright)" stroke-width="4"/>
        <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      </g>

      <!-- GLOWING CRIMSON-GOLD SECRET PATH LINE (Animated via stroke-dashoffset!) -->
      <path id="secretMazePath"
            d="M 225 -255 L 225 -125 L 105 -125 L 105 -15 L 165 -15 L 165 145 L 45 145 L 45 75 L -45 75 L -45 35 L -15 35"
            fill="none" stroke="url(#crimsonGoldPath)" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1450" stroke-dashoffset="1450" filter="url(#superGlow)"/>

      <!-- Traveling Light Tip Along the Secret Path -->
      <circle id="pathTracerDot" cx="225" cy="-255" r="14" fill="#ffffff" stroke="#ff6b1a" stroke-width="4" filter="url(#superGlow)" opacity="0"/>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: VIBHISHANA STANDING IN SHADOW POINTING FINGER    -->
    <!-- Positioned in Right-Lower Safe Zone at (745, 965)         -->
    <!-- ========================================================= -->
    <g id="vibhishanaShadowGroup" transform="translate(745, 965)">
      <!-- Dark Shadow Veil Framing Vibhishana's Betrayal -->
      <ellipse cx="0" cy="45" rx="145" ry="235" fill="#04080b" fill-opacity="0.72" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="12 8"/>

      <!-- Vibhishana Lower Robes & Standing Stance -->
      <path d="M -56 45 L 56 45 L 74 255 L 15 255 L 0 150 L -15 255 L -74 255 Z" fill="url(#vibhishanaRobes)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="-68" y1="242" x2="-16" y2="242" stroke="url(#goldMetal)" stroke-width="8"/>
      <line x1="16" y1="242" x2="68" y2="242" stroke="url(#goldMetal)" stroke-width="8"/>
      <rect x="-56" y="32" width="112" height="18" rx="5" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4"/>

      <!-- Vibhishana Torso, Sacred Janeu & Shawl -->
      <path d="M -58 -125 C -22 -144, 22 -144, 58 -125 L 48 36 L -48 36 Z" fill="url(#vibhishanaSkin)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M -42 -126 C -12 -52, 18 2, 44 34" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M -54 -122 C -18 -68, 18 -28, 54 12 L 54 -36 C 18 -68, -12 -100, -35 -130 Z" fill="#fef3c7" stroke="#0a1214" stroke-width="3.5"/>

      <!-- POINTING ARM & FINGER EXTENDED LEFT TOWARD THE MAZE PATH -->
      <g id="vibhishanaPointArm" transform="translate(-48, -92)">
        <path d="M 0 -8 C -45 -22, -88 -38, -128 -48 L -118 -74 C -82 -64, -42 -50, 8 -34 Z" fill="url(#vibhishanaSkin)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
        <!-- Pointing Index Finger -->
        <path d="M -124 -64 L -162 -72 C -168 -73, -170 -64, -162 -61 L -126 -52 Z" fill="url(#vibhishanaSkin)" stroke="#0a1214" stroke-width="3.5"/>
        <circle cx="-164" cy="-67" r="9" fill="#ffe066" opacity="0.65" filter="url(#softGoldGlow)"/>
      </g>

      <!-- Vibhishana Crown & Shadowed Face Looking Left -->
      <g id="vibhishanaHead" transform="translate(-6, -142)">
        <path d="M -30 -68 L -20 -118 L 0 -148 L 20 -118 L 30 -68 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="0" cy="-106" r="6.5" fill="#0d9488" stroke="#0a1214" stroke-width="2"/>
        <path d="M -34 -68 Q 0 -78 34 -68 L 32 -58 Q 0 -66 -32 -58 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="3.5"/>

        <path d="M -32 -60 L 32 -60 L 28 -10 C 28 10, 14 20, 0 20 C -14 20, -28 10, -28 -10 Z" fill="url(#vibhishanaSkin)" stroke="#0a1214" stroke-width="4"/>
        <line x1="-14" y1="-50" x2="10" y2="-50" stroke="#ffffff" stroke-width="2.5"/>
        <circle cx="-2" cy="-47" r="3" fill="#dc2626"/>
        <ellipse cx="-14" cy="-26" rx="6" ry="3.8" fill="#ffffff" stroke="#0a1214" stroke-width="1.8"/>
        <circle cx="-16" cy="-26" r="2.4" fill="#0a1214"/>
        <ellipse cx="8" cy="-26" rx="6" ry="3.8" fill="#ffffff" stroke="#0a1214" stroke-width="1.8"/>
        <circle cx="6" cy="-26" r="2.4" fill="#0a1214"/>
        <path d="M -14 4 Q -4 -2 6 4" fill="none" stroke="#0a1214" stroke-width="2.8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Match-Cut Agni-Mandal Boundary Seed at t=0 (Seamless Link from Scene 10!) -->
    <ellipse id="matchCutAgniSeed" cx="605" cy="1135" rx="225" ry="42" fill="none" stroke="#ffe066" stroke-width="5" opacity="0.85" filter="url(#softGoldGlow)"/>

    <!-- Rising Golden & Crimson Sparks -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: चाचा विभीषण का छल -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-295" y="-48" width="590" height="82" rx="22" fill="#18060c" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="43" font-weight="900" letter-spacing="1">चाचा विभीषण का छल 💔</text>
      </g>

      <!-- Keyword 2: गुप्त मार्ग खुला -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-275" y="-44" width="550" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">गुप्त मार्ग खुला 🔓</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND STROKE-DASHOFFSET MAZE PATH ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const mazeAuraOrb = document.getElementById('mazeAuraOrb');
      const secretMazePath = document.getElementById('secretMazePath');
      const pathTracerDot = document.getElementById('pathTracerDot');
      const gateUnlockRing = document.getElementById('gateUnlockRing');
      const matchCutAgniSeed = document.getElementById('matchCutAgniSeed');

      const vibhishanaPointArm = document.getElementById('vibhishanaPointArm');
      const vibhishanaHead = document.getElementById('vibhishanaHead');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ef4444');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 1. Safe-Zone Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);

        // 2. Match-Cut Expansion From Scene 10's Agni-Mandal Boundary (0.0 -> 0.22)
        const seedProg = easeOutCubic(Math.min(1, t / 0.22));
        matchCutAgniSeed.setAttribute('opacity', Math.max(0, 0.85 * (1 - seedProg)).toFixed(2));
        matchCutAgniSeed.setAttribute('transform', `translate(605, 1135) scale(${(1 + seedProg * 1.4).toFixed(2)}) translate(-605, -1135)`);

        // 3. Secret Maze Path Reveal via stroke-dashoffset (t: 0.14 -> 0.78)
        const pathProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.14) / 0.64)));
        const totalLen = 1450;
        const dashOffset = totalLen * (1 - pathProg);
        secretMazePath.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));

        // Tracer Dot Along Path Length
        if (pathProg > 0 && pathProg < 1) {
          const pt = secretMazePath.getPointAtLength(pathProg * secretMazePath.getTotalLength());
          pathTracerDot.setAttribute('opacity', '1');
          pathTracerDot.setAttribute('cx', pt.x.toFixed(1));
          pathTracerDot.setAttribute('cy', pt.y.toFixed(1));
        } else {
          pathTracerDot.setAttribute('opacity', '0');
        }

        // Secret Gate Unlock Pulse When Path Reaches Target
        const gatePulse = pathProg > 0.85 ? 1 + Math.sin(t * Math.PI * 10) * 0.18 : 1;
        gateUnlockRing.setAttribute('transform', `scale(${gatePulse.toFixed(3)})`);
        mazeAuraOrb.setAttribute('r', (370 + Math.sin(t * Math.PI * 5) * 24).toFixed(1));

        // 4. Vibhishana Pointing Finger Motion & Head Tilt
        const pointBob = Math.sin(t * Math.PI * 4) * 3.5;
        vibhishanaPointArm.setAttribute('transform', `translate(-48, -92) rotate(${pointBob.toFixed(2)})`);
        vibhishanaHead.setAttribute('transform', `translate(-6, -142) rotate(${(Math.sin(t * Math.PI * 2.5) * 1.6).toFixed(2)})`);

        // 5. Rising Golden & Crimson Sparks
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Safe-Zone Kinetic Hindi Keywords ("चाचा विभीषण का छल 💔" & "गुप्त मार्ग खुला 🔓")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
