  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const ashokaCanopy = document.getElementById('ashokaCanopy');
      const sitaAuraOrb = document.getElementById('sitaAuraOrb');
      const sitaMandala = document.getElementById('sitaMandala');
      const curseBoundaryBeam = document.getElementById('curseBoundaryBeam');
      const ravanaHelplessGroup = document.getElementById('ravanaHelplessGroup');
      const ravanaHeadsHelpless = document.getElementById('ravanaHeadsHelpless');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 28 Floating Golden Sanctuary Fireflies
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 130 + (i % 6) * 28,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        // 1. Camera Gentle Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Ashoka Tree Canopy Gentle Breeze Sway
        ashokaCanopy.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 3) * 1.4).toFixed(2)}, 180, 560)`);

        // 3. Mata Sita Sanctuary Aura & Mandala Rotation
        sitaMandala.setAttribute('transform', `translate(0, -45) rotate(${(t * 42).toFixed(1)})`);
        sitaAuraOrb.setAttribute('r', (295 + Math.sin(t * Math.PI * 4) * 26).toFixed(1));

        // 4. Invisible Curse Boundary Line Pulse
        const beamOp = 0.65 + 0.35 * Math.sin(t * Math.PI * 6);
        curseBoundaryBeam.setAttribute('opacity', beamOp.toFixed(2));

        // 5. Helpless Ravana Taking Half a Step Forward and Stopping in Frustration
        const stepShift = Math.sin(t * Math.PI * 2) * 12;
        const bobRavana = 1135 + Math.sin(t * Math.PI * 3) * 5;
        ravanaHelplessGroup.setAttribute('transform', `translate(${(825 - stepShift).toFixed(1)}, ${bobRavana.toFixed(1)})`);
        ravanaHeadsHelpless.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 6) * 1.2).toFixed(2)}, 0, -400)`);

        // 6. Floating Fireflies
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("अशोक वाटिका 🌿" & "एक साल तक बेबस 🔒")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
