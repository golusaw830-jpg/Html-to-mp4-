<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghnad 16-Scene Blueprint - Scene 13A (5.0s Symbolic SVG)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030709;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #050b0e;
  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 13A (5.0 SECONDS EXACT)
  Voiceover: "अब आप ही बताइए, अपने परिवार और मातृभूमि के लिए प्राण देना अगर अधर्म है,"
  Visual Concept: Vector scales (तराजू) with burning Lanka spire & family crown on the left pan
  tipping downward (+14deg) with a deep sub-bass pulse.
  100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s loop, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dharmaScaleBg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <radialGradient id="adharmaPanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.68"/>
      <stop offset="55%" stop-color="#dc2626" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="lankaTowerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#3b1404"/>
    </linearGradient>

    <linearGradient id="flameTipGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#dharmaScaleBg)"/>
    <g id="cosmicStarsLayer"></g>

    <g id="bgMandala" transform="translate(505, 740)" opacity="0.34">
      <circle cx="0" cy="0" r="395" fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-dasharray="20 12"/>
      <circle cx="0" cy="0" r="340" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.65"/>
    </g>

    <!-- SYMBOLIC SCALES OF JUSTICE (तराजू) -->
    <g id="dharmaScalesAssembly" transform="translate(505, 735)">
      <rect x="-11" y="-235" width="22" height="545" rx="7" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>
      <circle cx="0" cy="-242" r="22" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
      <path d="M -125 310 L 125 310 L 96 274 L -96 274 Z" fill="#083336" stroke="url(#goldMetal)" stroke-width="4.5"/>

      <!-- TILTING BALANCE BEAM (+14deg dips left pan down, lifts right pan up) -->
      <g id="tiltingScaleBeam" transform="translate(0, -215)">
        <line x1="-245" y1="0" x2="245" y2="0" stroke="url(#goldBright)" stroke-width="11" stroke-linecap="round" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="18" fill="#115e59" stroke="url(#goldBright)" stroke-width="4"/>

        <!-- LEFT PAN: BURNING LANKA & FAMILY CROWN -->
        <g id="leftPanAssembly" transform="translate(-225, 0)">
          <line x1="0" y1="0" x2="-64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <line x1="0" y1="0" x2="64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <path d="M -82 165 L 82 165 Q 0 215 -82 165 Z" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>

          <g id="adharmaCargoGroup" transform="translate(0, 162)">
            <circle cx="0" cy="-48" r="95" fill="url(#adharmaPanGlow)"/>
            <path d="M -22 4 L -12 -64 L 0 -94 L 12 -64 L 22 4 Z" fill="url(#lankaTowerGold)" stroke="#1a0508" stroke-width="3"/>
            <path d="M -52 4 L -58 -28 L -38 -14 L -26 -36 L -14 -14 L -6 -28 L -12 4 Z" fill="url(#goldBright)" stroke="#1a0508" stroke-width="2.5"/>
            <path id="cargoFlameL" d="M -36 -20 Q -42 -58 -30 -76 Q -20 -55 -24 -20 Z" fill="url(#flameTipGrad)" filter="url(#softGoldGlow)"/>
            <path id="cargoFlameC" d="M -10 -56 Q -16 -102 0 -126 Q 16 -102 10 -56 Z" fill="url(#flameTipGrad)" filter="url(#softGoldGlow)"/>
            <path id="cargoFlameR" d="M 22 -26 Q 16 -62 30 -82 Q 38 -58 32 -26 Z" fill="url(#flameTipGrad)" filter="url(#softGoldGlow)"/>
          </g>
        </g>

        <!-- RIGHT PAN -->
        <g id="rightPanAssembly" transform="translate(225, 0)">
          <line x1="0" y1="0" x2="-64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <line x1="0" y1="0" x2="64" y2="165" stroke="#ffe066" stroke-width="3.5"/>
          <path d="M -82 165 L 82 165 Q 0 215 -82 165 Z" fill="url(#goldMetal)" stroke="#071316" stroke-width="4.5"/>
        </g>
      </g>
    </g>

    <g id="particlesLayer"></g>

    <!-- SAFE-ZONE KEYWORDS -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-255" y="-48" width="510" height="82" rx="22" fill="#18060c" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="45" font-weight="900" letter-spacing="1">अधर्म? 🔥</text>
      </g>
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-315" y="-44" width="630" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="39" font-weight="900" letter-spacing="0.8">प्राण देना क्या अधर्म? ⚖️</text>
      </g>
    </g>
  </g>

  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const tiltingScaleBeam = document.getElementById('tiltingScaleBeam');
      const leftPanAssembly = document.getElementById('leftPanAssembly');
      const rightPanAssembly = document.getElementById('rightPanAssembly');
      const cargoFlameL = document.getElementById('cargoFlameL');
      const cargoFlameC = document.getElementById('cargoFlameC');
      const cargoFlameR = document.getElementById('cargoFlameR');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ff6b1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        let bassPulse = 0;
        if (t >= 0.20 && t <= 0.42) {
          const bp = (t - 0.20) / 0.22;
          bassPulse = Math.sin(bp * Math.PI * 3) * (1 - bp) * 0.035;
        }

        const camScale = 1 + easeOutCubic(t) * 0.06 + bassPulse;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);
        bgMandala.setAttribute('transform', `translate(505, 740) rotate(${(t * 34).toFixed(1)})`);

        const tipProg = easeOutCubic(Math.min(1, t / 0.42));
        const beamAngle = tipProg * 14;
        tiltingScaleBeam.setAttribute('transform', `translate(0, -215) rotate(${beamAngle.toFixed(2)})`);
        leftPanAssembly.setAttribute('transform', `translate(-225, 0) rotate(${(-beamAngle).toFixed(2)})`);
        rightPanAssembly.setAttribute('transform', `translate(225, 0) rotate(${(-beamAngle).toFixed(2)})`);

        const fScaleL = 0.85 + Math.sin(t * Math.PI * 10) * 0.22;
        const fScaleC = 0.85 + Math.cos(t * Math.PI * 12) * 0.25;
        const fScaleR = 0.85 + Math.sin(t * Math.PI * 9 + 1) * 0.22;
        cargoFlameL.setAttribute('transform', `translate(-30, -20) scale(1, ${fScaleL.toFixed(2)}) translate(30, 20)`);
        cargoFlameC.setAttribute('transform', `translate(0, -56) scale(1, ${fScaleC.toFixed(2)}) translate(0, 56)`);
        cargoFlameR.setAttribute('transform', `translate(30, -26) scale(1, ${fScaleR.toFixed(2)}) translate(-30, 26)`);

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
