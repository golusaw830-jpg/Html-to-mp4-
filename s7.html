  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s matching Scene 7 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const sudarshanChakraGroup = document.getElementById('sudarshanChakraGroup');
      const sudarshanWheelSpin = document.getElementById('sudarshanWheelSpin');
      const sudarshanHaloOrb = document.getElementById('sudarshanHaloOrb');
      const chakraSerratedBlades = document.getElementById('chakraSerratedBlades');

      const extractionBeamGroup = document.getElementById('extractionBeamGroup');
      const extractionLaser = document.getElementById('extractionLaser');

      const ashwatthamaHeroGroup = document.getElementById('ashwatthamaHeroGroup');
      const headGroup = document.getElementById('headGroup');
      const hairStrandL = document.getElementById('hairStrandL');
      const hairStrandR = document.getElementById('hairStrandR');

      const extractShock1 = document.getElementById('extractShock1');
      const extractShock2 = document.getElementById('extractShock2');
      const extractedManiHero = document.getElementById('extractedManiHero');

      const burstSparksLayer = document.getElementById('burstSparksLayer');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 16 Serrated Golden Blades Around Sudarshan Chakra
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const blade = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        blade.setAttribute('d', 'M -16 -145 L 4 -195 L 22 -145 Z');
        blade.setAttribute('fill', 'url(#goldBright)');
        blade.setAttribute('stroke', '#240b03');
        blade.setAttribute('stroke-width', '2.5');
        blade.setAttribute('transform', `rotate(${angle})`);
        chakraSerratedBlades.appendChild(blade);
      }

      // 2. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 24 Bursting Extraction Sparks (Radiate outward when Mani separates at t=0.34)
      const burstSparks = [];
      for (let i = 0; i < 24; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', i % 2 === 0 ? '#ffffff' : '#ffe066');
        line.setAttribute('stroke-width', i % 3 === 0 ? '5' : '3');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('opacity', '0');
        burstSparksLayer.appendChild(line);

        const rad = ((i * 360) / 24) * (Math.PI / 180);
        burstSparks.push({
          el: line,
          rad,
          speed: 320 + (i % 5) * 85,
          len: 26 + (i % 4) * 10
        });
      }

      // 4. Generate 28 Rising Golden Energy Motes
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff9900');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Cinematic Camera Push-In + Micro Impact Shake on Extraction (t: 0.34 -> 0.44)
        let camScale = 1 + easeOutCubic(t) * 0.08;
        let shakeX = 0;
        let shakeY = 0;
        if (t >= 0.34 && t <= 0.44) {
          const sp = (t - 0.34) / 0.10;
          shakeX = Math.sin(sp * Math.PI * 10) * 14 * (1 - sp);
          shakeY = Math.cos(sp * Math.PI * 8) * 10 * (1 - sp);
        }
        cameraRig.setAttribute('transform', `translate(${(540 + shakeX).toFixed(1)}, ${(820 + shakeY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-540, -820)`);

        // 3. Sudarshan Chakra Rapid Spin & Descent Into Position (t: 0.0 -> 0.20)
        const chakraEntry = easeOutBack(Math.min(1, t / 0.20));
        const chakraY = 180 + chakraEntry * 115; // Settles at y=295
        sudarshanChakraGroup.setAttribute('transform', `translate(540, ${chakraY.toFixed(1)})`);
        sudarshanWheelSpin.setAttribute('transform', `rotate(${(t * 1080).toFixed(1)})`);
        sudarshanHaloOrb.setAttribute('r', (330 + Math.sin(t * Math.PI * 8) * 32).toFixed(1));

        // 4. Divine Extraction Beam & Rudra-Mani Separation from Forehead Socket!
        // Socket screen center is (540, 842) when ashwatthamaHeroGroup is at (540, 1060)
        let maniY = 842;
        let maniScale = 1.0;

        if (t < 0.18) {
          extractionBeamGroup.setAttribute('opacity', '0');
          extractShock1.setAttribute('opacity', '0');
          extractShock2.setAttribute('opacity', '0');
        } else if (t < 0.34) {
          // Beam locks onto forehead Mani (0.18 -> 0.34)
          const lockP = (t - 0.18) / 0.16;
          extractionBeamGroup.setAttribute('opacity', lockP.toFixed(2));
          extractionLaser.setAttribute('stroke-dashoffset', (-t * 500).toFixed(1));
          // Mani vibrates intensely before separation
          maniY = 842 + Math.sin(t * Math.PI * 48) * 4;
          maniScale = 1.0 + lockP * 0.25;
          extractShock1.setAttribute('opacity', '0');
          extractShock2.setAttribute('opacity', '0');
        } else {
          // Mani is extracted upward toward Sudarshan Chakra (0.34 -> 1.0)
          const extractP = easeInOutCubic(Math.min(1, (t - 0.34) / 0.46));
          maniY = 842 - extractP * 285; // Lifts from y=842 up to y=557
          maniScale = 1.25 + extractP * 0.35 + Math.sin(t * Math.PI * 8) * 0.06;

          extractionBeamGroup.setAttribute('opacity', (0.75 + 0.25 * Math.sin(t * Math.PI * 10)).toFixed(2));
          extractionLaser.setAttribute('stroke-dashoffset', (-t * 500).toFixed(1));

          // Expanding Shockwave Rings on Extraction Moment (0.34 -> 0.68)
          if (t <= 0.68) {
            const sw1 = (t - 0.34) / 0.34;
            extractShock1.setAttribute('r', (45 + easeOutCubic(sw1) * 280).toFixed(1));
            extractShock1.setAttribute('opacity', ((1 - sw1) * 0.92).toFixed(2));

            const sw2 = Math.max(0, (t - 0.40) / 0.28);
            extractShock2.setAttribute('r', (45 + easeOutCubic(sw2) * 230).toFixed(1));
            extractShock2.setAttribute('opacity', (sw2 > 0 ? (1 - sw2) * 0.85 : 0).toFixed(2));
          } else {
            extractShock1.setAttribute('opacity', '0');
            extractShock2.setAttribute('opacity', '0');
          }
        }

        extractedManiHero.setAttribute('transform', `translate(540, ${maniY.toFixed(1)}) scale(${maniScale.toFixed(3)})`);

        // 5. Bursting Extraction Sparks at Forehead Socket (t: 0.34 -> 0.72)
        for (let i = 0; i < burstSparks.length; i++) {
          const bs = burstSparks[i];
          if (t >= 0.34 && t <= 0.72) {
            const dt = (t - 0.34) * 5;
            const prog = (t - 0.34) / 0.38;
            const dist = bs.speed * easeOutCubic(prog);
            const x1 = 540 + Math.cos(bs.rad) * dist;
            const y1 = 842 + Math.sin(bs.rad) * dist;
            const x2 = x1 + Math.cos(bs.rad) * bs.len * (1 - prog * 0.5);
            const y2 = y1 + Math.sin(bs.rad) * bs.len * (1 - prog * 0.5);
            bs.el.setAttribute('x1', x1.toFixed(1));
            bs.el.setAttribute('y1', y1.toFixed(1));
            bs.el.setAttribute('x2', x2.toFixed(1));
            bs.el.setAttribute('y2', y2.toFixed(1));
            bs.el.setAttribute('opacity', (1 - prog).toFixed(2));
          } else {
            bs.el.setAttribute('opacity', '0');
          }
        }

        // 6. Ashwatthama Recoil & Agonized Reaction on Mani Extraction
        let recoilY = 1060;
        let headTilt = 0;
        if (t >= 0.34) {
          const rProg = Math.min(1, (t - 0.34) / 0.25);
          recoilY = 1060 + easeOutCubic(rProg) * 18 + Math.sin(t * Math.PI * 16) * 2.5;
          headTilt = easeOutCubic(rProg) * -3.5 + Math.sin(t * Math.PI * 20) * 1.1;
        }
        ashwatthamaHeroGroup.setAttribute('transform', `translate(540, ${recoilY.toFixed(1)})`);
        headGroup.setAttribute('transform', `rotate(${headTilt.toFixed(2)}, 0, 120)`);

        hairStrandL.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 5) * 4).toFixed(2)}, -215, -190)`);
        hairStrandR.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 5) * 4).toFixed(2)}, 215, -190)`);

        // 7. Rising Golden Energy Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 8. Safe-Zone Kinetic Hindi Keywords ("श्रीकृष्ण का दंड ⚡" & "मणि का निष्कासन 💎")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
