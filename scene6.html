        clods.push({
          el: rect,
          offsetX: -120 + (i * 17) % 240,
          speedY: 160 + (i % 5) * 45,
          phase: (i * 0.23) % 1
        });
      }

      // Generate 24 Floating Golden Sparkles
      const particles = [];
      for (let i = 0; i < 24; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 135 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Pushpaka Vimana Hovering in Twilight Clouds
        const vimanaY = 290 + Math.sin(t * Math.PI * 3) * 12;
        pushpakaVimana.setAttribute('transform', `translate(275, ${vimanaY.toFixed(1)})`);

        // 3. Uprooted Earth Slab + Full-Detail Mata Sita Rising Smoothly Upward (y: 1390 -> 1140)
        const liftProg = easeOutCubic(Math.min(1, t / 0.72));
        const slabY = 1390 - liftProg * 250 + Math.sin(t * Math.PI * 4) * 6;
        const slabTilt = -2 + Math.sin(t * Math.PI * 3) * 1.5;
        uprootedEarthGroup.setAttribute('transform', `translate(315, ${slabY.toFixed(1)}) rotate(${slabTilt.toFixed(2)})`);

        // Mata Sita Mandala Rotation & Gentle Hair Braid Sway
        sitaMandala.setAttribute('transform', `translate(0, -255) rotate(${(t * 48).toFixed(2)})`);
        sitaBraid.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 2.5).toFixed(2)}, -35, -260)`);

        // 4. Ravana's Sword Arm Pivoting Upward in Sync with the Earth Slab!
        const armAngle = liftProg * 22 + Math.sin(t * Math.PI * 4) * 0.8;
        swordLiftArmRig.setAttribute('transform', `rotate(${armAngle.toFixed(2)}, -95, -290)`);

        const sparkScale = 0.8 + 0.35 * Math.sin(t * Math.PI * 10);
        swordTipSpark.setAttribute('transform', `translate(-365, 308) scale(${sparkScale.toFixed(2)}) translate(365, -308)`);

        // 5. Falling Earth Clods & Pebbles Below Rising Slab
        for (let i = 0; i < clods.length; i++) {
          const cl = clods[i];
          const p = (cl.phase + t * 1.6) % 1;
          const x = 315 + cl.offsetX;
          const y = slabY + 90 + p * cl.speedY * 1.4;
          cl.el.setAttribute('x', x.toFixed(1));
          cl.el.setAttribute('y', y.toFixed(1));
          cl.el.setAttribute('opacity', ((1 - p) * 0.85).toFixed(2));
        }

        // 6. Floating Golden Sparkles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("पृथ्वी समेत हरण 🌍" & "मायावी चाल ⚔️")
        if (t >= 0.18) {
          const p1 = Math.min(1, (t - 0.18) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
