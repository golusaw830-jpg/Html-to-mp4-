<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwatthama Mani - Scene 6: 4 Superhuman Raksha-Kavach Shields (4.5s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #070310;
  }
</style>
</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 6 (00:23.5 – 00:28.0 = 4.5 SECONDS EXACT)
  Voiceover: "...जिसकी शक्ति से उसे न कभी भूख-प्यास लगती थी, न कोई विष या देवता उसे हरा सकता था!"
  Visual Blueprint:
  - Central locked Rudra-Mani gem (exact faceted crimson-gold design from Scenes 1, 2, 4 & 5)
    encased inside a radiant golden spherical protective energy barrier.
  - Surrounding the Mani in cardinal/quadrant positions: 4 glowing Raksha-Kavach medallions:
    1. अभय (Fearless)   2. अमर-ऊर्जा (No Hunger/Thirst)   3. विष-नाशक (Anti-Venom)   4. अजेय (Invincible)
  - Incoming arrows and divine astras streak toward the Mani and disintegrate into golden sparks upon hitting the outer shield!
  - Safe-Zone Compliant Kinetic Hindi Keywords ("अजेय रक्षा-कवच 🛡️" & "भूख-प्यास व विष से मुक्त ⚡") with zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. CONSISTENT COSMIC VOID BACKDROP (Matches Scenes 1-5) -->
    <radialGradient id="cosmicVoidBg" cx="50%" cy="44%" r="76%">
      <stop offset="0%" stop-color="#2c0f4a"/>
      <stop offset="46%" stop-color="#120624"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>

    <!-- Radiant Golden Protective Barrier Aura -->
    <radialGradient id="shieldDomeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="28%" stop-color="#ffe57f" stop-opacity="0.62"/>
      <stop offset="68%" stop-color="#ff8c00" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#120624" stop-opacity="0"/>
    </radialGradient>

    <!-- Locked Rudra-Mani Gem Core Gradient (Exact Match with Scenes 1-5) -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD & MEDALLION GRADIENTS -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="medallionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0c3b"/>
      <stop offset="55%" stop-color="#160624"/>
      <stop offset="100%" stop-color="#090212"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 840) scale(1) translate(-540, -840)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicVoidBg)"/>
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Cosmic Starfield -->
    <g id="cosmicStarsLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 2: CENTRAL RAKSHA-KAVACH SPHERE & LOCKED RUDRA-MANI -->
    <!-- ========================================================= -->
    <g id="kavachFortressGroup" transform="translate(540, 820)">
      <!-- Expansive Protective Energy Aura -->
      <circle id="fortressAura" cx="0" cy="0" r="460" fill="url(#shieldDomeAura)" opacity="0.85"/>

      <!-- Outer Protective Energy Barrier Ring (Arrows Shatter Against This Perimeter r=370) -->
      <g id="outerBarrierDome">
        <circle cx="0" cy="0" r="370" fill="#ffe066" fill-opacity="0.06" stroke="url(#goldBright)" stroke-width="8" filter="url(#superGlow)"/>
        <circle id="barrierDashRing" cx="0" cy="0" r="348" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="24 14" opacity="0.82"/>
      </g>

      <!-- Counter-Rotating Geometric Shield Yantra -->
      <g id="innerShieldYantra" opacity="0.62">
        <polygon points="0,-245 212,122 -212,122" fill="none" stroke="url(#goldMetal)" stroke-width="3.5"/>
        <polygon points="0,245 212,-122 -212,-122" fill="none" stroke="url(#goldMetal)" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="185" fill="none" stroke="#ffe066" stroke-width="2" stroke-dasharray="12 8"/>
      </g>

      <!-- CENTER FOCAL POINT: LOCKED RUDRA-MANI GEM (Exact Match with Scenes 1-5) -->
      <g id="centralManiCore">
        <polygon points="0,-105 91,-52.5 91,52.5 0,105 -91,52.5 -91,-52.5" fill="#22050a" stroke="url(#goldBright)" stroke-width="6"/>
        <g id="maniGemHeartbeat" filter="url(#superGlow)">
          <ellipse cx="0" cy="0" rx="52" ry="72" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="4"/>
          <polygon points="0,-50 31,0 0,50 -31,0" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.88"/>
          <circle cx="-14" cy="-22" r="11" fill="#ffffff"/>
        </g>
      </g>

      <!-- ======================================================= -->
      <!-- 4 GLOWING RAKSHA-KAVACH SHIELDS AROUND THE RUDRA-MANI   -->
      <!-- ======================================================= -->
      <!-- SHIELD 1 (TOP-LEFT): अभय (FEARLESS) -->
      <g id="shieldNode1" transform="translate(-255, -245)" opacity="0">
        <circle cx="0" cy="0" r="102" fill="url(#medallionBg)" stroke="url(#goldBright)" stroke-width="5.5" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="88" fill="none" stroke="#ffe066" stroke-width="1.8" stroke-dasharray="10 6"/>
        <!-- Lion / Flame Fearless Crest -->
        <path d="M 0 -54 C 18 -34, 24 -12, 12 4 C 5 12, -5 12, -12 4 C -24 -12, -18 -34, 0 -54 Z" fill="url(#goldBright)"/>
        <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="900">अभय</text>
        <text x="0" y="68" text-anchor="middle" fill="#ffe066" font-size="18" font-weight="800">निडर शक्ति</text>
      </g>

      <!-- SHIELD 2 (TOP-RIGHT): अमर-ऊर्जा (NO HUNGER / THIRST) -->
      <g id="shieldNode2" transform="translate(255, -245)" opacity="0">
        <circle cx="0" cy="0" r="102" fill="url(#medallionBg)" stroke="url(#goldBright)" stroke-width="5.5" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="88" fill="none" stroke="#ffe066" stroke-width="1.8" stroke-dasharray="10 6"/>
        <!-- Radiant Sun / Prana Orb Icon -->
        <circle cx="0" cy="-22" r="18" fill="url(#goldBright)"/>
        <circle cx="0" cy="-22" r="28" fill="none" stroke="#fff7c2" stroke-width="2.5" stroke-dasharray="6 6"/>
        <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="900">अमर-ऊर्जा</text>
        <text x="0" y="68" text-anchor="middle" fill="#ffe066" font-size="18" font-weight="800">भूख-प्यास मुक्त</text>
      </g>

      <!-- SHIELD 3 (BOTTOM-LEFT): विष-नाशक (ANTI-VENOM) -->
      <g id="shieldNode3" transform="translate(-255, 245)" opacity="0">
        <circle cx="0" cy="0" r="102" fill="url(#medallionBg)" stroke="url(#goldBright)" stroke-width="5.5" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="88" fill="none" stroke="#ffe066" stroke-width="1.8" stroke-dasharray="10 6"/>
        <!-- Sacred Lotus / Amrita Drop Icon -->
        <path d="M 0 -52 C 18 -26, 22 -6, 0 8 C -22 -6, -18 -26, 0 -52 Z" fill="#7dd3fc" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="900">विष-नाशक</text>
        <text x="0" y="68" text-anchor="middle" fill="#ffe066" font-size="18" font-weight="800">विष भी निष्प्रभावी</text>
      </g>

      <!-- SHIELD 4 (BOTTOM-RIGHT): अजेय (INVINCIBLE AGAINST GODS & WEAPONS) -->
      <g id="shieldNode4" transform="translate(255, 245)" opacity="0">
        <circle cx="0" cy="0" r="102" fill="url(#medallionBg)" stroke="url(#goldBright)" stroke-width="5.5" filter="url(#softGoldGlow)"/>
        <circle cx="0" cy="0" r="88" fill="none" stroke="#ffe066" stroke-width="1.8" stroke-dasharray="10 6"/>
        <!-- Divine Vajra / Shield Emblem -->
        <path d="M -22 -44 L 22 -44 L 22 -14 C 22 4, 0 16, 0 16 C 0 16, -22 4, -22 -14 Z" fill="url(#goldBright)"/>
        <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="900">अजेय</text>
        <text x="0" y="68" text-anchor="middle" fill="#ffe066" font-size="18" font-weight="800">अस्त्र-शस्त्र अजेय</text>
      </g>

      <!-- ======================================================= -->
      <!-- INCOMING ARROWS & DIVINE ASTRAS SHATTERING ON BARRIER   -->
      <!-- ======================================================= -->
      <g id="incomingWeaponsLayer" filter="url(#superGlow)"></g>
      <g id="impactSparksLayer" filter="url(#superGlow)"></g>
    </g>

    <!-- Floating Golden Energy Motes -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 3: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: अजेय रक्षा-कवच -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-315" y="-56" width="630" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="52" font-weight="900" letter-spacing="1">अजेय रक्षा-कवच 🛡️</text>
      </g>

      <!-- Keyword 2: भूख-प्यास व विष से मुक्त -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-355" y="-50" width="710" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="43" font-weight="900" letter-spacing="0.8">भूख-प्यास व विष से मुक्त ⚡</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 4.5-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4500; // Exact 4.5s matching Scene 6 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const fortressAura = document.getElementById('fortressAura');
      const barrierDashRing = document.getElementById('barrierDashRing');
      const innerShieldYantra = document.getElementById('innerShieldYantra');
      const maniGemHeartbeat = document.getElementById('maniGemHeartbeat');

      const shieldNodes = [
        { el: document.getElementById('shieldNode1'), x: -255, y: -245, delay: 0.12 },
        { el: document.getElementById('shieldNode2'), x:  255, y: -245, delay: 0.22 },
        { el: document.getElementById('shieldNode3'), x: -255, y:  245, delay: 0.32 },
        { el: document.getElementById('shieldNode4'), x:  255, y:  245, delay: 0.42 }
      ];

      const incomingWeaponsLayer = document.getElementById('incomingWeaponsLayer');
      const impactSparksLayer = document.getElementById('impactSparksLayer');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 36 Cosmic Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 2. Generate 8 Incoming Fiery Arrows / Astras That Strike r=370 Barrier and Shatter!
      const attackAngles = [-165, -90, -15, 15, 90, 165, -130, -50];
      const weapons = [];
      for (let i = 0; i < attackAngles.length; i++) {
        const deg = attackAngles[i];
        const rad = (deg * Math.PI) / 180;

        // Arrow Group
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '-95');
        line.setAttribute('y1', '0');
        line.setAttribute('x2', '0');
        line.setAttribute('y2', '0');
        line.setAttribute('stroke', i % 2 === 0 ? '#ff6a00' : '#ff2a4b');
        line.setAttribute('stroke-width', '7');
        line.setAttribute('stroke-linecap', 'round');
        g.appendChild(line);

        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        tip.setAttribute('points', '12,0 -14,-10 -8,0 -14,10');
        tip.setAttribute('fill', '#ffffff');
        g.appendChild(tip);
        incomingWeaponsLayer.appendChild(g);

        // Impact Burst Ring & Sparks at r=370 Barrier Perimeter
        const impactX = Math.cos(rad) * 370;
        const impactY = Math.sin(rad) * 370;
        const burst = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        burst.setAttribute('cx', impactX.toFixed(1));
        burst.setAttribute('cy', impactY.toFixed(1));
        burst.setAttribute('r', '10');
        burst.setAttribute('fill', 'none');
        burst.setAttribute('stroke', '#fff7c2');
        burst.setAttribute('stroke-width', '6');
        burst.setAttribute('opacity', '0');
        impactSparksLayer.appendChild(burst);

        const flash = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        flash.setAttribute('cx', impactX.toFixed(1));
        flash.setAttribute('cy', impactY.toFixed(1));
        flash.setAttribute('r', '18');
        flash.setAttribute('fill', '#ffffff');
        flash.setAttribute('opacity', '0');
        impactSparksLayer.appendChild(flash);

        weapons.push({
          g,
          burst,
          flash,
          deg,
          rad,
          cycleOffset: (i * 0.37) % 1
        });
      }

      // 3. Generate 28 Rising Golden Energy Motes
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff8c1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.5s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Camera Push-In (1.0 -> 1.08)
        const camScale = 1 + easeOutCubic(t) * 0.08;
        cameraRig.setAttribute('transform', `translate(540, 840) scale(${camScale.toFixed(4)}) translate(-540, -840)`);

        // 3. Central Fortress Barrier Rotation & Rudra-Mani Heartbeat
        barrierDashRing.setAttribute('transform', `rotate(${(t * 48).toFixed(1)})`);
        innerShieldYantra.setAttribute('transform', `rotate(${(-t * 36).toFixed(1)})`);
        fortressAura.setAttribute('r', (445 + Math.sin(t * Math.PI * 6) * 35).toFixed(1));

        const beat = 1 + Math.abs(Math.sin(t * Math.PI * 6)) * 0.16;
        maniGemHeartbeat.setAttribute('transform', `scale(${beat.toFixed(3)})`);

        // 4. Staggered Pop-In of the 4 Raksha-Kavach Shield Medallions
        for (let i = 0; i < shieldNodes.length; i++) {
          const sn = shieldNodes[i];
          if (t >= sn.delay) {
            const p = Math.min(1, (t - sn.delay) / 0.14);
            const s = 0.65 + 0.35 * easeOutBack(p);
            const bob = Math.sin((t - sn.delay) * Math.PI * 4 + i) * 5;
            sn.el.setAttribute('opacity', easeOutCubic(p).toFixed(2));
            sn.el.setAttribute('transform', `translate(${sn.x}, ${(sn.y + bob).toFixed(1)}) scale(${s.toFixed(3)})`);
          } else {
            sn.el.setAttribute('opacity', '0');
          }
        }

        // 5. Incoming Arrows/Astras Striking r=370 Barrier and Disintegrating into Golden Sparks!
        for (let i = 0; i < weapons.length; i++) {
          const w = weapons[i];
          const cyc = (t * 2.2 + w.cycleOffset) % 1;
          if (cyc < 0.52) {
            // Arrow flying inward from r=760 -> r=370
            const flyP = cyc / 0.52;
            const r = 760 - flyP * 390;
            const x = Math.cos(w.rad) * r;
            const y = Math.sin(w.rad) * r;
            const angleTowardCenter = w.deg + 180;
            w.g.setAttribute('opacity', Math.min(1, flyP * 3).toFixed(2));
            w.g.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleTowardCenter.toFixed(1)})`);
            w.burst.setAttribute('opacity', '0');
            w.flash.setAttribute('opacity', '0');
          } else {
            // Arrow shatters upon hitting the barrier (0.52 -> 1.0)
            const hitP = (cyc - 0.52) / 0.48;
            w.g.setAttribute('opacity', '0');
            w.burst.setAttribute('r', (12 + easeOutCubic(hitP) * 75).toFixed(1));
            w.burst.setAttribute('opacity', ((1 - hitP) * 0.92).toFixed(2));
            w.flash.setAttribute('r', (24 * (1 - hitP)).toFixed(1));
            w.flash.setAttribute('opacity', ((1 - hitP) * 0.95).toFixed(2));
          }
        }

        // 6. Rising Golden Energy Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 4.5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("अजेय रक्षा-कवच 🛡️" & "भूख-प्यास व विष से मुक्त ⚡")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.13);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.46) {
          const p2 = Math.min(1, (t - 0.46) / 0.13);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
