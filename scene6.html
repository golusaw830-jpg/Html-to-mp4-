</head>
<body>

<!--

  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">

  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->

    <!-- LAYER 1: LANKA ROYAL PALACE CHAMBER -->

    <!-- ========================================================= -->

    <!-- ========================================================= -->

    <!-- ========================================================= -->

        <circle cx="0" cy="-138" r="8" fill="#0d9488" stroke="url(#goldBright)" stroke-width="2.5"/>
        <path d="M -52 -86 Q 0 -100 52 -86 L 50 -74 Q 0 -86 -50 -74 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>

        <path d="M -48 -76 L 48 -76 L 56 -32 L 48 6 L 22 34 C 8 46, -16 44, -32 28 L -48 -18 Z"
              fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>

        <polygon points="-44,-18 -50,2 -44,10 -38,2" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
        <line x1="-10" y1="-64" x2="36" y2="-64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

        <path d="M -12 -46 L 34 -42" stroke="#0f1115" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Rising Golden Chamber Embers -->

    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: माँ मंदोदरी का स्नेह -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-315" y="-48" width="630" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="43" font-weight="900" letter-spacing="1">माँ मंदोदरी का स्नेह 🪔</text>

      <!-- Keyword 2: पुत्र का कर्तव्य -->

        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">पुत्र का कर्तव्य 🛡️</text>

  <!-- DETERMINISTIC 5.0-SECOND STORY & TEARDROP MOTION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const maternalHalo = document.getElementById('maternalHalo');
      const queenMandala = document.getElementById('queenMandala');
      const mandodariHeroGroup = document.getElementById('mandodariHeroGroup');
      const goldenTeardrop = document.getElementById('goldenTeardrop');

      const reassureHandRig = document.getElementById('reassureHandRig');
      const meghnadProfileHead = document.getElementById('meghnadProfileHead');
      const hairBack = document.getElementById('hairBack');
      const mouthCavity = document.getElementById('mouthCavity');
      const upperLip = document.getElementById('upperLip');
      const lowerLip = document.getElementById('lowerLip');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#fb923c');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      // Syllable-driven Lip-Sync for "तो ए-क पु-त्र हो-ने के ना-ते मै-ं अ-प-नी माँ मं-दो-द-री..."
      const syllableCenters = [0.06, 0.13, 0.20, 0.27, 0.35, 0.43, 0.51, 0.59, 0.67, 0.75, 0.83, 0.91];
      function getSpeechOpenness(t) {
        let open = 0;
        for (let i = 0; i < syllableCenters.length; i++) {
          const dist = (t - syllableCenters[i]) / 0.028;
          const amp = (i === 2 || i === 5 || i === 8 || i === 10) ? 1.0 : 0.72;
          open += amp * Math.exp(-dist * dist);
        }
        return Math.min(1.0, open);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 1. Safe-Zone Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);
        maternalHalo.setAttribute('r', (310 + Math.sin(t * Math.PI * 4) * 22).toFixed(1));
        queenMandala.setAttribute('transform', `translate(0, -145) rotate(${(t * 36).toFixed(1)})`);

        // 2. Queen Mandodari Gentle Breathing & Slow-Motion Golden Teardrop Falling
        const queenBreath = 865 + Math.sin(t * Math.PI * 3) * 4;
        mandodariHeroGroup.setAttribute('transform', `translate(675, ${queenBreath.toFixed(1)})`);

        // Teardrop forms at eye (-26, -210) and falls slowly down to (-26, -110) with glowing trail
        const dropProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.15) / 0.75)));
        const tearY = -210 + dropProg * 95;
        const tearScale = 0.75 + Math.sin(dropProg * Math.PI) * 0.45;
        goldenTeardrop.setAttribute('transform', `translate(-26, ${tearY.toFixed(1)}) scale(${tearScale.toFixed(2)})`);
        goldenTeardrop.setAttribute('opacity', (t >= 0.15 ? 0.95 : 0).toFixed(2));

        // 3. Meghnad Reassuring Hand & Tender Head Nod + Lip-Sync
        const handWave = Math.sin(t * Math.PI * 4) * 3.5;
        reassureHandRig.setAttribute('transform', `translate(42, -95) rotate(${handWave.toFixed(2)})`);

        const headNod = Math.sin(t * Math.PI * 3) * 1.8;
        meghnadProfileHead.setAttribute('transform', `translate(12, -175) rotate(${headNod.toFixed(2)})`);
        hairBack.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3).toFixed(2)}, -45, -245)`);

        const mouthOpen = getSpeechOpenness(t);
        const jawDrop = mouthOpen * 6.5;
        mouthCavity.setAttribute('ry', (1.5 + mouthOpen * 5.0).toFixed(1));
        upperLip.setAttribute('transform', `translate(0, ${(-mouthOpen * 1.2).toFixed(1)})`);
        lowerLip.setAttribute('transform', `translate(0, ${jawDrop.toFixed(1)})`);

        // 4. Rising Golden Embers
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Safe-Zone Kinetic Hindi Keywords ("माँ मंदोदरी का स्नेह 🪔" & "पुत्र का कर्तव्य 🛡️")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
