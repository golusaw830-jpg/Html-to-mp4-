<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 3 - Clip 10: Nalakubara's Curse Condition (5.0s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #05020c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #090314;
  }
</style>
</head>
<body>

<!-- 
  PART 3 - CLIP 10 (5.0 SECONDS EXACT) — HIGH-DETAIL VERSION
  Voiceover: "जहाँ नलकुबेर के श्राप की शर्त केवल 'छूने' की नहीं थी!"
  Blueprint Visual: "नलकुबेर द्वारा जल हाथ में लेकर दिए गए श्राप का प्रतीक यंत्र—जहाँ 'स्पर्श' नहीं बल्कि 'मर्यादा की सीमा' चमकती है। कीवर्ड्स: 'नलकुबेर का श्राप', 'असली शर्त'।"
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. BACKGROUND: Celestial Alakapuri Night Sky (Deep Indigo & Royal Violet) -->
    <radialGradient id="alakapuriSky" cx="50%" cy="38%" r="76%">
      <stop offset="0%" stop-color="#351452"/>
      <stop offset="48%" stop-color="#160729"/>
      <stop offset="100%" stop-color="#05020d"/>
    </radialGradient>

    <!-- Sacred Water & Yantra Golden Halo -->
    <radialGradient id="yantraGoldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="32%" stop-color="#ffe066" stop-opacity="0.56"/>
      <stop offset="70%" stop-color="#ff8c00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#160729" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Sacred Water Stream Gradient -->
    <linearGradient id="sacredWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- 2. LORD NALAKUBARA & GOLD PALETTES -->
    <linearGradient id="nalakubaraSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="55%" stop-color="#e39f5c"/>
      <stop offset="100%" stop-color="#ad672a"/>
    </linearGradient>

    <linearGradient id="royalIndigoSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7bd"/>
      <stop offset="42%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#8c4804"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: ALAKAPURI CELESTIAL NIGHT & PALACE ARCHES -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#alakapuriSky)"/>

    <!-- Sacred Vedic Frame Filigree -->
    <g opacity="0.28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Alakapuri Palace Pillars & Terrace Horizon -->
    <g opacity="0.45" fill="#0d041a">
      <rect x="75" y="140" width="58" height="1360"/>
      <rect x="947" y="140" width="58" height="1360"/>
      <path d="M 75 310 Q 540 160 1005 310 L 1005 140 L 75 140 Z"/>
    </g>
    <path d="M -60 1490 Q 540 1445 1140 1490 L 1140 2000 L -60 2000 Z" fill="#090312"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: TOP — LORD NALAKUBARA POURING SACRED CURSE WATER -->
    <!-- ========================================================= -->
    <g id="nalakubaraTopGroup" transform="translate(540, 445)">
      <circle cx="0" cy="-30" r="270" fill="url(#yantraGoldHalo)" opacity="0.55"/>

      <!-- Flowing Celestial Uttariya Scarf -->
      <path d="M -95 -40 C -165 15, -185 95, -145 165 C -125 110, -105 55, -75 10 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <path d="M 95 -40 C 165 15, 185 95, 145 165 C 125 110, 105 55, 75 10 Z" fill="url(#goldGrad)" opacity="0.85"/>

      <!-- Royal Torso & Gold Armor/Ornaments -->
      <path d="M -88 -55 C -35 -80, 35 -80, 88 -55 L 72 125 L -72 125 Z" fill="url(#nalakubaraSkin)" stroke="#1a0903" stroke-width="5" stroke-linejoin="round"/>
      <!-- Sacred White Janeu & Yaksha Royal Necklaces -->
      <path d="M -66 -56 C -20 25, 25 85, 68 120" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M -52 -56 Q 0 0 52 -56" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="0" cy="-22" r="12" fill="#0284c7" stroke="url(#goldGrad)" stroke-width="3.5"/>

      <!-- Ornate Celestial Crown & Fierce Righteous Face -->
      <path d="M -38 -155 L -26 -225 L 0 -258 L 26 -225 L 38 -155 Z" fill="url(#goldGrad)" stroke="#1a0903" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M -46 -155 Q 0 -168 46 -155 L 42 -140 Q 0 -152 -42 -140 Z" fill="url(#goldGrad)" stroke="#1a0903" stroke-width="4"/>
      <circle cx="0" cy="-198" r="9" fill="#0284c7"/>

      <path d="M -44 -140 L 44 -140 L 38 -75 C 38 -48, 18 -34, 0 -34 C -18 -34, -38 -48, -38 -75 Z" fill="url(#nalakubaraSkin)" stroke="#1a0903" stroke-width="4.5"/>
      <!-- Tilak & Righteous Angry Eyebrows -->
      <line x1="0" y1="-134" x2="0" y2="-112" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-122" r="3.5" fill="#d91e18"/>
      <path d="M -28 -110 L -8 -102" stroke="#1a0903" stroke-width="5" stroke-linecap="round"/>
      <path d="M 28 -110 L 8 -102" stroke="#1a0903" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="-16" cy="-96" rx="8" ry="5" fill="#ffffff" stroke="#1a0903" stroke-width="2"/>
      <circle cx="-16" cy="-96" r="3.2" fill="#1e1b4b"/>
      <ellipse cx="16" cy="-96" rx="8" ry="5" fill="#ffffff" stroke="#1a0903" stroke-width="2"/>
      <circle cx="16" cy="-96" r="3.2" fill="#1e1b4b"/>
      <path d="M -14 -62 Q 0 -70 14 -62" fill="none" stroke="#1a0903" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cupped Hands Holding Sacred Curse Water in Front of Chest -->
      <path d="M -85 -35 C -115 20, -75 72, -18 76 L -12 45 C -46 42, -62 12, -48 -28 Z" fill="url(#nalakubaraSkin)" stroke="#1a0903" stroke-width="4.5"/>
      <path d="M 85 -35 C 115 20, 75 72, 18 76 L 12 45 C 46 42, 62 12, 48 -28 Z" fill="url(#nalakubaraSkin)" stroke="#1a0903" stroke-width="4.5"/>
      <!-- Cupped Palms & Glowing Sacred Water Orb -->
      <path d="M -32 58 Q 0 88 32 58 Z" fill="url(#nalakubaraSkin)" stroke="#1a0903" stroke-width="4"/>
      <ellipse id="waterOrb" cx="0" cy="52" rx="28" ry="14" fill="url(#sacredWaterGrad)" filter="url(#strongGlow)"/>
    </g>

    <!-- SACRED CURSE WATER STREAM POURING INTO THE YANTRA SEAL -->
    <g filter="url(#strongGlow)">
      <line id="waterStream" x1="540" y1="515" x2="540" y2="735" stroke="url(#sacredWaterGrad)" stroke-width="9" stroke-dasharray="26 14" stroke-linecap="round"/>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: CENTER HERO — NALAKUBARA'S CURSE CONDITION YANTRA -->
    <!-- ========================================================= -->
    <g id="curseYantraCenter" transform="translate(540, 1045)">
      <circle id="yantraAura" cx="0" cy="0" r="360" fill="url(#yantraGoldHalo)"/>

      <!-- Outer Rotating Sacred Vedic Yantra Wheel -->
      <g id="yantraOuterRing">
        <circle cx="0" cy="0" r="300" fill="#130624" fill-opacity="0.88" stroke="url(#goldGrad)" stroke-width="7"/>
        <circle cx="0" cy="0" r="272" fill="none" stroke="#ffe066" stroke-width="3" stroke-dasharray="18 10"/>
        <polygon points="0,-268 232,134 -232,134" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
        <polygon points="0,268 232,-134 -232,-134" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
      </g>

      <!-- TWO CONTRASTING SYMBOLS INSIDE THE YANTRA: -->
      <!-- 1. LEFT: CROSSED-OUT "स्पर्श" (MERE TOUCH IS NOT THE CONDITION) -->
      <g id="touchNegatedGroup" transform="translate(-115, 0)">
        <circle cx="0" cy="0" r="82" fill="#240814" stroke="#64748b" stroke-width="3.5"/>
        <!-- Hand Touch Icon -->
        <path d="M -14 25 L -14 -18 C -14 -24, -6 -24, -6 -18 L -6 2 L -2 -26 C -2 -32, 6 -32, 6 -26 L 6 2 L 10 -22 C 10 -28, 18 -28, 18 -22 L 18 18 C 18 32, -14 35, -14 25 Z" fill="#94a3b8"/>
        <text x="0" y="58" text-anchor="middle" fill="#cbd5e1" font-size="22" font-weight="800">केवल स्पर्श</text>
        <!-- Bold Crimson Cross-Out Slash ("X") -->
        <line x1="-54" y1="-54" x2="54" y2="54" stroke="#ef4444" stroke-width="11" stroke-linecap="round"/>
        <line x1="54" y1="-54" x2="-54" y2="54" stroke="#ef4444" stroke-width="11" stroke-linecap="round"/>
      </g>

      <!-- Center Vertical Divider -->
      <line x1="0" y1="-110" x2="0" y2="110" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.7"/>

      <!-- 2. RIGHT: BLAZING GOLDEN "मर्यादा की सीमा" (BOUNDARY OF CONSENT & DIGNITY) -->
      <g id="maryadaBoundaryGroup" transform="translate(115, 0)" filter="url(#softGoldGlow)">
        <circle id="maryadaPulseRing" cx="0" cy="0" r="86" fill="#2b1204" stroke="url(#goldBright)" stroke-width="6"/>
        <!-- Sacred Flame / Shield Boundary Emblem -->
        <path d="M 0 -46 C 26 -24, 34 6, 22 28 C 14 42, -14 42, -22 28 C -34 6, -26 -24, 0 -46 Z" fill="url(#goldBright)"/>
        <path d="M 0 -22 C 12 -10, 16 6, 10 18 C 6 26, -6 26, -10 18 C -16 6, -12 -10, 0 -22 Z" fill="#ffffff"/>
        <text x="0" y="64" text-anchor="middle" fill="#ffe066" font-size="22" font-weight="900">मर्यादा सीमा</text>
      </g>
    </g>

    <!-- Floating Golden Sparkles -->
    <g id="particlesLayer"></g>

    <!-- LAYER 4: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1625)">
      <!-- Keyword 1: नलकुबेर का श्राप -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-325" y="-58" width="650" height="96" rx="24" fill="#160726" fill-opacity="0.94" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="54" font-weight="900">नलकुबेर का श्राप ⚡</text>
      </g>

      <!-- Keyword 2: असली शर्त -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-250" y="-52" width="500" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900">असली शर्त 🔥</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const nalakubaraTopGroup = document.getElementById('nalakubaraTopGroup');
      const waterOrb = document.getElementById('waterOrb');
      const waterStream = document.getElementById('waterStream');
      const curseYantraCenter = document.getElementById('curseYantraCenter');
      const yantraOuterRing = document.getElementById('yantraOuterRing');
      const yantraAura = document.getElementById('yantraAura');
      const maryadaPulseRing = document.getElementById('maryadaPulseRing');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 28 Floating Golden & Celestial Blue Particles
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#7dd3fc' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 140 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Lord Nalakubara Top Entrance & Sacred Water Stream Flow
        const bobNala = 445 + Math.sin(t * Math.PI * 3) * 6;
        nalakubaraTopGroup.setAttribute('transform', `translate(540, ${bobNala.toFixed(1)})`);

        const orbRx = 26 + Math.sin(t * Math.PI * 8) * 4;
        waterOrb.setAttribute('rx', orbRx.toFixed(1));
        waterStream.setAttribute('stroke-dashoffset', (-t * 420).toFixed(1));

        // 3. Center Curse Condition Yantra Pop-In & Rotation
        const pYantra = Math.min(1, (t - 0.08) / 0.18);
        const sYantra = 0.75 + 0.25 * easeOutBack(Math.max(0, pYantra));
        curseYantraCenter.setAttribute('opacity', Math.min(1, Math.max(0, pYantra) * 2).toFixed(2));
        curseYantraCenter.setAttribute('transform', `translate(540, 1045) scale(${sYantra.toFixed(3)})`);

        yantraOuterRing.setAttribute('transform', `rotate(${(t * 45).toFixed(1)})`);
        yantraAura.setAttribute('r', (350 + Math.sin(t * Math.PI * 4) * 30).toFixed(1));

        // Blazing Golden Maryada Boundary Pulse
        const maryadaR = 84 + Math.sin(t * Math.PI * 6) * 6;
        maryadaPulseRing.setAttribute('r', maryadaR.toFixed(1));

        // 4. Floating Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 5. Kinetic Hindi Keywords ("नलकुबेर का श्राप ⚡" & "असली शर्त 🔥")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
