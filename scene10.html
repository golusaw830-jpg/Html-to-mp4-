<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>Ashwatthama Mani - Scene 1: The Visual Hook (4.5s)</title>

<style>

    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;

</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 1 (00:00 – 00:04.5 = 4.5 SECONDS EXACT)
  Voiceover: "अश्वत्थामा के माथे में जड़ी दिव्य मणि कोई साधारण रत्न नहीं थी..."
  Visual Blueprint:
  - Dark cosmic background (#040208 -> #1c082e) with rotating sacred Ajna/Rudra mandala geometry.
  - High-detail close-up hero portrait of Ashwatthama (locked character design for all 10 scenes:
    matted dark warrior locks with golden headband, fierce sculpted brow, Tripundra tilak, glowing golden-amber eyes,
    sacred white Brahmin janeu, and Kuru warrior armor/shawl).
  - Embedded in his forehead (Ajna Chakra): The legendary Rudra-Mani (Chintamani) beating like a living cosmic heart
    and emitting expanding golden energy shockwaves & neural light veins.
  - Safe-Zone Compliant Kinetic Hindi Keywords ("अश्वत्थामा की मणि 💎" & "साधारण रत्न नहीं... ⚡") with zero bottom overlap.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. DARK COSMIC BACKDROP & SACRED AURA GRADIENTS -->
    <radialGradient id="cosmicVoidBg" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#2b0d3d"/>

    <!-- Radiant Rudra-Mani Forehead Aura -->
    <radialGradient id="maniDivineAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="22%" stop-color="#ffe57f" stop-opacity="0.78"/>
      <stop offset="52%" stop-color="#ff5500" stop-opacity="0.38"/>
      <stop offset="82%" stop-color="#9e0b22" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#12051f" stop-opacity="0"/>

    <!-- Living Crimson-Gold Mani Gem Core Gradient -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. LOCKED ASHWATTHAMA CHARACTER PALETTE (Consistent Across All 10 Scenes) -->

      <stop offset="0%" stop-color="#d49363"/>
      <stop offset="52%" stop-color="#a6663b"/>
      <stop offset="100%" stop-color="#5e3218"/>
    </linearGradient>

    <linearGradient id="ashwaSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e3c1e"/>
      <stop offset="100%" stop-color="#2e1508"/>
    </linearGradient>

    <linearGradient id="ashwaHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261714"/>
      <stop offset="60%" stop-color="#120908"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>

    <linearGradient id="warriorCrimsonCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e1922"/>
      <stop offset="55%" stop-color="#590a12"/>
      <stop offset="100%" stop-color="#240307"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffbe2e"/>
      <stop offset="78%" stop-color="#b86b09"/>
      <stop offset="100%" stop-color="#5e3102"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="maniSuperGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Smooth Dramatic Push-In Toward Forehead Mani) -->
  <g id="cameraRig" transform="translate(540, 820) scale(1) translate(-540, -820)">

    <!-- LAYER 1: DARK COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicVoidBg)"/>

    <!-- Subtle Sacred Vedic Frame Border -->
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Cosmic Starfield & Dust Layer -->
    <g id="cosmicStarsLayer"></g>

    <!-- LAYER 2: MIDGROUND — ROTATING AJNA CHAKRA & RUDRA MANDALA BEHIND ASHWATTHAMA -->
    <g id="rudraMandalaGroup" transform="translate(540, 760)">
      <!-- Expansive Warm Aura Behind Head -->
      <circle id="bgAuraOrb" cx="0" cy="0" r="540" fill="url(#maniDivineAura)" opacity="0.72"/>

      <!-- Outer Sacred Ring -->
      <g id="outerMandalaRing" opacity="0.46">
        <circle cx="0" cy="0" r="470" fill="none" stroke="url(#goldMetal)" stroke-width="3.5" stroke-dasharray="24 12"/>
        <circle cx="0" cy="0" r="435" fill="none" stroke="#ffbe2e" stroke-width="1.8"/>
        <g id="mandalaPetals" stroke="url(#goldMetal)" stroke-width="2" fill="#ffbe2e" fill-opacity="0.06"></g>
      </g>

      <!-- Counter-Rotating Geometric Yantra -->
      <g id="innerMandalaRing" opacity="0.42">
        <polygon points="0,-390 338,195 -338,195" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
        <polygon points="0,390 338,-195 -338,-195" fill="none" stroke="url(#goldMetal)" stroke-width="3"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: FOREGROUND HERO — ASHWATTHAMA CLOSE-UP PORTRAIT  -->
    <!-- ========================================================= -->
    <g id="ashwatthamaHeroGroup" transform="translate(540, 960)">

      <!-- Flowing Matted Warrior Hair Locks (Jata) Behind Shoulders -->
      <g id="hairLocksGroup">
        <path d="M -185 -280 C -295 -160, -345 40, -285 260 C -250 140, -225 10, -165 -110 Z" fill="url(#ashwaHairGrad)" stroke="#050202" stroke-width="5"/>

        <path d="M 390 540 C 365 320, 260 225, 125 195 C 215 255, 285 370, 305 540 Z" fill="#170908" opacity="0.65"/>

        <!-- Crimson & Gold Warrior Shoulder Shawl (Left Shoulder Drape) -->

        <path d="M -275 255 C -185 350, -55 450, 75 540" fill="none" stroke="url(#goldMetal)" stroke-width="9"/>

        <!-- Sacred White Brahmin Thread (Janeu) Across Chest -->
        <path d="M -165 210 C -75 335, 35 445, 145 540" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
        <path d="M -165 210 C -75 335, 35 445, 145 540" fill="none" stroke="#ffe066" stroke-width="3.5" stroke-dasharray="12 8"/>

        <!-- Ornate Golden Warrior Pauldrons (Arm Guards) -->
        <path d="M -355 335 C -315 280, -245 270, -205 315 L -235 375 C -275 345, -325 355, -365 395 Z" fill="url(#goldMetal)" stroke="#140804" stroke-width="5"/>
        <path d="M 355 335 C 315 280, 245 270, 205 315 L 235 375 C 275 345, 325 355, 365 395 Z" fill="url(#goldMetal)" stroke="#140804" stroke-width="5"/>

        <!-- Rudraksha & Gold Kantha Necklace -->
        <path d="M -118 192 Q 0 285 118 192" fill="none" stroke="#3b1406" stroke-width="14" stroke-linecap="round"/>
        <path d="M -118 192 Q 0 285 118 192" fill="none" stroke="url(#goldMetal)" stroke-width="7" stroke-dasharray="8 12" stroke-linecap="round"/>
        <circle cx="0" cy="242" r="16" fill="#9e1116" stroke="url(#goldMetal)" stroke-width="4.5"/>

        <!-- Sculpted Muscular Neck -->
        <path d="M -88 85 L 88 85 L 105 205 L -105 205 Z" fill="url(#ashwaSkinShadow)" stroke="#140804" stroke-width="5"/>
      </g>

      <!-- ======================================================= -->
      <!-- HEAD, INTENSE FACE & EMBEDDED RUDRA-MANI (AJNA CHAKRA)  -->
      <!-- ======================================================= -->
      <g id="headAndManiGroup">
        <!-- Topknot Warrior Hair Bun (Jata Mukuta) -->
        <path d="M -92 -355 C -105 -465, 105 -465, 92 -355 Z" fill="url(#ashwaHairGrad)" stroke="#050202" stroke-width="5.5"/>
        <path d="M -88 -368 Q 0 -342 88 -368" fill="none" stroke="url(#goldMetal)" stroke-width="8"/>

        <!-- Sculpted Strong Jaw & Face -->
        <path d="M -182 -290 C -182 -365, 182 -365, 182 -290 L 168 -75 C 168 35, 82 112, 0 112 C -82 112, -168 35, -168 -75 Z" fill="url(#ashwaSkin)" stroke="#140804" stroke-width="6"/>

        <!-- Dramatic Rim Lighting from Forehead Mani onto Brow & Cheekbones -->
        <path d="M -145 -245 Q 0 -305 145 -245 Q 85 -175 0 -175 Q -85 -175 -145 -245 Z" fill="#ffbe2e" opacity="0.16"/>

        <!-- Ears & Heavy Gold Warrior Kundala Earrings -->
        <ellipse cx="-186" cy="-120" rx="20" ry="42" fill="url(#ashwaSkinShadow)" stroke="#140804" stroke-width="4.5"/>
        <ellipse cx="186" cy="-120" rx="20" ry="42" fill="url(#ashwaSkinShadow)" stroke="#140804" stroke-width="4.5"/>
        <circle cx="-188" cy="-65" r="22" fill="none" stroke="url(#goldMetal)" stroke-width="8"/>
        <circle cx="188" cy="-65" r="22" fill="none" stroke="url(#goldMetal)" stroke-width="8"/>

        <!-- Ornate Golden Warrior Headband (Patta) -->
        <path d="M -184 -285 Q 0 -322 184 -285 L 180 -252 Q 0 -288 -180 -252 Z" fill="url(#goldMetal)" stroke="#140804" stroke-width="5"/>
        <circle cx="-115" cy="-274" r="7" fill="#9e1116"/>
        <circle cx="115" cy="-274" r="7" fill="#9e1116"/>

        <!-- Sacred Shaivite Tripundra Tilak Framing the Mani -->
        <path d="M -105 -228 Q 0 -248 105 -228" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.88"/>
        <path d="M -92 -210 Q 0 -228 92 -210" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" opacity="0.88"/>

        <!-- Fierce Sculpted Eyebrows -->
        <path d="M -145 -178 L -42 -152" stroke="#120908" stroke-width="14" stroke-linecap="round"/>
        <path d="M 145 -178 L 42 -152" stroke="#120908" stroke-width="14" stroke-linecap="round"/>

        <!-- Intense Glowing Golden-Amber Warrior Eyes -->
        <g id="eyesGroup">
          <!-- Left Eye -->
          <path d="M -132 -136 Q -85 -162 -44 -134 Q -85 -114 -132 -136 Z" fill="#fff7d6" stroke="#120908" stroke-width="4"/>
          <circle cx="-86" cy="-136" r="14" fill="#b84a09"/>
          <circle cx="-86" cy="-136" r="6.5" fill="#120502"/>
          <circle cx="-90" cy="-140" r="3" fill="#ffffff"/>

          <!-- Right Eye -->
          <path d="M 132 -136 Q 85 -162 44 -134 Q 85 -114 132 -136 Z" fill="#fff7d6" stroke="#120908" stroke-width="4"/>
          <circle cx="86" cy="-136" r="14" fill="#b84a09"/>
          <circle cx="86" cy="-136" r="6.5" fill="#120502"/>
          <circle cx="82" cy="-140" r="3" fill="#ffffff"/>
        </g>

        <!-- Sculpted Nose Bridge -->
        <path d="M 0 -145 L -14 -55 L 14 -50" fill="none" stroke="#4a2410" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Fierce Warrior Mustache & Trimmed Beard -->
        <path d="M 0 -24 C -48 -36, -98 -18, -118 12 C -84 2, -42 -4, 0 -10 C 42 -4, 84 2, 118 12 C 98 -18, 48 -36, 0 -24 Z" fill="url(#ashwaHairGrad)" stroke="#050202" stroke-width="3.5"/>
        <path d="M -162 -65 C -162 55, -78 124, 0 128 C 78 124, 162 55, 162 -65 C 138 15, 78 52, 0 52 C -78 52, -138 15, -162 -65 Z" fill="url(#ashwaHairGrad)" stroke="#050202" stroke-width="4.5"/>
        <!-- Determined Warrior Mouth -->
        <path d="M -38 22 Q 0 12 38 22" fill="none" stroke="#c98557" stroke-width="4.5" stroke-linecap="round"/>

        <!-- ===================================================== -->
        <!-- HERO FOCAL POINT: LIVING RUDRA-MANI ON FOREHEAD       -->
        <!-- (At Local Coordinates 0, -218 -> Screen 540, 742)     -->
        <!-- ===================================================== -->
        <g id="foreheadManiHero" transform="translate(0, -218)">
          <!-- Expanding Golden Energy Shockwave Rings Emitted by the Mani -->
          <circle id="maniWave1" cx="0" cy="0" r="45" fill="none" stroke="#fff7c2" stroke-width="7" opacity="0"/>
          <circle id="maniWave2" cx="0" cy="0" r="45" fill="none" stroke="#ffbe2e" stroke-width="5" opacity="0"/>
          <circle id="maniWave3" cx="0" cy="0" r="45" fill="none" stroke="#ff5500" stroke-width="4" opacity="0"/>

          <!-- Glowing Neural Energy Veins Radiating Into Temple & Brow -->
          <g id="neuralVeins" stroke="#ffe066" stroke-width="2.8" fill="none" opacity="0.78" filter="url(#softGoldGlow)">
            <polyline points="-28,-8 -68,-26 -108,-18"/>
            <polyline points="28,-8 68,-26 108,-18"/>
            <polyline points="-24,10 -58,28 -95,22"/>
            <polyline points="24,10 58,28 95,22"/>
            <line x1="0" y1="-34" x2="0" y2="-68"/>
          </g>

          <!-- Radiant Inner Aura Behind Gem -->
          <circle id="maniInnerHalo" cx="0" cy="0" r="85" fill="url(#maniDivineAura)"/>

          <!-- Ornate Golden Lotus Socket Embedded in Forehead -->
          <polygon points="0,-38 28,-18 28,18 0,38 -28,18 -28,-18" fill="#240608" stroke="url(#goldBright)" stroke-width="4.5"/>

          <!-- THE LIVING RUDRA-MANI (CHINTAMANI GEM) -->
          <g id="maniGemPulse" filter="url(#maniSuperGlow)">
            <!-- Faceted Oval Ruby-Gold Gem -->
            <ellipse cx="0" cy="0" rx="22" ry="30" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="2.5"/>
            <!-- Inner Diamond Facet Lines -->
            <polygon points="0,-20 13,0 0,20 -13,0" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/>
            <!-- Specular Star Highlight -->
            <circle cx="-6" cy="-10" r="5.5" fill="#ffffff"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Floating Golden Energy Motes Rising Around Ashwatthama -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- (Top & Safe Upper-Bottom Band y=1545..1735 — Zero Overlap) -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: अश्वत्थामा की मणि -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-335" y="-56" width="670" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="52" font-weight="900" letter-spacing="1">अश्वत्थामा की मणि 💎</text>
      </g>

      <!-- Keyword 2: साधारण रत्न नहीं... -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-310" y="-50" width="620" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900" letter-spacing="1">साधारण रत्न नहीं... ⚡</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 4.5-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4500; // Exact 4.5s matching Scene 1 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const outerMandalaRing = document.getElementById('outerMandalaRing');
      const innerMandalaRing = document.getElementById('innerMandalaRing');
      const mandalaPetals = document.getElementById('mandalaPetals');
      const bgAuraOrb = document.getElementById('bgAuraOrb');

      const ashwatthamaHeroGroup = document.getElementById('ashwatthamaHeroGroup');
      const headAndManiGroup = document.getElementById('headAndManiGroup');
      const hairStrandL = document.getElementById('hairStrandL');
      const hairStrandR = document.getElementById('hairStrandR');

      const maniGemPulse = document.getElementById('maniGemPulse');
      const maniInnerHalo = document.getElementById('maniInnerHalo');
      const neuralVeins = document.getElementById('neuralVeins');
      const maniWave1 = document.getElementById('maniWave1');
      const maniWave2 = document.getElementById('maniWave2');
      const maniWave3 = document.getElementById('maniWave3');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 16 Sacred Lotus Petals on Rudra Mandala
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-435 Q24,-385 0,-345 Q-24,-385 0,-435 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        mandalaPetals.appendChild(p);
      }

      // 2. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 28 Rising Golden Energy Motes
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff6a1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function updateShockwave(el, cycleProg) {
        const r = 42 + easeOutCubic(cycleProg) * 380;
        const op = (1 - cycleProg) * 0.85;
        el.setAttribute('r', r.toFixed(1));
        el.setAttribute('opacity', Math.max(0, op).toFixed(2));
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.5s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Cinematic Camera Push-In Toward the Glowing Forehead Mani (1.0 -> 1.11)
        const camScale = 1 + easeOutCubic(t) * 0.11;
        cameraRig.setAttribute('transform', `translate(540, 742) scale(${camScale.toFixed(4)}) translate(-540, -742)`);

        // 3. Rotating Ajna / Rudra Mandala Behind Ashwatthama
        outerMandalaRing.setAttribute('transform', `rotate(${(t * 48).toFixed(1)})`);
        innerMandalaRing.setAttribute('transform', `rotate(${(-t * 36).toFixed(1)})`);
        bgAuraOrb.setAttribute('r', (520 + Math.sin(t * Math.PI * 6) * 42).toFixed(1));

        // 4. Articulated Ashwatthama Character Animation (Breathing, Head Tilt, Wind-Swept Hair)
        const breathY = 960 + Math.sin(t * Math.PI * 3) * 7;
        ashwatthamaHeroGroup.setAttribute('transform', `translate(540, ${breathY.toFixed(1)})`);

        const headTilt = Math.sin(t * Math.PI * 2) * 1.4;
        headAndManiGroup.setAttribute('transform', `rotate(${headTilt.toFixed(2)}, 0, 120)`);

        const hairSwayL = Math.sin(t * Math.PI * 4) * 3.5;
        const hairSwayR = -Math.cos(t * Math.PI * 4) * 3.5;
        hairStrandL.setAttribute('transform', `rotate(${hairSwayL.toFixed(2)}, -215, -190)`);
        hairStrandR.setAttribute('transform', `rotate(${hairSwayR.toFixed(2)}, 215, -190)`);

        // 5. Heartbeat-Like Living Rudra-Mani Pulse & Golden Energy Waves (3 Heartbeats in 4.5s)
        const beatCycle = (t * 3) % 1;
        // Double-lub-dub heartbeat curve
        const lub = Math.exp(-Math.pow((beatCycle - 0.12) / 0.06, 2));
        const dub = 0.65 * Math.exp(-Math.pow((beatCycle - 0.28) / 0.07, 2));
        const beatStrength = lub + dub;

        const gemScale = 1.0 + beatStrength * 0.26;
        maniGemPulse.setAttribute('transform', `scale(${gemScale.toFixed(3)})`);
        maniInnerHalo.setAttribute('r', (78 + beatStrength * 48).toFixed(1));
        neuralVeins.setAttribute('opacity', (0.55 + beatStrength * 0.45).toFixed(2));

        // Three Staggered Expanding Golden Energy Waves Radiating Outward
        updateShockwave(maniWave1, (t * 2.5) % 1);
        updateShockwave(maniWave2, ((t * 2.5) + 0.33) % 1);
        updateShockwave(maniWave3, ((t * 2.5) + 0.66) % 1);

        // 6. Rising Golden Energy Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 4.5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("अश्वत्थामा की मणि 💎" & "साधारण रत्न नहीं... ⚡")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.13);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.13);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
