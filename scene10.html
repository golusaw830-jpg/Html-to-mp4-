<html lang="hi">
<head>

    display: flex;

  svg#scene {
    width: 100vw;

  }
</style>
</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 9 (00:45.0 – 00:50.0 = 5.0 SECONDS EXACT)
  Voiceover: "मैं हारा नहीं था, मुझे धोखे से मारा गया था।"
  CLEAR STORYTELLING + SYMBOLIC VECTOR MOTIF:
  - Left Foreground (x=270): Locked Indrajit (Meghnad) in emerald-teal & gold Lanka armor and Naga-wing crown,
    holding a straight, taut luminous golden bowline (सीधी तनी हुई वेक्टर धनुष-रेखा) that cannot be broken from the front.
  - Right Shadow Split (x=685): A dark shadow split-screen slide reveals an unseen treacherous vector dagger
    (अदृश्य वेक्टर कटार) slashing from behind to sever the taut bowstring with a sudden dark-crimson flash!
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC AMBER BATTLEFIELD SKY (Locked Palette) -->
    <radialGradient id="deceitNightBg" cx="46%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#173a40"/>
      <stop offset="44%" stop-color="#0b1d24"/>
      <stop offset="80%" stop-color="#050c10"/>
      <stop offset="100%" stop-color="#020507"/>
    </radialGradient>

    <radialGradient id="valorFrontHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.92"/>
      <stop offset="32%" stop-color="#ffd043" stop-opacity="0.46"/>
      <stop offset="68%" stop-color="#0f766e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b1d24" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shadowBetrayalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#7f1d1d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#050c10" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. LOCKED MEGHNAD (INDRAJIT) PALETTE (Matches Scenes 1-8) -->
    <linearGradient id="meghnadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a370"/>
      <stop offset="52%" stop-color="#b57443"/>
      <stop offset="100%" stop-color="#6b3b1b"/>
    </linearGradient>

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="52%" stop-color="#083336"/>
      <stop offset="100%" stop-color="#03171a"/>
    </linearGradient>

    <linearGradient id="crimsonRoyalCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#690b12"/>
      <stop offset="100%" stop-color="#2b0306"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>
      <stop offset="78%" stop-color="#c4740a"/>
      <stop offset="100%" stop-color="#633302"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- Treacherous Shadow Dagger Gradient -->
    <linearGradient id="shadowDaggerBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL BATTLEFIELD SKY & RAMPART -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#deceitNightBg)"/>
    <g id="cosmicStarsLayer"></g>

    <!-- Lanka Fortress Pillars & Battlefield Floor -->
    <g opacity="0.42" fill="#051014">
      <rect x="95" y="235" width="42" height="1010"/>
      <rect x="865" y="235" width="42" height="1010"/>
      <path d="M 95 360 Q 480 230 907 360 L 907 235 L 95 235 Z"/>
    </g>
    <rect x="75" y="1225" width="850" height="22" rx="6" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4"/>
    <rect x="-60" y="1247" width="1200" height="720" fill="#040b0e"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: SPLIT-SCREEN SHADOW SLIDE (RIGHT SIDE x=560..895)-->
    <!-- Dark Shadow Realm Sliding In From Right With Treacherous  -->
    <!-- Curved Vector Dagger Slicing From Behind!                 -->
    <!-- ========================================================= -->
    <g id="shadowSplitPanel" transform="translate(260, 0)">
      <!-- Dark Diagonal Shadow Panel -->
      <polygon points="555,235 907,235 907,1225 495,1225" fill="#060205" fill-opacity="0.88" stroke="#991b1b" stroke-width="4"/>
      <circle cx="715" cy="760" r="245" fill="url(#shadowBetrayalGlow)"/>

      <!-- Unseen Treacherous Cloaked Silhouette in Shadow -->
      <g transform="translate(755, 845)" opacity="0.72">
        <path d="M -75 380 L -55 -65 Q 0 -135 55 -65 L 75 380 Z" fill="#0d0408" stroke="#7f1d1d" stroke-width="3"/>
        <circle cx="0" cy="-125" r="38" fill="#0d0408" stroke="#991b1b" stroke-width="3"/>
        <!-- Shadowy Arm Reaching Forward From Behind -->
        <path d="M -45 -45 C -115 -65, -175 -75, -225 -65 L -215 -35 C -165 -42, -115 -32, -45 -12 Z" fill="#12050a" stroke="#dc2626" stroke-width="3"/>
      </g>

      <!-- TREACHEROUS CURVED VECTOR DAGGER (अदृश्य वेक्टर कटार) -->
      <g id="treacherousDaggerRig" transform="translate(530, 775) rotate(-28)" filter="url(#superGlow)">
        <!-- Sharp Crimson-Edged Curved Dagger Blade -->
        <path d="M 0 -12 L -165 -22 C -205 -24, -235 -10, -255 6 C -222 14, -188 14, -155 10 L 0 12 Z"
              fill="url(#shadowDaggerBlade)" stroke="#1a0406" stroke-width="4" stroke-linejoin="round"/>
        <!-- Dagger Crossguard & Dark-Gold Hilt -->
        <rect x="-6" y="-26" width="14" height="52" rx="4" fill="url(#goldMetal)" stroke="#1a0406" stroke-width="3.5"/>
        <rect x="8" y="-9" width="46" height="18" rx="5" fill="#2b070a" stroke="url(#goldMetal)" stroke-width="3.5"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: LEFT FOREGROUND (x=270) — UNDEFEATED INDRAJIT    -->
    <!-- & STRAIGHT TAUT GOLDEN BOWLINE (सीधी तनी धनुष-रेखा)      -->
    <!-- ========================================================= -->
    <g id="indrajitUndefeatedGroup" transform="translate(270, 920)">
      <circle id="valorFrontOrb" cx="45" cy="-145" r="275" fill="url(#valorFrontHalo)" opacity="0.78"/>

      <!-- Warrior Dhoti & Greaves Standing Tall -->
      <path d="M -72 65 L 72 65 L 92 305 L 18 305 L 0 185 L -18 305 L -92 305 Z" fill="url(#crimsonRoyalCloth)" stroke="#0a1214" stroke-width="5" stroke-linejoin="round"/>
      <line x1="-88" y1="290" x2="-20" y2="290" stroke="url(#goldMetal)" stroke-width="10"/>
      <line x1="20" y1="290" x2="88" y2="290" stroke="url(#goldMetal)" stroke-width="10"/>
      <rect x="-72" y="48" width="144" height="22" rx="6" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4.5"/>

      <!-- Swept-Back Warrior Hair Locks -->
      <path id="hairBack" d="M -45 -245 C -115 -175, -135 -65, -105 45 C -85 -15, -72 -85, -42 -150 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>

      <!-- Torso in Locked Emerald-Teal & Gold Lanka Armor -->
      <path d="M -74 -155 C -25 -178, 35 -178, 74 -155 L 64 52 L -64 52 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M -52 -156 C -15 -65, 25 5, 58 48" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M -42 -156 Q 5 -105 52 -156" fill="none" stroke="url(#goldMetal)" stroke-width="10" stroke-linecap="round"/>

      <!-- Naga-Wing Golden Shoulder Pauldron -->
      <path d="M -82 -142 C -50 -185, 14 -185, 42 -148 L 20 -95 C -12 -118, -50 -110, -86 -82 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4.5"/>

      <!-- Extended Arm Holding Grand Golden Bow Upright -->
      <g id="bowHoldArm" transform="translate(42, -95)">
        <path d="M -15 -10 C 35 6, 78 -8, 114 -36 L 98 -60 C 66 -36, 34 -26, -4 -36 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="5" stroke-linejoin="round"/>
        <!-- Upright Golden Brahmastra Bow Limb -->
        <g transform="translate(122, -48)">
          <path d="M 0 -265 C 95 -165, 95 165, 0 265" fill="none" stroke="#081417" stroke-width="20" stroke-linecap="round"/>
          <path d="M 0 -265 C 95 -165, 95 165, 0 265" fill="none" stroke="url(#goldBright)" stroke-width="12" stroke-linecap="round" filter="url(#softGoldGlow)"/>

          <!-- STRAIGHT TAUT VECTOR BOWLINE (सीधी तनी हुई वेक्टर धनुष-रेखा) -->
          <!-- Intact Phase (0.0 -> 0.44) -->
          <line id="tautBowlineIntact" x1="0" y1="-265" x2="0" y2="265" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" filter="url(#superGlow)"/>

          <!-- Severed Upper & Lower Bowline Halves (Recoil After Dagger Cut at t=0.44!) -->
          <path id="severedLineTop" d="M 0 -265 Q 0 -132 0 0" fill="none" stroke="#ffe066" stroke-width="5.5" stroke-linecap="round" opacity="0" filter="url(#softGoldGlow)"/>
          <path id="severedLineBot" d="M 0 265 Q 0 132 0 0" fill="none" stroke="#ffe066" stroke-width="5.5" stroke-linecap="round" opacity="0" filter="url(#softGoldGlow)"/>
        </g>
      </g>

      <!-- LOCKED MEGHNAD HEAD (3/4 PROFILE) -->
      <g id="meghnadProfileHead" transform="translate(12, -175)">
        <path d="M -46 -85 L -34 -148 L 0 -195 L 34 -148 L 46 -85 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M -46 -95 C -68 -110, -72 -132, -58 -145 C -52 -128, -48 -115, -38 -105 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
        <circle cx="0" cy="-138" r="8" fill="#0d9488" stroke="url(#goldBright)" stroke-width="2.5"/>
        <path d="M -52 -86 Q 0 -100 52 -86 L 50 -74 Q 0 -86 -50 -74 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>

        <path d="M -48 -76 L 48 -76 L 56 -32 L 48 6 L 22 34 C 8 46, -16 44, -32 28 L -48 -18 Z"
              fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4.5" stroke-linejoin="round"/>

        <polygon points="-44,-18 -50,2 -44,10 -38,2" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3"/>
        <line x1="-10" y1="-64" x2="36" y2="-64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="-6" y1="-56" x2="34" y2="-56" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="16" cy="-60" r="4.5" fill="#dc2626"/>

        <path d="M -12 -46 L 34 -42" stroke="#0f1115" stroke-width="5.5" stroke-linecap="round"/>
        <ellipse cx="14" cy="-32" rx="11" ry="6.5" fill="#fffbeb" stroke="#0f1115" stroke-width="2.5"/>
        <circle cx="18" cy="-33" r="5" fill="#d97706"/>
        <circle cx="19" cy="-33" r="2.5" fill="#090d10"/>

        <path d="M 48 -38 L 60 -12 L 46 -8" fill="none" stroke="#5c3014" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 24 0 C 34 -4, 46 0, 52 6 C 42 4, 32 4, 24 3 Z" fill="#0f1115"/>
        <path d="M 26 14 Q 36 18 46 14" fill="none" stroke="#5e2418" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Slash Impact Flash & Severed Sparks at Bowline Center (434, 777) -->
    <g id="slashImpactGroup" transform="translate(434, 777)" opacity="0">
      <line x1="-85" y1="-55" x2="85" y2="55" stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#superGlow)"/>
      <circle id="slashShockRing" cx="0" cy="0" r="24" fill="none" stroke="#ef4444" stroke-width="8"/>
    </g>
    <g id="slashSparksLayer" filter="url(#superGlow)"></g>

    <!-- Rising Golden & Crimson Sparks -->
    <g id="particlesLayer"></g>

    <!-- Sudden Dark-Crimson Flash Overlay on Deceitful Cut -->
    <rect id="darkFlashOverlay" x="-80" y="-80" width="1240" height="2080" fill="#1a0206" opacity="0" pointer-events="none"/>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: हारा नहीं था -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-265" y="-48" width="530" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="45" font-weight="900" letter-spacing="1">हारा नहीं था 🏹</text>
      </g>

      <!-- Keyword 2: धोखे से वार -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-255" y="-44" width="510" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#170500" font-size="40" font-weight="900" letter-spacing="1">धोखे से वार 🗡️</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND SPLIT-SCREEN & BOWLINE CUT ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const valorFrontOrb = document.getElementById('valorFrontOrb');
      const shadowSplitPanel = document.getElementById('shadowSplitPanel');
      const treacherousDaggerRig = document.getElementById('treacherousDaggerRig');

      const tautBowlineIntact = document.getElementById('tautBowlineIntact');
      const severedLineTop = document.getElementById('severedLineTop');
      const severedLineBot = document.getElementById('severedLineBot');

      const slashImpactGroup = document.getElementById('slashImpactGroup');
      const slashShockRing = document.getElementById('slashShockRing');
      const slashSparksLayer = document.getElementById('slashSparksLayer');
      const darkFlashOverlay = document.getElementById('darkFlashOverlay');

      const hairBack = document.getElementById('hairBack');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Build 18 Sparks Bursting From Severed Bowline (434, 777)
      const cutSparks = [];
      for (let i = 0; i < 18; i++) {
        const sp = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        sp.setAttribute('r', (2.8 + (i % 3) * 1.4).toFixed(1));
        sp.setAttribute('fill', i % 2 === 0 ? '#ffffff' : '#ff6b1a');
        slashSparksLayer.appendChild(sp);
        const ang = (i * 20) * (Math.PI / 180);
        cutSparks.push({
          el: sp,
          vx: Math.cos(ang) * (120 + (i % 5) * 45),
          vy: Math.sin(ang) * (120 + (i % 5) * 45)
        });
      }

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#ef4444');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 110 + ((i * 103) % 780),
          baseY: 240 + ((i * 181) % 1180),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 1. Split-Screen Shadow Panel Slide-In (t: 0.14 -> 0.34)
        const slideProg = easeOutCubic(Math.max(0, Math.min(1, (t - 0.14) / 0.20)));
        const panelX = (1 - slideProg) * 380;
        shadowSplitPanel.setAttribute('transform', `translate(${panelX.toFixed(1)}, 0)`);

        // 2. Treacherous Dagger Slash From Behind to Sever Bowline at t = 0.44!
        const CUT_T = 0.44;
        let daggerX = 760;
        let daggerRot = -15;
        if (t < 0.32) {
          daggerX = 760;
          daggerRot = -15;
        } else if (t < CUT_T) {
          const lungP = easeOutCubic((t - 0.32) / (CUT_T - 0.32));
          daggerX = 760 - lungP * 115; // Dagger tip reaches bowline at x=434!
          daggerRot = -15 - lungP * 16;
        } else {
          const followP = Math.min(1, (t - CUT_T) / 0.20);
          daggerX = 645 - easeOutCubic(followP) * 28;
          daggerRot = -31 - easeOutCubic(followP) * 6;
        }
        treacherousDaggerRig.setAttribute('transform', `translate(${daggerX.toFixed(1)}, 775) rotate(${daggerRot.toFixed(1)})`);

        // 3. Sudden Dark-Crimson Flash & Impact Shake at t = 0.44
        let flashOp = 0;
        let shakeX = 0;
        let shakeY = 0;
        if (t >= CUT_T && t <= CUT_T + 0.14) {
          const fp = (t - CUT_T) / 0.14;
          flashOp = Math.sin(fp * Math.PI) * 0.68;
          shakeX = Math.sin(fp * Math.PI * 10) * 14 * (1 - fp);
          shakeY = Math.cos(fp * Math.PI * 8) * 10 * (1 - fp);
        }
        darkFlashOverlay.setAttribute('opacity', flashOp.toFixed(2));

        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute(
          'transform',
          `translate(${(505 + shakeX).toFixed(1)}, ${(760 + shakeY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-505, -760)`
        );

        // 4. Taut Bowline Intact Before t=0.44, Snapping Apart & Recoiling After Cut!
        if (t < CUT_T) {
          tautBowlineIntact.setAttribute('opacity', '1');
          severedLineTop.setAttribute('opacity', '0');
          severedLineBot.setAttribute('opacity', '0');
          slashImpactGroup.setAttribute('opacity', '0');
        } else {
          tautBowlineIntact.setAttribute('opacity', '0');
          severedLineTop.setAttribute('opacity', '1');
          severedLineBot.setAttribute('opacity', '1');

          const snapDt = Math.min(1, (t - CUT_T) / 0.35);
          const whip = Math.sin(snapDt * Math.PI * 5) * (1 - snapDt) * 35;
          const gapY = easeOutCubic(snapDt) * 48;
          severedLineTop.setAttribute('d', `M 0 -265 Q ${whip.toFixed(1)} -132 ${(-gapY * 0.45).toFixed(1)} ${(-gapY).toFixed(1)}`);
          severedLineBot.setAttribute('d', `M 0 265 Q ${(-whip).toFixed(1)} 132 ${(-gapY * 0.45).toFixed(1)} ${gapY.toFixed(1)}`);

          // Slash Impact Flash & Ring
          if (t <= CUT_T + 0.22) {
            const sp = (t - CUT_T) / 0.22;
            slashImpactGroup.setAttribute('opacity', (1 - sp).toFixed(2));
            slashShockRing.setAttribute('r', (24 + easeOutCubic(sp) * 115).toFixed(1));
          } else {
            slashImpactGroup.setAttribute('opacity', '0');
          }
        }

        // Sparks Bursting From Severed Bowline
        for (let i = 0; i < cutSparks.length; i++) {
          const cs = cutSparks[i];
          if (t >= CUT_T && t <= CUT_T + 0.28) {
            const dt = (t - CUT_T) * 5.0;
            const x = 434 + cs.vx * dt;
            const y = 777 + cs.vy * dt + 140 * dt * dt;
            const op = Math.max(0, 1 - (t - CUT_T) / 0.28);
            cs.el.setAttribute('cx', x.toFixed(1));
            cs.el.setAttribute('cy', y.toFixed(1));
            cs.el.setAttribute('opacity', op.toFixed(2));
          } else {
            cs.el.setAttribute('opacity', '0');
          }
        }

        // 5. Valor Halo & Ambient Particles
        valorFrontOrb.setAttribute('r', (270 + Math.sin(t * Math.PI * 5) * 22).toFixed(1));
        hairBack.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -45, -245)`);

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1180 + 1180) % 1180 + 240;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Safe-Zone Kinetic Hindi Keywords ("हारा नहीं था 🏹" & "धोखे से वार 🗡️")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
