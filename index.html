ravanaSwordArm = document.getElementById(\"ravana-sword-arm\");\n      const ravanaHeadsCluster = document.getElementById(\"ravana-heads-cluster\");\n\n      const centerBarrierGroup = document.getElementById(\"center-barrier-group\");\n      const qOrbAura = document.getElementById(\"q-orb-aura\");\n      const qRingInner = document.getElementById(\"q-ring-inner\");\n      const barrierBolt1 = document.getElementById(\"barrier-bolt-1\");\n      const barrierBolt2 = document.getElementById(\"barrier-bolt-2\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwRavana = document.getElementById(\"kw-ravana\");\n      const kwWhyNot = document.getElementById(\"kw-why-not\");\n\n      // Build 32 Floating Golden Spark Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 4) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff8c1a\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 90 + ((i * 97) % 900),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 200 + (i % 7) * 40,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Background Mandala & Center Question Ring Rotation\n        bgMandala.setAttribute(\"transform\", `rotate(${((t * 12) % 360).toFixed(2)} 540 920)`);\n        qRingInner.setAttribute(\"transform\", `rotate(${(-(t * 28) % 360).toFixed(2)} 540 920)`);\n\n        // 2. Dramatic Camera Zoom-In across 5.0 Seconds\n        const zoom = lerp(1.0, 1.09, easeOutCubic(clamp01(t / 5.0)));\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 920) scale(${zoom.toFixed(4)}) translate(-540 -920)`\n        );\n\n        // 3. Fast Slide-In From Left (Parshuram) & Right (Ravana) in First 0.65s\n        const slideProg = easeOutBack(clamp01(t / 0.65));\n        const leftOffset = lerp(-340, 0, slideProg);\n        const rightOffset = lerp(340, 0, slideProg);\n\n        // Subtle Breathing Bob after Slide-In\n        const bobLeft = t > 0.65 ? Math.sin((t - 0.65) * 3.2) * 7 : 0;\n        const bobRight = t > 0.65 ? Math.cos((t - 0.65) * 3.0) * 7 : 0;\n\n        parshuramSide.setAttribute(\"transform\", `translate(${leftOffset.toFixed(1)} ${bobLeft.toFixed(1)})`);\n        ravanaSide.setAttribute(\"transform\", `translate(${rightOffset.toFixed(1)} ${bobRight.toFixed(1)})`);\n\n        // 4. Weapon-Ready Combat Motion (Axe Aiming Forward & Sword Raising Defiantly)\n        const axeAngle = Math.sin(t * 3.4) * 5.5 - 3;\n        const swordAngle = -Math.sin(t * 3.2) * 5.5 + 3;\n        parshuramAxeArm.setAttribute(\"transform\", `rotate(${axeAngle.toFixed(2)} 315 935)`);\n        ravanaSwordArm.setAttribute(\"transform\", `rotate(${swordAngle.toFixed(2)} 765 935)`);\n\n        // Hair & Scarf Flowing Motion\n        pHairBack.setAttribute(\"transform\", `rotate(${(Math.sin(t * 4.2) * 5).toFixed(2)} 200 810)`);\n        pScarf.setAttribute(\"transform\", `rotate(${(Math.sin(t * 3.6) * 6).toFixed(2)} 175 990)`);\n        ravanaHeadsCluster.setAttribute(\"transform\", `rotate(${(Math.sin(t * 2.8) * 1.2).toFixed(2)} 820 840)`);\n\n        // 5. Center Energy Barrier Pop-In (0.45s -> 0.90s) + Flickering Lightning Arcs\n        const barrierProg = easeOutBack(clamp01((t - 0.45) / 0.45));\n        const orbPulse = 1 + 0.06 * Math.sin(t * 5.5);\n        centerBarrierGroup.setAttribute(\"opacity\", clamp01((t - 0.35) / 0.3).toFixed(3));\n        qOrbAura.setAttribute(\n          \"transform\",\n          `translate(540 920) scale(${(barrierProg * orbPulse).toFixed(3)}) translate(-540 -920)`\n        );\n\n        // Flickering Electric Path Strokes\n        const flick1 = 0.55 + 0.45 * Math.abs(Math.sin(t * 24));\n        const flick2 = 0.55 + 0.45 * Math.abs(Math.cos(t * 21));\n        const shiftX1 = Math.sin(t * 35) * 6;\n        const shiftX2 = Math.cos(t * 31) * 6;\n        barrierBolt1.setAttribute(\"opacity\", flick1.toFixed(2));\n        barrierBolt1.setAttribute(\"transform\", `translate(${shiftX1.toFixed(1)} 0)`);\n        barrierBolt2.setAttribute(\"opacity\", flick2.toFixed(2));\n        barrierBolt2.setAttribute(\"transform\", `translate(${shiftX2.toFixed(1)} 0)`);\n\n        // 6. Rising Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 7. Bold Hindi Keywords (\"लंकापति रावण\" & \"वध क्यों नहीं?\")\n        if (t >= 0.85) {\n          const p1 = clamp01((t - 0.85) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwRavana.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwRavana.setAttribute(\"transform\", `t    const totalFrames = Math.round(CLIP_DURATION * fps);\n\n          const canvas = document.createElement(\"canvas\");\n          canvas.width = width;\n          canvas.height = height;\n          const ctx = canvas.getContext(\"2d\");\n\n          const mimeCandidates = [\n            \"video/mp4;codecs=avc1\",\n            \"video/mp4\",\n            \"video/webm;codecs=vp9\",\n            \"video/webm;codecs=vp8\",\n            \"video/webm\"\n          ];\n          const chosenMime = mimeCandidates.find((m) => MediaRecorder.isTypeSupported(m)) || \"\";\n          const isMp4 = chosenMime.includes(\"mp4\");\n          const fileExt = isMp4 ? \"mp4\" : \"webm\";\n\n          const stream = canvas.captureStream(fps);\n          const recorder = chosenMime\n            ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 10_000_000 })\n            : new MediaRecorder(stream);\n\n          const chunks = [];\n          recorder.ondataavailable = (e) => {\n            if (e.data && e.data.size > 0) chunks.push(e.data);\n          };\n\n          const recordingDone = new Promise((resolve) => {\n            recorder.onstop = resolve;\n          });\n\n          function rasterizeCurrentSvgFrame() {\n            return new Promise((resolve) => {\n              const xml = new XMLSerializer().serializeToString(svgEl);\n              const svgBlob = new Blob([xml], { type: \"image/svg+xml;charset=utf-8\" });\n              const url = URL.createObjectURL(svgBlob);\n              const img = new Image();\n              img.onload = () => {\n                ctx.clearRect(0, 0, width, height);\n                ctx.drawImage(img, 0, 0, width, height);\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.onerror = () => {\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.src = url;\n            });\n          }\n\n          recorder.start();\n\n          for (let frame = 0; frame <= totalFrames; frame++) {\n            const simTime = (frame / totalFrames) * CLIP_DURATION;\n            const pct = Math.min(99, Math.round((frame / totalFrames) * 100));\n            showToast(`Rendering 5.0s Video... ${pct}%`);\n\n            renderFrameAtTime(simTime);\n            await rasterizeCurrentSvgFrame();\n            await new Promise((r) => setTimeout(r, 1000 / fps));\n          }\n\n          recorder.stop();\n          await recordingDone;\n\n          const videoBlob = new Blob(chunks, { type: chosenMime || \"video/webm\" });\n          const downloadUrl = URL.createObjectURL(videoBlob);\n          const a = document.createElement(\"a\");\n          a.href = downloadUrl;\n          a.download = `parshuram_sentence_2.${fileExt}`;\n          document.body.appendChild(a);\n          a.click();\n          document.body.removeChild(a);\n          setTimeout(() => URL.revokeObjectURL(downloadUrl), 4000);\n\n          showToast(`Saved parshuram_sentence_2.${fileExt}!`);\n          setTimeout(hideToast, 2800);\n        } catch (err) {\n          console.error(err);\n          showToast(\"Export error — please retry\");\n          setTimeout(hideToast, 2800);\n        } finally {\n          isExporting = false;\n          startTimestamp = performance.now();\n          downloadBtn.disabled = false;\n        }\n      });\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 3 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #070203;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-sys "ten-heads-tyrant\");\n      const royalCape = document.getElementById(\"royal-cape\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwTyrant = document.getElementById(\"kw-tyrant\");\n      const kwArrogantRavana = document.getElementById(\"kw-arrogant-ravana\");\n\n      // Build 34 Floating Golden & Crimson Embers\n      const embers = [];\n      for (let i = 0; i < 34; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 5) * 1.3;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff4526\");\n        circle.setAttribute(\"filter\", \"url(#softGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 80 + ((i * 103) % 920),\n          startY: 1850 - ((i * 137) % 720),\n          speedY: 210 + (i % 7) * 42,\n          wobbleAmp: 18 + (i % 4) * 9,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Dramatic Low-Angle Upward Pan + Scale Push-In across 5.0s\n        const panProg = easeOutCubic(clamp01(t / 5.0));\n        const panY = lerp(85, -35, panProg);\n        const camScale = lerp(0.98, 1.07, panProg);\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 ${(960 + panY).toFixed(1)}) scale(${camScale.toFixed(4)}) translate(-540 -96 erp(0, -430, gp);\n          glintOpacity = Math.sin(gp * Math.PI);\n        } else if (t >= 3.1 && t <= 4.1) {\n          const gp = (t - 3.1) / 1.0;\n          glintY = lerp(0, -430, gp);\n          glintOpacity = Math.sin(gp * Math.PI);\n        }\n        swordGlintSweep.setAttribute(\"transform\", `translate(0 ${glintY.toFixed(1)})`);\n        swordGlintSweep.setAttribute(\"opacity\", glintOpacity.toFixed(3));\n\n        // Arrogant Head & Cape Motion\n        tenHeadsTyrant.setAttribute(\"transform\", `rotate(${(Math.sin(t * 2.4) * 1.1).toFixed(2)} 540 820)`);\n        royalCape.setAttribute(\"transform\", `skewX(${(Math.sin(t * 3.2) * 1.8).toFixed(2)})`);\n\n        // 5. Rising Crimson & Golden Embers\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 6. Bold Hindi Keywords (\"महा-अत्याचारी\" & \"अहंकारी रावण\")\n        if (t >= 0.85) {\n          const p1 = clamp01((t - 0.85) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwTyrant.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwTyrant.setAttribute(\"transform\", `translate(540 215) scale(${s1.toFixed(3)})`);\n        } else {\n          kwTyrant.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 1.95) {\n          const p2 = clamp01((t - 1.95) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1795, 1745, easeOutCubic(p2));\n          kwArrogantRavana.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwArrogantRavana.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwArrogantRavana.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Preview Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n      let isExporting = false;\n\n      function animationLoop(now) {\n        if (!isExporting) {\n          const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n          renderFrameAtTime(elapsedSec);\n        }\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n\n      document.getElementById(\"replayBtn\").addEventListener(\"click\", () => {\n        startTimestamp = performance.now();\n        renderFrameAtTime(0);\n      });\n\n      // Direct 5.0s 9:16 Video Exporter\n      const downloadBtn = document.getElementById(\"downloadBtn\");\n      const statusToast = document.getElementById(\"statusToast\");\n\n      function showToast(msg) {\n        statusToast.textContent = msg;\n        statusToast.classList.add(\"visible\");\n      }\n\n      function hideToast() {\n        statusToast.classList.remove(\"visible\");\n      }\n\n      downloadBtn.addEventListener(\"click\", async () => {\n        if (downloadBtn.disabled) return;\n        downloadBtn.disabled = true;\n        isExporting = true;\n\n        try {\n          const svgEl = document.getElementById(\"scene\");\n          const width = 1080;\n          const height = 1920;\n          const fps = 30;\n          const totalFrames = Math.round(CLIP_DURATION * fps);\n\n          const canvas = document.createElement(\"canvas\");\n          canvas.width = width;\n          canvas.height = height;\n          const ctx = canvas.getContext(\"2d\");\n\n          const mimeCandidates = [\n            \"video/mp4;codecs=avc1\",\n            \"video/mp4\",\n            \"video/webm;codecs=vp9\",\n            \"video/webm;codecs=vp8\",\n            \"video/webm\"\n          ];\n          const chosenMime = mimeCandidates.find((m) => MediaRecorder.isTypeSupported(m)) || \"\";\n          const isMp4 = chosenMime.includes(\"mp4\");\n          const fileExt = isMp4 ? \"mp4\" : \"webm\";\n\n          const stream = canvas.captureStream(fps);\n          const recorder = chosenMime\n            ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 10_000_000 })\n            : new MediaRecorder(stream);\n\n          const chunks = [];\n          recorder.ondataavailable = (e) => {\n            if (e.data && e.data.size > 0) chunks.push(e.data);\n          };\n\n          const recordingDone = new Promise((resolve) => {\n            recorder.onstop = resolve;\n          });\n\n          function rasterizeCurrentSvgFrame() {\n            return new Promise((resolve) => {\n              const xml = new XMLSerializer().serializeToString(svgEl);\n              const svgBlob = new Blob([xml], { type: \"image/svg+xml;charset=utf-8\" });\n              const url = URL.createObjectURL(svgBlob);\n              const img = new Image();\n              img.onload = () => {\n                ctx.clearRect(0, 0, width, height);\n                ctx.drawImage(img, 0, 0, width, height);\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.onerror = () => {\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.src = url;\n            });\n          }\n\n          recorder.start();\n\n          for (let frame = 0; frame <= totalFrames; frame++) {\n            const simTime = (frame / totalFrames) * CLIP_DURATION;\n            const pct = Math.min(99, Math.round((frame / totalFrames) * 100));\n            showToast(`Rendering 5.0s Video... ${pct}%`);\n\n            renderFrameAtTime(simTime);\n            await rasterizeCurrentSvgFrame();\n            await new Promise((r) => setTimeout(r, 1000 / fps));\n          }\n\n          recorder.stop();\n          await recordingDone;\n\n          const videoBlob = new Blob(chunks, { type: chosenMime || \"video/webm\" });\n          const downloadUrl = URL.createObjectURL(videoBlob);\n          const a = document.createElement(\"a\");\n          a.href = downloadUrl;\n          a.download = `parshuram_sentence_3.${fileExt}`;\n          document.body.appendChild(a);\n          a.click();\n          document.body.removeChild(a);\n          setTimeout(() => URL.revokeObjectURL(downloadUrl), 4000);\n\n          showToast(`Saved parshuram_sentence_3.${fileExt}!`);\n          setTimeout(hideToast, 2800);\n        } catch (err) {\n          console.error(err);\n          showToast(\"Export error — please retry\");\n          setTimeout(hideToast, 2800);\n        } finally {\n          isExporting = false;\n          startTimestamp = performance.now();\n          downloadBtn.disabled = false;\n        }\n      });\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 4 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #06030a;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vertical Stage Container */\n    .stage-wrapper {\n      position: relative;\n      height: 100vh;\n      aspect-ratio: 9 / 16;\n      max-width: 100vw;\n      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);\n      background: #0d061a;\n      overflow: hidden;\n      border-radius: 14px;\n    }\n\n    svg#scene {\n      width: 100%  height=\"98\" rx=\"20\" fill=\"#140521\" fill-opacity=\"0.9\" stroke=\"url(#goldMetal)\" stroke-width=\"4.5\" />\n          <text x=\"0\" y=\"8\" font-family=\"'Noto Sans Devanagari', sans-serif\" font-weight=\"900\" font-size=\"68\" letter-spacing=\"1.5\" stroke=\"#0d0317\" stroke-width=\"14\" stroke-linejoin=\"round\" paint-order=\"stroke\" fill=\"url(#keywordGoldGrad)\">चौंकाने वाले रहस्य<\/text>\n        <\/g>\n      <\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 5: ORNATE CRIMSON & GOLD MITHILA BORDER             -->\n      <\!-- ========================================================= -->\n      <g pointer-events=\"none\">\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"#240506\" stroke-width=\"24\" />\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"7\" />\n        <rect x=\"34\" y=\"34\" width=\"1012\" height=\"1852\" rx=\"20\" fill=\"none\" stroke=\"#ffcf54\" stroke-width=\"2.5\" stroke-dasharray=\"16 10\" />\n        <g fill=\"url(#goldMetal)\" stroke=\"#240506\" stroke-width=\"3\">\n          <circle cx=\"44\" cy=\"44\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"44\" r=\"18\" />\n          <circle cx=\"44\" cy=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n\n    <div class=\"controls-bar\" id=\"controlsBar\">\n      <button class=\"action-btn\" id=\"replayBtn\" title=\"Replay 5s Animation\">↻ Replay<\/button>\n      <button class=\"action-btn download-btn\" id=\"downloadBtn\" title=\"Download 5.0s 9:16 Video\">⬇ Download MP4<\/button>\n    <\/div>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const bgCosmos = document.getElementById(\"bg-cosmos\");\n\n      const conduit12 = document.getElementById(\"conduit-1-2\");\n      const conduit23 = document.getElementById(\"conduit-2-3\");\n\n      const seals = [\n        {\n          group: document.getElementById(\"seal-group-1\"),\n          gear: document.getElementById(\"gear-1\"),\n          burst: document.getElementById(\"burst-1\"),\n          shock: document.getElementById(\"shock-1\"),\n          y: 530,\n          unlockTime: 0.45,\n          gearDir: 1\n        },\n        {\n          group: document.getElementById(\"seal-group-2\"),\n          gear: document.getElementById(\"gear-2\"),\n          burst: document.getElementById(\"burst-2\"),\n          shock: document.getElementById(\"shock-2\"),\n          y: 960,\n          unlockTime: 1.35,\n          gearDir: -1\n        },\n        {\n          group: document.getElementById(\"seal-group-3\"),\n          gear: document.getElementById(\"gear-3\"),\n          burst: document.getElementById(\"burst-3\"),\n          shock: document.getElementById(\"shock-3\"),\n          y: 1390,\n          unlockTime: 2.25,\n          gearDir: 1\n        }\n      ];\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwThreeReasons = document.getElementById(\"kw-three-reasons\");\n      const kwShockingSecrets = document.getElementById(\"kw-shocking-secrets\");\n\n      // Build 34 Floating Golden Spark Particles\n      const embers = [];\n      for (let i = 0; i < 34; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 5) * 1.3;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff8c1a\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 85 + ((i * 97) % 910),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 205 + (i % 7) * 40,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Subtle Cosmic Backdrop Rotation & Camera Push-In\n        bgCosmos.setAttribute(\"transform\", `rotate(${((t * 10) % 360).toFixed(2)} 540 960)`);\n\n        const camZoom = lerp(0.98, 1.07, easeOutCubic(clamp01(t / 5.0)));\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 960) scale(${camZoom.toFixed(4)}) translate(-540 -960)`\n        );\n\n        // 2. Staggered Pop-In & Unlocking of the 3 Hexagonal Vedic Seals\n        for (let i = 0; i < seals.length; i++) {\n          const s = seals[i];\n          const dt = t - s.unlockTime;\n\n          // Continuous inner gear rotation\n          const gearDeg = ((t * 48 * s.gearDir) % 360).toFixed(2);\n          s.gear.setAttribute(\"transform\", `rotate(${gearDeg})`);\n\n          if (dt < 0) {\n            s.group.setAttribute(\"opacity\", \"0\");\n            s.burst.setAttribute(\"opacity\", \"0\");\n            s.shock.setAttribute(\"opacity\", \"0\");\n          } else {\n            const popProg = clamp01(dt / 0.45);\n            const popScale = easeOutBack(popProg);\n            const idlePulse = dt > 0.45 ? 1 + 0.03 * Math.sin((dt - 0.45) * 4.5 + i) : 1;\n            const totalScale = popScale * idlePulse;\n\n            s.group.setAttribute(\"opacity\", clamp01(popProg * 2.2).toFixed(3));\n            s.group.setAttribute(\n              \"transform\",\n              `translate(540 ${s.y}) scale(${totalScale.toFixed(4)})`\n            );\n\n            // Saffron Aura Burst Glow\n            const auraAlpha = dt < 0.6 ? Math.sin((dt / 0.6) * Math.PI) * 0.95 : 0.45 + 0.18 * Math.sin(dt * 5 + i);\n            s.burst.setAttribute(\"opacity\", clamp01(auraAlpha).toFixed(3));\n\n            // Expanding Shockwave Ring on Unlock\n            if (dt <= 0.95) {\n              const sw = dt / 0.95;\n              const swScale = lerp(0.6, 1.9, easeOutCubic(sw));\n              s.shock.setAttribute(\"opacity\", (1 - sw).toFixed(3));\n              s.shock.setAttribute(\"transform\", `scale(${swScale.toFixed(3)})`);\n            } else {\n              s.shock.setAttribute(\"opacity\", \"0\");\n            }\n          }\n        }\n\n        // 3. Energy Conduit Beams Connecting Unlocked Seals\n        const c12 = clamp01((t - 1.15) / 0.35);\n        const c23 = clamp01((t - 2.05) / 0.35);\n        conduit12.setAttribute(\"opacity\", (c12 * (0.65 + 0.25 * Math.sin(t * 7))).toFixed(3));\n        conduit23.setAttribute(\"opacity\", (c23 * (0.65 + 0.25 * Math.cos(t * 7))).toFixed(3));\n\n        // 4. Rising Golden Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 5. Bold Hindi Keywords (\"तीन बड़े कारण\" & \"चौंकाने वाले रहस्य\")\n        if (t >= 0.65) {\n          const p1 = clamp01((t - 0.65) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwThreeReasons.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwThreeReasons.setAttribute(\"transform\", `translate(540 215) scale(${s1.toFixed(3)})`);\n        } else {\n          kwThreeReasons.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 2.45) {\n          const p2 = clamp01((t - 2.45) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1795, 1745, easeOutCubic(p2));\n          kwShockingSecrets.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwShockingSecrets.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwShockingSecrets.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Preview Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n      let isExporting = false;\n\n      function animationLoop(now) {\n        if (!isExporting) {\n          const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n          renderFrameAtTime(elapsedSec);\n        }\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n\n      document.getElementById(\"replayBtn\").addEventListener(\"click\", () => {\n        startTimestamp = performance.now();\n        renderFrameAtTime(0);\n      });\n\n      // Direct 5.0s 9:16 Video Exporter\n      const downloadBtn = document.getElementById(\"downloadBtn\");\n      const statusToast = document.getElementById(\"statusToast\");\n\n      function showToast(msg) {\n        statusToast.textContent = msg;\n        statusToast.classList.add(\"visible\");\n      }\n\n      function hideToast() {\n        statusToast.classList.remove(\"visible\");\n      }\n\n      downloadBtn.addEventListener(\"click\", async () => {\n        if (downloadBtn.disabled) return;\n        downloadBtn.disabled = true;\n        isExporting = true;\n\n        try {\n          const svgEl = document.getElementById(\"scene\");\n          const width = 1080;\n          const height = 1920;\n          const fps = 30;\n          const totalFrames = Math.round(CLIP_DURATION * fps);\n\n          const canvas = document.createElement(\"canvas\");\n          canvas.width = width;\n          canvas.height = height;\n          const ctx = canvas.getContext(\"2d\");\n\n          const mimeCandidates = [\n            \"video/mp4;codecs=avc1\",\n            \"video/mp4\",\n            \"video/webm;codecs=vp9\",\n            \"video/webm;codecs=vp8\",\n            \"video/webm\"\n          ];\n          const chosenMime = mimeCandidates.find((m) => MediaRecorder.isTypeSupported(m)) || \"\";\n          const isMp4 = chosenMime.includes(\"mp4\");\n          const fileExt = isMp4 ? \"mp4\" : \"webm\";\n\n          const stream = canvas.captureStream(fps);\n          const recorder = chosenMime\n            ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 10_000_000 })\n            : new MediaRecorder(stream);\n\n          const chunks = [];\n          recorder.ondataavailable = (e) => {\n            if (e.data && e.data.size > 0) chunks.push(e.data);\n          };\n\n          const recordingDone = new Promise((resolve) => {\n            recorder.onstop = resolve;\n          });\n\n          function rasterizeCurrentSvgFrame() {\n            return new Promise((resolve) => {\n              const xml = new XMLSerializer().serializeToString(svgEl);\n              const svgBlob = new Blob([xml], { type: \"image/svg+xml;charset=utf-8\" });\n              const url = URL.createObjectURL(svgBlob);\n              const img = new Image();\n              img.onload = () => {\n                ctx.clearRect(0, 0, width, height);\n                ctx.drawImage(img, 0, 0, width, height);\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.onerror = () => {\n                URL.revokeObjectURL(url);\n                resolve();\n              };\n              img.src = url;\n            });\n          }\n\n          recorder.start();\n\n          for (let frame = 0; frame <= totalFrames; frame++) {\n            const simTime = (frame / totalFrames) * CLIP_DURATION;\n            const pct = Math.min(99, Math.round((frame / totalFrames) * 100));\n            showToast(`Rendering 5.0s Video... ${pct}%`);\n\n            renderFrameAtTime(simTime);\n            await rasterizeCurrentSvgFrame();\n            await new Promise((r) => setTimeout(r, 1000 / fps));\n          }\n\n          recorder.stop();\n          await recordingDone;\n\n          const videoBlob = new Blob(chunks, { type: chosenMime || \"video/webm\" });\n          const downloadUrl = URL.createObjectURL(videoBlob);\n          const a = document.createElement(\"a\");\n          a.href = downloadUrl;\n          a.download = `parshuram_sentence_4.${fileExt}`;\n          document.body.appendChild(a);\n          a.click();\n          document.body.removeChild(a);\n          setTimeout(() => URL.revokeObjectURL(downloadUrl), 4000);\n\n          showToast(`Saved parshuram_sentence_4.${fileExt}!`);\n          setTimeout(hideToast, 2800);\n        } catch (err) {\n          console.error(err);\n          showToast(\"Export error — please retry\");\n          setTimeout(hideToast, 2800);\n        } finally {\n          isExporting = false;\n          startTimestamp = performance.now();\n          downloadBtn.disabled = false;\n        }\n      });\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 5 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #060204;\n      display: flex;\n      justify-cont "ब्राह्मण पुत्र\" -->\n        <g id=\"kw-brahmin-son\" transform=\"translate(540, 1785)\" opacity=\"0\">\n          <rect x=\"-275\" y=\"-62\" width=\"550\" height=\"92\" rx=\"20\" fill=\"#180614\" fill-opacity=\"0.9\" stroke=\"url(#goldMetal)\" stroke-width=\"4.5\" />\n          <text x=\"0\" y=\"8\" font-family=\"'Noto Sans Devanagari', sans-serif\" font-weight=\"900\" font-size=\"72\" letter-spacing=\"2\" stroke=\"#0f030c\" stroke-width=\"14\" stroke-linejoin=\"round\" paint-order=\"stroke\" fill=\"url(#keywordGoldGrad)\">ब्राह्मण पुत्र<\/text>\n        <\/g>\n      <\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 5: ORNATE CRIMSON & GOLD MITHILA BORDER             -->\n      <\!-- ========================================================= -->\n      <g pointer-events=\"none\">\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"#240506\" stroke-width=\"24\" />\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"7\" />\n        <rect x=\"34\" y=\"34\" width=\"1012\" height=\"1852\" rx=\"20\" fill=\"none\" stroke=\"#ffcf54\" stroke-width=\"2.5\" stroke-dasharray=\"16 10\" />\n        <g fill=\"url(#goldMetal)\" stroke=\"#240506\" stroke-width=\"3\">\n          <circle cx=\"44\" cy=\"44\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"44\" r=\"18\" />\n          <circle cx=\"44\" cy=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const upperMandala = document.getElementById(\"upper-mandala\");\n      const upperAxeRig = document.getElementById(\"upper-axe-rig\");\n      const upperSlashArc = document.getElementById(\"upper-slash-arc\");\n\n      const tyrantCrownsGroup = document.getElementById(\"tyrant-crowns-group\");\n      const crownFragmentsLayer = document.getElementById(\"crown-fragments-layer\");\n      const impactRing1 = document.getElementById(\"crown-impact-ring1\");\n      const impactRing2 = document.getElementById(\"crown-impact-ring2\");\n\n      const janeuAuraOrb = document.getElementById(\"janeu-aura-orb\");\n      const sageBlessingArm = document.getElementById(\"sage-blessing-arm\");\n      const blessingSpark = document.getElementById(\"blessing-spark\");\n      const sacredJaneu = document.getElementById(\"sacred-janeu-highlight\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwKshatriyaVow = document.getElementById(\"kw-kshatriya-vow\");\n      const kwBrahminSon = document.getElementById(\"kw-brahmin-son\");\n\n      // 1. Build 26 Shattered Crown Fragments (Fly outward when Parashu strikes at t=1.05s)\n      const fragments = [];\n      for (let i = 0; i < 26; i++) {\n        const poly = document.createElementNS(svgNS, \"polygon\");\n        const sz = 11 + (i % 5) * 5;\n        poly.setAttribute(\"points\", `0,${-sz} ${sz * 0.85},0 0,${sz} ${-sz * 0.75},${sz * 0.3}`);\n        poly.setAttribute(\"fill\", i % 2 === 0 ? \"#ffd859\" : \"#2b0709\");\n        poly.setAttribute(\"stroke\", \"#ffcf54\");\n        poly.setAttribute(\"stroke-width\", \"2\");\n        poly.setAttribute(\"opacity\", \"0\");\n        crownFragmentsLayer.appendChild(poly);\n\n        const angle = (-155 + (i / 25) * 185) * (Math.PI / 180);\n        fragments.push({\n          el: poly,\n          vx: Math.cos(angle) * (240 + (i % 6) * 65),\n          vy: Math.sin(angle) * (240 + (i % 5) * 65),\n          spin: (i % 2 === 0 ? 1 : -1) * (220 + (i % 4) * 85)\n        });\n      }\n\n      // 2. Build 32 Rising Golden Ember Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 4) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff941a\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 85 + ((i * 101) % 910),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 205 + (i % 7) * 40,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeInOutCubic(t) {\n        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Subtle Camera Push-In + Micro Impact Shake on Axe Strike (1.05s -> 1.40s)\n        let camScale = lerp(1.0, 1.06, easeOutCubic(clamp01(t / 5.0)));\n        let camX = 0;\n        let camY = 0;\n        if (t >= 1.05 && t <= 1.40) {\n          const sp = (t - 1.05) / 0.35;\n          const decay = 1 - sp;\n          camX = Math.sin(sp * Math.PI * 10) * 14 * decay;\n          camY = Math.cos(sp * Math.PI * 8) * 10 * decay;\n        }\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(${(540 + camX).toFixed(2)} ${(960 + camY).toFixed(2)}) scale(${camScale.toFixed(4)}) translate(-540 -960)`\n        );\n\n        // 2. Upper Half: Mandala Rotation & Parshuram Downward Parashu Strike\n        upperMandala.setAttribute(\"transform\", `rotate(${((t * 14) % 360).toFixed(2)} 330 540)`);\n\n        let axeRot = 0;\n        let slashAlpha = 0;\n        if (t < 0.72) {\n          // Wind-up back\n          const p = easeInOutCubic(t / 0.72);\n          axeRot = lerp(-12, -42, p);\n        } else if (t < 1.08) {\n          // Fierce downward strike onto the crowns\n          const p = easeOutCubic((t - 0.72) / 0.36);\n          axeRot = lerp(-42, 36, p);\n          slashAlpha = Math.sin(p * Math.PI);\n        } else if (t < 1.55) {\n          // Recoil back to commanding stance\n          const p = easeInOutCubic((t - 1.08) / 0.47);\n          axeRot = lerp(36, -6, p);\n          slashAlpha = Math.max(0, 1 - p * 2) * 0.6;\n        } else {\n          axeRot = -6 + Math.sin((t - 1.55) * 3.0) * 4;\n        }\n        upperAxeRig.setAttribute(\"transform\", `rotate(${axeRot.toFixed(2)} 75 20)`);\n        upperSlashArc.setAttribute(\"opacity\", clamp01(slashAlpha).toFixed(3));\n\n        // 3. Tyrannical Crowns Shattering into Fragments at t = 1.05s\n        if (t < 1.05) {\n          const wobble = Math.sin(t * 18) * 2;\n          tyrantCrownsGroup.setAttribute(\"opacity\", \"1\");\n          tyrantCrownsGroup.setAttribute(\"transform\", `translate(0 ${wobble.toFixed(1)})`);\n          impactRing1.setAttribute(\"opacity\", \"0\");\n          impactRing2.setAttribute(\"opacity\", \"0\");\n        } else {\n          const dt = t - 1.05;\n          tyrantCrownsGroup.setAttribute(\"opacity\", clamp01(1 - dt * 5).toFixed(3));\n\n          // Expanding Impact Shockwave Rings\n          if (dt <= 0.95) {\n            const sw1 = dt / 0.95;\n            const s1 = lerp(0.4, 2.2, easeOutCubic(sw1));\n            impactRing1.setAttribute(\"opacity\", (1 - sw1).toFixed(3));\n            impactRing1.setAttribute(\"transform\", `translate(720 610) scale(${s1.toFixed(3)}) translate(-720 -610)`);\n\n            const sw2 = clamp01((dt - 0.14) / 0.85);\n            const s2 = lerp(0.4, 2.0, easeOutCubic(sw2));\n            impactRing2.setAttribute(\"opacity\", (sw2 > 0 ? 1 - sw2 : 0).toFixed(3));\n            impactRing2.setAttribute(\"transform\", `translate(720 610) scale(${s2.toFixed(3)}) translate(-720 -610)`);\n          } else {\n            impactRing1.setAttribute(\"opacity\", \"0\");\n            impactRing2.setAttribute(\"opacity\", \"0\");\n          }\n        }\n\n        // Crown Shatter Fragments Flying Outward (1.05s -> 2.85s)\n        for (let i = 0; i < fragments.length; i++) {\n          const fr = fragments[i];\n          if (t >= 1.05 && t <= 2.85) {\n            const dt = t - 1.05;\n            const prog = dt / 1.8;\n            const x = 720 + fr.vx * dt;\n            const y = 610 + fr.vy * dt + 220 * dt * dt;\n            const rot = fr.spin * dt;\n            const alpha = prog < 0.7 ? 1 : 1 - (prog - 0.7) / 0.3;\n            fr.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n            fr.el.setAttribute(\"transform\", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);\n          } else {\n            fr.el.setAttribute(\"opacity\", \"0\");\n          }\n        }\n\n        // 4. Lower Half: Sage Vishrava Blessing & Sacred Janeu Golden Glow\n        const auraPulse = 1 + 0.08 * Math.sin(t * 3.2);\n        janeuAuraOrb.setAttribute(\n          \"transform\",\n          `translate(695 1340) scale(${auraPulse.toFixed(3)}) translate(-695 -1340)`\n        );\n\n        const blessAngle = Math.sin(t * 2.6) * 3.5;\n        sageBlessingArm.setAttribute(\"transform\", `rotate(${blessAngle.toFixed(2)} 75 -140)`);\n        const sparkScale = 0.85 + 0.25 * Math.sin(t * 5.5);\n        blessingSpark.setAttribute(\n          \"transform\",\n          `translate(242 -192) scale(${sparkScale.toFixed(3)}) translate(-242 192)`\n        );\n\n        // Sacred White Janeu Highlight Pulse (Strengthens after 1.6s when lower half is emphasized)\n        const janeuGlow = t >= 1.6 ? 0.85 + 0.15 * Math.sin((t - 1.6) * 6) : 0.7;\n        sacredJaneu.setAttribute(\"opacity\", janeuGlow.toFixed(3));\n\n        // 5. Rising Golden Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 6. Bold Hindi Keywords (\"क्षत्रिय संहार\" & \"ब्राह्मण पुत्र\")\n        if (t >= 0.85) {\n          const p1 = clamp01((t - 0.85) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwKshatriyaVow.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwKshatriyaVow.setAttribute(\"transform\", `translate(540 175) scale(${s1.toFixed(3)})`);\n        } else {\n          kwKshatriyaVow.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 2.15) {\n          const p2 = clamp01((t - 2.15) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1835, 1785, easeOutCubic(p2));\n          kwBrahminSon.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwBrahminSon.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwBrahminSon.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 6 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #040612;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vertical Full-Bleed Stage Container (Zero UI Buttons) */\n    .stage-wrapper {\n      position: relative;\n      height: 100vh;\n      aspect-ratio: 9 / 16;\n      max-width: 100vw;\n      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);\n      background: #080c24;\n      overflow: hidden;\n      border-radius: 14px;\n    }\n\n    svg#scene {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"stage-wrapper\" id=\"stage\">\n    <svg id=\"scene\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <\!-- Himalayan Cosmic Indigo & Silver Twilight Sky -->\n        <radialGradient id=\"kailashSkyGrad\" cx=\"50%\" cy=\"32%\" r=\"74%\">\n          <stop offset=\"0%\" stop-color=\"#2c4c8c\" />\n          <stop offset=\"38%\" stop-color=\"#14234a\" />\n          <stop offset=\"76%\" stop-color=\"#091026\" />\n          <stop offset=\"100%\" stop-color=\"#030612\" />\n        <\/radialGradient>\n\n        <\!-- Lord Shiva Divine Halo -->\n        <radialGradient id=\"shivaDivineHalo\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"0%\" stop-color=\"#ffffff\" stop-opacity=\"0.95\" />\n          <stop offset=\"32%\" stop-color=\"#a6e3ff\" stop-opacity=\"0.62\" />\n          <stop offset=\"68%\" stop-color= y=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const starsLayer = document.getElementById(\"stars-layer\");\n      const shivaHalo = document.getElementById(\"shiva-halo\");\n      const shivaMandala = document.getElementById(\"shiva-mandala\");\n      const lordShivaFig = document.getElementById(\"lord-shiva-fig\");\n\n      const energyStreamLeft = document.getElementById(\"energy-stream-left\");\n      const energyStreamRight = document.getElementById(\"energy-stream-right\");\n      const harmonyBondLine = document.getElementById(\"harmony-bond-line\");\n\n      const parshuramKneeling = document.getElementById(\"parshuram-kneeling\");\n      const ravanaKneeling = document.getElementById(\"ravana-kneeling\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwSameGuru = document.getElementById(\"kw-same-guru\");\n      const kwAgainstDharma = document.getElementById(\"kw-against-dharma\");\n\n      // 1. Build 42 Twinkling Himalayan Stars\n      const stars = [];\n      for (let i = 0; i < 42; i++) {\n        const star = document.createElementNS(svgNS, \"circle\");\n        const r = 1.8 + (i % 4) * 0.9;\n        star.setAttribute(\"cx\", (60 + ((i * 173) % 960)).toString());\n        star.setAttribute(\"cy\", (70 + ((i * 119) % 880)).toString());\n        star.setAttribute(\"r\", r.toFixed(1));\n        star.setAttribute(\"fill\", i % 3 === 0 ? \"#ffe799\" : \"#ffffff\");\n        starsLayer.appendChild(star);\n        stars.push({ el: star, speed: 2.2 + (i % 5) * 0.8, phase: i * 0.9 });\n      }\n\n      // 2. Build 32 Rising Golden & Celestial Blue Light Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, tAttribute(\n          \"transform\",\n          `translate(540 540) scale(${haloScale.toFixed(3)}) translate(-540 -540)`\n        );\n        shivaMandala.setAttribute(\"transform\", `rotate(${((t * 12) % 360).toFixed(2)} 540 540)`);\n\n        // 4. Flowing Golden Energy Streams from Shiva to Both Disciples (`stroke-dashoffset`)\n        const streamReveal = clamp01((t - 0.35) / 0.55);\n        const dashOffset = -(t * 190);\n        energyStreamLeft.setAttribute(\"opacity\", streamReveal.toFixed(3));\n        energyStreamRight.setAttribute(\"opacity\", streamReveal.toFixed(3));\n        energyStreamLeft.setAttribute(\"stroke-dashoffset\", dashOffset.toFixed(1));\n        energyStreamRight.setAttribute(\"stroke-dashoffset\", dashOffset.toFixed(1));\n\n        // Sacred Horizontal Bond Between Both Disciples Appears After 1.6s\n        const bondAlpha = clamp01((t - 1.6) / 0.5) * (0.55 + 0.25 * Math.sin(t * 5));\n        harmonyBondLine.setAttribute(\"opacity\", bondAlpha.toFixed(3));\n\n        // 5. Reverent Breathing / Bowing Motion on Both Kneeling Disciples\n        const bowL = Math.sin(t * 2.2) * 1.5;\n        const bowR = -Math.sin(t * 2.2) * 1.5;\n        parshuramKneeling.setAttribute(\"transform\", `translate(255 1340) rotate(${bowL.toFixed(2)})`);\n        ravanaKneeling.setAttribute(\"transform\", `translate(825 1340) rotate(${bowR.toFixed(2)})`);\n\n        // 6. Rising Light Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 7. Bold Hindi Keywords (\"एक ही गुरु — महादेव\" & \"युद्ध धर्म विरुद्ध\")\n        if (t >= 0.75) {\n          const p1 = clamp01((t - 0.75) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwSameGuru.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwSameGuru.setAttribute(\"transform\", `translate(540 195) scale(${s1.toFixed(3)})`);\n        } else {\n          kwSameGuru.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 2.05) {\n          const p2 = clamp01((t - 2.05) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1815, 1765, easeOutCubic(p2));\n          kwAgainstDharma.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwAgainstDharma.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwAgainstDharma.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 7 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #050208;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vert \n        chakraBlades.appendChild(blade);\n      }\n\n      // 2. Build 40 Cosmic Background Stars\n      const stars = [];\n      for (let i = 0; i < 40; i++) {\n        const st = document.createElementNS(svgNS, \"circle\");\n        st.setAttribute(\"cx\", (60 + ((i * 179) % 960)).toString());\n        st.setAttribute(\"cy\", (60 + ((i * 257) % 1800)).toString());\n        st.setAttribute(\"r\", (1.8 + (i % 4) * 0.8).toFixed(1));\n        st.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe799\" : \"#ffffff\");\n        starsLayer.appendChild(st);\n        stars.push({ el: st, speed: 2.5 + (i % 5) * 0.7, phase: i * 0.8 });\n      }\n\n      // 3. Build 28 Radial Warp Speed Light Streaks\n      const streaks = [];\n      for (let i = 0; i < 28; i++) {\n        const line = document.createElementNS(svgNS, \"line\");\n        line.setAttribute(\"stroke\", i % 2 === 0 ? \"#ffd966\" : \"#ff881a\");\n        line.setAttribute(\"stroke-width\", i % 3 === 0 ? \"4\" : \"2.5\");\n        line.setAttribute(\"stroke-linecap\", \"round\");\n        warpStreaksLayer.appendChild(line);\n\n        const rad = ((i * 360) / 28) * (Math.PI / 180);\n        streaks.push({\n          el: line,\n          rad,\n          speed: 520 + (i % 6) * 110,\n          offset: (i * 140) % 700,\n          len: 75 + (i % 4) * 35\n        });\n      }\n\n      // 4. Build 32 Rising Golden Ember Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 4) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff8c1a\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 85 + ((i * 101) % 910),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 215 + (i % 7) * 42,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeInOutCubic(t) {\n        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Twinkling Stars\n        for (let i = 0; i < stars.length; i++) {\n          const st = stars[i];\n          const alpha = 0.25 + 0.75 * Math.abs(Math.sin(t * st.speed + st.phase));\n          st.el.setAttribute(\"opacity\", alpha.toFixed(2));\n        }\n\n        // 2. Radial Warp Light Streaks Racing Outward from Center\n        for (let i = 0; i < streaks.length; i++) {\n          const sr = streaks[i];\n          const dist = 260 + ((sr.offset + t * sr.speed) % 740);\n          const x1 = 540 + Math.cos(sr.rad) * dist;\n          const y1 = 960 + Math.sin(sr.rad) * dist;\n          const x2 = 540 + Math.cos(sr.rad) * (dist + sr.len);\n          const y2 = 960 + Math.sin(sr.rad) * (dist + sr.len);\n          const alpha = dist < 340 ? (dist - 260) / 80 : dist > 860 ? (1000 - dist) / 140 : 0.85;\n          sr.el.setAttribute(\"x1\", x1.toFixed(1));\n          sr.el.setAttribute(\"y1\", y1.toFixed(1));\n          sr.el.setAttribute(\"x2\", x2.toFixed(1));\n          sr.el.setAttribute(\"y2\", y2.toFixed(1));\n          sr.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 3. Rapid Ancient Palm-Leaf Scroll Unrolling (0.15s -> 0.95s)\n        const unrollProg = easeOutBack(clamp01((t - 0.15) / 0.80));\n        const halfOpenH = lerp(22, 540, unrollProg);\n        const topRollerY = 960 - halfOpenH;\n        const botRollerY = 960 + halfOpenH;\n\n        scrollRollerTop.setAttribute(\"transform\", `translate(540 ${topRollerY.toFixed(1)})`);\n        scrollRollerBottom.setAttribute(\"transform\", `translate(540 ${botRollerY.toFixed(1)})`);\n        scrollClipRect.setAttribute(\"y\", topRollerY.toFixed(1));\n        scrollClipRect.setAttribute(\"height\", Math.max(0, botRollerY - topRollerY).toFixed(1));\n\n        // 4. Dramatic 2D Snap-Zoom Into Cosmic Chakra Core (Starts at 2.15s)\n        let camScale = 1.0;\n        if (t < 2.15) {\n          camScale = lerp(0.96, 1.04, easeOutCubic(t / 2.15));\n        } else {\n          const snapProg = easeInOutCubic(clamp01((t - 2.15) / 1.35));\n          const holdPulse = t > 3.5 ? Math.sin((t - 3.5) * 4) * 0.025 : 0;\n          camScale = lerp(1.04, 1.34, snapProg) + holdPulse;\n        }\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 960) scale(${camScale.toFixed(4)}) translate(-540 -960)`\n        );\n\n        // 5. Spinning Blazing Kaal-Chakra & High-Contrast Core Glow\n        const outerSpin = (t * 68) % 360;\n        const innerSpin = -(t * 42) % 360;\n        cosmicChakraOuter.setAttribute(\"transform\", `rotate(${outerSpin.toFixed(2)} 540 960)`);\n        cosmicChakraInner.setAttribute(\"transform\", `rotate(${innerSpin.toFixed(2)} 540 960)`);\n\n        const firePulse = 1 + 0.12 * Math.sin(t * 6.5);\n        coreFireAura.setAttribute(\n          \"transform\",\n          `translate(540 960) scale(${firePulse.toFixed(3)}) translate(-540 -960)`\n        );\n\n        // Hourglass Flowing Sand Stream\n        sandStream.setAttribute(\"stroke-dashoffset\", (-(t * 95)).toFixed(1));\n\n        // 6. Shockwave Rings Bursting Outward at Scroll Snap (0.85s) & Zoom Snap (2.20s)\n        if (t >= 0.85 && t <= 1.85) {\n          const sw = (t - 0.85) / 1.0;\n          const s = lerp(0.5, 2.5, easeOutCubic(sw));\n          shockwave1.setAttribute(\"opacity\", (1 - sw).toFixed(3));\n          shockwave1.setAttribute(\"transform\", `translate(540 960) scale(${s.toFixed(3)}) translate(-540 -960)`);\n        } else {\n          shockwave1.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 2.20 && t <= 3.25) {\n          const sw = (t - 2.20) / 1.05;\n          const s = lerp(0.4, 2.3, easeOutCubic(sw));\n          shockwave2.setAttribute(\"opacity\", (1 - sw).toFixed(3));\n          shockwave2.setAttribute(\"transform\", `translate(540 960) scale(${s.toFixed(3)}) translate(-540 -960)`);\n        } else {\n          shockwave2.setAttribute(\"opacity\", \"0\");\n        }\n\n        // 7. Rising Golden Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 8. Bold Hindi Keywords (\"तीसरा सबसे बड़ा कारण\" & \"नियति का विधान\")\n        if (t >= 0.70) {\n          const p1 = clamp01((t - 0.70) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwThirdReason.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwThirdReason.setAttribute(\"transform\", `translate(540 215) scale(${s1.toFixed(3)})`);\n        } else {\n          kwThirdReason.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 1.95) {\n          const p2 = clamp01((t - 1.95) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1795, 1745, easeOutCubic(p2));\n          kwDestinyDecree.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwDestinyDecree.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwDestinyDecree.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 8 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #040614;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vertical Full-Bleed Stage Container (Zero UI Buttons) */\n    .stage-wrapper {\n      position: relative;\n      height: 100vh;\n      aspect-ratio: 9 / 16;\n      max-width: 100vw;\n      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);\n      background: #0a102b;\n      overflow: hidden;\n      border-radius: 14px;\n    }\n\n    svg#scene {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"stage-wrapper\" id=\"stage\">\n    <svg id=\"scene\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <\!-- Cosmic Royal Blue & Warm Gol dth=\"570\" height=\"92\" rx=\"20\" fill=\"#070e29\" fill-opacity=\"0.92\" stroke=\"url(#goldMetal)\" stroke-width=\"4.5\" />\n          <text x=\"0\" y=\"8\" font-family=\"'Noto Sans Devanagari', sans-serif\" font-weight=\"900\" font-size=\"72\" letter-spacing=\"2\" stroke=\"#040817\" stroke-width=\"14\" stroke-linejoin=\"round\" paint-order=\"stroke\" fill=\"url(#keywordGoldGrad)\">श्रीराम अवतार<\/text>\n        <\/g>\n      <\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 5: ORNATE CRIMSON & GOLD MITHILA BORDER             -->\n      <\!-- ========================================================= -->\n      <g pointer-events=\"none\">\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"#180a1c\" stroke-width=\"24\" />\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"7\" />\n        <rect x=\"34\" y=\"34\" width=\"1012\" height=\"1852\" rx=\"20\" fill=\"none\" stroke=\"#ffcf54\" stroke-width=\"2.5\" stroke-dasharray=\"16 10\" />\n        <g fill=\"url(#goldMetal)\" stroke=\"#180a1c\" stroke-width=\"3\">\n          <circle cx=\"44\" cy=\"44\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"44\" r=\"18\" />\n          <circle cx=\"44\" cy=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const starsLayer = document.getElementById(\"stars-layer\");\n\n      const brahmaAura = document.getElementById(\"brahma-aura\");\n      const celestialWheelOuter = document.getElementById(\"celestial-wheel-outer\");\n      const wheelSpokes = document.getElementById(\"wheel-spokes\");\n      const humanOpeningPortal = document.getElementById(\"human-opening-portal\");\n      const lordBrahmaFig = document.getElementById(\"lord-brahma-fig\");\n\n      const destinyBeamGroup = document.getElementById(\"destiny-beam-group\");\n      const arrowCoreLaser = document.getElementById(\"arrow-core-laser\");\n\n      const ramHalo = document.getElementById(\"ram-halo\");\n      const lordRamFig = document.getElementById(\"lord-ram-fig\");\n      const bowstringPath = document.getElementById(\"bowstring-path\");\n      const divineArrowGroup = document.getElementById(\"divine-arrow-group\");\n      const arrowTipSpark = document.getElementById(\"arrow-tip-spark\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwBrahmaBoon = document.getElementById(\"kw-brahma-boon\");\n      const kwShriramAvatar = document.getElementById(\"kw-shriram-avatar\");\n\n      // 1. Build 12 Vedic Spokes on Brahma's Celestial Decree Wheel\n      for (let i = 0; i < 12; i++) {\n        const angle = (i * 360) / 12;\n        const spoke = document.createElementNS(svgNS, \"line\");\n        spoke.setAttribute(\"x1\", \"0\");\n        spoke.setAttribute(\"y1\", \"-265\");\n        spoke.setAttribute(\"x2\", \"0\");\n        spoke.setAttribute(\"y2\", \"-305\");\n        spoke.setAttribute(\"stroke\", \"#ffd859\");\n        spoke.setAttribute(\"stroke-width\", \"4\");\n        spoke.setAttribute(\"transform\", `rotate(${angle})`);\n        wheelSpokes.appendChild(spoke);\n      }\n\n      // 2. Build 42 Twinkling Cosmic Stars\n      const stars = [];\n      for (let i = 0; i < 42; i++) {\n        const st = document.createElementNS(svgNS, \"circle\");\n        st.setAttribute(\"cx\", (60 + ((i * 173) % 960)).toString());\n        st.setAttribute(\"cy\", (60 + ((i * 251) % 1800)).toString());\n        st.setAttribute(\"r\", (1.8 + (i % 4) * 0.8).toFixed(1));\n        st.setAttribute(\"fill\", i % 3 === 0 ? \"#ffe799\" : \"#ffffff\");\n        starsLayer.appendChild(st);\n        stars.push({ el: st, speed: 2.3 + (i % 5) * 0.7, phase: i * 0.85 });\n      }\n\n      // 3. Build 32 Rising Golden Ember Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 4) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#87c5eb\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 85 + ((i * 101) % 910),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 205 + (i % 7) * 40,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Twinkling Stars\n        for (let i = 0; i < stars.length; i++) {\n          const st = stars[i];\n          const alpha = 0.25 + 0.75 * Math.abs(Math.sin(t * st.speed + st.phase));\n          st.el.setAttribute(\"opacity\", alpha.toFixed(2));\n        }\n\n        // 2. Smooth Camera Push-In across 5.0 Seconds\n        const camZoom = lerp(0.99, 1.06, easeOutCubic(clamp01(t / 5.0)));\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 960) scale(${camZoom.toFixed(4)}) translate(-540 -960)`\n        );\n\n        // 3. Top Realm: Lord Brahma Levitation & Celestial Decree Wheel Rotation\n        const brahmaLev = Math.sin(t * 2.4) * 7;\n        lordBrahmaFig.setAttribute(\"transform\", `translate(0 ${(-10 + brahmaLev).toFixed(1)})`);\n\n        celestialWheelOuter.setAttribute(\"transform\", `rotate(${((t * 18) % 360).toFixed(2)})`);\n        const brahmaAuraScale = 1 + 0.07 * Math.sin(t * 2.8);\n        brahmaAura.setAttribute(\"transform\", `scale(${brahmaAuraScale.toFixed(3)})`);\n\n        // Pulse the Human-Shaped Opening Portal in Ravana's Boon Shield\n        const portalPulse = 1 + 0.10 * Math.sin(t * 5.0);\n        humanOpeningPortal.setAttribute(\n          \"transform\",\n          `translate(0 215) scale(${portalPulse.toFixed(3)})`\n        );\n\n        // 4. Bottom Realm: Lord Shri Ram Entrance, Bow Draw & Arrow Charging\n        let ramSlideY = 0;\n        if (t < 0.75) {\n          const p = easeOutBack(clamp01(t / 0.75));\n          ramSlideY = lerp(140, 0, p);\n        } else {\n          ramSlideY = Math.sin((t - 0.75) * 2.8) * 5;\n        }\n        lordRamFig.setAttribute(\"transform\", `translate(540 ${(1345 + ramSlideY).toFixed(1)})`);\n\n        const ramHaloScale = 1 + 0.08 * Math.sin(t * 3.2);\n        ramHalo.setAttribute(\n          \"transform\",\n          `translate(540 1340) scale(${ramHaloScale.toFixed(3)}) translate(-540 -1340)`\n        );\n\n        // Bowstring Draw Tension (0.6s -> 1.4s) & Arrow Charging Pulse\n        const drawProg = easeOutCubic(clamp01((t - 0.6) / 0.8));\n        const stringPullY = lerp(-185, -155, drawProg);\n        const arrowShiftY = lerp(-20, 10, drawProg);\n        bowstringPath.setAttribute(\"points\", `-215,-185 0,${stringPullY.toFixed(1)} 215,-185`);\n        divineArrowGroup.setAttribute(\"transform\", `translate(0 ${arrowShiftY.toFixed(1)})`);\n\n        const sparkScale = 0.8 + 0.35 * Math.sin(t * 8.0);\n        arrowTipSpark.setAttribute(\n          \"transform\",\n          `translate(0 -350) scale(${sparkScale.toFixed(3)}) translate(0 350)`\n        );\n\n        // 5. Divine Energy Beam Charging Upward Into the Human Opening Portal (1.3s -> 5.0s)\n        const beamFade = clamp01((t - 1.3) / 0.45);\n        const beamPulse = 0.72 + 0.28 * Math.sin(t * 7.0);\n        destinyBeamGroup.setAttribute(\"opacity\", (beamFade * beamPulse).toFixed(3));\n        arrowCoreLaser.setAttribute(\"stroke-dashoffset\", (-(t * 240)).toFixed(1));\n\n        // 6. Rising Golden Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 7. Bold Hindi Keywords (\"ब्रह्मा का वरदान\" & \"श्रीराम अवतार\")\n        if (t >= 0.65) {\n          const p1 = clamp01((t - 0.65) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwBrahmaBoon.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwBrahmaBoon.setAttribute(\"transform\", `translate(540 175) scale(${s1.toFixed(3)})`);\n        } else {\n          kwBrahmaBoon.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 1.85) {\n          const p2 = clamp01((t - 1.85) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1835, 1785, easeOutCubic(p2));\n          kwShriramAvatar.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwShriramAvatar.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwShriramAvatar.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 9 (5s 9:16 SVG)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #070309;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vertical Full-Bleed Stage Container (Zero UI Buttons) */\n    .stage-wrapper {\n      position: relative;\n      height: 100vh;\n      aspect-ratio: 9 / 16;\n      max-width: 100vw;\n      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);\n      background: #1a0714;\n      overflow: hidden;\n      border-radius: 14px;\n    }\n\n    svg#scene {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"stage-wrapper\" id=\"stage\">\n    <svg id=\"scene\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <\!-- Mithila Royal Court Warm Saffron, Crimson & Gold Gradient -->\n        <radialGradient id=\"mithilaCourtBg\" cx=\"50%\" cy=\"44%\" r=\"76%\">\n          <stop offset=\"0%\" stop-color=\"#c95b18\" />\n          <stop offset=\"38%\" stop-color=\"#6e1624\" />\n          <stop offset=\"76%\" stop-color=\"#2b0818\" />\n          <stop offset=\"100%\" stop-color=\"#11030b\" />\n        <\/radialGradient>\n\n        <\!-- Divine Vaishnava Ener =\"#b35a24\" />\n        <\/linearGradient>\n\n        <\!-- Lord Shri Ram Regal Blue Skin Tone (Consistent with Sentence 8) -->\n        <linearGradient id=\"ramBlueSkin\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#87c5eb\" />\n          <stop offset=\"55%\" stop-color=\"#488ec4\" />\n          <stop offset=\"100%\" stop-color=\"#215585\" />\n        <\/linearGradient>\n\n        <\!-- Saffron Cloth (Parshuram) -->\n        <linearGradient id=\"saffronCloth\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#ff7a17\" />\n          <stop offset=\"55%\" stop-color=\"#de4508\" />\n          <stop offset=\"100%\" stop-color=\"#8f1f03\" />\n        <\/linearGradient>\n\n        <\!-- Pitambara Saffron-Gold Dhoti (Shri Ram) -->\n        <linearGradient id=\"pitambaraCloth\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#ffaa1d\" />\n          <stop offset=\"55%\" stop-color=\"#e66409\" />\n          <stop offset=\"100%\" stop-color=\"#962d03\" />\n        <\/linearGradient>\n\n        <\!-- Radiant Gold Metal -->\n        <linearGradient id=\"goldMetal\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#fff8c7\" />\n          <stop offset=\"35%\" stop-color=\"#ffd043\" />\n          <stop offset=\"75%\" stop-color=\"#e08d12\" />\n          <stop offset=\"100%\" stop-color=\"#8c4503\" />\n        <\/linearGradient>\n\n        <\!-- Divine Pinaka Shiva Bow Celestial Blue-Silver Gradient -->\n        <linearGradient id=\"pinakaBowGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#e0f4ff\" />\n          <stop offset=\"45%\" stop-color=\"#76b5e0\" />\n          <stop offset=\"85%\" stop-color=\"#2a5680\" />\n          <stop offset=\"100%\" stop-color=\"#132942\" />\n        <\/linearGradient>\n\n        <\!-- Bold Hindi Keyword Fill -->\n        <linearGradient id
