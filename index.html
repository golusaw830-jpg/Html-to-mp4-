stroke-width=\"3\">\n          <circle cx=\"44\" cy=\"44\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"44\" r=\"18\" />\n          <circle cx=\"44\" cy=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const ramPowerHalo = document.getElementById(\"ram-power-halo\");\n      const ramSacredChakra = document.getElementById(\"ram-sacred-chakra\");\n      const parshuramSourceGlow = document.getElementById(\"parshuram-source-glow\");\n\n      const pHairSway = document.getElementById(\"p-hair-sway\");\n      const pScarfSway = document.getElementById(\"p-scarf-sway\");\n      const parshuramBestowArms = document.getElementById(\"parshuram-bestow-arms\");\n      const ramChestCore = document.getElementById(\"ram-chest-core\");\n\n      const transferStreamMain = document.getElementById(\"transfer-stream-main\");\n      const transferStreamSub = document.getElementById(\"transfer-stream-sub\");\n      const transferOrbsLayer = document.getElementById(\"transfer-orbs-layer\");\n\n      const bowFractureSparks = document.getElementById(\"bow-fracture-sparks\");\n      const embersLayer = document.getElementById(\"embers-layer\");\n\n      const kwSitaSwayamvar = document.getElementById(\"kw-sita-swayamvar\");\n      const kwShaktiTransfer = document.getElementById(\"kw-shakti-transfer\");\n\n      // 1. Build 14 Luminous Energy Orbs Flowing From Parshuram (495, 955) to Shri Ram (755, 985)\n      const transferOrbs = [];\n      for (let i = 0; i < 14; i++) {\n        const orb = document.createElementNS(svgNS, \"circle\");\n        const r = 5 + (i % 4) * 2.2;\n        orb.setAttribute(\"r\", r.toFixed(1));\n        orb.setAttribute(\"fill\", i % 2 === 0 ? \"#ffffff\" : \"#ffe066\");\n        transferOrbsLayer.appendChild(orb);\n\n        transferOrbs.push({\n          el: orb,\n          offset: i / 14,\n          speed: 0.72 + (i % 3) * 0.12,\n          arcLift: -45 - (i % 4) * 14\n        });\n      }\n\n      // 2. Build 18 Fading Sparks Rising From the Broken Pinaka Shiva Bow Seam (540, 1545)\n      const bowSparks = [];\n      for (let i = 0; i < 18; i++) {\n        const sp = document.createElementNS(svgNS, \"circle\");\n        sp.setAttribute(\"r\", (2.5 + (i % 3) * 1.2).toFixed(1));\n        sp.setAttribute(\"fill\", i % 2 === 0 ? \"#e0f4ff\" : \"#ffd859\");\n        bowFractureSparks.appendChild(sp);\n\n        bowSparks.push({\n          el: sp,\n          driftX: ((i % 7) - 3) * 26,\n          speedY: 75 + (i % 5) * 22,\n          phase: (i * 0.35) % 1\n        });\n      }\n\n      // 3. Build 32 Rising Golden Ember Particles\n      const embers = [];\n      for (let i = 0; i < 32; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 4) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe680\" : \"#ff9d2e\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 85 + ((i * 101) % 910),\n          startY: 1850 - ((i * 131) % 720),\n          speedY: 205 + (i % 7) * 40,\n          wobbleAmp: 16 + (i % 4) * 8,\n          wobbleFreq: 2.1 + (i % 5) * 0.45,\n          phase: i * 0.65\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Gentle Camera Push-In across 5.0 Seconds\n        const camZoom = lerp(0.99, 1.06, easeOutCubic(clamp01(t / 5.0)));\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(540 960) scale(${camZoom.toFixed(4)}) translate(-540 -960)`\n        );\n\n        // 2. Gentle Robe & Hair Sway Animation on Lord Parshuram\n        const hairRot = Math.sin(t * 3.2) * 3.5;\n        const scarfRot = Math.sin(t * 2.8) * 4.5;\n        const armPulse = Math.sin(t * 2.5) * 2.0;\n        pHairSway.setAttribute(\"transform\", `rotate(${hairRot.toFixed(2)} -35 -260)`);\n        pScarfSway.setAttribute(\"transform\", `rotate(${scarfRot.toFixed(2)} -65 -90)`);\n        parshuramBestowArms.setAttribute(\"transform\", `rotate(${armPulse.toFixed(2)} 50 -145)`);\n\n        // 3. Flowing Golden Vaishnava Energy Stream (Left -> Right)\n        const streamReveal = clamp01((t - 0.35) / 0.55);\n        const dashOffset = -(t * 240);\n        transferStreamMain.setAttribute(\"opacity\", streamReveal.toFixed(3));\n        transferStreamSub.setAttribute(\"opacity\", (streamReveal * 0.85).toFixed(3));\n        transferStreamMain.setAttribute(\"stroke-dashoffset\", dashOffset.toFixed(1));\n        transferStreamSub.setAttribute(\"stroke-dashoffset\", (dashOffset * 0.85).toFixed(1));\n\n        // Luminous Orbs Traveling Along Quadratic Bezier Arc from Parshuram (495,955) to Shri Ram (755,985)\n        for (let i = 0; i < transferOrbs.length; i++) {\n          const ob = transferOrbs[i];\n          const prog = (ob.offset + t * ob.speed) % 1;\n          const x = lerp(495, 755, prog);\n          const baseLineY = lerp(955, 985, prog);\n          const y = baseLineY + Math.sin(prog * Math.PI) * ob.arcLift;\n          const alpha = streamReveal * Math.sin(prog * Math.PI);\n          ob.el.setAttribute(\"cx\", x.toFixed(1));\n          ob.el.setAttribute(\"cy\", y.toFixed(1));\n          ob.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 4. Warm Golden Halo Expansion Behind Lord Shri Ram as He Absorbs Power\n        const powerGrowth = lerp(0.85, 1.24, easeOutCubic(clamp01((t - 0.5) / 4.2)));\n        const haloPulse = powerGrowth + 0.05 * Math.sin(t * 4.5);\n        ramPowerHalo.setAttribute(\n          \"transform\",\n          `translate(815 960) scale(${haloPulse.toFixed(3)}) translate(-815 -960)`\n        );\n        ramSacredChakra.setAttribute(\"transform\", `rotate(${((t * 16) % 360).toFixed(2)} 815 960)`);\n\n        const chestCoreScale = 0.85 + 0.25 * Math.sin(t * 6.0);\n        ramChestCore.setAttribute(\n          \"transform\",\n          `translate(-55 -155) scale(${chestCoreScale.toFixed(3)}) translate(55 155)`\n        );\n\n        const sourcePulse = 0.92 + 0.08 * Math.cos(t * 4.5);\n        parshuramSourceGlow.setAttribute(\n          \"transform\",\n          `translate(315 975) scale(${sourcePulse.toFixed(3)}) translate(-315 -975)`\n        );\n\n        // 5. Fading Sparks Rising From Broken Pinaka Shiva Bow\n        for (let i = 0; i < bowSparks.length; i++) {\n          const sp = bowSparks[i];\n          const p = (sp.phase + t * 0.45) % 1;\n          const x = 540 + sp.driftX * p;\n          const y = 1545 - p * sp.speedY * 2.2;\n          const alpha = (1 - p) * 0.78;\n          sp.el.setAttribute(\"cx\", x.toFixed(1));\n          sp.el.setAttribute(\"cy\", y.toFixed(1));\n          sp.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 6. Rising Golden Spark Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 7. Bold Hindi Keywords (\"सीता स्वयंवर\" & \"शक्ति समर्पण\")\n        if (t >= 0.65) {\n          const p1 = clamp01((t - 0.65) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwSitaSwayamvar.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwSitaSwayamvar.setAttribute(\"transform\", `translate(540 195) scale(${s1.toFixed(3)})`);\n        } else {\n          kwSitaSwayamvar.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 1.95) {\n          const p2 = clamp01((t - 1.95) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1815, 1765, easeOutCubic(p2));\n          kwShaktiTransfer.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwShaktiTransfer.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwShaktiTransfer.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Parshuram vs Ravana - Sentence 10 (5s Seamless Loop)<\/title>\n  <style>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background-color: #090404;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      overflow: hidden;\n      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;\n    }\n\n    /* 9:16 Vertical Full-Bleed Stage Container (Zero UI Buttons) */\n    .stage-wrapper {\n      position: relative;\n      height: 100vh;\n      aspect-ratio: 9 / 16;\n      max-width: 100vw;\n      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);\n      background: #140504;\n      overflow: hidden;\n      border-radius: 14px;\n    }\n\n    svg#scene {\n      width: 100%;\n      height: 100%;\n      display: block;\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"stage-wrapper\" id=\"stage\">\n    <svg id=\"scene\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\">\n      <defs>\n        <\!-- Exact Crimson & Dark Amber Twilight Sky Gradient Matching Sentence 1 -->\n        <radialGradient id=\"twilightSky\" cx=\"50%\" cy=\"44%\" r=\"74%\" fx=\"50%\" fy=\"44%\">\n          <stop offset=\"0%\" stop-color=\"#ff9124\" />\n          <stop offset=\"28%\" stop-color=\"#c42b12\" />\n          <stop offset=\"64%\" stop-color=\"#590c0b\" />\n          <stop offset=\"100%\" stop-color=\"#170305\" />\n        <\/radialGradient>\n\n        <\!-- Divine Sun Halo Gradient -->\n        <radialGradient id=\"divineHalo\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n          <stop offset=\"0%\" stop-color=\"#fff8cc\" stop-opacity=\"0.98\" />\n          <stop offset=\"35%\" stop-color=\"#ffaa24\" stop-opacity=\"0.58\" />\n          <stop offset=\"72%\" stop-color=\"#d62814\" stop-opacity=\"0.2\" />\n          <stop offset=\"100%\" stop-color=\"#5c0d0c\" stop-opacity=\"0\" />\n        <\/radialGradient>\n\n        <\!-- Radiant Gold Metal Gradient (Consistent with Sentence 1) -->\n        <linearGradient id=\"goldMetal\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#fff8c7\" />\n          <stop offset=\"35%\" stop-color=\"#ffd043\" />\n          <stop offset=\"75%\" stop-color=\"#e08d12\" />\n          <stop offset=\"100%\" stop-color=\"#994e03\" />\n        <\/linearGradient>\n\n        <\!-- Blazing Axe Blade Edge Gradient -->\n        <linearGradient id=\"axeEdgeGlow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n          <stop offset=\"0%\" stop-color=\"#ff9d00\" />\n          <stop offset=\"50%\" stop-color=\"#fff9cf\" />\n          <stop offset=\"100%\" stop-color=\"#ffffff\" />\n        <\/linearGradient>\n\n        <\!-- Wooden Axe Shaft Gradient -->\n        <linearGradient id=\"woodShaft\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n          <stop offset=\"0%\" stop-color=\"#4a1e0b\" />\n          <stop offset=\"45%\" stop-color=\"#8a3d17\" />\n          <stop offset=\"100%\" stop-color=\"#2b0e04\" />\n        <\/linearGradient>\n\n        <\!-- Bold Hindi Keyword Fill -->\n        <linearGradient id=\"keywordGoldGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#ffffff\" />\n          <stop offset=\"32%\" stop-color=\"#ffe785\" />\n          <stop offset=\"75%\" stop-color=\"#ff9900\" />\n          <stop offset=\"100%\" stop-color=\"#d43500\" />\n        <\/linearGradient>\n\n        <\!-- Dark Mountain Silhouette Gradient (Matches Sentence 1 Horizon) -->\n        <linearGradient id=\"mountainGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n          <stop offset=\"0%\" stop-color=\"#38090b\" />\n          <stop offset=\"100%\" stop-color=\"#120305\" />\n        <\/linearGradient>\n\n        <\!-- Intense Golden Glow Filter -->\n        <filter id=\"intenseGoldGlow\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\">\n          <feGaussianBlur stdDeviation=\"14\" result=\"blur\" />\n          <feMerge>\n            <feMergeNode in=\"blur\" />\n            <feMergeNode in=\"SourceGraphic\" />\n          <\/feMerge>\n        <\/filter>\n\n        <\!-- Soft Glow Filter -->\n        <filter id=\"softGoldGlow\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\">\n          <feGaussianBlur stdDeviation=\"7\" result=\"blur\" />\n          <feMerge>\n            <feMergeNode in=\"blur\" />\n            <feMergeNode in=\"SourceGraphic\" />\n          <\/feMerge>\n        <\/filter>\n      <\/defs>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 1: TWILIGHT SKY & SEAMLESS LOOP BACKDROP            -->\n      <\!-- ========================================================= -->\n      <rect width=\"1080\" height=\"1920\" fill=\"url(#twilightSky)\" />\n\n      <\!-- Volumetric Sunbeams -->\n      <g opacity=\"0.2\" fill=\"#ffd97d\">\n        <polygon points=\"540,860 60,0 300,0\" />\n        <polygon points=\"540,860 450,0 630,0\" />\n        <polygon points=\"540,860 780,0 1020,0\" />\n        <polygon points=\"540,860 0,340 0,580\" />\n        <polygon points=\"540,860 1080,340 1080,580\" />\n      <\/g>\n\n      <\!-- Radiant Center Sun Aura -->\n      <circle id=\"sun-aura\" cx=\"540\" cy=\"860\" r=\"560\" fill=\"url(#divineHalo)\" />\n\n      <\!-- Distant Mountains & Earth Horizon Silhouette (Matches Sentence 1) -->\n      <path d=\"M 0 1480 L 180 1310 L 340 1420 L 520 1270 L 730 1410 L 910 1290 L 1080 1430 L 1080 1920 L 0 1920 Z\" fill=\"url(#mountainGrad)\" opacity=\"0.92\" />\n      <path d=\"M 0 1580 Q 540 1500 1080 1590 L 1080 1920 L 0 1920 Z\" fill=\"#120304\" />\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 2: MAIN CAMERA RIG & ROTATING MANDALA               -->\n      <\!-- ========================================================= -->\n      <g id=\"camera-rig\">\n        <\!-- Outer Sacred Mandala Ring -->\n        <g id=\"mandala-outer\" opacity=\"0.58\">\n          <circle cx=\"540\" cy=\"860\" r=\"460\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"4\" stroke-dasharray=\"18 10\" />\n          <circle cx=\"540\" cy=\"860\" r=\"430\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"2\" />\n          <g id=\"mandala-petals\" stroke=\"url(#goldMetal)\" stroke-width=\"2.5\" fill=\"none\"><\/g>\n        <\/g>\n\n        <\!-- Inner Sacred Shatkona Mandala Ring -->\n        <g id=\"mandala-inner\" opacity=\"0.72\">\n          <circle cx=\"540\" cy=\"860\" r=\"325\" fill=\"none\" stroke=\"#ffdf78\" stroke-width=\"3\" stroke-dasharray=\"10 8\" />\n          <polygon points=\"540,545 813,1018 267,1018\" fill=\"none\" stroke=\"#ffd25a\" stroke-width=\"2.5\" />\n          <polygon points=\"540,1175 813,702 267,702\" fill=\"none\" stroke=\"#ffd25a\" stroke-width=\"2.5\" />\n        <\/g>\n\n        <\!-- Expanding Shockwave Rings on Axe Lock Impact -->\n        <circle id=\"lock-shockwave-1\" cx=\"540\" cy=\"860\" r=\"140\" fill=\"none\" stroke=\"#fff3a8\" stroke-width=\"11\" opacity=\"0\" />\n        <circle id=\"lock-shockwave-2\" cx=\"540\" cy=\"860\" r=\"140\" fill=\"none\" stroke=\"#ff9d1c\" stroke-width=\"7\" opacity=\"0\" />\n\n        <\!-- Subtle Rotational Motion Blur Ring During 360-Degree Spin -->\n        <circle id=\"spin-trail-ring\" cx=\"540\" cy=\"860\" r=\"310\" fill=\"none\" stroke=\"url(#axeEdgeGlow)\" stroke-width=\"14\" stroke-dasharray=\"220 340\" opacity=\"0\" filter=\"url(#intenseGoldGlow)\" />\n\n        <\!-- ======================================================= -->\n        <\!-- CENTER HERO: LORD PARSHURAM'S ICONIC GOLDEN PARASHU AXE -->\n        <\!-- ======================================================= -->\n        <g id=\"parashu-hero-pivot\" transform=\"translate(540, 860)\">\n          <\!-- Sacred Pedestal Emblem Behind Axe Base -->\n          <circle cx=\"0\" cy=\"0\" r=\"76\" fill=\"#240605\" fill-opacity=\"0.88\" stroke=\"url(#goldMetal)\" stroke-width=\"5\" />\n          <circle cx=\"0\" cy=\"0\" r=\"56\" fill=\"none\" stroke=\"#ffd86b\" stroke-width=\"2\" stroke-dasharray=\"8 6\" />\n\n          <\!-- Upright Divine Battle-Axe (Parashu) -->\n          <g id=\"parashu-upright-art\">\n            <\!-- Long Ornate Wooden & Gold Shaft -->\n            <line x1=\"0\" y1=\"360\" x2=\"0\" y2=\"-335\" stroke=\"#1a0b05\" stroke-width=\"30\" stroke-linecap=\"round\" />\n            <line x1=\"0\" y1=\"360\" x2=\"0\" y2=\"-335\" stroke=\"url(#woodShaft)\" stroke-width=\"21\" stroke-linecap=\"round\" />\n\n            <\!-- Decorative Gold Grip Rings Along Shaft -->\n            <rect x=\"-15\" y=\"-135\" width=\"30\" height=\"16\" rx=\"4\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"3\" />\n            <rect x=\"-15\" y=\"95\" width=\"30\" height=\"16\" rx=\"4\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"3\" />\n            <rect x=\"-15\" y=\"235\" width=\"30\" height=\"16\" rx=\"4\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"3\" />\n\n            <\!-- Sharp Golden Bottom Spike Finial -->\n            <polygon points=\"-14,355 14,355 0,415\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"4\" stroke-linejoin=\"round\" />\n\n            <\!-- Radiant Golden Crescent Axe Head -->\n            <g filter=\"url(#intenseGoldGlow)\">\n              <\!-- Main Crescent Blade -->\n              <path d=\"M 10 -265 C 155 -345, 285 -255, 275 -115 C 265 15, 145 75, 10 -25 Z\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"6.5\" stroke-linejoin=\"round\" />\n              <\!-- Razor-Sharp Glowing Cutting Edge -->\n              <path d=\"M 225 -245 C 272 -200, 285 -140, 265 -72 C 242 -5, 185 35, 125 32 C 185 10, 225 -45, 232 -118 C 236 -170, 232 -215, 225 -245 Z\" fill=\"url(#axeEdgeGlow)\" />\n              <\!-- Engraved Vedic Mandala Emblem on Blade -->\n              <circle cx=\"135\" cy=\"-125\" r=\"34\" fill=\"none\" stroke=\"#7a3204\" stroke-width=\"4\" />\n              <circle cx=\"135\" cy=\"-125\" r=\"14\" fill=\"#fff7c2\" />\n\n              <\!-- Back Hammer Spike -->\n              <path d=\"M -10 -185 L -115 -145 L -10 -115 Z\" fill=\"url(#goldMetal)\" stroke=\"#1a0b05\" stroke-width=\"5.5\" stroke-linejoin=\"round\" />\n\n              <\!-- Top Trident-Inspired Spear Tip -->\n              <path d=\"M -16 -325 L 0 -425 L 16 -325 Z\" fill=\"url(#axeEdgeGlow)\" stroke=\"#1a0b05\" stroke-width=\"5.5\" stroke-linejoin=\"round\" />\n            <\/g>\n          <\/g>\n        <\/g>\n      <\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 3: RISING GOLDEN EMBER PARTICLES                    -->\n      <\!-- ========================================================= -->\n      <g id=\"embers-layer\"><\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 4: BOLD HINDI KEYWORDS (LOOP HOOK & ENGAGEMENT)     -->\n      <\!-- ========================================================= -->\n      <g id=\"kinetic-keywords\" pointer-events=\"none\" text-anchor=\"middle\">\n        <\!-- Keyword 1: \"सोचने वाली बात...\" -->\n        <g id=\"kw-loop-hook\" transform=\"translate(540, 215)\" opacity=\"0\">\n          <line x1=\"-355\" y1=\"0\" x2=\"-285\" y2=\"0\" stroke=\"url(#goldMetal)\" stroke-width=\"5\" stroke-linecap=\"round\" />\n          <line x1=\"285\" y1=\"0\" x2=\"355\" y2=\"0\" stroke=\"url(#goldMetal)\" stroke-width=\"5\" stroke-linecap=\"round\" />\n          <text x=\"0\" y=\"24\" font-family=\"'Noto Sans Devanagari', sans-serif\" font-weight=\"900\" font-size=\"74\" letter-spacing=\"2\" stroke=\"#1f0704\" stroke-width=\"18\" stroke-linejoin=\"round\" paint-order=\"stroke\" fill=\"url(#keywordGoldGrad)\" filter=\"url(#softGoldGlow)\">सोचने वाली बात...<\/text>\n        <\/g>\n\n        <\!-- Keyword 2: \"हर हर महादेव 🚩\" -->\n        <g id=\"kw-har-har-mahadev\" transform=\"translate(540, 1745)\" opacity=\"0\">\n          <rect x=\"-305\" y=\"-66\" width=\"610\" height=\"98\" rx=\"20\" fill=\"#1c0504\" fill-opacity=\"0.88\" stroke=\"url(#goldMetal)\" stroke-width=\"4.5\" />\n          <text x=\"0\" y=\"8\" font-family=\"'Noto Sans Devanagari', sans-serif\" font-weight=\"900\" font-size=\"70\" letter-spacing=\"2\" stroke=\"#140302\" stroke-width=\"14\" stroke-linejoin=\"round\" paint-order=\"stroke\" fill=\"url(#keywordGoldGrad)\">हर हर महादेव 🚩<\/text>\n        <\/g>\n      <\/g>\n\n      <\!-- ========================================================= -->\n      <\!-- LAYER 5: ORNATE CRIMSON & GOLD MITHILA FRAME BORDER       -->\n      <\!-- ========================================================= -->\n      <g pointer-events=\"none\">\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"#2b0706\" stroke-width=\"24\" />\n        <rect x=\"18\" y=\"18\" width=\"1044\" height=\"1884\" rx=\"28\" fill=\"none\" stroke=\"url(#goldMetal)\" stroke-width=\"7\" />\n        <rect x=\"34\" y=\"34\" width=\"1012\" height=\"1852\" rx=\"20\" fill=\"none\" stroke=\"#ffcf54\" stroke-width=\"2.5\" stroke-dasharray=\"16 10\" />\n        <g fill=\"url(#goldMetal)\" stroke=\"#2b0706\" stroke-width=\"3\">\n          <circle cx=\"44\" cy=\"44\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"44\" r=\"18\" />\n          <circle cx=\"44\" cy=\"1876\" r=\"18\" />\n          <circle cx=\"1036\" cy=\"1876\" r=\"18\" />\n        <\/g>\n      <\/g>\n    <\/svg>\n  <\/div>\n\n  <script>\n    (function () {\n      const svgNS = \"http://www.w3.org/2000/svg\";\n\n      const cameraRig = document.getElementById(\"camera-rig\");\n      const sunAura = document.getElementById(\"sun-aura\");\n      const mandalaOuter = document.getElementById(\"mandala-outer\");\n      const mandalaInner = document.getElementById(\"mandala-inner\");\n      const mandalaPetals = document.getElementById(\"mandala-petals\");\n\n      const parashuHeroPivot = document.getElementById(\"parashu-hero-pivot\");\n      const parashuUprightArt = document.getElementById(\"parashu-upright-art\");\n      const spinTrailRing = document.getElementById(\"spin-trail-ring\");\n      const lockShockwave1 = document.getElementById(\"lock-shockwave-1\");\n      const lockShockwave2 = document.getElementById(\"lock-shockwave-2\");\n\n      const embersLayer = document.getElementById(\"embers-layer\");\n      const kwLoopHook = document.getElementById(\"kw-loop-hook\");\n      const kwHarHarMahadev = document.getElementById(\"kw-har-har-mahadev\");\n\n      // 1. Build 24 Decorative Mandala Petals (Matches Sentence 1 Mandala Geometry)\n      for (let i = 0; i < 24; i++) {\n        const angle = (i * 360) / 24;\n        const petal = document.createElementNS(svgNS, \"path\");\n        petal.setAttribute(\"d\", \"M 540 400 Q 558 365 540 330 Q 522 365 540 400 Z\");\n        petal.setAttribute(\"transform\", `rotate(${angle} 540 860)`);\n        mandalaPetals.appendChild(petal);\n      }\n\n      // 2. Build 36 Rising Golden Ember Particles\n      const embers = [];\n      for (let i = 0; i < 36; i++) {\n        const circle = document.createElementNS(svgNS, \"circle\");\n        const r = 3 + (i % 5) * 1.4;\n        circle.setAttribute(\"r\", r.toFixed(1));\n        circle.setAttribute(\"fill\", i % 2 === 0 ? \"#ffe47a\" : \"#ff8c1a\");\n        circle.setAttribute(\"filter\", \"url(#softGoldGlow)\");\n        embersLayer.appendChild(circle);\n\n        embers.push({\n          el: circle,\n          baseX: 80 + ((i * 97) % 920),\n          startY: 1850 - ((i * 131) % 700),\n          speedY: 215 + (i % 7) * 44,\n          wobbleAmp: 18 + (i % 4) * 10,\n          wobbleFreq: 2.2 + (i % 5) * 0.5,\n          phase: i * 0.7\n        });\n      }\n\n      // Easing Helpers\n      function clamp01(v) {\n        return Math.max(0, Math.min(1, v));\n      }\n      function easeOutCubic(t) {\n        return 1 - Math.pow(1 - t, 3);\n      }\n      function easeOutQuart(t) {\n        return 1 - Math.pow(1 - t, 4);\n      }\n      function easeOutBack(t) {\n        const c1 = 1.70158;\n        const c3 = c1 + 1;\n        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n      }\n      function lerp(a, b, t) {\n        return a + (b - a) * t;\n      }\n\n      // Master 5.0-Second Deterministic Render Function\n      function renderFrameAtTime(t) {\n        // 1. Continuous Mandala Rotation & Pulsing Golden Sun Aura\n        const outerDeg = (t * 16) % 360;\n        const innerDeg = -(t * 24) % 360;\n        mandalaOuter.setAttribute(\"transform\", `rotate(${outerDeg.toFixed(2)} 540 860)`);\n        mandalaInner.setAttribute(\"transform\", `rotate(${innerDeg.toFixed(2)} 540 860)`);\n\n        const auraScale = 1 + 0.08 * Math.sin(t * 3.2);\n        sunAura.setAttribute(\n          \"transform\",\n          `translate(540 860) scale(${auraScale.toFixed(3)}) translate(-540 -860)`\n        );\n\n        // 2. Smooth 360-Degree Spin With Ease-Out Deceleration & Upright Lock (0.15s -> 1.45s)\n        let axeRotDeg = 0;\n        let axeScale = 1.0;\n        let trailOpacity = 0;\n\n        if (t < 0.15) {\n          axeRotDeg = -360;\n          axeScale = lerp(0.75, 0.85, t / 0.15);\n        } else if (t < 1.45) {\n          const spinProg = easeOutQuart((t - 0.15) / 1.30);\n          axeRotDeg = lerp(-360, 0, spinProg);\n          axeScale = lerp(0.85, 1.04, spinProg);\n          trailOpacity = Math.sin(spinProg * Math.PI) * 0.85;\n        } else if (t < 1.75) {\n          // Crisp Upright Lock Settle\n          const settleProg = (t - 1.45) / 0.30;\n          axeRotDeg = Math.sin(settleProg * Math.PI * 2) * 2.5 * (1 - settleProg);\n          axeScale = lerp(1.04, 1.0, easeOutCubic(settleProg));\n        } else {\n          // Commanding Upright Pulse Preparing for Seamless Loop Back to Sentence 1\n          axeRotDeg = 0;\n          axeScale = 1.0 + 0.025 * Math.sin((t - 1.75) * 4.2);\n        }\n\n        parashuHeroPivot.setAttribute(\n          \"transform\",\n          `translate(540 860) scale(${axeScale.toFixed(4)})`\n        );\n        parashuUprightArt.setAttribute(\"transform\", `rotate(${axeRotDeg.toFixed(2)})`);\n\n        spinTrailRing.setAttribute(\"opacity\", clamp01(trailOpacity).toFixed(3));\n        spinTrailRing.setAttribute(\"transform\", `rotate(${(axeRotDeg * 1.4).toFixed(1)} 540 860)`);\n\n        // 3. Camera Micro-Impact Shake & Shockwave Rings When Axe Locks Upright at t = 1.45s\n        let camScale = lerp(0.98, 1.06, easeOutCubic(clamp01(t / 5.0)));\n        let camX = 0;\n        let camY = 0;\n        if (t >= 1.45 && t <= 1.80) {\n          const sp = (t - 1.45) / 0.35;\n          const decay = 1 - sp;\n          camX = Math.sin(sp * Math.PI * 10) * 14 * decay;\n          camY = Math.cos(sp * Math.PI * 8) * 10 * decay;\n          camScale += 0.025 * Math.sin(sp * Math.PI);\n        }\n        cameraRig.setAttribute(\n          \"transform\",\n          `translate(${(540 + camX).toFixed(2)} ${(860 + camY).toFixed(2)}) scale(${camScale.toFixed(4)}) translate(-540 -860)`\n        );\n\n        if (t >= 1.45 && t <= 2.65) {\n          const sw1 = clamp01((t - 1.45) / 0.95);\n          const s1 = lerp(0.4, 2.5, easeOutCubic(sw1));\n          lockShockwave1.setAttribute(\"opacity\", (1 - sw1).toFixed(3));\n          lockShockwave1.setAttribute(\"transform\", `translate(540 860) scale(${s1.toFixed(3)}) translate(-540 -860)`);\n\n          const sw2 = clamp01((t - 1.62) / 0.95);\n          const s2 = lerp(0.4, 2.3, easeOutCubic(sw2));\n          lockShockwave2.setAttribute(\"opacity\", (sw2 > 0 ? 1 - sw2 : 0).toFixed(3));\n          lockShockwave2.setAttribute(\"transform\", `translate(540 860) scale(${s2.toFixed(3)}) translate(-540 -860)`);\n        } else {\n          lockShockwave1.setAttribute(\"opacity\", \"0\");\n          lockShockwave2.setAttribute(\"opacity\", \"0\");\n        }\n\n        // 4. Rising Golden Ember Particles\n        for (let i = 0; i < embers.length; i++) {\n          const em = embers[i];\n          const travel = (t * em.speedY) % 1650;\n          let y = em.startY - travel;\n          if (y < 140) y += 1650;\n          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;\n          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;\n          em.el.setAttribute(\"cx\", x.toFixed(1));\n          em.el.setAttribute(\"cy\", y.toFixed(1));\n          em.el.setAttribute(\"opacity\", clamp01(alpha).toFixed(3));\n        }\n\n        // 5. Bold Hindi Keywords (\"सोचने वाली बात...\" & \"हर हर महादेव 🚩\")\n        if (t >= 0.85) {\n          const p1 = clamp01((t - 0.85) / 0.36);\n          const s1 = easeOutBack(p1);\n          kwLoopHook.setAttribute(\"opacity\", clamp01(p1 * 2).toFixed(3));\n          kwLoopHook.setAttribute(\"transform\", `translate(540 215) scale(${s1.toFixed(3)})`);\n        } else {\n          kwLoopHook.setAttribute(\"opacity\", \"0\");\n        }\n\n        if (t >= 1.85) {\n          const p2 = clamp01((t - 1.85) / 0.38);\n          const s2 = easeOutBack(p2);\n          const slideY = lerp(1795, 1745, easeOutCubic(p2));\n          kwHarHarMahadev.setAttribute(\"opacity\", clamp01(p2 * 2).toFixed(3));\n          kwHarHarMahadev.setAttribute(\"transform\", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);\n        } else {\n          kwHarHarMahadev.setAttribute(\"opacity\", \"0\");\n        }\n      }\n\n      // Live 5.0-Second Seamless Loop\n      const CLIP_DURATION = 5.0;\n      let startTimestamp = performance.now();\n\n      function animationLoop(now) {\n        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;\n        renderFrameAtTime(elapsedSec);\n        requestAnimationFrame(animationLoop);\n      }\n\n      renderFrameAtTime(0);\n      requestAnimationFrame(animationLoop);\n    })();\n  <\/script>\n<\/body>\n<\/html>"];
const CLIP_MS = 5000;   // har clip 5 sec ka hai
const TR_MS   = 700;    // transition ka time (overlap)
const stage = document.getElementById('stage');
const flash = document.getElementById('flash');
const E = 'cubic-bezier(.65,0,.35,1)';

// Sirf video ke liye: clips ke Replay/Download buttons chhupa do (clip ka code nahi badla)
function hideUI(fr){
  try{
    const d = fr.contentDocument, s = d.createElement('style');
    s.textContent = '.controls-bar{display:none !important}';
    d.head.appendChild(s);
  }catch(e){}
}

const transitions = [
  // 0: Zoom-blur crossfade
  (o,n)=>{ if(o) o.animate([{opacity:1,transform:'scale(1)',filter:'blur(0)'},{opacity:0,transform:'scale(.95)',filter:'blur(6px)'}],{duration:TR_MS,easing:E,fill:'forwards'});
           n.animate([{opacity:0,transform:'scale(1.08)',filter:'blur(8px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],{duration:TR_MS,easing:E,fill:'forwards'}); },
  // 1: Golden divine flash
  (o,n)=>{ n.style.opacity=0;
           flash.animate([{opacity:0},{opacity:.95,offset:.45},{opacity:0}],{duration:TR_MS,easing:'ease-in-out'});
           if(o) o.animate([{opacity:1},{opacity:0,offset:.5},{opacity:0}],{duration:TR_MS,fill:'forwards'});
           n.animate([{opacity:0},{opacity:0,offset:.45},{opacity:1}],{duration:TR_MS,fill:'forwards'}); },
  // 2: Slide up + fade
  (o,n)=>{ if(o) o.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-8%)'}],{duration:TR_MS,easing:E,fill:'forwards'});
           n.animate([{opacity:0,transform:'translateY(8%)'},{opacity:1,transform:'translateY(0)'}],{duration:TR_MS,easing:E,fill:'forwards'}); },
  // 3: Circular reveal from centre
  (o,n)=>{ n.style.opacity=1;
           if(o) o.animate([{opacity:1},{opacity:.35}],{duration:TR_MS,fill:'forwards'});
           n.animate([{clipPath:'circle(0% at 50% 45%)'},{clipPath:'circle(75% at 50% 45%)'}],{duration:TR_MS,easing:E,fill:'forwards'}); },
];

let idx = 0, cur = null, tcount = 0;

function play(){
  const fr = document.createElement('iframe');
  fr.setAttribute('scrolling','no');
  fr.style.opacity = 0;
  fr.addEventListener('load', ()=>{
    hideUI(fr);
    const old = cur; cur = fr;
    const t = transitions[tcount++ % transitions.length];
    if(!old){ fr.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'}); }
    else { t(old, fr); setTimeout(()=>old.remove(), TR_MS+80); }
    idx = (idx+1) % CLIPS.length;
    setTimeout(play, CLIP_MS - TR_MS);   // next clip tab shuru hoga jab current ke 5s me 0.7s bache
  }, {once:true});
  fr.srcdoc = CLIPS[idx];   // pehle srcdoc, phir append (warna blank-page ka load event pehle aa jata hai)
  stage.appendChild(fr);
}
play();
</script>
