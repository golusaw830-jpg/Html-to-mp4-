<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwatthama Mani - Scene 9: Yudhishthira's Royal Crown (4.5s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #040208;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #070310;
  }
</style>
</head>
<body>

<!-- 
  ASHWATTHAMA MANI BLUEPRINT — SCENE 9 (00:38.0 – 00:42.5 = 4.5 SECONDS EXACT)
  Voiceover: "और बाद में यही दिव्य मणि युधिष्ठिर के राजमुकुट की शोभा बनी..."
  Visual Blueprint:
  - Dark cosmic royal Hastinapura sanctuary backdrop (#040208 -> #2a124a) matching Scenes 1-8.
  - Ornate, richly sculpted golden Rajmukut (Emperor Yudhishthira's royal crown) resting on a royal crimson-and-gold pedestal.
  - The exact faceted crimson-gold Rudra-Mani gem (from Scenes 1-7) descends into the central crest of the crown,
    locking in with a radiant burst of peaceful golden light waves and rotating Dharma-Chakra mandala!
  - Safe-Zone Compliant Kinetic Hindi Keywords ("युधिष्ठिर का राजमुकुट 👑" & "दिव्य शांति का तेज ✨") with zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. COSMIC ROYAL HASTINAPURA BACKDROP (Matches Scenes 1-8) -->
    <radialGradient id="royalCosmicBg" cx="50%" cy="44%" r="76%">
      <stop offset="0%" stop-color="#311552"/>
      <stop offset="46%" stop-color="#140729"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>

    <!-- Peaceful Golden Crown Halo -->
    <radialGradient id="peaceGoldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="30%" stop-color="#ffe57f" stop-opacity="0.72"/>
      <stop offset="68%" stop-color="#ffaa1d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#140729" stop-opacity="0"/>
    </radialGradient>

    <!-- Locked Rudra-Mani Gem Core Gradient (Exact Match with Scenes 1-7) -->
    <radialGradient id="rudraManiCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffea78"/>
      <stop offset="62%" stop-color="#ff3b1d"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </radialGradient>

    <!-- 2. ROYAL GOLD & VELVET PEDESTAL GRADIENTS -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="36%" stop-color="#ffd043"/>
      <stop offset="76%" stop-color="#c97a0c"/>
      <stop offset="100%" stop-color="#693602"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <linearGradient id="crownInnerVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81428"/>
      <stop offset="55%" stop-color="#5e0713"/>
      <stop offset="100%" stop-color="#290207"/>
    </linearGradient>

    <linearGradient id="pedestalStoneGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e101c"/>
      <stop offset="25%" stop-color="#6e2432"/>
      <stop offset="50%" stop-color="#9e3948"/>
      <stop offset="75%" stop-color="#6e2432"/>
      <stop offset="100%" stop-color="#2e101c"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="superGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.88"/>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 860) scale(1) translate(-540, -860)">

    <!-- LAYER 1: ROYAL COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#royalCosmicBg)"/>
    <g opacity="0.28" stroke="url(#goldMetal)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Twinkling Cosmic Stars -->
    <g id="cosmicStarsLayer"></g>

    <!-- Subtle Hastinapura Royal Palace Columns in Background -->
    <g opacity="0.32" fill="#0d051c">
      <rect x="85" y="160" width="56" height="1340"/>
      <rect x="939" y="160" width="56" height="1340"/>
      <path d="M 85 320 Q 540 180 995 320 L 995 160 L 85 160 Z"/>
    </g>

    <!-- LAYER 2: ROTATING DHARMA-CHAKRA MANDALA BEHIND CROWN -->
    <g id="dharmaMandalaGroup" transform="translate(540, 820)">
      <circle id="crownPeaceAura" cx="0" cy="0" r="470" fill="url(#peaceGoldAura)" opacity="0.84"/>
      <g id="mandalaOuterRing" opacity="0.55">
        <circle cx="0" cy="0" r="420" fill="none" stroke="url(#goldMetal)" stroke-width="4" stroke-dasharray="24 12"/>
        <circle cx="0" cy="0" r="385" fill="none" stroke="#ffe066" stroke-width="2"/>
        <g id="mandalaPetals" stroke="url(#goldMetal)" stroke-width="2.2" fill="#ffbe2e" fill-opacity="0.08"></g>
      </g>
      <g id="mandalaInnerRing" opacity="0.48">
        <polygon points="0,-345 299,172 -299,172" fill="none" stroke="url(#goldBright)" stroke-width="3"/>
        <polygon points="0,345 299,-172 -299,-172" fill="none" stroke="url(#goldBright)" stroke-width="3"/>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 3: ROYAL PEDESTAL & YUDHISHTHIRA'S GOLDEN RAJMUKUT  -->
    <!-- ========================================================= -->
    <g id="royalCrownAssembly" transform="translate(540, 895)" filter="url(#dropShadow)">

      <!-- Royal Velvet & Gold Cushion Pedestal Base -->
      <g transform="translate(0, 195)">
        <!-- Upper Gold-Trimmed Crimson Silk Cushion -->
        <path d="M -265 10 Q 0 -22 265 10 L 285 52 Q 0 28 -285 52 Z" fill="url(#crownInnerVelvet)" stroke="url(#goldMetal)" stroke-width="5"/>
        <path d="M -275 32 Q 0 6 275 32" fill="none" stroke="url(#goldBright)" stroke-width="5" stroke-dasharray="14 8"/>
        <!-- Ornate Tiered Royal Pedestal -->
        <rect x="-310" y="52" width="620" height="34" rx="10" fill="url(#goldMetal)" stroke="#240d02" stroke-width="4.5"/>
        <rect x="-280" y="86" width="560" height="82" fill="url(#pedestalStoneGold)" stroke="url(#goldMetal)" stroke-width="4"/>
        <rect x="-340" y="168" width="680" height="38" rx="12" fill="url(#goldMetal)" stroke="#240d02" stroke-width="4.5"/>
      </g>

      <!-- ======================================================= -->
      <!-- EMPEROR YUDHISHTHIRA'S ORNATE GOLDEN RAJMUKUT (CROWN)   -->
      <!-- ======================================================= -->
      <g id="yudhishthiraRajmukut">
        <!-- Inner Royal Crimson Velvet Cap Visible Between Spires -->
        <path d="M -185 155 C -195 -45, -115 -195, 0 -215 C 115 -195, 195 -45, 185 155 Z"
              fill="url(#crownInnerVelvet)" stroke="#240804" stroke-width="5"/>

        <!-- Back Flanking Golden Lotus Spires -->
        <path d="M -225 145 L -265 -25 L -185 45 L -165 -115 L -95 -15 Z"
              fill="url(#goldMetal)" stroke="#240d02" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 225 145 L 265 -25 L 185 45 L 165 -115 L 95 -15 Z"
              fill="url(#goldMetal)" stroke="#240d02" stroke-width="5" stroke-linejoin="round"/>

        <!-- Grand Central Kirit Mukuta Tiered Tower -->
        <path d="M -155 155 L -128 -110 L -65 -185 L 0 -295 L 65 -185 L 128 -110 L 155 155 Z"
              fill="url(#goldMetal)" stroke="#240d02" stroke-width="6" stroke-linejoin="round"/>

        <!-- Kalasha / Lotus Finial Spire at Crown Peak -->
        <circle cx="0" cy="-315" r="18" fill="url(#goldBright)" stroke="#240d02" stroke-width="4"/>
        <polygon points="0,-368 -12,-332 12,-332" fill="#ffffff" stroke="url(#goldMetal)" stroke-width="3"/>

        <!-- Sculpted Golden Filigree Arches & Jewels on Crown -->
        <path d="M -112 -45 Q 0 -95 112 -45" fill="none" stroke="#fff7c2" stroke-width="5"/>
        <path d="M -135 45 Q 0 -10 135 45" fill="none" stroke="#fff7c2" stroke-width="5"/>
        <circle cx="-82" cy="-28" r="11" fill="#0284c7" stroke="url(#goldBright)" stroke-width="3"/>
        <circle cx="82" cy="-28" r="11" fill="#0284c7" stroke="url(#goldBright)" stroke-width="3"/>
        <circle cx="-118" cy="65" r="11" fill="#16a34a" stroke="url(#goldBright)" stroke-width="3"/>
        <circle cx="118" cy="65" r="11" fill="#16a34a" stroke="url(#goldBright)" stroke-width="3"/>

        <!-- Ornate Lower Diadem Band & Pearl Festoons -->
        <path d="M -215 145 Q 0 112 215 145 L 205 192 Q 0 162 -205 192 Z"
              fill="url(#goldBright)" stroke="#240d02" stroke-width="5.5" stroke-linejoin="round"/>
        <!-- Hanging Pearl Strings Along Crown Rim -->
        <path d="M -185 186 Q -125 212 -65 182 Q 0 212 65 182 Q 125 212 185 186"
              fill="none" stroke="#ffffff" stroke-width="5.5" stroke-dasharray="4 9" stroke-linecap="round"/>

        <!-- CENTRAL ROYAL SOCKET FOR THE RUDRA-MANI (At Local 0, -45 -> Screen 540, 850) -->
        <g transform="translate(0, -45)">
          <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" fill="#24050a" stroke="url(#goldBright)" stroke-width="6"/>
          <circle cx="0" cy="0" r="78" fill="none" stroke="#fff7c2" stroke-width="2.5" stroke-dasharray="10 6"/>
          <!-- Expanding Peace Light Shockwave Rings on Gem Lock -->
          <circle id="crownLockWave1" cx="0" cy="0" r="65" fill="none" stroke="#ffffff" stroke-width="9" opacity="0"/>
          <circle id="crownLockWave2" cx="0" cy="0" r="65" fill="none" stroke="#ffe066" stroke-width="6" opacity="0"/>
        </g>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- LAYER 4: RUDRA-MANI DESCENDING & LOCKING INTO CROWN CREST -->
    <!-- (Exact Faceted Crimson-Gold Design from Scenes 1-7)        -->
    <!-- ========================================================= -->
    <g id="crownManiGem" transform="translate(540, 850)" filter="url(#superGlow)">
      <circle id="maniPeaceHalo" cx="0" cy="0" r="140" fill="url(#peaceGoldAura)"/>
      <g id="maniGemBeat">
        <ellipse cx="0" cy="0" rx="38" ry="52" fill="url(#rudraManiCore)" stroke="#fff7c2" stroke-width="3.5"/>
        <polygon points="0,-36 22,0 0,36 -22,0" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
        <circle cx="-10" cy="-16" r="8.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- Floating Golden Peace Sparkles -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 5: SAFE-ZONE COMPLIANT KINETIC HINDI KEYWORDS       -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(540, 1585)" filter="url(#textShadow)">
      <!-- Keyword 1: युधिष्ठिर का राजमुकुट -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-345" y="-56" width="690" height="94" rx="24" fill="#140624" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="50" font-weight="900" letter-spacing="1">युधिष्ठिर का राजमुकुट 👑</text>
      </g>

      <!-- Keyword 2: दिव्य शांति का तेज -->
      <g id="kw2" opacity="0" transform="translate(0, 114) scale(0.85)">
        <rect x="-295" y="-50" width="590" height="84" rx="42" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900" letter-spacing="1">दिव्य शांति का तेज ✨</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 4.5-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4500; // Exact 4.5s matching Scene 9 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const crownPeaceAura = document.getElementById('crownPeaceAura');
      const mandalaOuterRing = document.getElementById('mandalaOuterRing');
      const mandalaInnerRing = document.getElementById('mandalaInnerRing');
      const mandalaPetals = document.getElementById('mandalaPetals');

      const crownManiGem = document.getElementById('crownManiGem');
      const maniGemBeat = document.getElementById('maniGemBeat');
      const maniPeaceHalo = document.getElementById('maniPeaceHalo');
      const crownLockWave1 = document.getElementById('crownLockWave1');
      const crownLockWave2 = document.getElementById('crownLockWave2');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate 16 Sacred Lotus Petals Around Dharma Mandala
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-385 Q22,-340 0,-300 Q-22,-340 0,-385 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        mandalaPetals.appendChild(p);
      }

      // 2. Generate 36 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 30 Rising Golden Peace Sparkles
      const particles = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.5s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Camera Push-In Toward Yudhishthira's Crown (1.0 -> 1.09)
        const camScale = 1 + easeOutCubic(t) * 0.09;
        cameraRig.setAttribute('transform', `translate(540, 860) scale(${camScale.toFixed(4)}) translate(-540, -860)`);

        // 3. Dharma Mandala Rotation & Peaceful Golden Aura Expansion
        mandalaOuterRing.setAttribute('transform', `rotate(${(t * 48).toFixed(1)})`);
        mandalaInnerRing.setAttribute('transform', `rotate(${(-t * 36).toFixed(1)})`);
        const auraExpand = 450 + easeOutCubic(Math.min(1, t / 0.45)) * 75 + Math.sin(t * Math.PI * 5) * 24;
        crownPeaceAura.setAttribute('r', auraExpand.toFixed(1));

        // 4. Rudra-Mani Gem Descending Into Crown Central Socket (t: 0.0 -> 0.26) & Radiating Peace
        const setProg = easeOutBack(Math.min(1, t / 0.26));
        const gemY = 640 + setProg * 210; // Descends from y=640 into socket at y=850
        const gemScale = 1.18 - setProg * 0.18;
        crownManiGem.setAttribute('transform', `translate(540, ${gemY.toFixed(1)}) scale(${gemScale.toFixed(3)})`);

        const beat = 1 + Math.abs(Math.sin(t * Math.PI * 6)) * 0.12;
        maniGemBeat.setAttribute('transform', `scale(${beat.toFixed(3)})`);
        maniPeaceHalo.setAttribute('r', (135 + Math.sin(t * Math.PI * 6) * 28).toFixed(1));

        // Expanding Peaceful Golden Shockwaves Upon Locking Into Crown (t: 0.24 -> 0.65)
        if (t >= 0.24 && t <= 0.65) {
          const sw1 = (t - 0.24) / 0.41;
          crownLockWave1.setAttribute('r', (65 + easeOutCubic(sw1) * 340).toFixed(1));
          crownLockWave1.setAttribute('opacity', ((1 - sw1) * 0.92).toFixed(2));

          const sw2 = Math.max(0, (t - 0.30) / 0.35);
          crownLockWave2.setAttribute('r', (65 + easeOutCubic(sw2) * 280).toFixed(1));
          crownLockWave2.setAttribute('opacity', (sw2 > 0 ? (1 - sw2) * 0.85 : 0).toFixed(2));
        } else {
          crownLockWave1.setAttribute('opacity', '0');
          crownLockWave2.setAttribute('opacity', '0');
        }

        // 5. Rising Golden Peace Sparkles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 4.5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Safe-Zone Kinetic Hindi Keywords ("युधिष्ठिर का राजमुकुट 👑" & "दिव्य शांति का तेज ✨")
        if (t >= 0.14) {
          const p1 = Math.min(1, (t - 0.14) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
