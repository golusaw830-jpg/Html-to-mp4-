<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 3 - Clip 9: Uttara Kanda Sarga 26 Scroll (5.0s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #05020c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #090314;
  }
</style>
</head>
<body>

<!-- 
  PART 3 - CLIP 9 (5.0 SECONDS EXACT) — HIGH-DETAIL VERSION
  Voiceover: "इसका असली सच वाल्मीकि रामायण के उत्तरकांड में लिखा है!"
  Blueprint Visual: "उत्तरकांड का दिव्य सुनहरा ताड़पत्र स्क्रॉल तेज़ी से खुलता हुआ। कीवर्ड्स: 'उत्तरकांड (सर्ग 26)', 'असली प्रमाण'।"
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. BACKGROUND: Deep Cosmic Indigo & Sacred Sanctuary Night -->
    <radialGradient id="sanctuaryBg" cx="50%" cy="46%" r="76%">
      <stop offset="0%" stop-color="#30124d"/>
      <stop offset="48%" stop-color="#140626"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>

    <!-- Divine Scroll Golden Aura -->
    <radialGradient id="scrollAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="32%" stop-color="#ffe066" stop-opacity="0.58"/>
      <stop offset="70%" stop-color="#ff8c00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#140626" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. ANCIENT GOLDEN PALM-LEAF PARCHMENT & ROLLERS -->
    <linearGradient id="palmParchmentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f4609"/>
      <stop offset="12%" stop-color="#f7ca6d"/>
      <stop offset="50%" stop-color="#fff4cc"/>
      <stop offset="88%" stop-color="#f7ca6d"/>
      <stop offset="100%" stop-color="#8f4609"/>
    </linearGradient>

    <linearGradient id="rollerWoodGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="32%" stop-color="#e39214"/>
      <stop offset="74%" stop-color="#7a3204"/>
      <stop offset="100%" stop-color="#2b0c01"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7bd"/>
      <stop offset="42%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#8c4804"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08809"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scrollShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Dynamic Clip Path for Rapid Scroll Unrolling from Center Outward -->
    <clipPath id="uttaraScrollClip">
      <rect id="scrollClipRect" x="90" y="880" width="900" height="0"/>
    </clipPath>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: DEEP COSMIC BACKDROP & SACRED FRAME -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#sanctuaryBg)"/>

    <!-- Sacred Vedic Frame Filigree -->
    <g opacity="0.28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Rotating Sacred Mandala Behind Scroll -->
    <g id="bgMandala" transform="translate(540, 880)" opacity="0.45">
      <circle cx="0" cy="0" r="490" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="24 12"/>
      <circle cx="0" cy="0" r="420" fill="none" stroke="#ffe066" stroke-width="2"/>
      <polygon points="0,-420 364,210 -364,210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <polygon points="0,420 364,-210 -364,-210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    </g>

    <!-- Radiant Golden Halo & Shockwave Ring -->
    <circle id="scrollHalo" cx="540" cy="880" r="480" fill="url(#scrollAura)" opacity="0.85"/>
    <circle id="unrollShockwave" cx="540" cy="880" r="160" fill="none" stroke="#fff6b3" stroke-width="10" opacity="0"/>

    <!-- ========================================================= -->
    <!-- LAYER 2: HERO — UTTARA KANDA GOLDEN PALM-LEAF SCROLL      -->
    <!-- ========================================================= -->
    <g id="uttaraScrollAssembly" filter="url(#scrollShadow)">
      <!-- Unrolled Palm-Leaf Parchment Body (Clipped Dynamically) -->
      <g clip-path="url(#uttaraScrollClip)">
        <!-- Main Golden Parchment Sheet -->
        <rect x="145" y="340" width="790" height="1080" rx="16" fill="url(#palmParchmentGrad)" stroke="#3d1803" stroke-width="7"/>

        <!-- Ornate Inner Double Vedic Border -->
        <rect x="172" y="366" width="736" height="1028" rx="10" fill="none" stroke="#8f4506" stroke-width="3.5" stroke-dasharray="14 8"/>
        <rect x="186" y="380" width="708" height="1000" rx="8" fill="none" stroke="#b8600b" stroke-width="2"/>

        <!-- Subtle Sacred Mandala Watermark in Center of Scroll -->
        <g transform="translate(540, 880)" opacity="0.16" stroke="#5c2103" stroke-width="3" fill="none">
          <circle cx="0" cy="0" r="245"/>
          <circle cx="0" cy="0" r="205" stroke-dasharray="10 8"/>
          <polygon points="0,-205 178,102 -178,102"/>
          <polygon points="0,205 178,-102 -178,-102"/>
        </g>

        <!-- Top Royal Seal & Scripture Title -->
        <g transform="translate(540, 465)">
          <circle cx="0" cy="-15" r="28" fill="#8f1116" stroke="url(#goldGrad)" stroke-width="4"/>
          <text x="0" y="-6" text-anchor="middle" fill="#ffe066" font-size="28" font-weight="900">ॐ</text>
          <text x="0" y="45" text-anchor="middle" fill="#5c2103" font-size="34" font-weight="900">॥ श्रीमद्वाल्मीकीय रामायणम् ॥</text>
          <rect x="-220" y="65" width="440" height="54" rx="27" fill="#7a1118" stroke="url(#goldGrad)" stroke-width="3"/>
          <text x="0" y="101" text-anchor="middle" fill="#ffe066" font-size="30" font-weight="900">उत्तरकाण्डम् • सर्ग २६</text>
        </g>

        <line x1="230" y1="605" x2="850" y2="605" stroke="#8a4406" stroke-width="2.5" opacity="0.65"/>

        <!-- Highlighted Sanskrit Sloka & Meaning Box -->
        <g transform="translate(540, 845)">
          <rect x="-315" y="-195" width="630" height="390" rx="22" fill="#fff7db" fill-opacity="0.72" stroke="#b8600b" stroke-width="3"/>
          <text x="0" y="-130" text-anchor="middle" fill="#7a1118" font-size="30" font-weight="900">॥ नलकुबेरस्य शाप-विधानम् ॥</text>

          <text x="0" y="-65" text-anchor="middle" fill="#2b0d02" font-size="33" font-weight="900">"अकामां यदा कामयिष्यति</text>
          <text x="0" y="-15" text-anchor="middle" fill="#2b0d02" font-size="33" font-weight="900">बलान्मोहाद् दशाननः।</text>
          <text x="0" y="42" text-anchor="middle" fill="#9e1116" font-size="35" font-weight="900">तदा तस्य शतधा मूर्धा</text>
          <text x="0" y="95" text-anchor="middle" fill="#9e1116" font-size="35" font-weight="900">स्फोटिष्यति न संशयः॥"</text>

          <line x1="-240" y1="125" x2="240" y2="125" stroke="#8a4406" stroke-width="2" opacity="0.5"/>
          <text x="0" y="165" text-anchor="middle" fill="#4a1e04" font-size="25" font-weight="800">(बिना इच्छा बलपूर्वक भोग करने पर ही सिर फटेंगे)</text>
        </g>

        <line x1="230" y1="1085" x2="850" y2="1085" stroke="#8a4406" stroke-width="2.5" opacity="0.65"/>

        <!-- Bottom Golden Royal Stamp Seal -->
        <g transform="translate(540, 1225)">
          <circle cx="0" cy="0" r="68" fill="#6b0816" stroke="url(#goldGrad)" stroke-width="5"/>
          <circle cx="0" cy="0" r="52" fill="none" stroke="#ffe066" stroke-width="2" stroke-dasharray="8 6"/>
          <text x="0" y="-6" text-anchor="middle" fill="#ffe066" font-size="22" font-weight="900">शास्त्र</text>
          <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">प्रमाणम्</text>
        </g>
      </g>

      <!-- TOP GOLDEN WOODEN ROLLER (Unrolls Upward to y=340) -->
      <g id="rollerTop" transform="translate(540, 858)">
        <rect x="-485" y="-14" width="60" height="28" rx="8" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <circle cx="-494" cy="0" r="19" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <rect x="425" y="-14" width="60" height="28" rx="8" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <circle cx="494" cy="0" r="19" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <rect x="-430" y="-23" width="860" height="46" rx="16" fill="url(#rollerWoodGold)" stroke="#1f0703" stroke-width="5"/>
        <line x1="-410" y1="-8" x2="410" y2="-8" stroke="#fff6bd" stroke-width="3" opacity="0.65"/>
        <rect x="-330" y="-24" width="24" height="48" rx="4" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="3"/>
        <rect x="306" y="-24" width="24" height="48" rx="4" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="3"/>
      </g>

      <!-- BOTTOM GOLDEN WOODEN ROLLER (Unrolls Downward to y=1420) -->
      <g id="rollerBottom" transform="translate(540, 902)">
        <rect x="-485" y="-14" width="60" height="28" rx="8" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <circle cx="-494" cy="0" r="19" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <rect x="425" y="-14" width="60" height="28" rx="8" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <circle cx="494" cy="0" r="19" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="4"/>
        <rect x="-430" y="-23" width="860" height="46" rx="16" fill="url(#rollerWoodGold)" stroke="#1f0703" stroke-width="5"/>
        <line x1="-410" y1="-8" x2="410" y2="-8" stroke="#fff6bd" stroke-width="3" opacity="0.65"/>
        <rect x="-330" y="-24" width="24" height="48" rx="4" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="3"/>
        <rect x="306" y="-24" width="24" height="48" rx="4" fill="url(#goldGrad)" stroke="#1f0703" stroke-width="3"/>
      </g>
    </g>

    <!-- Floating Golden Sparkles -->
    <g id="particlesLayer"></g>

    <!-- LAYER 3: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1625)">
      <!-- Keyword 1: उत्तरकांड (सर्ग 26) -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-335" y="-58" width="670" height="96" rx="24" fill="#160726" fill-opacity="0.94" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="52" font-weight="900">उत्तरकांड (सर्ग 26) 📜</text>
      </g>

      <!-- Keyword 2: असली प्रमाण -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-270" y="-52" width="540" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900">असली प्रमाण ✨</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const bgMandala = document.getElementById('bgMandala');
      const scrollHalo = document.getElementById('scrollHalo');
      const unrollShockwave = document.getElementById('unrollShockwave');
      const scrollClipRect = document.getElementById('scrollClipRect');
      const rollerTop = document.getElementById('rollerTop');
      const rollerBottom = document.getElementById('rollerBottom');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 28 Floating Golden Spark Particles
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffe066');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 140 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Background Mandala Rotation & Golden Aura Pulse
        bgMandala.setAttribute('transform', `translate(540, 880) rotate(${(t * 48).toFixed(1)})`);
        scrollHalo.setAttribute('r', (470 + Math.sin(t * Math.PI * 4) * 35).toFixed(1));

        // 3. Rapid Golden Palm-Leaf Scroll Unrolling From Center (t: 0.05 -> 0.28)
        const unrollProg = easeOutBack(Math.max(0, Math.min(1, (t - 0.05) / 0.23)));
        const halfOpen = 22 + unrollProg * 518; // Expands to 540px half-height (340 to 1420)
        const topY = 880 - halfOpen;
        const botY = 880 + halfOpen;

        rollerTop.setAttribute('transform', `translate(540, ${topY.toFixed(1)})`);
        rollerBottom.setAttribute('transform', `translate(540, ${botY.toFixed(1)})`);
        scrollClipRect.setAttribute('y', topY.toFixed(1));
        scrollClipRect.setAttribute('height', Math.max(0, botY - topY).toFixed(1));

        // 4. Shockwave Ring Burst Upon Scroll Lock (t: 0.24 -> 0.48)
        if (t >= 0.24 && t <= 0.48) {
          const sw = (t - 0.24) / 0.24;
          unrollShockwave.setAttribute('r', (160 + easeOutCubic(sw) * 360).toFixed(1));
          unrollShockwave.setAttribute('opacity', ((1 - sw) * 0.85).toFixed(2));
        } else {
          unrollShockwave.setAttribute('opacity', '0');
        }

        // 5. Floating Golden Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Kinetic Hindi Keywords ("उत्तरकांड (सर्ग 26) 📜" & "असली प्रमाण ✨")
        if (t >= 0.22) {
          const p1 = Math.min(1, (t - 0.22) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
