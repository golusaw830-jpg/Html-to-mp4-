    </g>

    <!-- Floating Golden Speed Sparks -->
    <g id="particlesLayer"></g>

    <!-- LAYER 5: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Keyword 1: वाल्मीकि रामायण -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-320" y="-58" width="640" height="96" rx="24" fill="#160726" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="54" font-weight="900">वाल्मीकि रामायण 📜</text>
      </g>

      <!-- Keyword 2: अरण्यकाण्ड वर्णन -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-315" y="-52" width="630" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="45" font-weight="900">अरण्यकाण्ड वर्णन 🐎</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const valmikiBookGroup = document.getElementById('valmikiBookGroup');
      const pushpakaTarget = document.getElementById('pushpakaTarget');
      const flyingChariotRig = document.getElementById('flyingChariotRig');
      const chariotWheel = document.getElementById('chariotWheel');
      const celestialHorses = document.getElementById('celestialHorses');
      const cloudLayer = document.getElementById('cloudLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 28 Speed Spark Particles
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 60 + ((i * 113) % 960),
          baseY: 200 + ((i * 197) % 1500),
          speedX: 220 + (i % 6) * 45,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0s

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.07;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Top Valmiki Ramayana Book Pop-In & Gentle Float
        const pBook = Math.min(1, t / 0.16);
        const sBook = 0.82 + 0.18 * easeOutBack(pBook);
        const bookY = 315 + Math.sin(t * Math.PI * 3) * 6;
        valmikiBookGroup.setAttribute('opacity', easeOutCubic(pBook).toFixed(2));
        valmikiBookGroup.setAttribute('transform', `translate(540, ${bookY.toFixed(1)}) scale(${sBook.toFixed(3)})`);

        // 3. Pushpaka Vimana Destination Hovering in Upper Right Sky
        const vimanaY = 595 + Math.cos(t * Math.PI * 3) * 9;
        pushpakaTarget.setAttribute('transform', `translate(865, ${vimanaY.toFixed(1)}) scale(0.68)`);

        // 4. Ravana's Royal Chariot Ascending Diagonally Toward Pushpaka Vimana
        const flightProg = easeOutCubic(Math.min(1, t / 0.92));
        const chariotX = 415 + flightProg * 115;
        const chariotY = 1135 - flightProg * 115 + Math.sin(t * Math.PI * 5) * 8;
        const chariotTilt = -14 + Math.sin(t * Math.PI * 4) * 1.2;
        flyingChariotRig.setAttribute('transform', `translate(${chariotX.toFixed(1)}, ${chariotY.toFixed(1)}) rotate(${chariotTilt.toFixed(2)})`);

        // Spinning Chariot Wheel & Galloping Celestial Horses
        chariotWheel.setAttribute('transform', `translate(-85, 105) rotate(${(t * 720).toFixed(1)})`);
        const gallopY = 25 + Math.sin(t * Math.PI * 10) * 6;
        const gallopRot = Math.cos(t * Math.PI * 10) * 2.5;
        celestialHorses.setAttribute('transform', `translate(265, ${gallopY.toFixed(1)}) rotate(${gallopRot.toFixed(2)})`);

        // Drifting Background Clouds (Opposite to Flight Direction for Speed Parallax)
        cloudLayer.setAttribute('transform', `translate(${(-t * 95).toFixed(1)}, ${(t * 25).toFixed(1)})`);

        // 5. Speed Spark Particles Streaming Past Chariot
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const xPos = ((pt.baseX - t * pt.speedX * 5) % 1080 + 1080) % 1080;
          const yPos = ((pt.baseY + t * pt.speedX * 1.3) % 1500 + 1500) % 1500 + 180;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Kinetic Hindi Keywords ("वाल्मीकि रामायण 📜" & "अरण्यकाण्ड वर्णन 🐎")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
