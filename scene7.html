<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parshuram vs Ravana - Sentence 7 (5s 9:16 SVG)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050208;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
    }

    /* 9:16 Vertical Full-Bleed Stage Container (Zero UI Buttons) */
    .stage-wrapper {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.96);
      background: #0d0414;
      overflow: hidden;
      border-radius: 14px;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="stage-wrapper" id="stage">
    <svg id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Deep Cosmic Obsidian & Royal Crimson-Indigo Backdrop -->
        <radialGradient id="cosmicTwistBg" cx="50%" cy="50%" r="74%">
          <stop offset="0%" stop-color="#4a1126" />
          <stop offset="40%" stop-color="#1e0726" />
          <stop offset="76%" stop-color="#0c0314" />
          <stop offset="100%" stop-color="#040108" />
        </radialGradient>

        <!-- Blazing Saffron-Gold Cosmic Core Glow -->
        <radialGradient id="cosmicCoreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
          <stop offset="28%" stop-color="#ffe066" stop-opacity="0.82" />
          <stop offset="62%" stop-color="#ff6a00" stop-opacity="0.38" />
          <stop offset="100%" stop-color="#1e0726" stop-opacity="0" />
        </radialGradient>

        <!-- Ancient Golden Palm-Leaf Scroll Parchment -->
        <linearGradient id="scrollParchmentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#8a4208" />
          <stop offset="14%" stop-color="#f7ca6d" />
          <stop offset="50%" stop-color="#fff0bd" />
          <stop offset="86%" stop-color="#f7ca6d" />
          <stop offset="100%" stop-color="#8a4208" />
        </linearGradient>

        <!-- Ornate Scroll Wooden & Gold Rollers -->
        <linearGradient id="scrollRollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff5ba" />
          <stop offset="30%" stop-color="#e39214" />
          <stop offset="75%" stop-color="#7a3204" />
          <stop offset="100%" stop-color="#2b0c01" />
        </linearGradient>

        <!-- Radiant Gold Metal -->
        <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff8c7" />
          <stop offset="35%" stop-color="#ffd043" />
          <stop offset="75%" stop-color="#e08d12" />
          <stop offset="100%" stop-color="#8c4503" />
        </linearGradient>

        <!-- Blazing Hourglass Sand Gradient -->
        <linearGradient id="sandFireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="45%" stop-color="#ffd84d" />
          <stop offset="100%" stop-color="#ff5500" />
        </linearGradient>

        <!-- Bold Hindi Keyword Fill -->
        <linearGradient id="keywordGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="32%" stop-color="#ffe785" />
          <stop offset="75%" stop-color="#ff9900" />
          <stop offset="100%" stop-color="#d43500" />
        </linearGradient>

        <!-- Intense Golden Glow Filter -->
        <filter id="intenseGoldGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="14" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Soft Glow Filter -->
        <filter id="softGoldGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="7" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Dynamic Clip Path for Rapid Scroll Unrolling -->
        <clipPath id="scrollRevealClip">
          <rect id="scroll-clip-rect" x="120" y="960" width="840" height="0" />
        </clipPath>
      </defs>

      <!-- ========================================================= -->
      <!-- LAYER 1: DARK COSMIC BACKDROP & HIGH-SPEED LIGHT STREAKS  -->
      <!-- ========================================================= -->
      <rect width="1080" height="1920" fill="url(#cosmicTwistBg)" />
      <g id="stars-layer"></g>

      <!-- Radial Warp Speed Light Streaks (Populated via JS) -->
      <g id="warp-streaks-layer" opacity="0.72"></g>

      <!-- ========================================================= -->
      <!-- LAYER 2: MAIN CAMERA SNAP-ZOOM RIG                        -->
      <!-- ========================================================= -->
      <g id="camera-rig">
        <!-- Expanding Shockwave Rings on Scroll Unroll Impact -->
        <circle id="shockwave-1" cx="540" cy="960" r="160" fill="none" stroke="#fff3a8" stroke-width="10" opacity="0" />
        <circle id="shockwave-2" cx="540" cy="960" r="160" fill="none" stroke="#ff7714" stroke-width="7" opacity="0" />

        <!-- ======================================================= -->
        <!-- ANCIENT GOLDEN PALM-LEAF SCROLL (UNROLLING RAPIDLY)     -->
        <!-- ======================================================= -->
        <g id="ancient-scroll-group">
          <!-- Unrolled Parchment Body (Clipped dynamically from center outward) -->
          <g clip-path="url(#scrollRevealClip)">
            <rect x="165" y="420" width="750" height="1080" rx="14" fill="url(#scrollParchmentGrad)" stroke="#3b1803" stroke-width="7" />
            <!-- Inner Decorative Vedic Border Lines on Parchment -->
            <rect x="192" y="445" width="696" height="1030" rx="8" fill="none" stroke="#8f4506" stroke-width="3.5" stroke-dasharray="14 8" />
            <rect x="206" y="458" width="668" height="1004" rx="6" fill="none" stroke="#b8600b" stroke-width="2" />

            <!-- Subtle Ancient Sanskrit Geometric Watermarks on Scroll -->
            <g opacity="0.22" stroke="#5e2703" stroke-width="2.5" fill="none">
              <circle cx="540" cy="960" r="310" />
              <circle cx="540" cy="960" r="275" stroke-dasharray="10 8" />
              <line x1="230" y1="530" x2="850" y2="530" />
              <line x1="230" y1="1390" x2="850" y2="1390" />
            </g>

            <!-- Blazing Cosmic Core Aura Inside Scroll -->
            <circle id="core-fire-aura" cx="540" cy="960" r="290" fill="url(#cosmicCoreGlow)" />

            <!-- =================================================== -->
            <!-- BLAZING COSMIC KAAL-CHAKRA (SPINNING WHEEL OF TIME) -->
            <!-- =================================================== -->
            <g id="cosmic-chakra-outer" filter="url(#intenseGoldGlow)">
              <circle cx="540" cy="960" r="235" fill="none" stroke="#2e0b03" stroke-width="18" />
              <circle cx="540" cy="960" r="235" fill="none" stroke="url(#goldMetal)" stroke-width="10" />
              <circle cx="540" cy="960" r="198" fill="none" stroke="#ff5500" stroke-width="4" stroke-dasharray="16 10" />
              <!-- 16 Blazing Sudarshan / Kaal-Chakra Blades (Populated via JS) -->
              <g id="chakra-blades"></g>
            </g>

            <g id="cosmic-chakra-inner">
              <!-- Sacred Shatkona Star Geometry -->
              <polygon points="540,775 700,1052 380,1052" fill="none" stroke="#5c1f03" stroke-width="7" />
              <polygon points="540,775 700,1052 380,1052" fill="none" stroke="#fff3a8" stroke-width="3.5" />
              <polygon points="540,1145 700,868 380,868" fill="none" stroke="#5c1f03" stroke-width="7" />
              <polygon points="540,1145 700,868 380,868" fill="none" stroke="#fff3a8" stroke-width="3.5" />
            </g>

            <!-- =================================================== -->
            <!-- GLOWING CELESTIAL HOURGLASS AT THE CENTER CORE      -->
            <!-- =================================================== -->
            <g id="cosmic-hourglass" transform="translate(540, 960)" filter="url(#softGoldGlow)">
              <!-- Dark Backing Plate for Contrast -->
              <circle cx="0" cy="0" r="112" fill="#1c0508" fill-opacity="0.92" stroke="url(#goldMetal)" stroke-width="6" />

              <!-- Upper & Lower Glass Bulbs -->
              <path d="M -52 -68 L 52 -68 C 52 -24, 14 -8, 0 0 C -14 -8, -52 -24, -52 -68 Z" fill="#3b120c" stroke="url(#goldMetal)" stroke-width="4.5" />
              <path d="M -52 68 L 52 68 C 52 24, 14 8, 0 0 C -14 8, -52 24, -52 68 Z" fill="#3b120c" stroke="url(#goldMetal)" stroke-width="4.5" />

              <!-- Glowing Golden Sand Upper & Lower -->
              <path id="sand-top" d="M -38 -42 L 38 -42 C 32 -18, 10 -6, 0 0 C -10 -6, -32 -18, -38 -42 Z" fill="url(#sandFireGrad)" />
              <path id="sand-bottom" d="M -44 64 L 44 64 C 34 38, 14 26, 0 22 C -14 26, -34 38, -44 64 Z" fill="url(#sandFireGrad)" />
              <!-- Falling Stream of Cosmic Time Sand -->
              <line id="sand-stream" x1="0" y1="-2" x2="0" y2="62" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 6" />

              <!-- Ornate Top & Bottom Hourglass Caps & Pillars -->
              <rect x="-64" y="-78" width="128" height="14" rx="6" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3.5" />
              <rect x="-64" y="64" width="128" height="14" rx="6" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3.5" />
              <line x1="-54" y1="-64" x2="-54" y2="64" stroke="url(#goldMetal)" stroke-width="5" />
              <line x1="54" y1="-64" x2="54" y2="64" stroke="url(#goldMetal)" stroke-width="5" />
            </g>
          </g>

          <!-- TOP WOODEN & GOLD SCROLL ROLLER (Moves Upward as Scroll Unrolls) -->
          <g id="scroll-roller-top" transform="translate(540, 938)">
            <!-- Left & Right Finial Knobs -->
            <rect x="-465" y="-14" width="55" height="28" rx="8" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <circle cx="-472" cy="0" r="18" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <rect x="410" y="-14" width="55" height="28" rx="8" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <circle cx="472" cy="0" r="18" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <!-- Main Cylindrical Roller Bar -->
            <rect x="-415" y="-22" width="830" height="44" rx="16" fill="url(#scrollRollerGrad)" stroke="#1f0703" stroke-width="5" />
            <line x1="-395" y1="-8" x2="395" y2="-8" stroke="#fff3b0" stroke-width="3" opacity="0.65" />
            <!-- Decorative Gold Bands -->
            <rect x="-320" y="-23" width="22" height="46" rx="4" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3" />
            <rect x="298" y="-23" width="22" height="46" rx="4" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3" />
          </g>

          <!-- BOTTOM WOODEN & GOLD SCROLL ROLLER (Moves Downward as Scroll Unrolls) -->
          <g id="scroll-roller-bottom" transform="translate(540, 982)">
            <rect x="-465" y="-14" width="55" height="28" rx="8" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <circle cx="-472" cy="0" r="18" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <rect x="410" y="-14" width="55" height="28" rx="8" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <circle cx="472" cy="0" r="18" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="4" />
            <rect x="-415" y="-22" width="830" height="44" rx="16" fill="url(#scrollRollerGrad)" stroke="#1f0703" stroke-width="5" />
            <line x1="-395" y1="-8" x2="395" y2="-8" stroke="#fff3b0" stroke-width="3" opacity="0.65" />
            <rect x="-320" y="-23" width="22" height="46" rx="4" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3" />
            <rect x="298" y="-23" width="22" height="46" rx="4" fill="url(#goldMetal)" stroke="#1f0703" stroke-width="3" />
          </g>
        </g>
      </g>

      <!-- ========================================================= -->
      <!-- LAYER 3: RISING GOLDEN SPARK PARTICLES                    -->
      <!-- ========================================================= -->
      <g id="embers-layer"></g>

      <!-- ========================================================= -->
      <!-- LAYER 4: BOLD HINDI KEYWORDS (NO FULL CAPTIONS)           -->
      <!-- ========================================================= -->
      <g id="kinetic-keywords" pointer-events="none" text-anchor="middle">
        <!-- Keyword 1: "तीसरा सबसे बड़ा कारण" -->
        <g id="kw-third-reason" transform="translate(540, 215)" opacity="0">
          <line x1="-420" y1="0" x2="-365" y2="0" stroke="url(#goldMetal)" stroke-width="5" stroke-linecap="round" />
          <line x1="365" y1="0" x2="420" y2="0" stroke="url(#goldMetal)" stroke-width="5" stroke-linecap="round" />
          <text x="0" y="24" font-family="'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="64" letter-spacing="1" stroke="#140421" stroke-width="18" stroke-linejoin="round" paint-order="stroke" fill="url(#keywordGoldGrad)" filter="url(#softGoldGlow)">तीसरा सबसे बड़ा कारण</text>
        </g>

        <!-- Keyword 2: "नियति का विधान" -->
        <g id="kw-destiny-decree" transform="translate(540, 1745)" opacity="0">
          <rect x="-295" y="-64" width="590" height="94" rx="20" fill="#12041f" fill-opacity="0.92" stroke="url(#goldMetal)" stroke-width="4.5" />
          <text x="0" y="8" font-family="'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="72" letter-spacing="2" stroke="#090212" stroke-width="14" stroke-linejoin="round" paint-order="stroke" fill="url(#keywordGoldGrad)">नियति का विधान</text>
        </g>
      </g>

      <!-- ========================================================= -->
      <!-- LAYER 5: ORNATE CRIMSON & GOLD MITHILA BORDER             -->
      <!-- ========================================================= -->
      <g pointer-events="none">
        <rect x="18" y="18" width="1044" height="1884" rx="28" fill="none" stroke="#240506" stroke-width="24" />
        <rect x="18" y="18" width="1044" height="1884" rx="28" fill="none" stroke="url(#goldMetal)" stroke-width="7" />
        <rect x="34" y="34" width="1012" height="1852" rx="20" fill="none" stroke="#ffcf54" stroke-width="2.5" stroke-dasharray="16 10" />
        <g fill="url(#goldMetal)" stroke="#240506" stroke-width="3">
          <circle cx="44" cy="44" r="18" />
          <circle cx="1036" cy="44" r="18" />
          <circle cx="44" cy="1876" r="18" />
          <circle cx="1036" cy="1876" r="18" />
        </g>
      </g>
    </svg>
  </div>

  <script>
    (function () {
      const svgNS = "http://www.w3.org/2000/svg";

      const cameraRig = document.getElementById("camera-rig");
      const starsLayer = document.getElementById("stars-layer");
      const warpStreaksLayer = document.getElementById("warp-streaks-layer");

      const scrollClipRect = document.getElementById("scroll-clip-rect");
      const scrollRollerTop = document.getElementById("scroll-roller-top");
      const scrollRollerBottom = document.getElementById("scroll-roller-bottom");

      const coreFireAura = document.getElementById("core-fire-aura");
      const cosmicChakraOuter = document.getElementById("cosmic-chakra-outer");
      const cosmicChakraInner = document.getElementById("cosmic-chakra-inner");
      const chakraBlades = document.getElementById("chakra-blades");

      const sandStream = document.getElementById("sand-stream");
      const shockwave1 = document.getElementById("shockwave-1");
      const shockwave2 = document.getElementById("shockwave-2");

      const embersLayer = document.getElementById("embers-layer");
      const kwThirdReason = document.getElementById("kw-third-reason");
      const kwDestinyDecree = document.getElementById("kw-destiny-decree");

      // 1. Build 16 Golden Kaal-Chakra Serrated Blades
      for (let i = 0; i < 16; i++) {
        const angle = (i * 360) / 16;
        const blade = document.createElementNS(svgNS, "path");
        blade.setAttribute("d", "M 540 725 L 562 685 L 580 728 Z");
        blade.setAttribute("fill", "url(#goldMetal)");
        blade.setAttribute("stroke", "#2e0b03");
        blade.setAttribute("stroke-width", "2.5");
        blade.setAttribute("transform", `rotate(${angle} 540 960)`);
        chakraBlades.appendChild(blade);
      }

      // 2. Build 40 Cosmic Background Stars
      const stars = [];
      for (let i = 0; i < 40; i++) {
        const st = document.createElementNS(svgNS, "circle");
        st.setAttribute("cx", (60 + ((i * 179) % 960)).toString());
        st.setAttribute("cy", (60 + ((i * 257) % 1800)).toString());
        st.setAttribute("r", (1.8 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute("fill", i % 2 === 0 ? "#ffe799" : "#ffffff");
        starsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.5 + (i % 5) * 0.7, phase: i * 0.8 });
      }

      // 3. Build 28 Radial Warp Speed Light Streaks
      const streaks = [];
      for (let i = 0; i < 28; i++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("stroke", i % 2 === 0 ? "#ffd966" : "#ff881a");
        line.setAttribute("stroke-width", i % 3 === 0 ? "4" : "2.5");
        line.setAttribute("stroke-linecap", "round");
        warpStreaksLayer.appendChild(line);

        const rad = ((i * 360) / 28) * (Math.PI / 180);
        streaks.push({
          el: line,
          rad,
          speed: 520 + (i % 6) * 110,
          offset: (i * 140) % 700,
          len: 75 + (i % 4) * 35
        });
      }

      // 4. Build 32 Rising Golden Ember Particles
      const embers = [];
      for (let i = 0; i < 32; i++) {
        const circle = document.createElementNS(svgNS, "circle");
        const r = 3 + (i % 4) * 1.4;
        circle.setAttribute("r", r.toFixed(1));
        circle.setAttribute("fill", i % 2 === 0 ? "#ffe680" : "#ff8c1a");
        circle.setAttribute("filter", "url(#softGoldGlow)");
        embersLayer.appendChild(circle);

        embers.push({
          el: circle,
          baseX: 85 + ((i * 101) % 910),
          startY: 1850 - ((i * 131) % 720),
          speedY: 215 + (i % 7) * 42,
          wobbleAmp: 16 + (i % 4) * 8,
          wobbleFreq: 2.1 + (i % 5) * 0.45,
          phase: i * 0.65
        });
      }

      // Easing Helpers
      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Master 5.0-Second Deterministic Render Function
      function renderFrameAtTime(t) {
        // 1. Twinkling Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const alpha = 0.25 + 0.75 * Math.abs(Math.sin(t * st.speed + st.phase));
          st.el.setAttribute("opacity", alpha.toFixed(2));
        }

        // 2. Radial Warp Light Streaks Racing Outward from Center
        for (let i = 0; i < streaks.length; i++) {
          const sr = streaks[i];
          const dist = 260 + ((sr.offset + t * sr.speed) % 740);
          const x1 = 540 + Math.cos(sr.rad) * dist;
          const y1 = 960 + Math.sin(sr.rad) * dist;
          const x2 = 540 + Math.cos(sr.rad) * (dist + sr.len);
          const y2 = 960 + Math.sin(sr.rad) * (dist + sr.len);
          const alpha = dist < 340 ? (dist - 260) / 80 : dist > 860 ? (1000 - dist) / 140 : 0.85;
          sr.el.setAttribute("x1", x1.toFixed(1));
          sr.el.setAttribute("y1", y1.toFixed(1));
          sr.el.setAttribute("x2", x2.toFixed(1));
          sr.el.setAttribute("y2", y2.toFixed(1));
          sr.el.setAttribute("opacity", clamp01(alpha).toFixed(3));
        }

        // 3. Rapid Ancient Palm-Leaf Scroll Unrolling (0.15s -> 0.95s)
        const unrollProg = easeOutBack(clamp01((t - 0.15) / 0.80));
        const halfOpenH = lerp(22, 540, unrollProg);
        const topRollerY = 960 - halfOpenH;
        const botRollerY = 960 + halfOpenH;

        scrollRollerTop.setAttribute("transform", `translate(540 ${topRollerY.toFixed(1)})`);
        scrollRollerBottom.setAttribute("transform", `translate(540 ${botRollerY.toFixed(1)})`);
        scrollClipRect.setAttribute("y", topRollerY.toFixed(1));
        scrollClipRect.setAttribute("height", Math.max(0, botRollerY - topRollerY).toFixed(1));

        // 4. Dramatic 2D Snap-Zoom Into Cosmic Chakra Core (Starts at 2.15s)
        let camScale = 1.0;
        if (t < 2.15) {
          camScale = lerp(0.96, 1.04, easeOutCubic(t / 2.15));
        } else {
          const snapProg = easeInOutCubic(clamp01((t - 2.15) / 1.35));
          const holdPulse = t > 3.5 ? Math.sin((t - 3.5) * 4) * 0.025 : 0;
          camScale = lerp(1.04, 1.34, snapProg) + holdPulse;
        }
        cameraRig.setAttribute(
          "transform",
          `translate(540 960) scale(${camScale.toFixed(4)}) translate(-540 -960)`
        );

        // 5. Spinning Blazing Kaal-Chakra & High-Contrast Core Glow
        const outerSpin = (t * 68) % 360;
        const innerSpin = -(t * 42) % 360;
        cosmicChakraOuter.setAttribute("transform", `rotate(${outerSpin.toFixed(2)} 540 960)`);
        cosmicChakraInner.setAttribute("transform", `rotate(${innerSpin.toFixed(2)} 540 960)`);

        const firePulse = 1 + 0.12 * Math.sin(t * 6.5);
        coreFireAura.setAttribute(
          "transform",
          `translate(540 960) scale(${firePulse.toFixed(3)}) translate(-540 -960)`
        );

        // Hourglass Flowing Sand Stream
        sandStream.setAttribute("stroke-dashoffset", (-(t * 95)).toFixed(1));

        // 6. Shockwave Rings Bursting Outward at Scroll Snap (0.85s) & Zoom Snap (2.20s)
        if (t >= 0.85 && t <= 1.85) {
          const sw = (t - 0.85) / 1.0;
          const s = lerp(0.5, 2.5, easeOutCubic(sw));
          shockwave1.setAttribute("opacity", (1 - sw).toFixed(3));
          shockwave1.setAttribute("transform", `translate(540 960) scale(${s.toFixed(3)}) translate(-540 -960)`);
        } else {
          shockwave1.setAttribute("opacity", "0");
        }

        if (t >= 2.20 && t <= 3.25) {
          const sw = (t - 2.20) / 1.05;
          const s = lerp(0.4, 2.3, easeOutCubic(sw));
          shockwave2.setAttribute("opacity", (1 - sw).toFixed(3));
          shockwave2.setAttribute("transform", `translate(540 960) scale(${s.toFixed(3)}) translate(-540 -960)`);
        } else {
          shockwave2.setAttribute("opacity", "0");
        }

        // 7. Rising Golden Spark Particles
        for (let i = 0; i < embers.length; i++) {
          const em = embers[i];
          const travel = (t * em.speedY) % 1650;
          let y = em.startY - travel;
          if (y < 140) y += 1650;
          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;
          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;
          em.el.setAttribute("cx", x.toFixed(1));
          em.el.setAttribute("cy", y.toFixed(1));
          em.el.setAttribute("opacity", clamp01(alpha).toFixed(3));
        }

        // 8. Bold Hindi Keywords ("तीसरा सबसे बड़ा कारण" & "नियति का विधान")
        if (t >= 0.70) {
          const p1 = clamp01((t - 0.70) / 0.36);
          const s1 = easeOutBack(p1);
          kwThirdReason.setAttribute("opacity", clamp01(p1 * 2).toFixed(3));
          kwThirdReason.setAttribute("transform", `translate(540 215) scale(${s1.toFixed(3)})`);
        } else {
          kwThirdReason.setAttribute("opacity", "0");
        }

        if (t >= 1.95) {
          const p2 = clamp01((t - 1.95) / 0.38);
          const s2 = easeOutBack(p2);
          const slideY = lerp(1795, 1745, easeOutCubic(p2));
          kwDestinyDecree.setAttribute("opacity", clamp01(p2 * 2).toFixed(3));
          kwDestinyDecree.setAttribute("transform", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);
        } else {
          kwDestinyDecree.setAttribute("opacity", "0");
        }
      }

      // Live 5.0-Second Seamless Loop
      const CLIP_DURATION = 5.0;
      let startTimestamp = performance.now();

      function animationLoop(now) {
        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;
        renderFrameAtTime(elapsedSec);
        requestAnimationFrame(animationLoop);
      }

      renderFrameAtTime(0);
      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
