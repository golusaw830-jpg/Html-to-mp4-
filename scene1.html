<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 3 - Clip 1: Viewer Question & Golden Mandala (5.0s)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #06030d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }
  svg#scene {
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    max-height: 177.78vw;
    display: block;
    background: #090414;
  }
</style>
</head>
<body>

<!-- 
  PART 3 - CLIP 1 (5.0 SECONDS EXACT) — STRICTLY FOLLOWING BLUEPRINT
  Voiceover: "पिछले वीडियो पर एक भाई ने बहुत शानदार सवाल पूछा!"
  Blueprint Visual: "@KailashMehta-l5v के कमेंट कार्ड का चमकता हुआ पॉप-इन और पीछे सुनहरा प्रश्न-मंडल। कीवर्ड्स: 'सवाल का जवाब', 'Part 3 Special'।"
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. BACKGROUND: Deep Cosmic Indigo & Royal Violet Night -->
    <radialGradient id="cosmicBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#221042"/>
      <stop offset="48%" stop-color="#110724"/>
      <stop offset="100%" stop-color="#05020d"/>
    </radialGradient>

    <!-- Warm Golden Halo behind Mandala & Question Emblem -->
    <radialGradient id="goldenMandalaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f" stop-opacity="0.52"/>
      <stop offset="42%" stop-color="#ff9900" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#110724" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. METALLIC GOLD GRADIENT -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6b3"/>
      <stop offset="45%" stop-color="#ffbe2e"/>
      <stop offset="100%" stop-color="#9e5d06"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e08b0b"/>
    </linearGradient>

    <!-- 3. VIEWER COMMENT CARD GLASS GRADIENT -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1436" stop-opacity="0.97"/>
      <stop offset="60%" stop-color="#130b24" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0b0617" stop-opacity="0.99"/>
    </linearGradient>

    <!-- FILTERS -->
    <filter id="goldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.82"/>
    </filter>
  </defs>

  <!-- CAMERA RIG -->
  <g id="cameraRig" transform="translate(540, 960) scale(1) translate(-540, -960)">

    <!-- LAYER 1: COOL DARK COSMIC BACKDROP -->
    <rect x="-80" y="-80" width="1240" height="2080" fill="url(#cosmicBg)"/>

    <!-- Subtle Sacred Vedic Corner Filigree -->
    <g opacity="0.28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
      <rect x="44" y="44" width="992" height="1832" rx="34"/>
      <rect x="64" y="64" width="952" height="1792" rx="24" stroke-dasharray="14 10"/>
    </g>

    <!-- Floating Golden Dust & Sparkles -->
    <g id="particlesLayer"></g>

    <!-- LAYER 2: MIDGROUND — GRAND GOLDEN QUESTION MANDALA (सुनहरा प्रश्न-मंडल) -->
    <g id="mandalaAnchor" transform="translate(540, 880)">
      <!-- Radiant Warm Aura -->
      <circle id="auraCircle" cx="0" cy="0" r="540" fill="url(#goldenMandalaAura)"/>

      <!-- Outer Rotating Sacred Ring -->
      <g id="outerRing">
        <circle cx="0" cy="0" r="460" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="26 14"/>
        <circle cx="0" cy="0" r="430" fill="none" stroke="#ffd24d" stroke-width="1.8" opacity="0.55"/>
        <!-- 16 Lotus Petals Around Mandala -->
        <g id="lotusPetals" stroke="url(#goldGrad)" stroke-width="2.5" fill="#ffd24d" fill-opacity="0.08"></g>
      </g>

      <!-- Counter-Rotating Geometric Yantra Star -->
      <g id="innerYantra">
        <polygon points="0,-375 325,188 -325,188" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75"/>
        <polygon points="0,375 325,-188 -325,-188" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.75"/>
        <circle cx="0" cy="0" r="265" fill="#130826" fill-opacity="0.72" stroke="url(#goldGrad)" stroke-width="4"/>
      </g>

      <!-- Central Luminous Question Emblem "?" inside Mandala -->
      <g id="centralQuestionMark" filter="url(#strongGlow)">
        <text x="0" y="95" text-anchor="middle" fill="url(#goldBright)" font-size="310" font-weight="900">?</text>
      </g>
    </g>

    <!-- LAYER 3: FOREGROUND HERO — GLOWING @KailashMehta-l5v COMMENT CARD -->
    <g id="commentCardGroup" transform="translate(540, 940)" filter="url(#cardDropShadow)" opacity="0">
      <!-- Outer Golden Glow Rim -->
      <rect x="-465" y="-175" width="930" height="350" rx="36" fill="none" stroke="#ffe066" stroke-width="5" filter="url(#goldGlow)" opacity="0.85"/>
      <!-- Main Card Body -->
      <rect x="-465" y="-175" width="930" height="350" rx="36" fill="url(#cardSurface)" stroke="url(#goldGrad)" stroke-width="4"/>

      <!-- Subtle Top Accent Line -->
      <line x1="-410" y1="-72" x2="410" y2="-72" stroke="#ffd24d" stroke-width="1.5" opacity="0.25"/>

      <!-- Viewer Avatar Circle ("K") -->
      <circle cx="-365" cy="-115" r="34" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
      <text x="-365" y="-103" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="900">K</text>

      <!-- Viewer Handle & Timestamp -->
      <text x="-310" y="-118" fill="#e2e8f0" font-size="30" font-weight="800">@KailashMehta-l5v</text>
      <text x="-310" y="-86" fill="#94a3b8" font-size="22" font-weight="700">• 2 hours ago • YouTube Comment</text>

      <!-- Highlighted Pill Badge -->
      <rect x="235" y="-142" width="190" height="46" rx="23" fill="url(#goldGrad)"/>
      <text x="330" y="-111" text-anchor="middle" fill="#1a0900" font-size="24" font-weight="900">सवाल 🔥</text>

      <!-- Main Viewer Question Text -->
      <text x="-415" y="-8" fill="#ffffff" font-size="42" font-weight="800">"To fir ye shrap tha to sita haran</text>
      <text x="-415" y="52" fill="#ffd24d" font-size="44" font-weight="900">me kyu nai hua ye? 🤔"</text>

      <!-- Interactive Like & Heart Reaction Bar inside Card -->
      <g transform="translate(-415, 118)">
        <rect x="0" y="-22" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.08"/>
        <text x="75" y="8" text-anchor="middle" fill="#cbd5e1" font-size="24" font-weight="700">👍  1.2K</text>

        <rect x="170" y="-22" width="195" height="44" rx="22" fill="#ff2a55" fill-opacity="0.22" stroke="#ff4d73" stroke-width="1.5"/>
        <text x="267" y="8" text-anchor="middle" fill="#ff809b" font-size="24" font-weight="800">❤️ Creator</text>
      </g>
    </g>

    <!-- LAYER 4: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third y=1560 to 1760) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Keyword 1: सवाल का जवाब -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-310" y="-58" width="620" height="98" rx="24" fill="#16092b" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#goldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="56" font-weight="900" letter-spacing="1">सवाल का जवाब ✨</text>
      </g>

      <!-- Keyword 2: Part 3 Special -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-270" y="-50" width="540" height="84" rx="42" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#170700" font-size="44" font-weight="900" letter-spacing="1.5">Part 3 Special 🔥</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0s
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const outerRing = document.getElementById('outerRing');
      const innerYantra = document.getElementById('innerYantra');
      const centralQuestionMark = document.getElementById('centralQuestionMark');
      const auraCircle = document.getElementById('auraCircle');
      const commentCardGroup = document.getElementById('commentCardGroup');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');
      const lotusPetals = document.getElementById('lotusPetals');
      const particlesLayer = document.getElementById('particlesLayer');

      // Generate 16 Sacred Lotus Petals on Mandala
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-430 Q26,-380 0,-340 Q-26,-380 0,-430 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        lotusPetals.appendChild(p);
      }

      // Generate 28 Floating Golden Sparkle Particles
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const baseX = (i * 113) % 1080;
        const baseY = 180 + ((i * 197) % 1620);
        const r = 2.5 + (i % 4) * 1.2;
        c.setAttribute('r', r);
        c.setAttribute('fill', i % 3 === 0 ? '#ffffff' : '#ffd24d');
        particlesLayer.appendChild(c);
        particles.push({ el: c, baseX, baseY, speed: 130 + (i % 6) * 30, phase: i * 0.6 });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Smooth Camera Push-In (1.0 -> 1.08)
        const camScale = 1 + t * 0.08;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Golden Question Mandala Dual-Ring Counter-Rotation & Pulse
        outerRing.setAttribute('transform', `rotate(${(t * 72).toFixed(2)})`);
        innerYantra.setAttribute('transform', `rotate(${(-t * 54).toFixed(2)})`);

        const auraR = 520 + Math.sin(t * Math.PI * 4) * 40;
        auraCircle.setAttribute('r', auraR.toFixed(1));

        const qScale = 1 + Math.sin(t * Math.PI * 4) * 0.05;
        centralQuestionMark.setAttribute('transform', `scale(${qScale.toFixed(3)})`);

        // 3. Viewer Comment Card Pop-in (0.08 -> 0.24) + Gentle Hover
        if (t < 0.08) {
          commentCardGroup.setAttribute('opacity', '0');
        } else if (t < 0.24) {
          const p = easeOutBack((t - 0.08) / 0.16);
          const s = 0.78 + 0.22 * p;
          const yPos = 980 - 40 * p;
          commentCardGroup.setAttribute('opacity', Math.min(1, p).toFixed(2));
          commentCardGroup.setAttribute('transform', `translate(540, ${yPos.toFixed(1)}) scale(${s.toFixed(3)})`);
        } else {
          const hoverY = 940 + Math.sin((t - 0.24) * Math.PI * 2.5) * 8;
          commentCardGroup.setAttribute('opacity', '1');
          commentCardGroup.setAttribute('transform', `translate(540, ${hoverY.toFixed(1)}) scale(1)`);
        }

        // 4. Kinetic Hindi Keywords ("सवाल का जवाब ✨" & "Part 3 Special 🔥")
        if (t >= 0.26) {
          const p1 = Math.min(1, (t - 0.26) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.48) {
          const p2 = Math.min(1, (t - 0.48) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        // 5. Floating Golden Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1680 + 1680) % 1680 + 120;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          const op = 0.25 + 0.65 * Math.sin(t * Math.PI * 6 + pt.phase);
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', Math.max(0.1, op).toFixed(2));
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
