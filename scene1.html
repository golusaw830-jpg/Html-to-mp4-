  <!-- DETERMINISTIC 4.0-SECOND SEAMLESS LOOP ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 4000; // Exact 4.0s matching Scene 10 blueprint
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const outerMandalaRing = document.getElementById('outerMandalaRing');
      const innerMandalaRing = document.getElementById('innerMandalaRing');
      const mandalaPetals = document.getElementById('mandalaPetals');
      const bgAuraOrb = document.getElementById('bgAuraOrb');

      const crownMysteryGroup = document.getElementById('crownMysteryGroup');
      const mysteryQuestionMark = document.getElementById('mysteryQuestionMark');
      const scene1AshwatthamaBridge = document.getElementById('scene1AshwatthamaBridge');
      const travelingManiGem = document.getElementById('travelingManiGem');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Generate exact same 16 Sacred Lotus Petals as Scene 1
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-435 Q24,-385 0,-345 Q-24,-385 0,-435 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        mandalaPetals.appendChild(p);
      }

      // 2. Generate exact same 36 Cosmic Background Stars as Scene 1
      const stars = [];
      for (let i = 0; i < 36; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1820)).toString());
        st.setAttribute('r', (1.6 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#ffe799' : '#ffffff');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Generate 28 Periodic Rising Golden Energy Motes (t=1.0 matches t=0.0!)
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff6a1a');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 4.0s

        // 1. Twinkling Cosmic Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * 4 + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Camera Zooms into the Mani then Returns Smoothly to Exact scale=1.000 at t=1.0!
        let camScale = 1.0;
        if (t < 0.55) {
          camScale = 1.0 + easeOutCubic(t / 0.55) * 0.14;
        } else {
          const resetP = easeInOutCubic((t - 0.55) / 0.45);
          camScale = 1.14 - resetP * 0.14; // Returns cleanly to 1.000 at t=1.0!
        }
        cameraRig.setAttribute('transform', `translate(540, 742) scale(${camScale.toFixed(4)}) translate(-540, -742)`);

        // 3. Mandala Full 360-Degree Rotation (Ends at exact 0 deg at t=1.0 to match Scene 1!)
        const outerDeg = easeInOutCubic(t) * 360;
        const innerDeg = -easeInOutCubic(t) * 360;
        outerMandalaRing.setAttribute('transform', `rotate(${outerDeg.toFixed(1)})`);
        innerMandalaRing.setAttribute('transform', `rotate(${innerDeg.toFixed(1)})`);
        bgAuraOrb.setAttribute('r', (520 + Math.sin(t * Math.PI * 4) * 35).toFixed(1));

        // 4. Seamless Morph from Yudhishthira's Crown (0.0 -> 0.58) to Scene 1's Ashwatthama Portrait (0.52 -> 1.0)!
        if (t < 0.58) {
          const fadeOut = t < 0.35 ? 1 : 1 - (t - 0.35) / 0.23;
          const crownScale = 1 + easeOutCubic(t / 0.58) * 0.12;
          crownMysteryGroup.setAttribute('opacity', Math.max(0, fadeOut).toFixed(2));
          crownMysteryGroup.setAttribute('transform', `translate(540, 895) scale(${crownScale.toFixed(3)})`);

          const qBob = -435 + Math.sin(t * Math.PI * 6) * 10;
          mysteryQuestionMark.setAttribute('transform', `translate(0, ${qBob.toFixed(1)})`);
        } else {
          crownMysteryGroup.setAttribute('opacity', '0');
        }

        if (t >= 0.48) {
          const bridgeP = easeInOutCubic((t - 0.48) / 0.52);
          scene1AshwatthamaBridge.setAttribute('opacity', bridgeP.toFixed(2));
        } else {
          scene1AshwatthamaBridge.setAttribute('opacity', '0');
        }

        // 5. Traveling Rudra-Mani Gem: Starts at Crown (540, 850) -> Lands at Scene 1 Forehead Socket (540, 742) at Scale=1.000!
        const maniGlide = easeInOutCubic(t);
        const maniY = 850 - maniGlide * 108; // 850 -> 742 exact
        const maniScale = 1.65 - maniGlide * 0.65; // Scales smoothly from crown size (1.65) to Scene 1 forehead size (1.000)
        travelingManiGem.setAttribute('transform', `translate(540, ${maniY.toFixed(1)}) scale(${maniScale.toFixed(3)})`);

        // 6. Periodic Rising Golden Energy Motes
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * 1600) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 18;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 4 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("अनसुलझा रहस्य 🤔" & "कमेंट में बताएं 🚩") — Fade out cleanly before t=0.95 for Scene 1 loop
        if (t >= 0.12 && t < 0.88) {
          const p1 = Math.min(1, (t - 0.12) / 0.12);
          const fade1 = t > 0.78 ? 1 - (t - 0.78) / 0.10 : 1;
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', (easeOutCubic(p1) * fade1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.36 && t < 0.88) {
          const p2 = Math.min(1, (t - 0.36) / 0.12);
          const fade2 = t > 0.78 ? 1 - (t - 0.78) / 0.10 : 1;
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', (easeOutCubic(p2) * fade2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 114) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
