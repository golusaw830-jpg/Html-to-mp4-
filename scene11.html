  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const fireYantraWheel = document.getElementById('fireYantraWheel');
      const fireAuraTop = document.getElementById('fireAuraTop');

      const ravanaHero = document.getElementById('ravanaHero');
      const tenHeadsGroup = document.getElementById('tenHeadsGroup');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 19 Blazing Flame Tongues Along the Fiery Barrier
      const flames = [];
      for (let i = 0; i < 19; i++) {
        const x = -390 + i * 43.3;
        const curveY = (x * x) / 6000;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff6a00');
        fireTonguesLayer.appendChild(p);
        flames.push({ el: p, x, baseY: curveY, phase: i * 0.7 });
      }

      // Generate 28 Floating Fire Embers
      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ff5500');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 150 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        // 1. Camera Smooth Push-In
        const camScale = 1 + t * 0.08;
        cameraRig.setAttribute('transform', `translate(540, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Top "100 टुकड़े" Fiery Yantra Rotation & Pulse
        fireYantraWheel.setAttribute('transform', `rotate(${(t * 54).toFixed(1)})`);
        fireAuraTop.setAttribute('r', (280 + Math.sin(t * Math.PI * 6) * 28).toFixed(1));

        // 3. Blazing Lakshmana-Rekha Fire Wall & Dancing Flame Tongues
        fireWallCore.setAttribute('stroke-dashoffset', (-t * 480).toFixed(1));
        for (let i = 0; i < flames.length; i++) {
          const fl = flames[i];
          const h = 28 + Math.abs(Math.sin(t * Math.PI * 10 + fl.phase)) * 34;
          const sway = Math.sin(t * Math.PI * 8 + fl.phase) * 7;
          fl.el.setAttribute('d', `M ${fl.x - 10} ${fl.baseY + 4} Q ${fl.x + sway} ${fl.baseY - h} ${fl.x + 10} ${fl.baseY + 4} Z`);
        }

        // 4. Glowing Fracture Warning Lines on Ravana's Central Crown
        const crackOp = 0.55 + 0.45 * Math.abs(Math.sin(t * Math.PI * 8));
        crownFractureLines.setAttribute('opacity', crackOp.toFixed(2));

        // 5. Ravana Subtle Recoil & Tremor Under Fiery Barrier
        const bobY = 1340 + Math.sin(t * Math.PI * 3) * 5;
        ravanaHero.setAttribute('transform', `translate(540, ${bobY.toFixed(1)})`);
        tenHeadsGroup.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 18) * 1.1).toFixed(2)}, 0, -480)`);

        // 6. Floating Fire Embers
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Kinetic Hindi Keywords ("बलपूर्वक भोग निषेध 🔥" & "100 टुकड़ों का श्राप ⚡")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
