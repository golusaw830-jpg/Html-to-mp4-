<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 10 (00:50.0 – 00:55.0 = 5.0 SECONDS EXACT)
  Voiceover: "जब मैं अपने कुल की रक्षा के लिए निहत्था होकर निकुंभला यज्ञ कर रहा था,"

    that morphs into Scene 11's Lanka labyrinth secret path!

-->

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">

    <!-- FILTERS -->

  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->

    <!-- ========================================================= -->
    <g id="nikumbhilaYajnaGroup" transform="translate(605, 860)">
      <!-- Radiant Sacred Agni Halo -->

      <g id="yajnaMandalaRing" transform="translate(0, -45)" opacity="0.52">

      <!-- Sacred Agni-Mandal Energy Ring on Ground (Seed for Scene 11 Maze!) -->
      <g id="agniMandalBoundary" transform="translate(0, 225)">
        <ellipse cx="0" cy="0" rx="225" ry="42" fill="#2b0a06" fill-opacity="0.72" stroke="url(#goldBright)" stroke-width="5" filter="url(#softGoldGlow)"/>
        <ellipse id="agniPulseRing" cx="0" cy="0" rx="195" ry="34" fill="none" stroke="#ff7714" stroke-width="3.5" stroke-dasharray="24 12"/>

      <!-- UNARMED INDRAJIT MEDITATING IN PADMASANA (LOTUS POSE) -->
      <g id="meditatingIndrajitFig" transform="translate(0, 75)">
        <!-- Swept-Back Warrior Hair Locks -->
        <path d="M -52 -165 C -95 -105, -108 -25, -86 55 C -72 5, -60 -55, -42 -115 Z" fill="#0f1115" stroke="#040608" stroke-width="4"/>
        <path d="M 52 -165 C 95 -105, 108 -25, 86 55 C 72 5, 60 -55, 42 -115 Z" fill="#0f1115" stroke="#040608" stroke-width="4"/>

        <!-- Crossed Legs in Padmasana (Lotus Meditation Posture) -->
        <path d="M -128 135 C -145 102, -75 82, 0 98 C 75 82, 145 102, 128 135 C 110 168, -110 168, -128 135 Z"
              fill="url(#crimsonRoyalCloth)" stroke="#0a1214" stroke-width="5" stroke-linejoin="round"/>
        <path d="M -112 128 Q 0 148 112 128" fill="none" stroke="url(#goldMetal)" stroke-width="7"/>

        <!-- Upright Meditative Torso in Locked Emerald-Teal & Gold Lanka Attire -->
        <path d="M -72 -65 C -26 -88, 26 -88, 72 -65 L 66 96 L -66 96 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="5" stroke-linejoin="round"/>
        <path d="M -54 -66 C -16 5, 22 55, 58 92" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

        <!-- Naga-Wing Golden Shoulder Pauldrons -->
        <path d="M -92 -48 C -72 -82, -36 -82, -20 -56 L -34 -22 C -55 -36, -78 -32, -98 -12 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4.5"/>
        <path d="M 92 -48 C 72 -82, 36 -82, 20 -56 L 34 -22 C 55 -36, 78 -32, 98 -12 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="4.5"/>

        <!-- Arms Resting Calmly in Dhyana Mudra (Meditation Gesture) -->
        <path d="M -68 -48 C -98 -8, -88 52, -36 74 L -24 52 C -58 38, -62 -4, -44 -34 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4.5"/>
        <path d="M 68 -48 C 98 -8, 88 52, 36 74 L 24 52 C 58 38, 62 -4, 44 -34 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4.5"/>
        <ellipse cx="0" cy="68" rx="34" ry="13" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4"/>

        <!-- LOCKED MEGHNAD HEAD & NAGA-SERPENT CROWN (Serene Closed-Eye Meditation) -->
        <g transform="translate(0, -108)">

          <path d="M -46 -56 C -66 -68, -70 -88, -56 -100 C -50 -86, -46 -74, -38 -65 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
          <path d="M 46 -56 C 66 -68, 70 -88, 56 -100 C 50 -86, 46 -74, 38 -65 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5"/>
          <circle cx="0" cy="-96" r="7.5" fill="#0d9488" stroke="url(#goldBright)" stroke-width="2.5"/>
          <path d="M -52 -48 Q 0 -60 52 -48 L 50 -38 Q 0 -48 -50 -38 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>

          <!-- Chiseled Meditative Face -->
          <path d="M -48 -38 L 48 -38 L 42 18 C 42 40, 20 52, 0 52 C -20 52, -42 40, -42 18 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="4.5"/>
          <!-- Tripundra Tilak -->
          <line x1="-22" y1="-26" x2="22" y2="-26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="-18" y1="-19" x2="18" y2="-19" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="0" cy="-22" r="4" fill="#dc2626"/>
          <!-- Peaceful Half-Closed Meditative Eyes -->
          <path d="M -30 -4 Q -18 4 -8 -4" fill="none" stroke="#0f1115" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 8 -4 Q 18 4 30 -4" fill="none" stroke="#0f1115" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Sleek Mustache & Calm Smile -->
          <path d="M 0 18 C -14 14, -28 18, -36 25 C -24 22, -12 21, 0 20 C 12 21, 24 22, 36 25 C 28 18, 14 14, 0 18 Z" fill="#0f1115"/>
          <path d="M -12 34 Q 0 40 12 34" fill="none" stroke="#5e2418" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- SACRED YAJNA KUND (FIRE ALTAR) IN FOREGROUND OF MEDITATOR -->
      <g id="yajnaKundAltar" transform="translate(0, 275)">
        <!-- Stepped Golden & Obsidian Brick Fire Pit -->
        <polygon points="-95,65 95,65 78,25 -78,25" fill="#1c0a08" stroke="url(#goldMetal)" stroke-width="4"/>
        <polygon points="-115,88 115,88 95,65 -95,65" fill="#120504" stroke="url(#goldMetal)" stroke-width="4"/>

        <!-- Looping Vector Agni Flames Flickering Upward -->
        <g id="yajnaFlamesLayer" filter="url(#softGoldGlow)"></g>
      </g>

      <!-- Looping Sacred Smoke Curls Rising Gracefully Above the Yajna -->
      <g id="smokeCurlsLayer" opacity="0.58" fill="none" stroke="#fff7c2" stroke-width="3.5" stroke-linecap="round"></g>
    </g>

    <!-- Rising Golden Yajna Sparks -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: निहत्था होकर यज्ञ -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-295" y="-48" width="590" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="44" font-weight="900" letter-spacing="1">निहत्था होकर यज्ञ 🔥</text>
      </g>

      <!-- Keyword 2: निकुंभला साधना -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-270" y="-44" width="540" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="40" font-weight="900" letter-spacing="1">निकुंभला साधना 🪔</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND LOOPING YAJNA FLAMES & SMOKE CURLS ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const agniHaloOrb = document.getElementById('agniHaloOrb');
      const yajnaMandalaRing = document.getElementById('yajnaMandalaRing');
      const agniPulseRing = document.getElementById('agniPulseRing');
      const meditatingIndrajitFig = document.getElementById('meditatingIndrajitFig');

      const yajnaFlamesLayer = document.getElementById('yajnaFlamesLayer');
      const smokeCurlsLayer = document.getElementById('smokeCurlsLayer');
      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // 1. Build 9 Looping Vector Yajna Flames in the Fire Altar
      const flames = [];
      for (let i = 0; i < 9; i++) {
        const x = -64 + i * 16;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('fill', 'url(#yajnaFlameGrad)');
        yajnaFlamesLayer.appendChild(p);
        flames.push({ el: p, x, phase: i * 0.72, baseH: 52 + (4 - Math.abs(i - 4)) * 14 });
      }

      // 2. Build 6 Rising Vector Smoke Curls Above Yajna
      const smokeCurls = [];
      for (let i = 0; i < 6; i++) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        smokeCurlsLayer.appendChild(path);
        smokeCurls.push({
          el: path,
          baseX: -45 + i * 18,
          phase: i / 6
        });
      }

      const stars = [];
      for (let i = 0; i < 30; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1200)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#fb923c');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 430 + ((i * 67) % 350),
          baseY: 360 + ((i * 151) % 820),
          speed: 145 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 1. Calm Safe-Zone Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);

        // 2. Sacred Yajna Halo & Mandala Rotation
        agniHaloOrb.setAttribute('r', (315 + Math.sin(t * Math.PI * 5) * 26).toFixed(1));
        yajnaMandalaRing.setAttribute('transform', `translate(0, -45) rotate(${(t * 36).toFixed(1)})`);
        agniPulseRing.setAttribute('stroke-dashoffset', (-t * 288).toFixed(1));

        // 3. Meditating Indrajit Subtle Levitation / Breathing
        const medY = 75 + Math.sin(t * Math.PI * 3) * 4;
        meditatingIndrajitFig.setAttribute('transform', `translate(0, ${medY.toFixed(1)})`);

        // 4. Looping Vector Agni Flames Flickering
        for (let i = 0; i < flames.length; i++) {
          const fl = flames[i];
          const h = fl.baseH + Math.abs(Math.sin(t * Math.PI * 10 + fl.phase)) * 38;
          const sway = Math.sin(t * Math.PI * 8 + fl.phase) * 9;
          fl.el.setAttribute('d', `M ${fl.x - 12} 26 Q ${fl.x + sway} ${26 - h} ${fl.x + 12} 26 Z`);
        }

        // 5. Looping Vector Smoke Curls Rising Above Yajna Altar
        for (let i = 0; i < smokeCurls.length; i++) {
          const sc = smokeCurls[i];
          const p = (sc.phase + t * 1.5) % 1;
          const startY = 215 - p * 320;
          const w = Math.sin(p * Math.PI * 4 + i) * 22;
          const d = `M ${sc.baseX} ${startY.toFixed(1)} Q ${(sc.baseX + w).toFixed(1)} ${(startY - 45).toFixed(1)} ${sc.baseX} ${(startY - 90).toFixed(1)} Q ${(sc.baseX - w).toFixed(1)} ${(startY - 135).toFixed(1)} ${sc.baseX} ${(startY - 180).toFixed(1)}`;
          sc.el.setAttribute('d', d);
          sc.el.setAttribute('opacity', (Math.sin(p * Math.PI) * 0.65).toFixed(2));
        }

        // 6. Rising Golden Yajna Sparks
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 820 + 820) % 820 + 360;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("निहत्था होकर यज्ञ 🔥" & "निकुंभला साधना 🪔")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
