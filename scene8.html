  <!-- CAMERA RIG -->

    <!-- LAYER 3: FOREGROUND HERO — FULL-DETAIL DASHAANAN RAVANA -->
    <g id="ravanaHero" transform="translate(540, 1340)">
      <ellipse cx="0" cy="340" rx="290" ry="32" fill="#040108" opacity="0.85"/>

      <!-- Royal Crimson Dhoti & Gold Hem -->
      <path d="M -128 -105 L 128 -105 L 182 325 L 40 325 L 0 115 L -40 325 L -182 325 Z" fill="url(#royalCrimson)" stroke="#140703" stroke-width="6" stroke-linejoin="round"/>
      <path d="M -42 -105 L 42 -105 L 62 245 L 0 288 L -62 245 Z" fill="#b8141a" stroke="#140703" stroke-width="4.5"/>
      <line x1="-174" y1="305" x2="-44" y2="305" stroke="url(#goldGrad)" stroke-width="14"/>
      <line x1="44" y1="305" x2="174" y2="305" stroke="url(#goldGrad)" stroke-width="14"/>
      <rect x="-128" y="-135" width="256" height="32" rx="10" fill="url(#goldGrad)" stroke="#140703" stroke-width="5"/>

      <!-- Left Muscular Arm -->
      <path d="M -155 -415 C -235 -375, -275 -270, -255 -135 L -198 -135 C -205 -235, -180 -315, -135 -355 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="6"/>

          <path d="M -12 20 L -16 310 C -16 365, 10 405, 34 430 C 26 375, 18 330, 18 20 Z" fill="url(#swordSteel)" stroke="#140703" stroke-width="5"/>
          <rect x="-32" y="8" width="64" height="16" rx="6" fill="url(#goldGrad)" stroke="#140703" stroke-width="4"/>
        </g>
        <circle cx="225" cy="-115" r="28" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="5"/>

      <!-- Broad Royal Torso & Sacred Janeu + Gold Necklaces -->
      <path d="M -155 -425 C -80 -455, 80 -455, 155 -425 L 122 -125 L -122 -125 Z" fill="url(#ravanaSkin)" stroke="#140703" stroke-width="6"/>
      <path d="M -115 -428 C -62 -305, 35 -205, 112 -132" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

      <circle cx="0" cy="-352" r="16" fill="#d91e18" stroke="url(#goldGrad)" stroke-width="5"/>

      <!-- TEN HEADS & GOLDEN CROWNS -->
      <g id="tenHeadsGroup">
        <rect x="-46" y="-498" width="92" height="72" rx="14" fill="url(#ravanaSkinDark)" stroke="#140703" stroke-width="5"/>

        <use href="#ravana-side-head" transform="translate(-310, -575) scale(0.84)"/>
        <use href="#ravana-side-head" transform="translate(-250, -580) scale(0.88)"/>
        <use href="#ravana-side-head" transform="translate(-190, -585) scale(0.92)"/>

        <use href="#ravana-side-head" transform="translate(130, -590) scale(0.96)"/>

        <!-- Main Central Crown & Head -->
        <path d="M -75 -645 L -60 -735 L 0 -790 L 60 -735 L 75 -645 Z" fill="url(#goldGrad)" stroke="#140703" stroke-width="5"/>

        <line x1="-36" y1="-608" x2="36" y2="-608" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

        <path d="M -54 -580 L -14 -570" stroke="#140703" stroke-width="7" stroke-linecap="round"/>
        <path d="M 54 -580 L 14 -570" stroke="#140703" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="-32" cy="-558" rx="14" ry="10" fill="#fff9db" stroke="#140703" stroke-width="3"/>
        <circle cx="-32" cy="-558" r="5" fill="#9e0b0b"/>
        <ellipse cx="32" cy="-558" rx="14" ry="10" fill="#fff9db" stroke="#140703" stroke-width="3"/>
        <circle cx="32" cy="-558" r="5" fill="#9e0b0b"/>
        <path d="M 0 -526 C -26 -534, -54 -524, -66 -506 C -46 -512, -22 -514, 0 -518 C 22 -514, 46 -512, 66 -506 C 54 -524, 26 -534, 0 -526 Z" fill="#140703"/>
      </g>
    </g>

    <!-- Floating Golden Sparkles -->
    <g id="particlesLayer"></g>

    <!-- LAYER 4: KINETIC HINDI KEYWORDS (Safe Zone: Bottom Third) -->
    <g id="keywordsLayer" transform="translate(540, 1615)">
      <!-- Keyword 1: तब कैसे बचा? -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-275" y="-58" width="550" height="96" rx="24" fill="#160726" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softGoldGlow)"/>
        <text x="0" y="10" text-anchor="middle" fill="url(#goldBright)" font-size="56" font-weight="900">तब कैसे बचा? 🤔</text>
      </g>

      <!-- Keyword 2: सबसे बड़ा रहस्य -->
      <g id="kw2" opacity="0" transform="translate(0, 118) scale(0.85)">
        <rect x="-305" y="-52" width="610" height="86" rx="43" fill="url(#goldGrad)" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="#170500" font-size="46" font-weight="900">सबसे बड़ा रहस्य ⚡</text>
      </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND ANIMATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000;
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const questionCrownAssembly = document.getElementById('questionCrownAssembly');
      const qMandalaOuter = document.getElementById('qMandalaOuter');
      const qMandalaInner = document.getElementById('qMandalaInner');
      const giantQuestionMark = document.getElementById('giantQuestionMark');
      const qShockRing = document.getElementById('qShockRing');
      const arcBolt1 = document.getElementById('arcBolt1');
      const arcBolt2 = document.getElementById('arcBolt2');
      const arcBolt3 = document.getElementById('arcBolt3');
      const ravanaHero = document.getElementById('ravanaHero');
      const tenHeadsGroup = document.getElementById('tenHeadsGroup');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 26 Floating Spark Particles
      const particles = [];
      for (let i = 0; i < 26; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#ffe066' : '#ffffff');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 80 + ((i * 113) % 920),
          baseY: 200 + ((i * 197) % 1500),
          speed: 140 + (i % 6) * 30,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION;

        // 1. Camera Smooth Push-In + Lightning Pulse Shake
        let camScale = 1 + t * 0.08;
        let shakeX = 0;
        if (t >= 0.20 && t <= 0.28) {
          const sp = (t - 0.20) / 0.08;
          shakeX = Math.sin(sp * Math.PI * 10) * 12 * (1 - sp);
        }
        cameraRig.setAttribute('transform', `translate(${(540 + shakeX).toFixed(1)}, 960) scale(${camScale.toFixed(4)}) translate(-540, -960)`);

        // 2. Giant Question Mark Pop-In & Dual-Mandala Rotation Above Ravana's Crowns
        const pQ = Math.min(1, t / 0.18);
        const sQ = 0.72 + 0.28 * easeOutBack(pQ);
        const pulseQ = 1 + Math.sin(t * Math.PI * 5) * 0.05;
        questionCrownAssembly.setAttribute('opacity', easeOutCubic(pQ).toFixed(2));
        questionCrownAssembly.setAttribute('transform', `translate(540, 385) scale(${(sQ * pulseQ).toFixed(3)})`);

        qMandalaOuter.setAttribute('transform', `rotate(${(t * 54).toFixed(1)})`);
        qMandalaInner.setAttribute('transform', `rotate(${(-t * 42).toFixed(1)})`);

        // Shockwave Ring Pulse
        const ringCycle = (t * 2) % 1;
        qShockRing.setAttribute('r', (140 + ringCycle * 190).toFixed(1));
        qShockRing.setAttribute('opacity', ((1 - ringCycle) * 0.75).toFixed(2));

        // 3. Crackling Lightning Arcs Between "?" and Ravana's 10 Crowns
        const b1 = (t >= 0.20 && t <= 0.28) || (t >= 0.56 && t <= 0.64) ? 0.95 : 0;
        const b2 = (t >= 0.24 && t <= 0.32) || (t >= 0.60 && t <= 0.68) ? 0.95 : 0;
        const b3 = (t >= 0.20 && t <= 0.30) || (t >= 0.56 && t <= 0.66) || (t >= 0.82 && t <= 0.89) ? 0.95 : 0;
        arcBolt1.setAttribute('opacity', b1.toFixed(2));
        arcBolt2.setAttribute('opacity', b2.toFixed(2));
        arcBolt3.setAttribute('opacity', b3.toFixed(2));

        // 4. Ravana Breathing & Ten Heads Subtle Tilt
        const bobY = 1340 + Math.sin(t * Math.PI * 3) * 6;
        ravanaHero.setAttribute('transform', `translate(540, ${bobY.toFixed(1)})`);
        tenHeadsGroup.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 1.1).toFixed(2)}, 0, -480)`);

        // 5. Floating Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5) % 1600 + 1600) % 1600 + 140;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 6. Kinetic Hindi Keywords ("तब कैसे बचा? 🤔" & "सबसे बड़ा रहस्य ⚡")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.42) {
          const p2 = Math.min(1, (t - 0.42) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 118) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
