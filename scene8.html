<!DOCTYPE html>

  <style>

      padding: 0;

            <path d="M -38 -232 Q 0 -244 38 -232 L 35 -218 Q 0 -228 -35 -218 Z" fill="url(#goldMetal)" stroke="#091529" stroke-width="4" />

  <script>
    (function () {
      const svgNS = "http://www.w3.org/2000/svg";

      const cameraRig = document.getElementById("camera-rig");
      const starsLayer = document.getElementById("stars-layer");

      const brahmaAura = document.getElementById("brahma-aura");
      const celestialWheelOuter = document.getElementById("celestial-wheel-outer");
      const wheelSpokes = document.getElementById("wheel-spokes");
      const humanOpeningPortal = document.getElementById("human-opening-portal");
      const lordBrahmaFig = document.getElementById("lord-brahma-fig");

      const destinyBeamGroup = document.getElementById("destiny-beam-group");
      const arrowCoreLaser = document.getElementById("arrow-core-laser");

      const ramHalo = document.getElementById("ram-halo");
      const lordRamFig = document.getElementById("lord-ram-fig");
      const bowstringPath = document.getElementById("bowstring-path");
      const divineArrowGroup = document.getElementById("divine-arrow-group");
      const arrowTipSpark = document.getElementById("arrow-tip-spark");

      const embersLayer = document.getElementById("embers-layer");
      const kwBrahmaBoon = document.getElementById("kw-brahma-boon");
      const kwShriramAvatar = document.getElementById("kw-shriram-avatar");

      // 1. Build 12 Vedic Spokes on Brahma's Celestial Decree Wheel
      for (let i = 0; i < 12; i++) {
        const angle = (i * 360) / 12;
        const spoke = document.createElementNS(svgNS, "line");
        spoke.setAttribute("x1", "0");
        spoke.setAttribute("y1", "-265");
        spoke.setAttribute("x2", "0");
        spoke.setAttribute("y2", "-305");
        spoke.setAttribute("stroke", "#ffd859");
        spoke.setAttribute("stroke-width", "4");
        spoke.setAttribute("transform", `rotate(${angle})`);
        wheelSpokes.appendChild(spoke);
      }

      // 2. Build 42 Twinkling Cosmic Stars
      const stars = [];
      for (let i = 0; i < 42; i++) {
        const st = document.createElementNS(svgNS, "circle");
        st.setAttribute("cx", (60 + ((i * 173) % 960)).toString());
        st.setAttribute("cy", (60 + ((i * 251) % 1800)).toString());
        st.setAttribute("r", (1.8 + (i % 4) * 0.8).toFixed(1));
        st.setAttribute("fill", i % 3 === 0 ? "#ffe799" : "#ffffff");
        starsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.3 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      // 3. Build 32 Rising Golden Ember Particles
      const embers = [];
      for (let i = 0; i < 32; i++) {
        const circle = document.createElementNS(svgNS, "circle");
        const r = 3 + (i % 4) * 1.4;
        circle.setAttribute("r", r.toFixed(1));
        circle.setAttribute("fill", i % 2 === 0 ? "#ffe680" : "#87c5eb");
        circle.setAttribute("filter", "url(#softGoldGlow)");
        embersLayer.appendChild(circle);

        embers.push({
          el: circle,
          baseX: 85 + ((i * 101) % 910),
          startY: 1850 - ((i * 131) % 720),
          speedY: 205 + (i % 7) * 40,
          wobbleAmp: 16 + (i % 4) * 8,
          wobbleFreq: 2.1 + (i % 5) * 0.45,
          phase: i * 0.65
        });
      }

      // Easing Helpers
      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Master 5.0-Second Deterministic Render Function
      function renderFrameAtTime(t) {
        // 1. Twinkling Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const alpha = 0.25 + 0.75 * Math.abs(Math.sin(t * st.speed + st.phase));
          st.el.setAttribute("opacity", alpha.toFixed(2));
        }

        // 2. Smooth Camera Push-In across 5.0 Seconds
        const camZoom = lerp(0.99, 1.06, easeOutCubic(clamp01(t / 5.0)));
        cameraRig.setAttribute(
          "transform",
          `translate(540 960) scale(${camZoom.toFixed(4)}) translate(-540 -960)`
        );

        // 3. Top Realm: Lord Brahma Levitation & Celestial Decree Wheel Rotation
        const brahmaLev = Math.sin(t * 2.4) * 7;
        lordBrahmaFig.setAttribute("transform", `translate(0 ${(-10 + brahmaLev).toFixed(1)})`);

        celestialWheelOuter.setAttribute("transform", `rotate(${((t * 18) % 360).toFixed(2)})`);
        const brahmaAuraScale = 1 + 0.07 * Math.sin(t * 2.8);
        brahmaAura.setAttribute("transform", `scale(${brahmaAuraScale.toFixed(3)})`);

        // Pulse the Human-Shaped Opening Portal in Ravana's Boon Shield
        const portalPulse = 1 + 0.10 * Math.sin(t * 5.0);
        humanOpeningPortal.setAttribute(
          "transform",
          `translate(0 215) scale(${portalPulse.toFixed(3)})`
        );

        // 4. Bottom Realm: Lord Shri Ram Entrance, Bow Draw & Arrow Charging
        let ramSlideY = 0;
        if (t < 0.75) {
          const p = easeOutBack(clamp01(t / 0.75));
          ramSlideY = lerp(140, 0, p);
        } else {
          ramSlideY = Math.sin((t - 0.75) * 2.8) * 5;
        }
        lordRamFig.setAttribute("transform", `translate(540 ${(1345 + ramSlideY).toFixed(1)})`);

        const ramHaloScale = 1 + 0.08 * Math.sin(t * 3.2);
        ramHalo.setAttribute(
          "transform",
          `translate(540 1340) scale(${ramHaloScale.toFixed(3)}) translate(-540 -1340)`
        );

        // Bowstring Draw Tension (0.6s -> 1.4s) & Arrow Charging Pulse
        const drawProg = easeOutCubic(clamp01((t - 0.6) / 0.8));
        const stringPullY = lerp(-185, -155, drawProg);
        const arrowShiftY = lerp(-20, 10, drawProg);
        bowstringPath.setAttribute("points", `-215,-185 0,${stringPullY.toFixed(1)} 215,-185`);
        divineArrowGroup.setAttribute("transform", `translate(0 ${arrowShiftY.toFixed(1)})`);

        const sparkScale = 0.8 + 0.35 * Math.sin(t * 8.0);
        arrowTipSpark.setAttribute(
          "transform",
          `translate(0 -350) scale(${sparkScale.toFixed(3)}) translate(0 350)`
        );

        // 5. Divine Energy Beam Charging Upward Into the Human Opening Portal (1.3s -> 5.0s)
        const beamFade = clamp01((t - 1.3) / 0.45);
        const beamPulse = 0.72 + 0.28 * Math.sin(t * 7.0);
        destinyBeamGroup.setAttribute("opacity", (beamFade * beamPulse).toFixed(3));
        arrowCoreLaser.setAttribute("stroke-dashoffset", (-(t * 240)).toFixed(1));

        // 6. Rising Golden Spark Particles
        for (let i = 0; i < embers.length; i++) {
          const em = embers[i];
          const travel = (t * em.speedY) % 1650;
          let y = em.startY - travel;
          if (y < 140) y += 1650;
          const x = em.baseX + Math.sin(t * em.wobbleFreq + em.phase) * em.wobbleAmp;
          const alpha = y < 320 ? (y - 140) / 180 : y > 1650 ? (1850 - y) / 200 : 0.85;
          em.el.setAttribute("cx", x.toFixed(1));
          em.el.setAttribute("cy", y.toFixed(1));
          em.el.setAttribute("opacity", clamp01(alpha).toFixed(3));
        }

        // 7. Bold Hindi Keywords ("ब्रह्मा का वरदान" & "श्रीराम अवतार")
        if (t >= 0.65) {
          const p1 = clamp01((t - 0.65) / 0.36);
          const s1 = easeOutBack(p1);
          kwBrahmaBoon.setAttribute("opacity", clamp01(p1 * 2).toFixed(3));
          kwBrahmaBoon.setAttribute("transform", `translate(540 175) scale(${s1.toFixed(3)})`);
        } else {
          kwBrahmaBoon.setAttribute("opacity", "0");
        }

        if (t >= 1.85) {
          const p2 = clamp01((t - 1.85) / 0.38);
          const s2 = easeOutBack(p2);
          const slideY = lerp(1835, 1785, easeOutCubic(p2));
          kwShriramAvatar.setAttribute("opacity", clamp01(p2 * 2).toFixed(3));
          kwShriramAvatar.setAttribute("transform", `translate(540 ${slideY.toFixed(1)}) scale(${s2.toFixed(3)})`);
        } else {
          kwShriramAvatar.setAttribute("opacity", "0");
        }
      }

      // Live 5.0-Second Seamless Loop
      const CLIP_DURATION = 5.0;
      let startTimestamp = performance.now();

      function animationLoop(now) {
        const elapsedSec = ((now - startTimestamp) / 1000) % CLIP_DURATION;
        renderFrameAtTime(elapsedSec);
        requestAnimationFrame(animationLoop);
      }

      renderFrameAtTime(0);
      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
