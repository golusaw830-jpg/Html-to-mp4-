</head>
<body>

<!-- 
  16-VISUAL CREATIVE SVG BLUEPRINT — SCENE 7 (00:35.0 – 00:40.0 = 5.0 SECONDS EXACT)
  Voiceover: "स्वर्ग के राजा इंद्र को बंदी बनाने वाला मैं इंद्रजीत किसी भी अस्त्र से अजेय था।"

  - Center Hero (x=505, y=835): Locked Indrajit (Meghnad) in emerald-teal & gold Lanka armor and Naga-wing crown,
    standing invincible inside a spinning golden Sanskrit Yantra/Chakra constructed via stroke-dashoffset!
  - 100% YouTube Shorts Safe Zone (x: 90..900px, y: 235..1450px), 5.0s duration, zero UI buttons.
-->
<svg id="scene" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. SMOKY MIDNIGHT TEAL & VOLCANIC AMBER SVARGA SKY (Locked Palette) -->

    <radialGradient id="invincibleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#ffd043" stop-opacity="0.54"/>
      <stop offset="68%" stop-color="#0f766e" stop-opacity="0.24"/>

    <linearGradient id="meghnadSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">

    <linearGradient id="lankaRoyalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="52%" stop-color="#083336"/>
      <stop offset="100%" stop-color="#03171a"/>
    </linearGradient>

    <linearGradient id="crimsonRoyalCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#690b12"/>
      <stop offset="100%" stop-color="#2b0306"/>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8c7"/>
      <stop offset="38%" stop-color="#ffd043"/>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">

      <stop offset="100%" stop-color="#e08809"/>

    <!-- FILTERS -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGoldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- CAMERA RIG (Centered in Safe Zone x=505, y=760) -->
  <g id="cameraRig" transform="translate(505, 760) scale(1) translate(-505, -760)">

    <!-- LAYER 1: SMOKY MIDNIGHT TEAL & VOLCANIC AMBER SKY -->

    <!-- Svarga Storm Clouds Silhouettes -->

    <!-- ========================================================= -->

      <!-- Devraj Indra's Golden Vajra Weapon (Tilted & Captured) -->
      <g transform="rotate(-14)" filter="url(#softGoldGlow)">
        <!-- Central Grip -->

        <path d="M -24 -8 L -95 -36 L -125 0 L -95 36 L -24 8 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="3.5" stroke-linejoin="round"/>
        <line x1="-24" y1="0" x2="-138" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <!-- Right Three-Pronged Thunderbolt Head -->

    <!-- ========================================================= -->

      <!-- Counter-Rotating Inner Shatkona (Dual-Triangle Sanskrit Yantra) -->
      <g id="yantraInnerSpin">

    <!-- LOCKED INDRAJIT (MEGHNAD) STANDING INVINCIBLE INSIDE THE YANTRA -->
    <g id="indrajitInvincibleGroup" transform="translate(505, 875) scale(0.72)">
      <!-- Swept-Back Warrior Hair Locks -->
      <path id="hairLeft" d="M -128 -210 C -205 -125, -225 25, -185 185 C -162 95, -148 5, -112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>
      <path id="hairRight" d="M 128 -210 C 205 -125, 225 25, 185 185 C 162 95, 148 5, 112 -85 Z" fill="#0f1115" stroke="#040608" stroke-width="4.5"/>

      <!-- Warrior Dhoti & Armored Greaves Standing Tall -->
      <path d="M -165 295 L 165 295 L 205 510 L 42 510 L 0 385 L -42 510 L -205 510 Z" fill="url(#crimsonRoyalCloth)" stroke="#0a1214" stroke-width="6" stroke-linejoin="round"/>
      <line x1="-195" y1="492" x2="-46" y2="492" stroke="url(#goldMetal)" stroke-width="12"/>
      <line x1="46" y1="492" x2="195" y2="492" stroke="url(#goldMetal)" stroke-width="12"/>
      <rect x="-165" y="272" width="330" height="28" rx="8" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>

      <!-- Broad Warrior Torso in Locked Emerald-Teal & Gold Lanka Armor -->
      <path d="M -225 280 C -215 145, -165 85, -85 65 L 85 65 C 165 85, 215 145, 225 280 Z" fill="url(#lankaRoyalArmor)" stroke="#0a1214" stroke-width="6"/>

      <path d="M -112 75 C -45 165, 35 225, 105 275" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>

      <!-- Naga-Wing Golden Shoulder Pauldrons -->
      <path d="M -255 155 C -225 105, -165 98, -135 135 L -158 185 C -190 160, -230 168, -265 205 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5"/>

      <!-- Left & Right Arms Raised Triumphantly Holding Golden Brahmastra Bow -->
      <g id="triumphBowGroup">

        <path d="M 215 155 C 265 95, 265 25, 225 -35 L 182 -15 C 212 32, 212 85, 175 135 Z" fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="5"/>

        <!-- Grand Golden Brahmastra Bow Held Overhead -->
        <g transform="translate(0, -55)">
          <path d="M -245 25 C -155 -85, 155 -85, 245 25" fill="none" stroke="#081417" stroke-width="22" stroke-linecap="round"/>
          <path d="M -245 25 C -155 -85, 155 -85, 245 25" fill="none" stroke="url(#goldBright)" stroke-width="14" stroke-linecap="round" filter="url(#softGoldGlow)"/>
          <line x1="-245" y1="25" x2="245" y2="25" stroke="#ffffff" stroke-width="4"/>
          <!-- Glowing Celestial Brahmastra Arrow Pointed Upward -->
          <line x1="0" y1="25" x2="0" y2="-155" stroke="#fff7c2" stroke-width="8" stroke-linecap="round" filter="url(#superGlow)"/>
          <polygon points="0,-185 -14,-145 0,-154 14,-145" fill="#ffffff"/>
        </g>
      </g>

      <!-- LOCKED MEGHNAD HEAD & NAGA-SERPENT CROWN -->
      <g id="indrajitHeadGroup" transform="translate(0, -45)">
        <path d="M -68 25 L 68 25 L 82 115 L -82 115 Z" fill="url(#meghnadSkinShadow)" stroke="#0a1214" stroke-width="5"/>
        <path d="M -115 -225 L -86 -365 L -34 -420 L 0 -485 L 34 -420 L 86 -365 L 115 -225 Z" fill="url(#goldMetal)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M -115 -242 C -158 -268, -168 -312, -140 -338 C -132 -304, -122 -278, -102 -260 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <path d="M 115 -242 C 158 -268, 168 -312, 140 -338 C 132 -304, 122 -278, 102 -260 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="4"/>
        <circle cx="0" cy="-342" r="15" fill="#0d9488" stroke="url(#goldBright)" stroke-width="4"/>
        <path d="M -128 -228 Q 0 -256 128 -228 L 122 -198 Q 0 -224 -122 -198 Z" fill="url(#goldBright)" stroke="#0a1214" stroke-width="5"/>

        <!-- Sharp Chiseled Royal Face -->
        <path d="M -124 -205 L 124 -205 L 120 -95 L 104 -18 L 48 76 C 20 106, -20 106, -48 76 L -104 -18 L -120 -95 Z"
              fill="url(#meghnadSkin)" stroke="#0a1214" stroke-width="5.5" stroke-linejoin="round"/>
        <line x1="-54" y1="-175" x2="54" y2="-175" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-46" y1="-160" x2="46" y2="-160" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="-168" r="7.5" fill="#dc2626"/>

        <path d="M -102 -128 L -28 -108" stroke="#0f1115" stroke-width="10" stroke-linecap="round"/>
        <path d="M 102 -128 L 28 -108" stroke="#0f1115" stroke-width="10" stroke-linecap="round"/>
        <path d="M -92 -94 Q -58 -116 -28 -92 Q -58 -76 -92 -94 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="-60" cy="-94" r="10.5" fill="#d97706"/>
        <circle cx="-60" cy="-94" r="5" fill="#090d10"/>
        <path d="M 92 -94 Q 58 -116 28 -92 Q 58 -76 92 -94 Z" fill="#fffbeb" stroke="#0f1115" stroke-width="3.5"/>
        <circle cx="60" cy="-94" r="10.5" fill="#d97706"/>
        <circle cx="60" cy="-94" r="5" fill="#090d10"/>

        <path d="M 0 -102 L -10 -28 L 9 -22" fill="none" stroke="#5c3014" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 0 -4 C -28 -12, -56 -2, -74 12 C -52 5, -25 3, 0 1 C 25 3, 52 5, 74 12 C 56 -2, 28 -12, 0 -4 Z" fill="#0f1115"/>
        <path d="M -26 30 Q 0 38 26 30" fill="none" stroke="#5e2418" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Rising Golden Victory Sparks -->
    <g id="particlesLayer"></g>

    <!-- ========================================================= -->
    <!-- LAYER 4: 100% YOUTUBE SHORTS SAFE-ZONE KINETIC KEYWORDS   -->
    <!-- ========================================================= -->
    <g id="keywordsLayer" transform="translate(505, 1320)" filter="url(#textShadow)">
      <!-- Keyword 1: इंद्र को बंदी बनाया -->
      <g id="kw1" opacity="0" transform="scale(0.85)">
        <rect x="-320" y="-48" width="640" height="82" rx="22" fill="#07191e" fill-opacity="0.94" stroke="url(#goldMetal)" stroke-width="4" filter="url(#softGoldGlow)"/>
        <text x="0" y="9" text-anchor="middle" fill="url(#goldBright)" font-size="43" font-weight="900" letter-spacing="1">इंद्र को बंदी बनाया ⚡</text>
      </g>

      <!-- Keyword 2: किसी भी अस्त्र से अजेय -->
      <g id="kw2" opacity="0" transform="translate(0, 102) scale(0.85)">
        <rect x="-320" y="-44" width="640" height="74" rx="37" fill="url(#goldMetal)" filter="url(#softGoldGlow)"/>
        <text x="0" y="8" text-anchor="middle" fill="#071417" font-size="39" font-weight="900" letter-spacing="0.8">किसी भी अस्त्र से अजेय 👑</text>
      </g>
    </g>

  </g>

  <!-- DETERMINISTIC 5.0-SECOND YANTRA STROKE-DASHOFFSET & ROTATION ENGINE -->
  <script>
    (function() {
      const DURATION = 5000; // Exact 5.0 seconds as requested
      let startTime = null;

      const cameraRig = document.getElementById('cameraRig');
      const capturedVajraGroup = document.getElementById('capturedVajraGroup');
      const vajraLightning = document.getElementById('vajraLightning');

      const invincibleHaloOrb = document.getElementById('invincibleHaloOrb');
      const yantraOuterSpin = document.getElementById('yantraOuterSpin');
      const yantraInnerSpin = document.getElementById('yantraInnerSpin');
      const yantraMainCircle = document.getElementById('yantraMainCircle');
      const yantraTriUp = document.getElementById('yantraTriUp');
      const yantraTriDown = document.getElementById('yantraTriDown');
      const yantraLotusRing = document.getElementById('yantraLotusRing');

      const indrajitInvincibleGroup = document.getElementById('indrajitInvincibleGroup');
      const triumphBowGroup = document.getElementById('triumphBowGroup');
      const hairLeft = document.getElementById('hairLeft');
      const hairRight = document.getElementById('hairRight');

      const cosmicStarsLayer = document.getElementById('cosmicStarsLayer');
      const particlesLayer = document.getElementById('particlesLayer');
      const kw1 = document.getElementById('kw1');
      const kw2 = document.getElementById('kw2');

      // Generate 16 Sacred Lotus Petals on Sanskrit Yantra Ring
      for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', 'M0,-312 Q18,-282 0,-258 Q-18,-282 0,-312 Z');
        p.setAttribute('transform', `rotate(${angle})`);
        yantraLotusRing.appendChild(p);
      }

      const stars = [];
      for (let i = 0; i < 32; i++) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        st.setAttribute('cx', (50 + ((i * 179) % 980)).toString());
        st.setAttribute('cy', (50 + ((i * 257) % 1500)).toString());
        st.setAttribute('r', (1.5 + (i % 4) * 0.7).toFixed(1));
        st.setAttribute('fill', i % 3 === 0 ? '#99f6e4' : '#fef08a');
        cosmicStarsLayer.appendChild(st);
        stars.push({ el: st, speed: 2.2 + (i % 5) * 0.7, phase: i * 0.85 });
      }

      const particles = [];
      for (let i = 0; i < 28; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', (2.5 + (i % 4) * 1.1).toFixed(1));
        c.setAttribute('fill', i % 2 === 0 ? '#fde047' : '#5eead4');
        particlesLayer.appendChild(c);
        particles.push({
          el: c,
          baseX: 130 + ((i * 103) % 750),
          baseY: 260 + ((i * 181) % 1140),
          speed: 155 + (i % 6) * 32,
          phase: i * 0.65
        });
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const t = elapsed / DURATION; // 0.0 -> 1.0 over 5.0 seconds

        // 1. Twinkling Stars
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const op = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * st.speed + st.phase));
          st.el.setAttribute('opacity', op.toFixed(2));
        }

        // 2. Smooth Safe-Zone Camera Push-In
        const camScale = 1 + easeOutCubic(t) * 0.06;
        cameraRig.setAttribute('transform', `translate(505, 760) scale(${camScale.toFixed(4)}) translate(-505, -760)`);

        // 3. Indra's Bound Vajra Hovering in Clouds + Lightning Flicker
        const vajraY = 355 + Math.sin(t * Math.PI * 3) * 6;
        capturedVajraGroup.setAttribute('transform', `translate(505, ${vajraY.toFixed(1)})`);
        const boltOp = (t > 0.18 && t < 0.26) || (t > 0.64 && t < 0.72) ? 0.92 : 0;
        vajraLightning.setAttribute('opacity', boltOp.toFixed(2));

        // 4. Sanskrit Yantra Construction via stroke-dashoffset (0.0 -> 0.32) + Fast Counter-Rotation!
        const drawProg = easeOutCubic(Math.min(1, t / 0.32));
        yantraMainCircle.setAttribute('stroke-dashoffset', ((1 - drawProg) * 2168).toFixed(1));
        yantraTriUp.setAttribute('stroke-dashoffset', ((1 - drawProg) * 1535).toFixed(1));
        yantraTriDown.setAttribute('stroke-dashoffset', ((1 - drawProg) * 1535).toFixed(1));

        const outerDeg = (t * 144) % 360;
        const innerDeg = -(t * 108) % 360;
        yantraOuterSpin.setAttribute('transform', `rotate(${outerDeg.toFixed(1)})`);
        yantraInnerSpin.setAttribute('transform', `rotate(${innerDeg.toFixed(1)})`);
        invincibleHaloOrb.setAttribute('r', (365 + Math.sin(t * Math.PI * 5) * 26).toFixed(1));

        // 5. Invincible Indrajit Breathing & Raised Bow Pulse
        const breathY = 875 + Math.sin(t * Math.PI * 3) * 5;
        indrajitInvincibleGroup.setAttribute('transform', `translate(505, ${breathY.toFixed(1)}) scale(0.72)`);
        triumphBowGroup.setAttribute('transform', `translate(0, ${(Math.sin(t * Math.PI * 4) * -6).toFixed(1)})`);
        hairLeft.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 4) * 3.5).toFixed(2)}, -128, -210)`);
        hairRight.setAttribute('transform', `rotate(${(-Math.cos(t * Math.PI * 4) * 3.5).toFixed(2)}, 128, -210)`);

        // 6. Rising Golden Victory Sparks
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const yPos = ((pt.baseY - t * pt.speed * 5.0) % 1140 + 1140) % 1140 + 260;
          const xPos = pt.baseX + Math.sin(t * Math.PI * 4 + pt.phase) * 16;
          pt.el.setAttribute('cx', xPos.toFixed(1));
          pt.el.setAttribute('cy', yPos.toFixed(1));
          pt.el.setAttribute('opacity', (0.3 + 0.65 * Math.abs(Math.sin(t * Math.PI * 5 + pt.phase))).toFixed(2));
        }

        // 7. Safe-Zone Kinetic Hindi Keywords ("इंद्र को बंदी बनाया ⚡" & "किसी भी अस्त्र से अजेय 👑")
        if (t >= 0.16) {
          const p1 = Math.min(1, (t - 0.16) / 0.12);
          const s1 = 0.85 + 0.15 * easeOutBack(p1);
          kw1.setAttribute('opacity', easeOutCubic(p1).toFixed(2));
          kw1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
        } else {
          kw1.setAttribute('opacity', '0');
        }

        if (t >= 0.44) {
          const p2 = Math.min(1, (t - 0.44) / 0.12);
          const s2 = 0.85 + 0.15 * easeOutBack(p2);
          kw2.setAttribute('opacity', easeOutCubic(p2).toFixed(2));
          kw2.setAttribute('transform', `translate(0, 102) scale(${s2.toFixed(3)})`);
        } else {
          kw2.setAttribute('opacity', '0');
        }

        requestAnimationFrame(render);
      }

      window.onload = function() {
        requestAnimationFrame(render);
      };
    })();
  </script>
</body>
</html>
